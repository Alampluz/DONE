# Render blueprint: one always-on web service running done-mcp (the DONE MCP server for Grok Bots).
# Lives in Alampluz/DONE under done-mcp/; Render builds only that folder.
services:
  - type: web
    name: done-mcp
    runtime: docker
    rootDir: done-mcp
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: DONE_BOT_KEY
        sync: false          # paste the bot key in the Render dashboard
      - key: MCP_AUTH_TOKEN
        generateValue: true  # Render makes a random secret; copy it into Grok's header
