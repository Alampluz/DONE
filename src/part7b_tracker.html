<script>
/* ---------- state ---------- */
const CPT = { trackers:null, cur:null, steps:[], lines:[], fold:null, tix:null, tixBy:{}, tixOn:true, f:{svc:'', brand:'', kam:'', lead:'', q:'', late:false, miss:false} };

/* ---------- which tickets prove a step (the teams' boards are the source of truth) ----------
   A step is matched by its name to a ticket board (its code) and a kind of request on it. First match wins.
   need: 'exists' = the ticket has been raised (KAM "Submit …" steps); 'done' = the team finished it. */
const CPT_RULES = [
  {re:/book platform|stock forecast|lazada bonus|barter|visibility banner/i, skip:true},
  {el:/graphic/i, re:/frame\/pdp/i,   boards:['CRE'], kind:/frame|pdp/i},
  {el:/graphic/i, re:/sis/i,          boards:['CRE'], kind:/sis/i},
  {el:/graphic/i, re:/cpas/i,         boards:['CRE'], kind:/cpas|marketing/i},
  {el:/graphic/i, re:/visi/i,         boards:['CRE'], kind:/visibility/i},
  {el:/graphic/i, re:/./,             boards:['CRE'], kind:null},
  {el:/listing/i, re:/frame/i,        boards:['CFR'], kind:null},
  {re:/co-?fund voucher/i,            boards:['VCH'], kind:/co-?fund/i},
  {re:/free shipping/i,               boards:['VCH'], kind:/free ?shipping/i},
  {re:/flexi|bundle deal/i,           boards:['VCH'], kind:/flexi|bundle/i},
  {re:/add-?on/i,                     boards:['VCH'], kind:/add-?on/i},
  {re:/voucher/i,                     boards:['VCH'], kind:/regular|new buyer|follower|member|repeat/i},
  {re:/price update/i,                boards:['PTB'], kind:/price/i},
  {re:/flash ?sale/i,                 boards:['PTB','FS'], kind:/flash|jfy|special/i},
  {re:/rdh/i,                         boards:['PTB'], kind:/rdh/i},
  {re:/campaign \(tb\)|cbmo|subsidy|overall tb/i, boards:['PTB'], kind:/treasure bowl/i},
  {re:/gwp/i,                         boards:['GWP'], kind:null},
];
function cptRule(step){
  if(!step) return null;
  const r = CPT_RULES.find(x=> (!x.el || x.el.test(step.element||'')) && x.re.test(step.name||''));
  if(!r || r.skip) return null;
  const need = /store ops|graphic|listing|readiness/i.test(step.element||'') || /^(join|set|recheck)\b/i.test(step.name||'') ? 'done' : 'exists';
  return {boards:r.boards, kind:r.kind, need};
}
const cptNorm = v => String(v==null ? '' : v).toLowerCase().replace(/[^a-z0-9]+/g,'');
const cptTkCancelled = t => /won.?t do|cancel/i.test(t.team_status||'');
const cptTkDone = t => t.status==='done' || /^(done|approved|resolved)/i.test(t.team_status||'');
function cptIndexTix(tix){ const by = {}; (tix||[]).forEach(t=>{ const k = cptNorm(t.brand); (by[k] = by[k] || []).push(t); }); return by; }
/* The tickets behind one cell: same brand, the line's platform among the ticket's platforms (a ticket
   with no platform counts for all), on the rule's board, of the rule's kind, not cancelled. */
function cptTixFor(line, step, by, brands){
  const rule = cptRule(step); if(!rule) return null;
  const b = (brands||[]).find(x=>x.id===line.brand_id), keys = [...new Set([cptNorm(b && b.name), cptNorm(line.brand_name)].filter(Boolean))];
  const lp = cptNorm(line.platform);
  const list = keys.flatMap(k=> (by||{})[k] || []).filter(t=> rule.boards.includes(t.board_key) && !cptTkCancelled(t)
    && (!rule.kind || rule.kind.test(t.kind||''))
    && (!t.platform || !lp || String(t.platform).split(',').some(p=>{ const n = cptNorm(p); return n && (n===lp || lp.includes(n) || n.includes(lp)); })));
  return {rule, list};
}
/* null = nothing to check (no rule, or the cell is n/a / empty); otherwise
   state none = no ticket found · open = ticket(s) not finished · done = finished (or raised, when that is all the step asks) */
function cptCheck(line, step, by, brands){
  const v = (line.cells||{})[step.position]; if(cptKind(v)==='na') return null;
  const r = cptTixFor(line, step, by, brands); if(!r) return null;
  if(!r.list.length) return {state:'none', list:[], rule:r.rule};
  const fin = r.rule.need==='exists' || r.list.every(cptTkDone);
  return {state: fin ? 'done' : 'open', list:r.list, rule:r.rule};
}
/* ---------- missing tickets → raise them on the team board ----------
   One row per ticket that is needed and not there: several steps of a line can ask for the same ticket
   (KAM "Submit voucher" + Store Ops "Set voucher"), so they are folded by line + board + kind. */
function cptMissing(lines, steps, chk){
  const out = [], seen = {};
  (lines||[]).forEach(l=> (steps||[]).forEach(s=>{ const c = chk(l, s); if(!c || c.state!=='none') return;
    const k = l.id+'|'+c.rule.boards.join('+')+'|'+(c.rule.kind ? c.rule.kind.source : '');
    if(seen[k]){ seen[k].steps.push(s); if(s.due && (!seen[k].due || s.due < seen[k].due)) seen[k].due = s.due; return; }
    out.push(seen[k] = {line:l, step:s, steps:[s], rule:c.rule, due:s.due||null}); }));
  return out;
}
const CPT_COUNTRY = {th:'thailand', sg:'singapore', my:'malaysia'};
/* The board's own spelling of a value ("Tiktok" for TikTok, "Thailand" for TH); '' when the board has no such option. */
function cptPickOpt(options, want, alt){
  const o = (Array.isArray(options) ? options : []).map(x=> typeof x==='string' ? x : (x && (x.label || x.name || x.value)) || '').filter(Boolean);
  const w = cptNorm(want), a = cptNorm(alt); if(!w) return '';
  return o.find(x=>cptNorm(x)===w) || (a && o.find(x=>cptNorm(x)===a)) || '';
}
const cptKindOpts = (options, kind) => (Array.isArray(options) ? options : []).filter(x=> typeof x==='string' && (!kind || kind.test(x)));
/* Which field of a board plays which part; the same labels cp_tracker_tickets reads. fields = project_fields rows. */
function cptRoles(fields){
  const by = (...labels) => (fields||[]).find(f=> labels.includes(String(f.label||'').trim().toLowerCase())) || null;
  return {brand:(fields||[]).find(f=>f.ftype==='brand') || by('brand'), platform:by('platform','platfrom'), kind:by('request for','artwork type','campaign requests'),
          start:by('start date','live date','campaign start date'), end:by('end date','campaign end date'), country:by('country','country / region')};
}
/* What the new ticket would say, before the person edits it. */
function cptDraft(line, step, rule, tracker, roles, brands){
  const b = (brands||[]).find(x=>x.id===line.brand_id), brand = (b && b.name) || line.brand_name;
  const kinds = roles.kind ? cptKindOpts(roles.kind.options, rule.kind) : [];
  const cc = cptNorm(line.country);
  return {brand, title:`${brand} ${line.platform||''} – ${step.name} (${tracker.name})`.replace(/\s+/g,' ').trim(),
    platform: roles.platform ? cptPickOpt(roles.platform.options, line.platform) : '',
    kind: kinds.length===1 ? kinds[0] : '', kinds,
    country: roles.country ? cptPickOpt(roles.country.options, line.country, CPT_COUNTRY[cc]) : '',
    start:tracker.dday, end:tracker.dday};
}
/* The ticket as the tasks table takes it: custom = {field id: value}, empty values left out. */
function cptTicketRow(board, roles, v, groupId, position, me){
  const custom = {}; [['brand',v.brand],['platform',v.platform],['kind',v.kind],['country',v.country],['start',v.start],['end',v.end]].forEach(([r, val])=>{ if(roles[r] && val) custom[roles[r].id] = val; });
  return {project_id:board.id, group_id:groupId||null, title:v.title, description:v.description||'', status:'todo', priority:'normal', created_by:me, position, custom};
}
async function cptBoard(key){
  CPT.boards = CPT.boards || {};
  if(CPT.boards[key]) return CPT.boards[key];
  const p = (S.projects||[]).find(x=>x.key===key && x.status!=='archived'); if(!p) throw new Error(`No board with the code ${key}.`);
  const [f, g] = await Promise.all([db.from('project_fields').select('id,label,ftype,options').eq('project_id', p.id).order('position'),
    db.from('project_groups').select('id,name,position').eq('project_id', p.id).order('position').order('created_at')]);
  if(f.error || g.error) throw new Error((f.error || g.error).message);
  return CPT.boards[key] = {id:p.id, key, name:p.name, fields:f.data||[], groups:g.data||[], roles:cptRoles(f.data||[])};
}
/* The form: board, what is asked, platform, dates. Nothing is created until "Create ticket" is pressed. */
async function cptCreateModal(line, step, after){
  const rule = cptRule(step); if(!rule) return;
  let board; try{ board = await cptBoard(rule.boards[0]); }catch(e){ return toast(e.message, true); }
  const m = modal(`<div class="modal-head"><h2>Create the ticket</h2><button class="x" onclick="closeModals()" aria-label="Close">✕</button></div><div class="modal-body" id="cpm-body"></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="cpm-save">Create ticket</button></div>`);
  const paint = () => {
    const d = cptDraft(line, step, rule, CPT.cur, board.roles, S.brandsList), R = board.roles;
    const sel = (id, opts, cur, blank) => `<select id="${id}"><option value="">${blank}</option>${opts.map(o=>`<option${o===cur ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    const all = f => (f && Array.isArray(f.options) ? f.options.filter(x=>typeof x==='string') : []);
    m.querySelector('#cpm-body').innerHTML = `
      <p class="muted">${esc(line.brand_name)} · ${esc(line.platform||'')} · ${esc(step.name)}${step.due ? ' · due '+esc(fmtDate(step.due)) : ''}</p>
      <label>Board</label>${rule.boards.length > 1 ? `<select id="cpm-board">${rule.boards.map(k=>`<option${k===board.key ? ' selected' : ''}>${esc(k)}</option>`).join('')}</select>` : `<input value="${esc(board.key+' · '+board.name)}" disabled>`}
      <label>Title</label><input id="cpm-title" value="${esc(d.title)}">
      ${R.kind ? `<label>${esc(R.kind.label)}</label>${sel('cpm-kind', d.kinds.length ? d.kinds.concat(all(R.kind).filter(o=>!d.kinds.includes(o))) : all(R.kind), d.kind, 'Choose…')}` : ''}
      ${R.platform ? `<label>${esc(R.platform.label)}</label>${sel('cpm-plat', all(R.platform), d.platform, 'Choose…')}` : ''}
      ${R.country ? `<label>${esc(R.country.label)}</label>${sel('cpm-country', all(R.country), d.country, '—')}` : ''}
      <div style="display:flex;gap:10px"><div style="flex:1"><label>${esc(R.start ? R.start.label : 'Start')}</label><input type="date" id="cpm-start" value="${esc(d.start||'')}"></div>
        <div style="flex:1"><label>${esc(R.end ? R.end.label : 'End')}</label><input type="date" id="cpm-end" value="${esc(d.end||'')}"></div></div>
      <label>Details for the team</label><textarea id="cpm-desc" rows="3">${esc(`Raised from the campaign tracker "${CPT.cur.name}", step "${step.name}"${step.due ? ', due '+fmtDate(step.due) : ''}.`)}</textarea>
      <p class="hint">Brand: ${esc(d.brand)}. The ticket goes to "${esc((board.groups[0]||{}).name || 'the first group')}" on ${esc(board.name)} and the board's own rules (assignment, notifications) apply.</p>`;
    const bs = m.querySelector('#cpm-board'); if(bs) bs.onchange = async () => { try{ board = await cptBoard(bs.value); paint(); }catch(e){ toast(e.message, true); } };
  };
  paint();
  m.querySelector('#cpm-save').onclick = async e => {
    const g = id => { const x = m.querySelector('#'+id); return x ? x.value.trim() : ''; };
    const v = {brand:cptDraft(line, step, rule, CPT.cur, board.roles, S.brandsList).brand, title:g('cpm-title'), kind:g('cpm-kind'), platform:g('cpm-plat'), country:g('cpm-country'), start:g('cpm-start'), end:g('cpm-end'), description:g('cpm-desc')};
    if(!v.title) return toast('Title is required', true);
    if(board.roles.kind && !v.kind) return toast(`Choose the ${board.roles.kind.label}`, true);
    if(board.roles.platform && !v.platform) return toast('Choose the platform', true);
    if(!v.start) return toast('The start date is required', true);
    if(v.end && v.end < v.start) return toast('The end date is before the start date', true);
    if(typeof canEditOnBoard==='function' && !canEditOnBoard(board.id)) return toast(`You cannot add tickets on ${board.name}.`, true);
    e.target.disabled = true;
    const top = await db.from('tasks').select('position').eq('project_id', board.id).order('position', {ascending:false}).limit(1);
    const pos = ((top.data && top.data[0] && top.data[0].position) || 0) + 1;
    const {data, error} = await db.from('tasks').insert(cptTicketRow(board, board.roles, v, (board.groups[0]||{}).id, pos, S.me.id)).select().single();
    if(error){ e.target.disabled = false; return toast(error.message, true); }
    (CPT.tix = CPT.tix || []).push({task_id:data.id, ticket_no:data.ticket_no, title:data.title, project_id:board.id, board_key:board.key, board_name:board.name,
      brand:v.brand, platform:v.platform, kind:v.kind, status:data.status, team_status:null, start_date:v.start, end_date:v.end || v.start});
    CPT.tixBy = cptIndexTix(CPT.tix);
    closeModals(); toast(`Ticket ${data.ticket_no || ''} created on ${board.name}`);
    if(CPT.draw) CPT.draw();
    if(after) after(data);
  };
}
/* Every ticket the campaign still needs, by team board, each with its own Create button (never in bulk:
   the team boards notify people). Follows the filters of the sheet. */
function cptMissingHTML(miss, canMake){
  if(!miss.length) return '<div class="empty">Nothing is missing: every step that needs a ticket has one.</div>';
  const by = {}; miss.forEach((x, i)=>{ const k = x.rule.boards.join(' / '); (by[k] = by[k] || []).push({...x, i}); });
  return Object.keys(by).sort().map(k=>`<div class="section-title">${esc(k)} <span class="hint">${by[k].length} missing</span></div>
    <table class="cpt-miss"><tbody>${by[k].map(x=>`<tr data-i="${x.i}"><td><b>${esc(x.line.brand_name)}</b> <span class="hint">${esc(x.line.country||'')}</span></td><td>${esc(x.line.platform||'')}</td>
      <td title="${esc(x.steps.map(s=>s.name).join(' · '))}">${esc(x.step.name)}${x.steps.length > 1 ? ` <span class="hint">+${x.steps.length-1} more</span>` : ''}</td>
      <td class="hint">${x.due ? esc(fmtDate(x.due)) : ''}</td><td class="hint">${esc(x.line.kam||'')}</td>
      <td class="act">${canMake ? '<button class="btn btn-ghost btn-sm" data-mk>＋ Create</button>' : ''}</td></tr>`).join('')}</tbody></table>`).join('');
}
function cptMissingModal(){
  if(!CPT.tix) return;
  const chk = (l, s) => cptCheck(l, s, CPT.tixBy, S.brandsList);
  const miss = cptMissing(cptFiltered(CPT.lines, {...CPT.f, chk}, CPT.steps, cptToday()), CPT.steps, chk);
  const m = modal(`<div class="modal-head"><h2>Missing tickets <span class="hint">${miss.length}</span></h2><button class="x" onclick="closeModals()" aria-label="Close">✕</button></div>
    <div class="modal-body"><p class="muted">Steps of ${esc(CPT.cur.name)} that need a ticket on a team board and have none for that brand and platform around D-day. If the work is not needed, set the step to n/a in the sheet instead.</p>
    <div id="cpm-list" style="max-height:60vh;overflow:auto">${cptMissingHTML(miss, canEdit())}</div></div>`, true);
  m.querySelector('#cpm-list').onclick = e => { const b = e.target.closest('[data-mk]'); if(!b) return;
    const x = miss[+b.closest('tr').dataset.i]; closeModals(); cptCreateModal(x.line, x.step, ()=> cptMissingModal()); };
}
const CPT_OPEN = ['pending','in progress','brand review'];          // still to do
const CPT_CHOICES = ['Done','In Progress','Pending','Brand Review','n/a'];

/* ---------- pure helpers (tests/test_tracker.cjs) ---------- */
/* Excel serial, Date or text → 'YYYY-MM-DD' (or '') */
function cptDate(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return isNaN(v) ? '' : new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof v==='number') return v > 20000 && v < 80000 ? new Date(Math.round((v - 25569)*86400000)).toISOString().slice(0,10) : '';
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
}
const cptTxt = v => v==null ? '' : typeof v==='number' ? String(Math.round(v*100)/100) : String(v).replace(/\s+/g,' ').trim();
/* The planning sheet as rows of cells (SheetJS header:1) → {name, dday, steps, lines}. The header row is the
   one that starts Country | Brand; steps are the named columns right of "Completion": section (6 rows up,
   carried right), name (5 up), how-to (4 up), D- offset (1 up), due date (header row). */
function cptParseSheet(rows){
  rows = rows || [];
  const h = rows.findIndex(r=> r && cptTxt(r[0]).toLowerCase()==='country' && cptTxt(r[1]).toLowerCase()==='brand');
  if(h < 6) throw new Error('This does not look like the campaign planning sheet: no "Country | Brand" header row.');
  const H = rows[h].map(v=> cptTxt(v).toLowerCase());
  const col = (...names) => { for(const n of names){ const i = H.indexOf(n); if(i>=0) return i; } return -1; };
  const cComp = col('completion'); if(cComp < 0) throw new Error('No "Completion" column in the header row.');
  const R = k => rows[h-k] || [];
  const dday = cptDate(R(5)[1]); if(!dday) throw new Error('No D-day date next to "Dday".');
  const steps = []; let sec = '';
  for(let c = cComp+1; c < Math.max(R(5).length, rows[h].length); c++){
    if(cptTxt(R(6)[c])) sec = cptTxt(R(6)[c]);
    const name = cptTxt(R(5)[c]); if(!name) continue;
    const off = parseInt(cptTxt(R(1)[c]), 10);
    steps.push({col:c, position:steps.length, element:sec, name, how:cptTxt(R(4)[c]), d_offset:isNaN(off) ? null : off, due:cptDate(rows[h][c]) || null});
  }
  if(!steps.length) throw new Error('No steps found right of the "Completion" column.');
  const cs = {country:col('country'), brand:col('brand'), lead:col('lead'), kam:col('kam/pic','kam'), asso:col('asso','associate'), plat:col('platform'), cat:col('category'), svc:col('service type','service'),
              teasing:col('teasing date start'), mkt:col('mkt start date'), presale:col('presale start'), presale_mkt:col('presale mkt start date')};
  const g = (r, i) => i < 0 ? '' : cptTxt(r[i]);
  const lines = [];
  for(let i = h+1; i < rows.length; i++){
    const r = rows[i]; if(!r || !g(r, cs.brand)) continue;
    const cells = {}; steps.forEach(s=>{ const v = cptTxt(r[s.col]); if(v) cells[s.position] = v; });
    const dates = {}; ['teasing','mkt','presale','presale_mkt'].forEach(k=>{ const d = cs[k] < 0 ? '' : cptDate(r[cs[k]]); if(d) dates[k] = d; });
    lines.push({position:lines.length, country:g(r,cs.country), brand_name:g(r,cs.brand), lead:g(r,cs.lead), kam:g(r,cs.kam), associate:g(r,cs.asso),
                platform:g(r,cs.plat), category:g(r,cs.cat), service_type:g(r,cs.svc), dates, cells});
  }
  if(!lines.length) throw new Error('No brand rows under the header.');
  return {name: cptTxt((rows[h-6]||[])[1]) || 'Campaign tracker', dday, steps:steps.map(({col, ...s})=>s), lines};
}
/* A cell's kind: na (n/a or empty) · pend · prog · done (Done, Yes, an amount, any other answer) */
function cptKind(v){
  const k = String(v==null ? '' : v).trim().toLowerCase();
  if(!k || k==='n/a' || k==='na') return 'na';
  if(k==='pending' || k==='brand review') return 'pend';
  if(k==='in progress') return 'inprog';
  return k==='done' ? 'done' : 'info';
}
const cptIsOpen = v => CPT_OPEN.includes(String(v==null ? '' : v).trim().toLowerCase());
const cptIsLate = (step, v, today) => !!(step && step.due && step.due < today && cptIsOpen(v));
function cptLabel(v){
  const s = String(v==null ? '' : v).trim(), k = s.toLowerCase();
  if(!s) return ''; if(k==='n/a' || k==='na') return '—'; if(k==='done') return '✓'; if(k==='in progress') return 'In progress';
  const n = Number(s); if(s!=='' && !isNaN(n) && Math.abs(n) >= 1000) return (Math.round(n/100)/10)+'k';
  return s;
}
/* {applicable, done, open, late} over a line's cells for the given steps */
function cptStats(line, steps, today){
  const o = {applicable:0, done:0, open:0, late:0};
  (steps||[]).forEach(s=>{ const v = (line.cells||{})[s.position], k = cptKind(v); if(k==='na') return;
    o.applicable++; if(cptIsOpen(v)){ o.open++; if(cptIsLate(s, v, today)) o.late++; } else o.done++; });
  return o;
}
function cptFiltered(lines, f, steps, today){
  const q = String(f.q||'').trim().toLowerCase();
  return (lines||[]).filter(l=> (!f.svc || l.service_type===f.svc) && (!f.brand || l.brand_name===f.brand) && (!f.kam || l.kam===f.kam || l.associate===f.kam) && (!f.lead || l.lead===f.lead)
    && (!q || [l.brand_name,l.platform,l.kam,l.associate,l.lead].some(x=> String(x||'').toLowerCase().includes(q)))
    && (!f.late || cptStats(l, steps, today).late > 0)
    && (!f.miss || !f.chk || (steps||[]).some(s=>{ const c = f.chk(l, s); return c && c.state==='none'; })));
}
const cptToday = () => new Date(Date.now() + 7*3600e3).toISOString().slice(0,10);   // Bangkok date
const cptElements = steps => { const out = []; (steps||[]).forEach(s=>{ let g = out[out.length-1]; if(!g || g.name!==s.element){ g = {name:s.element||'Steps', steps:[]}; out.push(g); } g.steps.push(s); }); return out; };

/* ---------- data ---------- */
async function cptLoad(trackerId){
  const {data:tr, error} = await db.from('campaign_trackers').select('*').is('archived_at', null).order('dday', {ascending:false});
  if(error) throw new Error(error.message);
  CPT.trackers = tr || [];
  CPT.cur = CPT.trackers.find(t=>t.id===trackerId) || CPT.trackers.find(t=> CPT.cur && t.id===CPT.cur.id) || CPT.trackers[0] || null;
  CPT.steps = []; CPT.lines = [];
  if(!CPT.cur) return;
  const [st, ln] = await Promise.all([
    db.from('campaign_tracker_steps').select('*').eq('tracker_id', CPT.cur.id).order('position').limit(1000),
    db.from('campaign_tracker_lines').select('*').eq('tracker_id', CPT.cur.id).order('position').limit(2000)]);
  if(st.error || ln.error) throw new Error((st.error || ln.error).message);
  CPT.steps = st.data || []; CPT.lines = ln.data || [];
  CPT.tix = null; CPT.tixErr = null;
  try{ const tk = await db.rpc('cp_tracker_tickets', {p_tracker:CPT.cur.id}); if(tk.error) CPT.tixErr = tk.error.message; else CPT.tix = tk.data || []; }catch(e){ CPT.tixErr = e.message; }
  CPT.tixBy = cptIndexTix(CPT.tix);
  if(!CPT.fold || CPT.foldFor!==CPT.cur.id){ CPT.fold = {}; cptElements(CPT.steps).forEach((g,i)=>{ if(i>0) CPT.fold[g.name] = 1; }); CPT.foldFor = CPT.cur.id; }
}

/* ---------- the sheet ---------- */
function cptSheetHTML(lines, steps, fold, today, chk){
  const groups = cptElements(steps);
  let h1 = `<th class="fx c0" rowspan="2">Brand</th><th class="fx c1" rowspan="2">Platform</th><th class="fx c2" rowspan="2">KAM</th><th class="fx c3" rowspan="2">Done</th>`, h2 = '';
  groups.forEach((g, gi)=>{
    const f = !!fold[g.name];
    h1 += `<th class="eh" data-el="${gi}" colspan="${f ? 1 : g.steps.length}" ${f ? 'rowspan="2"' : ''} title="${f ? 'Show' : 'Hide'} the ${g.steps.length} steps">${f ? '▸' : '▾'} ${esc(g.name)} <span class="hint">${g.steps.length}</span></th>`;
    if(!f) g.steps.forEach((s, i)=>{ h2 += `<th class="sh${s.due && s.due < today ? ' late' : ''}${i===g.steps.length-1 ? ' ge' : ''}" data-step="${s.position}" title="${esc(s.name)}">${esc(s.name.length > 34 ? s.name.slice(0,32)+'…' : s.name)}<small>${s.d_offset!=null ? 'D-'+s.d_offset : ''}${s.due ? ' · '+esc(fmtDate(s.due)) : ''}</small></th>`; });
  });
  const body = lines.map(l=>{
    const st = cptStats(l, steps, today);
    let tds = `<td class="fx c0" title="${esc(l.brand_name)}">${esc(l.brand_name)} <span class="hint">${esc(l.country||'')}</span></td><td class="fx c1">${esc(l.platform||'')}</td><td class="fx c2" title="${esc([l.kam, l.associate, l.lead].filter(Boolean).join(' · '))}">${esc(l.kam||'')}</td><td class="fx c3">${st.applicable ? Math.round(100*st.done/st.applicable)+'%' : '—'}</td>`;
    groups.forEach((g, gi)=>{
      if(fold[g.name]){ const s = cptStats(l, g.steps, today);
        tds += `<td class="gs ge${s.late ? ' bad' : s.applicable && !s.open ? ' ok' : ''}" data-el="${gi}">${s.applicable ? `${s.done}/${s.applicable}${s.late ? ` · ${s.late} late` : ''}` : '—'}</td>`; return; }
      g.steps.forEach((s, i)=>{ const v = (l.cells||{})[s.position];
        const c = chk ? chk(l, s) : null;
        tds += `<td class="cc ${cptKind(v)}${cptIsLate(s, v, today) ? ' late' : ''}${c ? ' tk-'+c.state : ''}${i===g.steps.length-1 ? ' ge' : ''}" data-line="${l.id}" data-step="${s.position}" title="${esc((v||'')+(c ? (c.state==='none' ? ' · no ticket found on '+c.rule.boards.join(' / ') : ` · ${c.list.length} ticket${c.list.length===1?'':'s'}, ${c.state==='done' ? 'finished' : 'not finished'}`) : ''))}">${esc(cptLabel(v))}${c && c.list.length ? `<sup>${c.list.length}</sup>` : ''}</td>`; });
    });
    return `<tr>${tds}</tr>`;
  }).join('');
  return `<table class="cpt"><thead><tr>${h1}</tr><tr class="r2">${h2}</tr></thead><tbody>${body}</tbody></table>`;
}
function cptSumHTML(lines, steps, today, chk){
  const t = {applicable:0, done:0, open:0, late:0}; lines.forEach(l=>{ const s = cptStats(l, steps, today); Object.keys(t).forEach(k=> t[k] += s[k]); });
  const brands = new Set(lines.map(l=>l.brand_name)).size;
  return `<div class="cpt-sum"><div class="b"><b>${brands}</b><span>brands · ${lines.length} lines</span></div>
    <div class="b green"><b>${t.applicable ? Math.round(100*t.done/t.applicable) : 0}%</b><span>${t.done} of ${t.applicable} steps done</span></div>
    <div class="b"><b>${t.open}</b><span>still open</span></div><div class="b${t.late ? ' red' : ''}"><b>${t.late}</b><span>past their due date</span></div>${chk ? (()=>{ let none = 0, open = 0, ok = 0; lines.forEach(l=> steps.forEach(s=>{ const c = chk(l, s); if(!c) return; if(c.state==='none') none++; else if(c.state==='open') open++; else ok++; }));
      return `<div class="b${none ? ' red' : ''}"><b>${none}</b><span>steps with no ticket</span></div><div class="b"><b>${open}</b><span>tickets not finished</span></div><div class="b green"><b>${ok}</b><span>backed by a ticket</span></div>`; })() : ''}</div>`;
}
const cptOpts = (vals, cur, all) => `<option value="">${all}</option>` + [...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(v=>`<option${v===cur ? ' selected' : ''}>${esc(v)}</option>`).join('');

    <div class="hint" style="margin-top:8px">Click a cell to change it. Click a section name to show or hide its steps, and a step name for its how-to. Red outline = past its due date and not done.</div>`;

/* The tickets behind a cell, each a link to the ticket on its team board. tk = cptTixFor(...) or null (no rule). */

async function cptSetCell(line, step, value, td){
  const old = (line.cells||{})[step.position], v = String(value||'').trim();
  if((old||'')===v) return;
  line.cells = {...(line.cells||{})}; if(v) line.cells[step.position] = v; else delete line.cells[step.position];
  const today = cptToday();
  if(td && td.isConnected){ td.className = `cc ${cptKind(v)}${cptIsLate(step, v, today) ? ' late' : ''}${td.classList.contains('ge') ? ' ge' : ''}`; td.textContent = cptLabel(v); td.title = v; }
  const {error} = await db.rpc('cp_tracker_set_cell', {p_line:line.id, p_step:step.position, p_value:v});
  if(error){ line.cells = {...line.cells}; if(old) line.cells[step.position] = old; else delete line.cells[step.position]; toast('Not saved: '+error.message, true); if(CPT.draw) CPT.draw(); return; }
  if(CPT.tix && CPT.tixOn && CPT.draw){ CPT.draw(); return; }   // ticket marks depend on the cell's value
  const rows = cptFiltered(CPT.lines, CPT.f, CPT.steps, today), sum = document.getElementById('cpt-sum'); if(sum) sum.innerHTML = cptSumHTML(rows, CPT.steps, today);
  const tr = td && td.closest('tr'), pc = tr && tr.querySelector('.c3'); if(pc){ const st = cptStats(line, CPT.steps, today); pc.textContent = st.applicable ? Math.round(100*st.done/st.applicable)+'%' : '—'; }
}
function cptStepModal(pos){
  const s = CPT.steps.find(x=>x.position===pos); if(!s) return;
  const today = cptToday(), c = {done:0, open:0, late:0, na:0};
  CPT.lines.forEach(l=>{ const v = (l.cells||{})[pos], k = cptKind(v); if(k==='na') c.na++; else if(cptIsOpen(v)){ c.open++; if(cptIsLate(s, v, today)) c.late++; } else c.done++; });
  const late = CPT.lines.filter(l=> cptIsLate(s, (l.cells||{})[pos], today));
  modal(`<div class="modal-head"><h2>${esc(s.name)}</h2><button class="x" onclick="closeModals()" aria-label="Close">✕</button></div>
    <div class="modal-body"><p class="muted">${esc(s.element||'')}${s.d_offset!=null ? ` · D-${s.d_offset}` : ''}${s.due ? ` · due ${esc(fmtDate(s.due))}` : ''}</p>
      ${s.how ? `<div class="section-title">How to</div><p>${esc(s.how)}</p>` : '<p class="muted">No how-to written for this step.</p>'}
      <p><b>${c.done}</b> done · <b>${c.open}</b> open${c.late ? ` · <b style="color:var(--red)">${c.late} late</b>` : ''} · ${c.na} not applicable</p>
      ${late.length ? `<div class="section-title">Late</div><p>${late.map(l=>`${esc(l.brand_name)} ${esc(l.platform||'')} <span class="hint">${esc(l.kam||'')}</span>`).join('<br>')}</p>` : ''}</div>`);
}
function cptExport(){
  const steps = CPT.steps, rows = cptFiltered(CPT.lines, CPT.f, steps, cptToday()), meta = ['Country','Brand','Lead','KAM/PIC','Asso','Platform','Category','Service Type'];
  const pad = meta.map(()=> '');
  const aoa = [pad.concat(steps.map((s,i)=> i===0 || steps[i-1].element!==s.element ? s.element : '')), pad.concat(steps.map(s=>s.name)), pad.concat(steps.map(s=>s.how||'')),
    pad.slice(0,-1).concat(['D-']).concat(steps.map(s=> s.d_offset==null ? '' : s.d_offset)), meta.concat(steps.map(s=>s.due||''))]
    .concat(rows.map(l=> [l.country, l.brand_name, l.lead, l.kam, l.associate, l.platform, l.category, l.service_type].concat(steps.map(s=> (l.cells||{})[s.position] || ''))));
  downloadXLSX(xlsxFilename(CPT.cur.name), aoa, null, 'Tracker');
}

/* ---------- import ---------- */
function cptImportPick(){
  if(typeof XLSX==='undefined') return toast('The Excel reader has not loaded. Check the connection and reload.', true);
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.xlsx,.xls'; i.style.display = 'none'; document.body.appendChild(i);
  i.onchange = async ()=>{ const file = i.files && i.files[0]; i.remove(); if(!file) return;
    try{ const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
      let parsed = null, err = null;
      for(const n of wb.SheetNames){ try{ parsed = cptParseSheet(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null})); break; }catch(e){ err = err || e; } }
      if(!parsed) throw err || new Error('No sheet found.');
      cptImportConfirm(parsed, file.name);
    }catch(e){ toast('Could not read the file: '+e.message, true); } };
  i.click();
}
function cptImportConfirm(p, fileName){
  const brands = new Set(p.lines.map(l=>l.brand_name)).size, cells = p.lines.reduce((n,l)=> n + Object.keys(l.cells).length, 0);
  const same = (CPT.trackers||[]).find(t=> t.name===p.name && t.dday===p.dday);
  const m = modal(`<div class="modal-head"><h2>Import the tracker</h2><button class="x" onclick="closeModals()" aria-label="Close">✕</button></div>
    <div class="modal-body"><label>Name<input id="cpt-in" value="${esc(p.name)}"></label>
      <p>D-day <b>${esc(fmtDate(p.dday))}</b> · <b>${p.steps.length}</b> steps in ${cptElements(p.steps).length} sections · <b>${brands}</b> brands on <b>${p.lines.length}</b> lines · ${cells} filled cells.</p>
      ${same ? `<p style="color:var(--amber)"><b>A tracker with this name and D-day already exists.</b> Importing adds a second copy; it does not update the first.</p>` : ''}
      <p class="muted">Brands are matched to the DONE brand list by name. Empty KAM, associate and category lead in the brand directory are filled from the sheet.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="cpt-go">Import</button></div>`);
  m.querySelector('#cpt-go').onclick = async e => { const b = e.target; b.disabled = true; b.textContent = 'Importing…';
    try{ const res = await cptImport({...p, name: m.querySelector('#cpt-in').value.trim() || p.name}, fileName);
      closeModals(); toast(`Imported ${p.lines.length} lines${res.unlinked.length ? ` · ${res.unlinked.length} brand names not in the brand list` : ''}`);
      if(res.unlinked.length) modal(`<div class="modal-head"><h2>Brand names not in the brand list</h2><button class="x" onclick="closeModals()" aria-label="Close">✕</button></div><div class="modal-body"><p class="muted">These lines are in the tracker but not tied to a DONE brand. Add the name as an alias of the right brand in Admin → Brands, then import again or leave them as they are.</p><p>${res.unlinked.map(esc).join('<br>')}</p></div>`);
      CPT.cur = {id:res.id}; CPT.fold = null; cptMount();
    }catch(err){ b.disabled = false; b.textContent = 'Import'; toast('Import failed: '+err.message, true); } };
}
async function cptImport(p, fileName){
  const {data:t, error} = await db.from('campaign_trackers').insert({name:p.name, dday:p.dday, source_file:fileName||null}).select().single();
  if(error) throw new Error(error.message);
  const fail = async msg => { await db.from('campaign_trackers').delete().eq('id', t.id); throw new Error(msg); };   // no half-imported tracker
  const s = await db.from('campaign_tracker_steps').insert(p.steps.map(x=>({...x, tracker_id:t.id})));
  if(s.error) await fail(s.error.message);
  for(let i = 0; i < p.lines.length; i += 50){
    const r = await db.from('campaign_tracker_lines').insert(p.lines.slice(i, i+50).map(x=>({...x, tracker_id:t.id})));
    if(r.error) await fail(r.error.message);
  }
  const lk = await db.rpc('cp_tracker_link_brands', {p_tracker:t.id});
  if(!lk.error){ const {data:bs} = await db.from('brands').select('*').order('name'); if(bs) S.brandsList = bs; }   // the directory may have been filled
  return {id:t.id, unlinked: lk.error ? [] : ((lk.data && lk.data.unlinked) || [])};
}

/* ---------- brand directory ---------- */
const CPD_COLS = [['service_model','Service'],['category','Category'],['category_lead','Category lead'],['kam','KAM'],['associate','Associate'],['cs_owner','CS owner']];
const CPD_PLAT_ORDER = ['Shopee','Lazada','TikTok','Line MyShop','Amaze','Brand.com','Call CC'];
/* stores: {brand_id: [platform…]} from brand_stores (the platforms we manage, loaded from NiRM); rename: show the Rename button */
function cpdRowsHTML(brands, q, edit, stores, rename){
  const k = String(q||'').trim().toLowerCase();
  const list = (brands||[]).filter(b=> !b.merged_into && b.active!==false && (!k || [b.name, b.kam, b.associate, b.category_lead, b.category, b.service_model].some(x=> String(x||'').toLowerCase().includes(k))));
  if(!list.length) return '<tr><td colspan="8" class="empty">No brands match.</td></tr>';
  const plats = b => { const p = [...new Set((stores||{})[b.id] || [])].sort((x,y)=> (CPD_PLAT_ORDER.indexOf(x)+99)%99 - (CPD_PLAT_ORDER.indexOf(y)+99)%99 || x.localeCompare(y)); return p.length ? esc(p.join(' · ')) : '<span class="hint">not in the managed list</span>'; };
  return list.map(b=>`<tr><td>${esc(b.name)}${b.cusp_country ? ` <span class="hint">${esc(b.cusp_country)}</span>` : ''}${rename ? ` <button type="button" class="btn btn-ghost btn-sm cpd-rn" data-rename="${b.id}" title="Rename this brand on every board">Rename</button>` : ''}</td><td class="cpd-pl">${stores ? plats(b) : ''}</td>${CPD_COLS.map(([f, label])=>
    edit ? `<td><input data-brand="${b.id}" data-f="${f}" value="${esc(b[f]||'')}" aria-label="${esc(label)} of ${esc(b.name)}" class="${b[f] ? '' : (f==='kam' || f==='category_lead' ? 'empty' : '')}" list="cpd-${f}"></td>` : `<td>${esc(b[f]||'—')}</td>`).join('')}</tr>`).join('');
}
/* Rename a brand everywhere. The database carries the new name to every board's tickets and every routing
   rule (trigger brands_rename_propagate) and keeps the old name as an alias. */
async function brandRename(id, after){
  const b = (S.brandsList||[]).find(x=>x.id===id); if(!b) return;
  const name = (prompt(`Rename "${b.name}" on every board, form and routing rule.\nThe old name is kept as an alternative name, so imports still find it.\n\nNew name:`, b.name) || '').trim();
  if(!name || name===b.name) return;
  if((S.brandsList||[]).some(x=> x.id!==id && String(x.name||'').toLowerCase()===name.toLowerCase())) return toast(`"${name}" already exists. Two brands cannot share a name.`, true);
  const {error} = await db.from('brands').update({name}).eq('id', id);
  if(error) return toast('Not renamed: '+error.message, true);
  toast(`Renamed to ${name} on every board`); await refreshCore(); if(after) after();
}
async function cpdMount(){
  const _nav = S.nav, root = document.getElementById('cpd-root'); if(!root) return;
  const brands = (S.brandsList||[]).filter(b=> !b.merged_into && b.active!==false), edit = canEdit(), rename = typeof isAdmin==='function' && isAdmin();
  const stores = {};
  try{ const {data} = await db.from('brand_stores').select('brand_id,platform,launch_state').neq('launch_state','closed').limit(5000); (data||[]).forEach(s=>{ (stores[s.brand_id] = stores[s.brand_id] || []).push(s.platform); }); }catch(e){}
  if(navStale(_nav) || !document.getElementById('cpd-root')) return;
  const managed = brands.filter(b=> (stores[b.id]||[]).length).length;
  const miss = brands.filter(b=> !b.kam || !b.category_lead).length;
  root.innerHTML = `<div class="cpt-bar"><input type="search" id="cpd-q" placeholder="Find a brand or person…" aria-label="Find a brand or person"><span class="hint">${brands.length} brands · ${managed} with managed platforms${miss ? ` · <b style="color:var(--amber)">${miss} without a KAM or category lead</b>` : ''}</span><span class="grow"></span><span class="hint">${edit ? 'Type in a cell; it saves when you leave it.' : 'Read only'}</span></div>
    ${CPD_COLS.map(([f])=>`<datalist id="cpd-${f}">${[...new Set(brands.map(b=>b[f]).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('')}
    <div class="cpt-wrap"><table class="cpd-tbl"><thead><tr><th>Brand</th><th>Platforms we manage</th>${CPD_COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody id="cpd-body">${cpdRowsHTML(brands, '', edit, stores, rename)}</tbody></table></div>`;
  const body = root.querySelector('#cpd-body');
  root.querySelector('#cpd-q').oninput = e => { body.innerHTML = cpdRowsHTML(brands, e.target.value, edit, stores, rename); };
  body.addEventListener('click', e => { const b = e.target.closest('[data-rename]'); if(b) brandRename(b.dataset.rename, cpdMount); });
  body.addEventListener('change', async e => { const i = e.target.closest('input[data-brand]'); if(!i) return;
    const b = (S.brandsList||[]).find(x=>x.id===i.dataset.brand), f = i.dataset.f, v = i.value.trim() || null; if(!b || (b[f]||null)===v) return;
    const {error} = await db.from('brands').update({[f]:v}).eq('id', b.id);
    if(error){ i.value = b[f]||''; return toast('Not saved: '+error.message, true); }
    b[f] = v; i.classList.toggle('empty', !v && (f==='kam' || f==='category_lead')); toast(`${b.name}: saved`); });
}
</script>
