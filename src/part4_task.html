<script>
/* ================= TASK MODAL ================= */
function newTaskModal(projectId, status='todo', groupId=null){
  const p = projById(projectId);
  const m = modal(`<div class="modal-head"><h2>New task</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Title <span class="req">*</span></label><input id="tk-title" placeholder="What needs to be done?">
      <label>Description</label><textarea id="tk-desc" rows="3"></textarea>
      <div class="field-grid">
        <div><label>${esc(coreLabel(projectId,'status'))}</label><select id="tk-status">${STATUSES.map(s=>`<option value="${s.k}" ${s.k===status?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div ${coreHidden(projectId,'priority')?'hidden':''}><label>${esc(coreLabel(projectId,'priority'))}</label><select id="tk-prio">${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k==='normal'?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div ${coreHidden(projectId,'assignee')?'hidden':''}><label>${esc(coreLabel(projectId,'assignee'))}</label><select id="tk-assignee"><option value="">Unassigned</option>${assigneeOptions(projectId)}</select></div>
        <div ${coreHidden(projectId,'due_date')?'hidden':''}><label>${esc(coreLabel(projectId,'due_date'))}</label><input id="tk-due" type="date"></div>
      </div>
      <label>Tags (comma separated)</label><input id="tk-tags" placeholder="e.g. 9.9, shopee">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tk-save">Create task</button></div>`);
  m.querySelector('#tk-title').focus();
  m.querySelector('#tk-save').onclick = async ()=>{
    const title=m.querySelector('#tk-title').value.trim(); if(!title) return toast('Title is required', true);
    const maxPos = Math.max(0, ...(S._tasks||[]).map(t=>t.position||0));
    const {data, error} = await db.from('tasks').insert({
      project_id:projectId, title, description:m.querySelector('#tk-desc').value.trim(),
      status:m.querySelector('#tk-status').value, priority:m.querySelector('#tk-prio').value,
      assignee_id:m.querySelector('#tk-assignee').value||null, due_date:m.querySelector('#tk-due').value||null,
      tags:m.querySelector('#tk-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      created_by:S.me.id, position:maxPos+1, group_id:groupId
    }).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Task created');
    if(S.route.view==='project') renderProject(projectId); else renderHome();
  };
}
function assigneeOptions(projectId, selected){
  // staff can assign anyone; also include project members (partners)
  return S.profiles.filter(p=>p.active).map(p=>
    `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.full_name)}</option>`).join('');
}
/* #/task/<id> — a shareable link straight to one task */
async function openTaskRoute(id){
  const {data:t} = await db.from('tasks').select('id,project_id').eq('id',id).single();
  if(!t){ toast('Task not found — it may have been deleted or you may not have access', true); location.hash='#/home'; return; }
  location.hash = '#/project/' + t.project_id;
  setTimeout(()=>openTask(id), 450);
}
async function openTask(id){
  const [{data:t}, {data:chk}, {data:comments}, {data:atts}, {data:subs}, {data:hist}, {data:apprs}, {data:depsOn}, {data:depsBy}] = await Promise.all([
    db.from('tasks').select('*').eq('id',id).single(),
    db.from('task_checklist').select('*').eq('task_id',id).order('position'),
    db.from('comments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('attachments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('subtasks').select('*').eq('task_id',id).order('position').order('created_at'),
    db.from('activity_log').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at',{ascending:false}).limit(200),
    db.from('approvals').select('*').eq('task_id',id).order('created_at'),
    db.from('task_deps').select('*').eq('task_id',id),
    db.from('task_deps').select('*').eq('depends_on',id),
  ]);
  S._taskHist = hist||[]; S._histEntity = id; S._histType = 'task';
  if(!t) return toast('Task not found', true);
  S._taskDeps = depsOn||[];
  // Titles/statuses for what this task waits on — the board cache usually has them.
  let depTasks = [];
  const depIds = (depsOn||[]).map(d=>d.depends_on);
  if(depIds.length){
    depTasks = (S._tasksAll||S._tasks||[]).filter(x=>depIds.includes(x.id));
    const missing = depIds.filter(i=>!depTasks.some(x=>x.id===i));
    if(missing.length){ const {data:mt} = await db.from('tasks').select('id,title,status').in('id',missing); depTasks = depTasks.concat(mt||[]); }
  }
  await hydrateCommentAtts(comments||[]);
  // this board's columns (fetched when the popup opens from somewhere other than the board)
  const flds = await icLoadFields(t);
  const bt = (S._tasks||[]).find(x=>x.id===t.id);
  S._popTask = bt? Object.assign(bt, {custom:t.custom}) : t;    // edits land on the board's row too
  const cfg = icConfig(t.project_id, flds);
  S._commentCache = {}; (comments||[]).forEach(c=> S._commentCache[c.id]=c);
  const p = projById(t.project_id);
  const ws = S.workspaces.find(w=>w.id===p?.workspace_id);
  const edit = canEdit();
  // Brand / platform columns on this board give the meta line its "Revlon · Lazada".
  const metaVals = flds.filter(f=>f.ftype==='brand'||f.ftype==='platform')
    .map(f=>bfColValue(t,f)).filter(Boolean);
  const meta = [ticketTag(t,'tv-tkt'), ...metaVals.map(v=>`<span>${esc(v)}</span>`)].filter(Boolean);
  const nComments = (comments||[]).filter(c=>!c.deleted_at).length;
  const showComments = sectionOn(t.project_id,'comments'), showActivity = !isExternal();
  const chkDone = (chk||[]).filter(c=>c.done).length;
  const owner = prof(t.assignee_id);
  const tabOn = {fields: flds.length>0, subtasks: cfg.tabs.includes('subtasks') && sectionOn(t.project_id,'subtasks'),
    files: cfg.tabs.includes('files'), comments: showComments, activity: showActivity};
  const first = tabOn.fields? 'fields' : 'details';
  const tabDefs = [['fields','Fields'],['details','Details'],['subtasks','Subtasks'],['files','Files'],['comments','Comments'],['activity','Activity']]
    .filter(([k])=> k==='details' || tabOn[k]);
  const subsHTML = sectionOn(t.project_id,'subtasks')? `<section class="tv-sec"><label>Subtasks</label>
            <div id="tv-subprog">${subProgressBar(subs||[])}</div>
            <div id="tv-subs">${(subs||[]).map(stRow).join('')}</div>
            ${canCreate()? `<div class="tv-add"><input id="tv-sub-new" placeholder="Add a subtask…"><button class="btn btn-ghost btn-sm" id="tv-sub-add">Add</button></div>`:''}</section>`:'';
  const attsHTML = sectionOn(t.project_id,'attachments')? `<section class="tv-sec"><label>Attachments</label>
            <div id="tv-atts">${attListHTML(atts, edit)}</div>
            ${canCreate()? attachZoneHTML('tv-drop') : ''}</section>`:'';
  const m = modal(`<div class="modal-head tv-head">
      <div class="task-heading">
        <div class="task-context">${esc(ws?.name||'')}${ws?' <span aria-hidden="true">/</span> ':''}<b>${esc(p?.name||'Task')}</b></div>
        <h2 class="tv-h2"><span id="tv-title-view" class="tv-title-view" ${edit?'role="button" tabindex="0" title="Click to rename"':''}>${esc(t.title)}</span></h2>
        <input id="tv-title" class="tv-title-input" aria-label="Task title" value="${esc(t.title)}" ${edit?'':'disabled'} hidden>
        ${meta.length? `<div class="tv-meta">${meta.join(' <span class="tv-sep" aria-hidden="true">·</span> ')}</div>`:''}
      </div>
      <button class="x" aria-label="Close" onclick="closeModals()">✕</button></div>
    <div class="tv-props">
      <div class="tv-pills">
        <select id="tv-status" class="tv-pill tv-pill-status" aria-label="${esc(coreLabel(t.project_id,'status'))}" ${edit?'':'disabled'}>${STATUSES.map(s=>`<option value="${s.k}" ${s.k===t.status?'selected':''}>${s.label}</option>`).join('')}</select>
        <select id="tv-prio" class="tv-pill tv-pill-prio" aria-label="${esc(coreLabel(t.project_id,'priority'))}" ${edit?'':'disabled'} ${coreHidden(t.project_id,'priority')?'hidden':''}>${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k===t.priority?'selected':''}>${x.label}</option>`).join('')}</select>
      </div>
      <div class="tv-prop" ${coreHidden(t.project_id,'assignee')?'hidden':''}>
        <label for="tv-assignee">${esc(coreLabel(t.project_id,'assignee'))}</label>
        <div class="tv-prop-val"><span id="tv-owner-av">${owner? avatar(owner,true):''}</span>
          <select id="tv-assignee" class="tv-bare" ${edit?'':'disabled'}><option value="">Unassigned</option>${assigneeOptions(t.project_id, t.assignee_id)}</select></div>
      </div>
      <div class="tv-prop" ${coreHidden(t.project_id,'due_date')?'hidden':''}>
        <label for="tv-due">${esc(coreLabel(t.project_id,'due_date'))}</label>
        <div class="tv-prop-val"><input id="tv-due" class="tv-bare" type="date" value="${t.due_date||''}" ${edit?'':'disabled'}></div>
      </div>
    </div>
    <div class="tv-tabbar"><div class="tv-tabs" role="tablist" aria-label="Task sections">${tabDefs.map(([k,l])=>
        `<button role="tab" class="tv-tab${k===first?' on':''}" id="tv-tab-${k}" aria-controls="tv-pane-${k}" aria-selected="${k===first}" ${k===first?'':'tabindex="-1"'}>${l}${k==='comments'? ` <span class="tv-count" id="tv-comment-count">${nComments||''}</span>`:''}</button>`).join('')}</div>
      ${canManageBoard(t.project_id)? `<button class="tv-tab-add" aria-label="Add or remove tabs" title="Add or remove tabs" onclick="icTabMenu(this,'${t.id}','${t.project_id}')">＋</button>`:''}</div>
    <div class="modal-body">
      ${tabOn.fields? `<div role="tabpanel" id="tv-pane-fields" aria-labelledby="tv-tab-fields">
        ${canManageBoard(t.project_id)? `<div class="ic-bar"><button class="btn btn-ghost btn-sm" onclick="icLayoutModal('${t.id}')">Edit layout</button></div>`:''}
        <div id="ic-cards" class="ic-grid">${icCardsHTML(S._popTask, flds, cfg)}</div></div>`:''}
      <div role="tabpanel" id="tv-pane-details" aria-labelledby="tv-tab-details" class="tv-grid" ${first==='details'?'':'hidden'}>
        <div class="tv-main">
          ${sectionOn(t.project_id,'description')? `<section class="tv-sec"><label for="tv-desc">Description</label><textarea id="tv-desc" rows="4" placeholder="${edit?'Add a description…':''}" ${edit?'':'disabled'}>${esc(t.description)}</textarea></section>`:''}
          ${sectionOn(t.project_id,'checklist')? `<section class="tv-sec"><label>Checklist <span class="tv-sub" id="tv-chk-count">${(chk||[]).length? `(${chkDone} of ${(chk||[]).length} complete)`:''}</span></label>
            <div id="tv-chk">${(chk||[]).map(c=>chkRow(c)).join('')}</div>
            ${edit? `<div class="tv-add"><input id="tv-chk-new" placeholder="Add checklist item…"><button class="btn btn-ghost btn-sm" id="tv-chk-add">Add</button></div>`:''}</section>`:''}
          ${tabOn.subtasks? '' : subsHTML}
        </div>
        <div class="tv-side">
          ${tabOn.files? '' : attsHTML}
          ${sectionOn(t.project_id,'deps') && (isStaff() || (depsOn||[]).length || (depsBy||[]).length)? `<section class="tv-sec tv-deps${(depsOn||[]).length?' is-waiting':''}">${depsSectionHTML(t, depsOn||[], depsBy||[], depTasks)}</section>` : ''}
          ${(p?.approval_gate?.on || (apprs||[]).length)? `<section class="tv-sec">${signoffSectionHTML(t, apprs||[], p?.approval_gate||{})}</section>` : ''}
        </div>
        <div class="tv-created">Created ${fmtDateTime(t.created_at)} by ${esc(prof(t.created_by)?.full_name||'—')} · in ${esc(p?.name||'')}</div>
      </div>
      ${tabOn.subtasks? `<div role="tabpanel" id="tv-pane-subtasks" aria-labelledby="tv-tab-subtasks" hidden>${subsHTML}</div>`:''}
      ${tabOn.files? `<div role="tabpanel" id="tv-pane-files" aria-labelledby="tv-tab-files" hidden>${attsHTML}${icFilesHTML(S._popTask, flds, comments)}</div>`:''}
      ${showComments? `<div role="tabpanel" id="tv-pane-comments" aria-labelledby="tv-tab-comments" hidden>
        <div id="tv-comments">${(comments||[]).map(commentRow).join('')||'<div style="color:var(--ink3);font-size:13px">No comments yet</div>'}</div>
        ${canCreate()? commentComposerHTML('tv') : ''}</div>`:''}
      ${showActivity? `<div role="tabpanel" id="tv-pane-activity" aria-labelledby="tv-tab-activity" hidden>
        <div id="tv-history">${historyHTML(S._taskHist)}</div></div>`:''}
    </div>
    <div class="modal-foot">
      ${isStaff()? `<button class="btn btn-ghost btn-danger-ghost" onclick="deleteTask('${t.id}','${t.project_id}')">Delete task</button>`:''}
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="closeModals()">${edit?'Cancel':'Close'}</button>${edit? `<button class="btn btn-primary" id="tv-save">Save changes</button>`:''}</div>`, true);

  m.classList.add('task-modal-back');
  m.querySelector('.modal').classList.add('task-modal');
  wireTaskView(m, t);

  if(m.querySelector('#tv-save')) m.querySelector('#tv-save').onclick = async ()=>{
    const desc = m.querySelector('#tv-desc');
    const upd = {
      title:m.querySelector('#tv-title').value.trim()||t.title,
      ...(desc? {description:desc.value} : {}),      // Description may be switched off on this board
      status:m.querySelector('#tv-status').value, priority:m.querySelector('#tv-prio').value,
      assignee_id:m.querySelector('#tv-assignee').value||null, due_date:m.querySelector('#tv-due').value||null,
    };
    const {error} = await db.from('tasks').update(upd).eq('id',t.id);
    if(error) return toast(error.message, true);
    closeModals(); toast('Task saved');
    if(S.route.view==='project') renderProject(t.project_id); else if(S.route.view==='home') renderHome();
  };
  if(m.querySelector('#tv-sub-add')) m.querySelector('#tv-sub-add').onclick = async ()=>{
    const title = m.querySelector('#tv-sub-new').value.trim(); if(!title) return;
    const {data, error} = await db.from('subtasks').insert({task_id:t.id, title, created_by:S.me.id, position:(m.querySelectorAll('.strow').length)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-subs').insertAdjacentHTML('beforeend', stRow(data));
    m.querySelector('#tv-sub-new').value=''; refreshSubProg(t.id);
  };
  if(m.querySelector('#tv-chk-add')) m.querySelector('#tv-chk-add').onclick = async ()=>{
    const label = m.querySelector('#tv-chk-new').value.trim(); if(!label) return;
    const {data, error} = await db.from('task_checklist').insert({task_id:t.id, label, position:(chk?.length||0)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-chk').insertAdjacentHTML('beforeend', chkRow(data));
    m.querySelector('#tv-chk-new').value='';
  };
  // Paste a whole list -> one subtask / checklist item per line
  wireListPaste(m.querySelector('#tv-sub-new'), lines=> addSubtasksBulk(t.id, lines, m));
  wireListPaste(m.querySelector('#tv-chk-new'), lines=> addChecklistBulk(t.id, lines, m));
  wireAttachZone(m, 'tv-drop', 'task', t.id, m.querySelector('#tv-atts'));
  const cIn = m.querySelector('#tv-comment');
  if(cIn){
    wireComposer(m, 'tv');
    wireMentions(cIn);
    cIn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !document.querySelector('.mention-menu')){ e.preventDefault(); m.querySelector('#tv-comment-add').click(); } });
    m.querySelector('#tv-comment-add').onclick = ()=> postComment('task', t.id, t.title, cIn, m.querySelector('#tv-comments'));
  }
}
/* Task popup chrome (4 Oct 2026): tabs, click-to-rename title, coloured status/priority
   pills, and live counts. Everything here is presentation; the Save handler in openTask
   still reads #tv-title / #tv-status / #tv-prio / #tv-assignee / #tv-due as before. */
function tvPaintPills(m){
  const st = m.querySelector('#tv-status'), pr = m.querySelector('#tv-prio');
  if(st){ const s = STATUSES.find(x=>x.k===st.value)||STATUSES[0];
    st.style.background = `color-mix(in srgb, ${s.color} 16%, var(--panel))`; st.style.color = s.ink||s.color; st.style.borderColor = 'transparent'; }
  if(pr){ const x = PRIORITIES.find(y=>y.k===pr.value)||PRIORITIES[2];
    pr.style.background = x.soft; pr.style.color = x.color; pr.style.borderColor = 'transparent'; }
}
function tvShowTab(m, which){
  m.querySelectorAll('.tv-tab').forEach(b=>{
    const on = b.id==='tv-tab-'+which;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); b.tabIndex = on? 0 : -1;
    const pane = m.querySelector('#'+b.getAttribute('aria-controls')); if(pane) pane.hidden = !on;
  });
}
function tvCounts(m){
  const chk = m.querySelector('#tv-chk'), cc = m.querySelector('#tv-chk-count');
  if(chk && cc){ const all = chk.querySelectorAll('.chk').length, done = chk.querySelectorAll('.chk.done').length;
    cc.textContent = all? `(${done} of ${all} complete)` : ''; }
  const cm = m.querySelector('#tv-comments'), cn = m.querySelector('#tv-comment-count');
  if(cm && cn){ const n = cm.querySelectorAll('.comment').length; cn.textContent = n||''; }
}
function wireTaskView(m, t){
  tvPaintPills(m);
  const cards = m.querySelector('#ic-cards');
  if(cards){ icWire(cards);
    cards.addEventListener('keydown', e=>{ if(e.key==='Escape' && e.target.matches('input')) e.stopPropagation(); }); }
  const side = m.querySelector('#tv-pane-details .tv-side');
  if(side && !side.children.length){ side.remove(); m.querySelector('#tv-pane-details').classList.add('solo'); }
  setTimeout(()=>{ const box=m.querySelector('.modal'); if(box && box.contains(document.activeElement) && document.activeElement.id==='tv-title-view') box.focus({preventScroll:true}); }, 0);
  ['#tv-status','#tv-prio'].forEach(sel=>{ const el=m.querySelector(sel); if(el) el.addEventListener('change', ()=>tvPaintPills(m)); });
  const asg = m.querySelector('#tv-assignee'), av = m.querySelector('#tv-owner-av');
  if(asg && av) asg.addEventListener('change', ()=>{ const p = prof(asg.value); av.innerHTML = p? avatar(p,true) : ''; });
  // Tabs: click, and ←/→/Home/End between them (WAI-ARIA tabs pattern)
  const tabs = [...m.querySelectorAll('.tv-tab')];
  tabs.forEach((b,i)=>{
    b.onclick = ()=> tvShowTab(m, b.id.replace('tv-tab-',''));
    b.onkeydown = e=>{
      let j = null;
      if(e.key==='ArrowRight') j=(i+1)%tabs.length; else if(e.key==='ArrowLeft') j=(i-1+tabs.length)%tabs.length;
      else if(e.key==='Home') j=0; else if(e.key==='End') j=tabs.length-1;
      if(j==null) return; e.preventDefault(); tabs[j].click(); tabs[j].focus();
    };
  });
  // Title: reads as a heading, becomes an input on click / Enter
  const view = m.querySelector('#tv-title-view'), inp = m.querySelector('#tv-title');
  if(view && inp && !inp.disabled){
    const open = ()=>{ view.parentElement.hidden = true; inp.hidden = false; inp.focus(); inp.select(); };
    const shut = ()=>{ view.textContent = inp.value.trim() || t.title; view.parentElement.hidden = false; inp.hidden = true; };
    view.onclick = open;
    view.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
    inp.addEventListener('blur', shut);
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); inp.blur(); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); inp.value = view.textContent; inp.blur(); }
    });
  }
  // Counts follow the lists however rows get added (Add, paste, re-render) or removed
  const sync = ()=> tvCounts(m);
  ['#tv-chk','#tv-comments'].forEach(sel=>{ const el=m.querySelector(sel);
    if(el){ new MutationObserver(sync).observe(el, {childList:true, subtree:true, attributes:true, attributeFilter:['class']}); el.addEventListener('change', ()=>setTimeout(sync,0)); } });
}
/* ---- Task popup: board columns as cards (6 Oct 2026) ----
   Every board column shows in the popup as an editable field, grouped into named cards.
   The layout is per board and shared by everyone: projects.field_config.item_card =
   {cards:[{id,title,fields:[fid]}], hidden:[fid], tabs:['subtasks','files']}. It lives on
   projects, so projects_update (can_manage_board) is what guards it — no new policy.
   Cells are the table's own editors (tvCell / tvEdit / tvCustom), so a value edited here
   saves, validates and runs automations exactly as it does on the board. */
const IC_TABS = [{k:'subtasks', label:'Subtasks'}, {k:'files', label:'Files'}];
const IC_FTYPE = {text:'Text', number:'Number', date:'Date', select:'Dropdown', checkbox:'Checkbox', person:'Person',
  brand:'Brand', platform:'Platform', file:'File', formula:'Formula', link:'Link to board', mirror:'Mirror'};
const icTabs = v => Array.isArray(v)? IC_TABS.map(x=>x.k).filter(k=>v.includes(k)) : [];
function icDefaultCards(flds){
  const dp = new Set(['date','person','file']);
  const a = flds.filter(f=>!dp.has(f.ftype)).map(f=>f.id), b = flds.filter(f=>dp.has(f.ftype)).map(f=>f.id);
  const cards = [];
  if(a.length) cards.push({id:'info', title:'Information', fields:a});
  if(b.length) cards.push({id:'dates', title:'Dates & people', fields:b});
  if(!cards.length) cards.push({id:'info', title:'Information', fields:[]});
  return cards;
}
/* Reads whatever is stored defensively — a hand-edited or stale config must never break the
   popup. Columns added after the layout was saved land in the last card, so nothing new goes
   missing; columns deleted since simply drop out. */
function icConfig(pid, flds){
  const raw = ((projById(pid)||{}).field_config||{}).item_card;
  const ok = raw && typeof raw==='object' && !Array.isArray(raw);
  const tabs = icTabs(ok? raw.tabs : null);
  if(!(ok && Array.isArray(raw.cards) && raw.cards.length))
    return {cards:icDefaultCards(flds), hidden:[], tabs, custom:false};
  const ids = new Set(flds.map(f=>f.id));
  const hidden = [...new Set((Array.isArray(raw.hidden)? raw.hidden : []).filter(id=>ids.has(id)))];
  const seen = new Set(hidden);
  const cards = raw.cards.filter(c=>c && typeof c==='object').map((c,i)=>({
    id: String(c.id||('c'+i)).slice(0,40),
    title: String(c.title==null? 'Information' : c.title).slice(0,60),
    fields: (Array.isArray(c.fields)? c.fields : []).filter(id=>{ if(!ids.has(id) || seen.has(id)) return false; seen.add(id); return true; }),
  }));
  if(!cards.length) return {cards:icDefaultCards(flds), hidden:[], tabs, custom:false};
  flds.forEach(f=>{ if(!seen.has(f.id)) cards[cards.length-1].fields.push(f.id); });
  return {cards, hidden, tabs, custom:true};
}
/* The popup can open a task from Home, the calendar or search, where the board behind it is a
   different one (or none). Load this task's own columns then; add to the option lists and the
   link caches, never rebuild them — the open board still renders from them. */
async function icLoadFields(t){
  let flds = (S._fields||[]).filter(f=>f.project_id===t.project_id);
  if(!flds.length){
    const {data} = await db.from('project_fields').select('*').eq('project_id',t.project_id).order('position').order('created_at');
    flds = data||[];
    const links = flds.filter(f=>f.ftype==='link');
    if(links.length){
      const ids = links.map(f=>(t.custom||{})[f.id]).filter(v=>typeof v==='string' && LINK_ID_RE.test(v));
      const targets = [...new Set(links.map(f=>(f.options||{}).project_id).filter(Boolean))];
      const [lt, lf] = await Promise.all([
        ids.length? db.from('tasks').select('id,title,status,priority,assignee_id,due_date,group_id,project_id,custom').in('id',ids) : Promise.resolve({data:[]}),
        targets.length? db.from('project_fields').select('id,label,ftype,options').in('project_id',targets) : Promise.resolve({data:[]}),
      ]);
      S._linkedTasks = S._linkedTasks||{}; S._linkedFields = S._linkedFields||{};
      ((lt&&lt.data)||[]).forEach(x=> S._linkedTasks[x.id]=x);
      ((lf&&lf.data)||[]).forEach(x=> S._linkedFields[x.id]=x);
    }
  }
  S._popFields = flds;
  if(!TVO.status) tvBuildOpts(S._fields||[]);
  flds.forEach(f=>{ if(f.ftype==='select') TVO['f_'+f.id] = (f.options||[]).map(o=>({v:o, l:o})); });
  return flds;
}

async function icSaveItemCard(pid, patch){
  const p = projById(pid); if(!p) return false;
  const fc = Object.assign({}, p.field_config||{});
  const ic = Object.assign({}, (fc.item_card && typeof fc.item_card==='object')? fc.item_card : {}, patch);
  Object.keys(ic).forEach(k=>{ if(ic[k]==null) delete ic[k]; });     // null = back to the default for that part
  if(Object.keys(ic).length) fc.item_card = ic; else delete fc.item_card;
  const {error} = await db.from('projects').update({field_config:fc}).eq('id',pid);
  if(error){ toast(error.message, true); return false; }
  p.field_config = fc; return true;
}

/* ---- Edit layout: cards, their columns and order, hidden columns, extra tabs ---- */
function icLayListHTML(d, byId){

    + `<option value="hide" ${cur==='hide'?'selected':''}>Not shown</option>`;

      <div class="icl-fields" data-ci="${ci}">${c.fields.map((fid,i)=>row(fid,ci,i,c.fields.length)).join('') || '<div class="icl-empty">Drop columns here</div>'}</div></div>`).join('')
    + `<div class="icl-card icl-hidden"><div class="icl-card-head"><b>Not shown</b></div>
      <div class="icl-fields" data-ci="hide">${d.hidden.map((fid,i)=>row(fid,'hide',i,d.hidden.length)).join('') || '<div class="icl-empty">Every column is shown</div>'}</div></div>`;

function icLayoutModal(taskId){
  const t = S._popTask; if(!t || t.id!==taskId) return;
  const pid = t.project_id, flds = S._popFields||[];
  if(!canManageBoard(pid)) return;
  const byId = Object.fromEntries(flds.map(f=>[f.id,f]));
  const cfg = icConfig(pid, flds);
  const d = {cards: cfg.cards.map(c=>({id:c.id, title:c.title, fields:c.fields.slice()})), hidden: cfg.hidden.slice(), tabs: cfg.tabs.slice(), reset:false};
  let n = 0; const newId = ()=> 'c'+Date.now().toString(36)+(n++);
  const m = modal(`<div class="modal-head"><h2>Task layout</h2><button class="x" aria-label="Close" onclick="closeTopModal()">✕</button></div>
    <div class="modal-body icl">
      <div class="icl-note">Changes apply to every task on ${esc(projById(pid)?.name||'this board')}, for everyone.</div>
      <div id="icl-list">${icLayListHTML(d, byId)}</div>

    </div>
    <div class="modal-foot"><button class="btn btn-ghost" data-act="reset">Reset to default</button><span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="closeTopModal()">Cancel</button><button class="btn btn-primary" data-act="save">Save layout</button></div>`, true);
  m.querySelector('.modal').classList.add('icl-modal');
  const list = m.querySelector('#icl-list');
  const listOf = ci => ci==='hide'? d.hidden : d.cards[+ci].fields;
  const draw = (focusSel)=>{
    list.innerHTML = icLayListHTML(d, byId);
    if(focusSel){ const el = list.querySelector(focusSel); if(el && !el.disabled) el.focus(); else list.querySelector(focusSel.replace(/\[data-act="[^"]+"\]/,'select'))?.focus(); }
  };
  const moveField = (fid, from, to, at)=>{
    const src = listOf(from), i = src.indexOf(fid); if(i<0) return;
    src.splice(i,1);
    const dst = listOf(to); dst.splice(at==null? dst.length : Math.min(at, dst.length), 0, fid);
    d.reset = false;
  };
  m.addEventListener('input', e=>{ if(e.target.classList.contains('icl-title')){ d.cards[+e.target.dataset.ci].title = e.target.value; d.reset=false; } });
  m.addEventListener('change', e=>{
    const el = e.target;
    if(el.dataset.tab){ const k=el.dataset.tab; d.tabs = el.checked? IC_TABS.map(x=>x.k).filter(x=>x===k||d.tabs.includes(x)) : d.tabs.filter(x=>x!==k); return; }
    if(el.dataset.act==='f-move'){
      const row = el.closest('.icl-row'); moveField(row.dataset.fid, row.dataset.ci, el.value);
      draw(`.icl-row[data-fid="${row.dataset.fid}"] select`);
    }
  });
  m.addEventListener('click', async e=>{
    const b = e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT') return;
    const act = b.dataset.act, row = b.closest('.icl-row');
    if(act==='f-up'||act==='f-down'){
      const L = listOf(row.dataset.ci), i = L.indexOf(row.dataset.fid), j = act==='f-up'? i-1 : i+1;
      if(j<0 || j>=L.length) return; [L[i],L[j]] = [L[j],L[i]]; d.reset=false;
      draw(`.icl-row[data-fid="${row.dataset.fid}"] [data-act="${act}"]`);
    } else if(act==='c-up'||act==='c-down'){
      const i = +b.dataset.ci, j = act==='c-up'? i-1 : i+1; if(j<0 || j>=d.cards.length) return;
      [d.cards[i], d.cards[j]] = [d.cards[j], d.cards[i]]; d.reset=false;
      draw(`[data-act="${act}"][data-ci="${j}"]`);
    } else if(act==='c-del'){
      const i = +b.dataset.ci; if(d.cards.length<2) return;
      const keep = d.cards[i===0? 1 : i-1];                // its columns move to the neighbouring card, never vanish
      keep.fields.push(...d.cards[i].fields); d.cards.splice(i,1); d.reset=false;
      draw('.icl-title');
    } else if(act==='add-card'){
      d.cards.push({id:newId(), title:'New card', fields:[]}); d.reset=false;
      draw(`.icl-title[data-ci="${d.cards.length-1}"]`);
      const inp = list.querySelector(`.icl-title[data-ci="${d.cards.length-1}"]`); if(inp){ inp.focus(); inp.select(); }
    } else if(act==='reset'){
      d.cards = icDefaultCards(flds); d.hidden = []; d.reset = true; draw();
      toast('Default layout restored here — Save layout to keep it');
    } else if(act==='save'){
      const patch = d.reset? {cards:null, hidden:null, tabs:d.tabs}
        : {v:1, cards:d.cards.map(c=>({id:c.id, title:(c.title||'').trim()||'Untitled', fields:c.fields.slice()})), hidden:d.hidden.slice(), tabs:d.tabs};
      b.disabled = true;
      const ok = await icSaveItemCard(pid, patch);
      b.disabled = false; if(!ok) return;
      const tabsChanged = d.tabs.join()!==cfg.tabs.join();
      closeTopModal();
      toast('Layout saved for every task on this board');
      if(tabsChanged){ closeModals(); openTask(taskId); } else icRefresh();
    }
  });
  // drag a column onto a card (or onto a row to land just before it); the buttons and the
  // "where it shows" select do everything drag does, for keyboard users
  let drag = null;
  m.addEventListener('dragstart', e=>{ const r = e.target.closest?.('.icl-row'); if(!r) return;
    drag = {fid:r.dataset.fid, from:r.dataset.ci}; r.classList.add('dragging');
    try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', r.dataset.fid); }catch(x){} });
  m.addEventListener('dragend', ()=>{ drag = null; m.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover')); });
  m.addEventListener('dragover', e=>{ const z = e.target.closest?.('.icl-fields'); if(!z || !drag) return; e.preventDefault();
    m.querySelectorAll('.icl-fields.dragover').forEach(x=>{ if(x!==z) x.classList.remove('dragover'); }); z.classList.add('dragover'); });
  m.addEventListener('drop', e=>{ const z = e.target.closest?.('.icl-fields'); if(!z || !drag) return; e.preventDefault();
    const before = e.target.closest('.icl-row'); const to = z.dataset.ci;
    let at = null;
    if(before && before.dataset.fid!==drag.fid){ at = listOf(to).indexOf(before.dataset.fid);
      if(to===drag.from && listOf(to).indexOf(drag.fid) < at) at -= 1; }
    moveField(drag.fid, drag.from, to, at); const fid = drag.fid; drag = null; draw(`.icl-row[data-fid="${fid}"] select`); });
}

/* One definition of "what could this task wait on", so the button and the
   picker can never disagree. */
function depCandidates(taskId){
  const linked = new Set((S._taskDeps||[]).map(d=>d.depends_on));
  return (S._tasks||[]).filter(x=>x.id!==taskId && x.status!=='done' && !x.archived_at && !linked.has(x.id));

function addDepModal(taskId){

  if(!pool.length) return toast('Nothing on this board left to wait on');

async function removeDep(taskId, dependsOn){
  const {error} = await db.from('task_deps').delete().eq('task_id',taskId).eq('depends_on',dependsOn);
  if(error) return toast(error.message, true);
  S._deps = (S._deps||[]).filter(d=>!(d.task_id===taskId && d.depends_on===dependsOn));
  toast('Dependency removed'); closeModals(); openTask(taskId);
}
/* Same decision as decideApproval, but lands back in the task drawer.
   The DB writes the notification + history rows itself. */
async function decideTaskApproval(id, status, taskId){
  let note = '';
  if(status==='rejected'){ note = prompt('Reason for rejection (optional):')||''; }
  const {error} = await db.from('approvals').update({status, note, decided_at:new Date().toISOString()}).eq('id',id);
  if(error) return toast(error.message, true);
  toast(status==='approved'? 'Approved':'Rejected');
  updateApprovalBadge();
  closeModals(); openTask(taskId);
}
/* ---- paste a list, get items: one per line, bullets/numbering stripped ---- */
function splitPasteLines(text){
  return String(text||'').split(/\r?\n/)
    .map(s=> s.replace(/^\s*(?:[-–—•*▪◦✓☐]|\d+[.)])\s*/,'').trim())
    .filter(Boolean);
}
function wireListPaste(input, addMany){
  if(!input) return;
  input.addEventListener('paste', e=>{
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const lines = splitPasteLines(txt);
    if(lines.length < 2) return;              // single line pastes normally
    e.preventDefault();
    addMany(lines);
  });
}
async function addSubtasksBulk(taskId, lines, m){
  const base = m.querySelectorAll('.strow').length;
  const {data, error} = await db.from('subtasks').insert(
    lines.map((title,i)=>({task_id:taskId, title, created_by:S.me.id, position:base+i+1}))).select();
  if(error) return toast(error.message, true);
  (data||[]).forEach(s=> m.querySelector('#tv-subs').insertAdjacentHTML('beforeend', stRow(s)));
  m.querySelector('#tv-sub-new').value=''; refreshSubProg(taskId);
  toast(`${(data||[]).length} subtasks added`);
}
async function addChecklistBulk(taskId, lines, m){
  const base = m.querySelector('#tv-chk').children.length;
  const {data, error} = await db.from('task_checklist').insert(
    lines.map((label,i)=>({task_id:taskId, label, position:base+i+1}))).select();
  if(error) return toast(error.message, true);
  (data||[]).forEach(c=> m.querySelector('#tv-chk').insertAdjacentHTML('beforeend', chkRow(c)));
  m.querySelector('#tv-chk-new').value='';
  toast(`${(data||[]).length} checklist items added`);
}
function subProgressBar(subs){
  const total=subs.length, done=subs.filter(s=>s.status==='done').length;
  if(!total) return '';
  const pct = Math.round(done/total*100);
  return `<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><span class="prog-lbl">${done}/${total} done</span></div>`;
}
async function refreshSubProg(taskId){
  const {data:subs} = await db.from('subtasks').select('status').eq('task_id',taskId);
  const box = document.getElementById('tv-subprog'); if(box) box.innerHTML = subProgressBar(subs||[]);
}
function stRow(s){
  if(!canEdit()) return `<div class="strow ro" id="st-${s.id}">
    <span class="tv-fill mini" style="background:${STATUSES.find(x=>x.k===s.status)?.color||'#8E93A8'}">${esc(STATUSES.find(x=>x.k===s.status)?.label||s.status)}</span>
    <span style="font-size:12.5px">${esc(s.title)}</span><span style="font-size:12px;color:var(--ink3)">${esc(s.stype||'')}</span>
    <span style="font-size:12px">${s.assignee_id? esc(prof(s.assignee_id)?.full_name||''):''}</span>
    <span style="font-size:12px;color:var(--ink3)">${s.due_date||''}</span><span></span></div>`;
  return `<div class="strow" id="st-${s.id}" data-task="${s.task_id}">
    <select class="st-status" aria-label="Subtask status" onchange="stUpd('${s.id}','status',this.value,'${s.task_id}')">${STATUSES.map(x=>`<option value="${x.k}" ${x.k===s.status?'selected':''}>${x.label}</option>`).join('')}</select>
    <input class="st-title" aria-label="Subtask title" type="text" value="${esc(s.title)}" onchange="stUpd('${s.id}','title',this.value.trim(),'${s.task_id}')">
    <input class="st-type" aria-label="Subtask type" type="text" value="${esc(s.stype||'')}" placeholder="Type" onchange="stUpd('${s.id}','stype',this.value.trim()||null,'${s.task_id}')">
    <select class="st-asg" aria-label="Subtask assignee" onchange="stUpd('${s.id}','assignee_id',this.value||null,'${s.task_id}')"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active && !(p.email||'').startsWith('forms+')).map(p=>`<option value="${p.id}" ${p.id===s.assignee_id?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    <input class="st-due" aria-label="Subtask due date" type="date" value="${s.due_date||''}" onchange="stUpd('${s.id}','due_date',this.value||null,'${s.task_id}')">
    <button class="del" aria-label="Delete subtask" onclick="delSubtask('${s.id}','${s.task_id}')">✕</button></div>`;
}
async function stUpd(id, field, val, taskId){
  const {error} = await db.from('subtasks').update({[field]:val}).eq('id',id);
  if(error) return toast(error.message, true);
  if(field==='status') refreshSubProg(taskId);
}
async function delSubtask(id, taskId){
  const {error} = await db.from('subtasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  document.getElementById('st-'+id)?.remove(); refreshSubProg(taskId);
}
function chkRow(c){
  if(!canEdit()) return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} disabled><span>${esc(c.label)}</span></div>`;
  return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} onchange="toggleChk('${c.id}', this.checked)">
    <span>${esc(c.label)}</span>
    <button class="del" onclick="delChk('${c.id}')">✕</button></div>`;
}
async function toggleChk(id, done){
  await db.from('task_checklist').update({done}).eq('id',id);
  const row = document.getElementById('chk-'+id); if(row) row.classList.toggle('done', done);
}
async function delChk(id){
  await db.from('task_checklist').delete().eq('id',id);
  document.getElementById('chk-'+id)?.remove();
}
function canRemoveComment(c){ return S.me && (c.author_id===S.me.id || isStaff()); }
function canEditComment(c){ return S.me && c.author_id===S.me.id; }
/* A removed comment disappears from the thread entirely — its trace, and the
   Undo, live on the task History instead. */
function commentRow(c){
  if(c.deleted_at) return '';
  const a = prof(c.author_id);
  const atts = c.atts || [];
  return `<div class="comment" data-cid="${c.id}">${avatar(a,true)}<div class="body">
    <b>${esc(a?.full_name||'Unknown')}</b><span class="when">${fmtDateTime(c.created_at)}${c.edited_at? ' · edited':''}</span>
    <span class="cmt-acts">
      ${canEditComment(c)? `<button class="cmt-act" title="Edit" onclick="editComment('${c.id}')">Edit</button>`:''}
      ${canRemoveComment(c)? `<button class="cmt-act danger" title="Remove" onclick="deleteComment('${c.id}')">Remove</button>`:''}
    </span>
    <p class="cmt-body">${c.body? renderMentionText(c.body, c.mentions):''}</p>
    ${atts.length? `<div class="att-list in-comment">${atts.map(x=>attLink(x)).join('')}</div>`:''}
  </div></div>`;
}
function commentsBoxEl(){ return document.querySelector('#tv-comments, #rv-comments'); }
function renderCommentsBox(){
  const box = commentsBoxEl(); if(!box) return;
  const rows = Object.values(S._commentCache||{}).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  box.innerHTML = rows.map(commentRow).join('') || '<div style="color:var(--ink3);font-size:13px">No comments yet</div>';
}
async function refreshTaskHistory(){
  const boxEl = document.getElementById('tv-history'); if(!boxEl || !S._histEntity) return;
  const {data} = await db.from('activity_log').select('*').eq('entity_type', S._histType||'task')
    .eq('entity_id', S._histEntity).order('created_at',{ascending:false}).limit(200);
  S._taskHist = data||[];
  boxEl.innerHTML = historyHTML(S._taskHist);
}
async function deleteComment(id){
  const {data, error} = await db.from('comments')
    .update({deleted_at:new Date().toISOString(), deleted_by:S.me.id}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  toastUndo('Comment removed', ()=>undoDeleteComment(id));
}
async function undoDeleteComment(id){
  const {data, error} = await db.from('comments')
    .update({deleted_at:null, deleted_by:null}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  toast('Comment restored');
}
/* Edit in place: the text swaps for an input; Enter saves, Escape cancels. */
function editComment(id){
  const c = (S._commentCache||{})[id]; if(!c) return;
  const body = document.querySelector(`.comment[data-cid="${id}"] .cmt-body`); if(!body) return;
  if(body.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.className = 'cmt-editbox'; inp.value = c.body||'';
  body.textContent=''; body.appendChild(inp); inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);
  let done=false;
  const cancel = ()=>{ if(done) return; done=true; body.innerHTML = renderMentionText(c.body, c.mentions); };
  const save = async ()=>{
    if(done) return;
    const val = inp.value.trim();
    if(!val || val===c.body) return cancel();
    done=true;
    const {data, error} = await db.from('comments')
      .update({body:val, edited_at:new Date().toISOString()}).eq('id',id).select().single();
    if(error){ done=false; return toast(error.message, true); }
    cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  };
  inp.onkeydown = e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') cancel(); };
  inp.onblur = ()=> setTimeout(save, 100);
}
function cacheComment(row){
  if(!row) return;
  const prev = (S._commentCache||{})[row.id];
  if(prev) row.atts = prev.atts;
  (S._commentCache = S._commentCache||{})[row.id] = row;
}
/* ---- task history ---- */
const statusLabel = k => (STATUSES.find(s=>s.k===k)||{}).label || k || '—';
const prioLabel   = k => (PRIORITIES.find(p=>p.k===k)||{}).label || k || '—';
const groupLabel  = id => ((S._groups||[]).find(g=>g.id===id)||{}).name || (id? 'another group':'no group');
const fieldLabel  = f => ({title:'Title', status:'Status', priority:'Priority', assignee:'Assignee',
                           due_date:'Due date', group:'Group', board:'Board', description:'Description',
                           archived:'Archive'})[f] || f;
function histValue(field, v, key){
  if(v===null || v===undefined || v==='') return '<em>empty</em>';
  if(field==='status')   return esc(statusLabel(v));
  if(field==='priority') return esc(prioLabel(v));
  if(field==='assignee') return esc(prof(v)?.full_name || 'someone');
  if(field==='group')    return esc(groupLabel(v));
  if(field==='board')    return esc(projById(v)?.name || 'another board');
  if(field==='due_date') return esc(fmtDate(v));
  return esc(String(v));
}
function histLine(a){
  const d = a.detail||{};
  switch(a.action){
    case 'created':        return 'created this task';
    case 'deleted':        return 'deleted this task';
    case 'commented':        return `commented${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_deleted':  return `removed a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_restored': return `restored a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_edited':   return `edited a comment${d.was? ` — “${esc(d.was)}” → “${esc(d.excerpt||'')}”` : (d.excerpt? ` — now “${esc(d.excerpt)}”`:'')}`;
    case 'file_added':     return `attached <b>${esc(d.file||'a file')}</b>`;
    case 'file_removed':   return `removed <b>${esc(d.file||'a file')}</b>`;
    case 'subtask_added':  return `added subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_removed':return `removed subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_status': return `marked subtask <b>${esc(d.title||'')}</b> ${esc(d.to==='done'?'done':'not done')}`;
    case 'checklist_added':  return `added checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_removed':return `removed checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_toggled':return `${d.done?'checked':'unchecked'} <b>${esc(d.label||'')}</b>`;
    case 'signoff_requested': return `requested a sign-off from <b>${esc(prof(d.approver)?.full_name||'someone')}</b>`;
    case 'signoff_approved':  return `approved the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    case 'signoff_rejected':  return `rejected the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    // entries written before the history engine existed
    case 'status_changed': return `changed <b>Status</b> from ${histValue('status',d.from)} to ${histValue('status',d.to)}`;
    case 'updated': {
      const cs = d.changes||[];
      if(!cs.length && d.status){ const rs=(typeof REQ_STATUSES!=='undefined'?REQ_STATUSES:[]).find(s=>s.k===d.status);
        return `moved this ticket to <b>${esc(rs?rs.label:d.status)}</b>`; }
      if(!cs.length) return 'made a change';
      return cs.map(c=>{
        if(c.field==='description') return 'edited the description';
        if(c.field==='archived')    return c.to==='archived'? 'archived this task' : 'restored this task';
        if(c.field==='custom'){
          const f = (S._fields||[]).find(x=>x.id===c.key);
          return `set <b>${esc(f?f.name:'a field')}</b> to ${histValue('custom', c.to)}`;
        }
        const from = histValue(c.field, c.from), to = histValue(c.field, c.to);
        if(c.field==='title') return `renamed it to <b>${to}</b>`;
        return `changed <b>${esc(fieldLabel(c.field))}</b> from ${from} to ${to}`;
      }).join(', ');
    }
    default: return esc(a.action.replace(/_/g,' '));
  }
}
function historyHTML(rows, showAll){
  if(!rows || !rows.length) return '<div style="color:var(--ink3);font-size:13px">Nothing recorded yet.</div>';
  const shown = showAll ? rows : rows.slice(0,8);
  return `<div class="hist">${shown.map(a=>{
    const who = prof(a.actor_id);
    const cid = a.action==='comment_deleted' ? (a.detail||{}).comment_id : null;
    const cRow = cid ? (S._commentCache||{})[cid] : null;
    const undo = cid && cRow && cRow.deleted_at && canRemoveComment(cRow)
      ? `<button class="hist-undo" onclick="undoDeleteComment('${cid}')">Undo</button>` : '';
    return `<div class="hist-row">
      ${avatar(who,true)}
      <div class="hist-txt"><b>${esc(who?.full_name||'Someone')}</b> ${histLine(a)}
        <span class="hist-when" title="${fmtDateTime(a.created_at)}">${timeAgo(a.created_at)}</span>${undo}</div>
    </div>`;
  }).join('')}</div>
  ${rows.length>8 && !showAll ? `<div class="hist-more" onclick="showAllHistory()">Show all ${rows.length} events</div>`:''}`;
}
function showAllHistory(){
  const box = document.getElementById('tv-history'); if(!box) return;
  box.innerHTML = historyHTML(S._taskHist||[], true);
}
/* The activity log stays folded until asked for — a click on the header opens it.
   Partners and freelancers never see it: the board's change history is internal, and the
   database returns them nothing anyway (April, 10 Sep 2026). */
function historySectionHTML(){
  if(isExternal()) return '';
  const n = (S._taskHist||[]).length;
  return `<div class="hist-toggle" onclick="toggleHistoryPanel(this)">
      <label style="cursor:pointer;margin:0">Activity log</label>
      <span class="hist-count">${n||''}</span><span class="hist-chev">▸</span>
    </div>
    <div id="tv-history" hidden>${historyHTML(S._taskHist)}</div>`;
}
function toggleHistoryPanel(head){
  const box = document.getElementById('tv-history'); if(!box) return;
  box.hidden = !box.hidden;
  const ch = head.querySelector('.hist-chev'); if(ch) ch.textContent = box.hidden? '▸' : '▾';
}
/* Comments come back without their files; fetch them in one go and attach. */
async function hydrateCommentAtts(comments){
  const ids = (comments||[]).map(c=>c.id);
  if(!ids.length) return comments||[];
  const {data} = await db.from('attachments').select('*').eq('entity_type','comment').in('entity_id', ids).order('created_at');
  const by = {};
  (data||[]).forEach(a=> (by[a.entity_id] || (by[a.entity_id]=[])).push(a));
  comments.forEach(c=> c.atts = by[c.id] || []);
  return comments;
}
async function deleteTask(id, projectId){
  if(!confirm('Delete this task permanently?')) return;
  const {error} = await db.from('tasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  closeModals(); toast('Task deleted'); renderProject(projectId);
}
</script>
