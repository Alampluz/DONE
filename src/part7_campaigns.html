<script>
/* ================= CAMPAIGNS =================
   #/campaigns            the live tracker (the campaign planning sheet, part7b)
   #/campaigns/brands     the brand directory (part7b)
   Until 18 Nov 2026 this file also carried eight views on sample data (Months, Timeline, All campaigns,
   Team lanes, Brand lines, Tracker grid, Targets & budget, Asset approvals) and a "Plan a month" / "New
   campaign" flow that created nothing. April asked for the real thing only, so they are gone; anything
   that comes back is built on the tracker tables and real tickets. */
let cpTab = 'tracker';
const CP_TABS = [['tracker','Tracker'],['directory','Brands']];
function renderCampaigns(id){
  if(id==='brands' || id==='directory') cpTab = 'directory'; else if(id==='tracker' || !CP_TABS.some(t=>t[0]===cpTab)) cpTab = 'tracker';
  setTopbar('Campaigns');
  $('#content').innerHTML = `
    <div class="page-head"><h1>Campaigns</h1>
      <div class="tabs" style="max-width:100%;overflow-x:auto">
        ${CP_TABS.map(([k,l])=>`<button class="tab ${cpTab===k?'active':''}" style="flex:none" onclick="location.hash='#/campaigns${k==='directory'?'/brands':''}'">${l}</button>`).join('')}
      </div>
    </div>
    ${cpTab==='tracker' ? '<div id="cpt-root"><div class="empty">Loading…</div></div>' : '<div id="cpd-root"><div class="empty">Loading…</div></div>'}`;
  if(cpTab==='tracker' && typeof cptMount==='function') cptMount();
  if(cpTab==='directory' && typeof cpdMount==='function') cpdMount();
}
</script>
