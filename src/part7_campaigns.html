  if(ph.error) toast(ph.error.message, true);
  S.cpLoaded = false; S.cpLoading = false;
  await cpLoadRemote();
  return cpById(data.id);
}

/* ---------- numbers ---------- */
function cpRollup(targets, mode){
  const rows = targets||[];
  const gKey = mode==='actual' ? 'actual' : 'gmv';
  const acc = {gmv:null, visitors:null, buyers:null, orders:null, ads:null, fb:null, search:null, ams:null};
  const add = (k, v)=>{ if(v==null || !isFinite(Number(v))) return; acc[k] = (acc[k]||0) + Number(v); };
  rows.forEach(t=>{
    add('gmv', t[gKey]);
    add('visitors', t.visitors); add('buyers', t.buyers); add('orders', t.orders);
    add('ads', t.ads); add('fb', t.fb); add('search', t.search); add('ams', t.ams);
  });
  acc.aov = (acc.gmv!=null && acc.orders) ? acc.gmv/acc.orders : null;
  acc.cr = (acc.buyers!=null && acc.visitors) ? acc.buyers/acc.visitors : null;
  return acc;
}
function cpSumLines(lines, mode){
  const acc = cpRollup([], mode);
  (lines||[]).forEach(l=>{
    const r = cpRollup(l.targets, mode);
    ['gmv','visitors','buyers','orders','ads','fb','search','ams'].forEach(k=>{
      if(r[k]!=null) acc[k] = (acc[k]||0)+r[k];
    });
  });
  acc.aov = (acc.gmv!=null && acc.orders) ? acc.gmv/acc.orders : null;
  acc.cr = (acc.buyers!=null && acc.visitors) ? acc.buyers/acc.visitors : null;
  return acc;
}
function cpBaht(n){
  if(n==null || !isFinite(Number(n))) return '—';
  return '฿'+Math.round(Number(n)).toLocaleString('en-US');
}
function cpInt(n){
  if(n==null || !isFinite(Number(n))) return '—';
  return Math.round(Number(n)).toLocaleString('en-US');
}
function cpPct1(ratio){
  if(ratio==null || !isFinite(Number(ratio))) return '—';
  return (Number(ratio)*100).toFixed(1)+'%';
}
/* Growth beyond ±30% is an outlier. A missing or zero baseline is an explicit state, never a divide-by-zero. */
function cpGrowth(proposed, baseline){
  if(proposed==null || !isFinite(Number(proposed))) return {kind:'notarget', text:'—', hot:false};
  if(baseline==null || !isFinite(Number(baseline))) return {kind:'nobase', text:'No baseline', hot:false};
  if(Number(baseline)===0) return {kind:'zero', text:'—', hot:false};
  const g = (Number(proposed)-Number(baseline))/Number(baseline);
  const hot = Math.abs(g) > 0.30;
  const arrow = g>0 ? '▲' : g<0 ? '▼' : '';
  const text = (g>0?'+':'')+(g*100).toFixed(1)+'%'+(arrow ? ' '+arrow : '');
  return {kind:'ok', g, hot, text};
}
function cpBaselineGmv(c, line){
  if(!c || !c.baselineId) return {kind:'none'};
  const ref = cpById(c.baselineId);
  if(!ref) return {kind:'none'};
  const same = (l)=> (line.brandId && l.brandId===line.brandId || cpNormName(l.brand)===cpNormName(line.brand))
    && l.platform===line.platform && l.country===line.country;
  const other = (ref.lines||[]).find(same);
  if(!other) return {kind:'none'};
  const mode = c.baselineMode==='actual' ? 'actual' : 'target';
  const gmv = cpRollup(other.targets, mode).gmv;
  if(gmv==null) return {kind:'none'};
  return {kind:'ok', gmv, mode, name:ref.name};
}
function cpLineState(line){
  const rows = (line && line.targets) || [];
  if(!rows.length) return 'draft';
  let best = rows[0].state || 'draft';
  rows.forEach(t=>{
    const s = t.state || 'draft';
    if((CP_STATE_RANK[s]??0) < (CP_STATE_RANK[best]??0)) best = s;
  });
  return best;
}
function cpNeedsReason(c, line){
  const g = cpGrowth(cpRollup(line.targets,'target').gmv, (cpBaselineGmv(c, line).kind==='ok' ? cpBaselineGmv(c, line).gmv : null));
  return !!(g.hot && !String(line.reason||'').trim());
}
function cpCampaignTarget(c){
  if(c.lines && c.lines.length){
    const s = cpSumLines(c.lines, 'target');
    if(s.gmv!=null) return s.gmv;
  }
  return c.gmvTarget||0;
}
function cpCampaignActual(c){
  if(c.lines && c.lines.length){
    const s = cpSumLines(c.lines, 'actual');
    if(s.gmv!=null) return s.gmv;
  }
  return c.gmvActual ? c.gmvActual : null;
}
function cpReadyPct(c){
  if(!c.tasks || !c.tasks.length) return null;
  return cpPct(cpDone(c), c.tasks.length);
}
function cpPaceRatio(c){
  const actual = cpCampaignActual(c);
  const target = cpCampaignTarget(c);
  if(actual==null || !target) return null;
  const today = cpToday();
  if(today < cpD(c.start)) return null;
  const span = Math.max(1, cpDays(c.start, c.end)+1);
  const elapsed = Math.min(span, Math.max(1, cpDays(c.start, today)+1));
  const expected = target * (elapsed/span);
  if(!expected) return null;
  return actual/expected;
}

function cpCanEditLine(line){
  if(!canEdit()) return false;
  if(cpLineState(line)!=='draft') return false;
  if(cpIsSuper()) return true;
  if(!line.kamId && !line.leadId) return true;
  return line.kamId===S.me.id || line.leadId===S.me.id;
}
function cpCanApprove(line){
  if(cpLineState(line)!=='proposed') return false;

function cpCanAlign(line){
  if(cpLineState(line)!=='cat_approved') return false;
  if(cpIsSuper() || canEdit()) return true;
  if(isExternal()) return (S.brandsList||[]).some(b=>b.id===line.brandId);

}

function cpVisibleLines(c){
  const f = cpFilters();
  return (c.lines||[]).filter(l=>{
    if(f.vertical && (l.vertical||'Uncategorised')!==f.vertical) return false;

        ${cpStateTd(c, l)}

    <td class="${tg.hot?'hot':''}">${esc(tg.text)}</td>${cpMetricCells(tot)}<td></td></tr>`;
  return `

      <div class="cp-legend"><span>Amber growth is beyond ±30% and needs a reason before Propose.</span><span>Typed cells are inputs. Plain numbers are calculated.</span><span style="margin-left:auto">฿ full amounts · % to 1 decimal</span></div></div>`
      : `<div class="card empty"><div style="font-weight:600">No brand lines${(c.lines||[]).length?' match these filters':' yet'}</div><p style="color:var(--ink3)">Import a CUSP daily-target file on the Data tab. Shop name, channel and date become a brand line.</p></div>`}`;

function cpSetBaseline(id, which, value){

  else c.baselineMode = value==='actual' ? 'actual' : 'target';
  if(S.cpSource==='db' && cpIsUuid(c.id)){
    db.from('campaigns').update({baseline_campaign_id:c.baselineId, baseline_mode:c.baselineMode}).eq('id', c.id)

function cpSetLineState(line, state){
  if(!line.targets.length) return false;

function cpEditGmv(id, raw){
  const c = cpById(cpRouteId()); if(!c) return;
  const line = (c.lines||[]).find(l=>l.id===id); if(!line) return;
  const s = String(raw??'').replace(/,/g,'').trim();
  if(s==='') return cpRerenderKeep();
  if(!/^\d+(\.\d+)?$/.test(s)) return toast('Enter a target of 0 or more', true);
  const total = Number(s);
  const rows = line.targets.length ? line.targets : null;
  if(!rows){
    line.targets.push({date:c.end, gmv:total, visitors:null, buyers:null, orders:null, aov:null, cr:null, ads:null, fb:null, search:null, ams:null, budgetGmv:null, actual:null, state:'draft', phase:'dday'});
  } else {
    const prev = rows.reduce((sum,t)=> sum + (t.gmv==null?0:Number(t.gmv)), 0);
    if(prev<=0){
      const each = total/rows.length;
      rows.forEach(t=>{ t.gmv = each; });
    } else {
      const f = total/prev;
      rows.forEach(t=>{ if(t.gmv!=null) t.gmv = Number(t.gmv)*f; });
      if(!rows.some(t=>t.gmv!=null)) rows[0].gmv = total;
    }
  }
  cpPersistLine(c, line);
  cpRerenderKeep();
}
function cpReasonModal(id){

function cpSaveReason(id){

}
async function cpBulk(cid, action){
  const c = cpById(cid); if(!c) return;
  const ids = [...(S.cpSel||[])];
  const lines = (c.lines||[]).filter(l=>ids.includes(l.id));
  if(!lines.length) return;
  if(action==='propose'){
    const need = lines.filter(l=>cpNeedsReason(c, l));
    if(need.length) return toast(need.length+' outlier'+(need.length===1?'':'s')+' need a reason before Propose', true);
  }
  const next = {propose:'proposed', approve:'cat_approved', align:'brand_aligned', lock:'locked', draft:'draft'}[action];
  const fromOk = {propose:'draft', approve:'proposed', align:'cat_approved', lock:'brand_aligned', draft:null};
  let moved = 0, skipped = 0;
  for(const line of lines){
    const st = cpLineState(line);
    if(action==='draft'){
      if(st==='locked' && !cpCanLock()){ skipped++; continue; }
      if(st==='draft'){ skipped++; continue; }
      if(!canEdit() && !cpCanLock()){ skipped++; continue; }
    } else if(st!==fromOk[action]){ skipped++; continue; }
    if(action==='propose' && !cpCanEditLine(line)){ skipped++; continue; }
    if(action==='approve' && !cpCanApprove(line)){ skipped++; continue; }
    if(action==='align' && !cpCanAlign(line)){ skipped++; continue; }
    if(action==='lock' && !cpCanLock()){ skipped++; continue; }
    if(!line.targets.length){ skipped++; continue; }
    cpSetLineState(line, next);
    moved++;
  }
  if(!moved) return toast(skipped ? 'None of the selected lines can take that step' : 'Nothing to update', true);
  await cpPersistStates(c, lines.filter(l=>cpLineState(l)===next));
  toast(moved+' line'+(moved===1?'':'s')+' updated'+(skipped? ' · '+skipped+' skipped':''));
  cpRerenderKeep();
}
async function cpPersistStates(c, lines){
  if(S.cpSource!=='db') return;
  for(const line of lines){
    if(!cpIsUuid(line.id)) continue;
    const state = cpLineState(line);
    const {error} = await db.from('line_targets').update({approval_state:state, outlier_reason:line.reason||''}).eq('brand_line_id', line.id);
    if(error){ toast(error.message, true); return; }
    if(state==='proposed' && line.leadId && line.leadId!==S.me.id){
      await db.from('approvals').insert({
        brand_line_id:line.id,
        title:line.brand+' target',
        approver_id:line.leadId,
        requested_by:S.me.id,
        status:'pending'
      });
    }
    if(state==='cat_approved'){
      await db.from('approvals').update({status:'approved', decided_at:new Date().toISOString()}).eq('brand_line_id', line.id).eq('status','pending');
    }
    if(cpIsUuid(line.id)) logActivity('brand_line', line.id, 'updated', {changes:[{field:'approval_state', to:state}]});
  }
}
async function cpPersistLine(c, line){
  if(S.cpSource!=='db' || !cpIsUuid(line.id)) return;
  for(const t of line.targets){
    const payload = {
      target_gmv:t.gmv, target_visitors:t.visitors, target_buyers:t.buyers, target_orders:t.orders,
      target_aov:t.aov, target_cr:t.cr, target_ads_spend:t.ads, target_fb_spend:t.fb,
      target_search_spend:t.search, target_ams_spend:t.ams, budget_gmv:t.budgetGmv, actual_gmv:t.actual,
      outlier_reason:line.reason||''
    };
    if(t.id && cpIsUuid(t.id)){
      const {error} = await db.from('line_targets').update(payload).eq('id', t.id);
      if(error) return toast(error.message, true);
    } else {
      const {data, error} = await db.from('line_targets').insert({brand_line_id:line.id, target_date:t.date, approval_state:'draft', ...payload}).select().single();
      if(error) return toast(error.message, true);
      if(data) t.id = data.id;
    }
  }
}
async function cpLockCampaign(id){
  const c = cpById(id); if(!c || !cpCanLock()) return;
  const outliers = (c.lines||[]).filter(l=>cpNeedsReason(c, l));
  if(outliers.length) return toast(outliers.length+' outliers still need a reason', true);
  const waiting = (c.lines||[]).filter(l=> cpRollup(l.targets,'target').gmv!=null && !['brand_aligned','locked'].includes(cpLineState(l)));
  if(waiting.length) return toast(waiting.length+' lines are not brand-aligned yet', true);
  (c.lines||[]).forEach(l=>{ if(cpLineState(l)==='brand_aligned') cpSetLineState(l, 'locked'); });
  c.lockedAt = new Date().toISOString();
  if(S.cpSource==='db' && cpIsUuid(c.id)){
    await cpPersistStates(c, (c.lines||[]).filter(l=>cpLineState(l)==='locked'));
    const {error} = await db.from('campaigns').update({locked_at:c.lockedAt}).eq('id', c.id);
    if(error) return toast(error.message, true);
  }
  toast('Campaign locked');
  cpRerenderKeep();
}
async function cpUnlockCampaign(id){
  const c = cpById(id); if(!c || !cpCanLock()) return;
  (c.lines||[]).forEach(l=>{ if(cpLineState(l)==='locked') cpSetLineState(l, 'brand_aligned'); });
  c.lockedAt = null;
  if(S.cpSource==='db' && cpIsUuid(c.id)){
    await cpPersistStates(c, c.lines||[]);
    const {error} = await db.from('campaigns').update({locked_at:null}).eq('id', c.id);
    if(error) return toast(error.message, true);
  }
  toast('Campaign unlocked');
  cpRerenderKeep();
}

async function cpSaveEdit(id){
  const c = cpById(id); if(!c) return;
  const v = s => (document.querySelector(s)?.value||'').trim();
  const name = v('#cp-ed-name');
  if(!name) return toast('Give the campaign a name', true);
  c.name = name;
  c.status = v('#cp-ed-st') || c.status;
  c.pb = v('#cp-ed-pb') || c.pb;
  c.countries = v('#cp-ed-co').split(/[, ]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  if(!c.countries.length) c.countries = ['TH'];
  c.channels = [...document.querySelectorAll('input[name=cp-ed-ch]:checked')].map(el=>el.value);
  c.baselineId = v('#cp-ed-base') || null;
  c.baselineMode = v('#cp-ed-mode')==='actual' ? 'actual' : 'target';
  c.phases.forEach(p=>{
    const s = document.querySelector(`[data-ph="${p.kind}:start"]`);
    const e = document.querySelector(`[data-ph="${p.kind}:end"]`);
    if(s && s.value) p.start = s.value;
    if(e && e.value) p.end = e.value;
  });
  const dday = (c.phases.find(p=>p.kind==='dday')||{}).start;
  const tease = (c.phases.find(p=>p.kind==='teasing')||{}).start;
  if(tease) c.start = tease;
  if(dday) c.end = dday;
  if(S.cpSource==='db' && cpIsUuid(c.id)){
    const {error} = await db.from('campaigns').update({
      name:c.name, status:c.status, playbook:c.pb, countries:c.countries, channels:c.channels,
      start_date:c.start, end_date:c.end, baseline_campaign_id:c.baselineId, baseline_mode:c.baselineMode
    }).eq('id', c.id);
    if(error) return toast(error.message, true);
    for(const p of c.phases){
      if(!p.id) continue;
      await db.from('campaign_phases').update({start_date:p.start, end_date:p.end, label:p.label}).eq('id', p.id);
    }
  }
  closeModals();
  toast(S.cpSource==='db' ? 'Campaign saved' : 'Campaign updated in this session');
  cpRerenderKeep();
}

/* ---------- daily target import ---------- */
function cpNormName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,''); }
function cpNormTagText(s){ return String(s||'').replace(/\s+/g,' ').trim().replace(/\.+$/,'').trim(); }
/* Excel turns the text "10.10" into the number 10.1. A one-decimal number is also offered zero-padded. */
function cpCampaignTags(v){
  if(v==null || v==='') return [];
  if(v instanceof Date) return [];
  if(typeof v==='number' && isFinite(v)){
    const s = String(v);
    const out = [];
    if(/^\d+\.\d$/.test(s)) out.push(Number(v).toFixed(2));
    out.push(s);
    return [...new Set(out.map(cpNormTagText).filter(Boolean))];
  }
  const s = cpNormTagText(v);
  return s ? [s] : [];
}
function cpNormPlatform(v){
  const x = String(v??'').trim().toLowerCase();
  if(!x) return '';
  if(x.includes('shopee')) return 'shopee';
  if(x.includes('lazada')) return 'lazada';
  if(x.includes('tiktok') || x==='tt' || x==='tts') return 'tiktok';
  if(x.includes('shopify')) return 'shopify';
  if(x.includes('line')) return 'line';
  if(x==='brand' || x.includes('brand.com') || x.includes('brand com')) return 'brand';
  return '';
}
function cpDateCell(v){
  if(v instanceof Date && !isNaN(v)) return cpISO(v);
  if(typeof v==='number' && v>20000 && v<80000){
    const d = new Date(Math.round((v-25569)*86400000));
    return isNaN(d) ? null : d.toISOString().slice(0,10);
  }
  const s = String(v??'').trim();
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  const d = new Date(s);
  return isNaN(d) ? null : cpISO(d);
}
function cpNumCell(v){
  if(v==null || v==='') return null;
  if(typeof v==='number') return isFinite(v) ? v : null;
  const s = String(v).trim().replace(/,/g,'').replace(/%$/,'');
  if(!s) return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function cpBrandCatalog(){
  const live = (S.brandsList||[]).filter(b=>b && b.name && b.active!==false);
  if(live.length) return live;
  if(S.cpDemo || S.cpSource==='demo') return CP_DEMO_BRANDS;
  return [];
}
function cpMatchBrand(shop, pending){
  if(!shop) return null;
  if(pending && pending[shop]){
    const hit = cpBrandCatalog().find(b=>b.id===pending[shop]);
    if(hit) return hit;
  }
  const norm = cpNormName(shop);
  const low = shop.trim().toLowerCase();
  const aliases = S.cpAliases||[];
  const alias = aliases.find(a=> cpNormName(a.alias)===norm || String(a.alias||'').trim().toLowerCase()===low || a.alias_norm===low);
  if(alias){
    const b = cpBrandCatalog().find(x=>x.id===alias.brand_id) || {id:alias.brand_id, name:shop, vertical:''};
    return b;
  }
  return cpBrandCatalog().find(b=> cpNormName(b.name)===norm || String(b.name).trim().toLowerCase()===low) || null;
}
function cpPhaseForTags(tags, aliases, campaignId){
  const lows = (tags||[]).map(t=>t.toLowerCase());
  const list = aliases||[];
  const normOf = a => (a.alias_norm || cpNormTagText(a.alias).toLowerCase());
  const specific = list.find(a=> a.campaign_id && a.campaign_id===campaignId && lows.includes(normOf(a)));
  if(specific) return specific.phase_kind;
  const general = list.find(a=> !a.campaign_id && lows.includes(normOf(a)));
  return general ? general.phase_kind : null;
}
function cpSavedMap(){
  try{ return JSON.parse(localStorage.getItem('done.cp.map.daily_targets')||'{}')||{}; }catch(e){ return {}; }
}
function cpRememberMap(mapping){
  const o = cpSavedMap();
  mapping.forEach(m=>{ if(m.target && m.target!=='skip') o[m.label.trim().toLowerCase()] = m.target; });
  try{ localStorage.setItem('done.cp.map.daily_targets', JSON.stringify(o)); }catch(e){}
}
function cpGuessDailyMapping(headers){
  const saved = cpSavedMap();
  const used = new Set();
  return (headers||[]).map(h=>{
    const low = String(h.label||'').trim().toLowerCase();
    if(saved[low] && !used.has(saved[low])){ used.add(saved[low]); return {ci:h.i, label:h.label, target:saved[low]}; }
    for(const [key,,,aliases] of CP_DAILY_FIELDS){
      if(aliases.includes(low) && !used.has(key)){ used.add(key); return {ci:h.i, label:h.label, target:key}; }
    }
    return {ci:h.i, label:h.label, target:'skip'};
  });
}
function cpSheetRows(aoa){
  const sheet = (typeof importReadSheet==='function') ? importReadSheet(aoa) : null;
  if(!sheet) return null;
  const filled = r => (r||[]).filter(c=> String(c??'').trim()!=='').length;
  const rows = [];
  let blanks = 0;
  for(let r = sheet.hi+1; r<aoa.length; r++){
    if(filled(aoa[r])===0) blanks++;
    else rows.push({n:r+1, cells:aoa[r]});
  }
  return {headers:sheet.headers, rows, blanks, hi:sheet.hi};
}
function cpValidateDaily(sheet, mapping, ctx){
  ctx = ctx || {};
  const errors = [], warnings = [];
  const taken = {};
  (mapping||[]).forEach(m=>{ if(m.target && m.target!=='skip') taken[m.target]=(taken[m.target]||0)+1; });
  let colsOk = true;
  CP_DAILY_FIELDS.forEach(([key, label, req])=>{
    if(req && !taken[key]){ errors.push({code:'column', message:'Missing required column: '+label}); colsOk = false; }
    if(taken[key]>1){ errors.push({code:'column', message:label+' is mapped from two columns'}); colsOk = false; }
  });
  if(sheet && sheet.blanks) warnings.push({code:'blank', message:Number(sheet.blanks).toLocaleString('en-US')+' blank row'+(sheet.blanks===1?'':'s')+' dropped'});
  const parsed = [];
  if(!sheet || !colsOk) return {errors, warnings, parsed, blocked:errors.length>0, blanks:sheet&&sheet.blanks||0};
  const at = t => mapping.find(m=>m.target===t);
  const seen = {}, unknown = {}, outside = {}, unmapped = {};
  let blankTag = 0, badDate = 0, badPlat = 0, badShop = 0, negative = 0;
  const countries = ctx.countries || [];
  for(const row of sheet.rows){
    const cell = key => { const m = at(key); return m ? row.cells[m.ci] : undefined; };
    const shopRaw = cell('brand');
    const shop = String(shopRaw??'').trim();
    const platform = cpNormPlatform(cell('platform'));
    const country = String(cell('country')??'').trim().toUpperCase() || 'TH';
    const date = cpDateCell(cell('date'));
    const tags = cpCampaignTags(cell('campaign_name'));
    const rec = {
      n:row.n, shop, platform, country, date, tags, tag:tags[0]||'',
      gmv:cpNumCell(cell('target_gmv')), visitors:cpNumCell(cell('target_visitors')),
      buyers:cpNumCell(cell('target_buyers')), orders:cpNumCell(cell('target_orders')),
      aov:cpNumCell(cell('target_aov')), cr:cpNumCell(cell('target_cr')),
      ads:cpNumCell(cell('target_ads_spend')), fb:cpNumCell(cell('target_fb_spend')),
      search:cpNumCell(cell('target_search_spend')), ams:cpNumCell(cell('target_ams_spend')),
      budgetGmv:cpNumCell(cell('budget_gmv')), actual:cpNumCell(cell('actual_gmv'))
    };
    ['gmv','visitors','buyers','orders','aov','cr','ads','fb','search','ams','budgetGmv','actual'].forEach(k=>{
      if(rec[k]!=null && rec[k]<0) negative++;
    });
    if(!shop) badShop++;
    else {
      const match = cpMatchBrand(shop, ctx.aliases);
      if(match){ rec.brandId = match.id; rec.brand = match.name; rec.vertical = match.vertical||''; }
      else { (unknown[shop] = unknown[shop]||{shop, rows:[]}).rows.push(row.n); }
    }
    if(!platform) badPlat++;
    if(!date) badDate++;
    if(shop && date && platform){
      const key = [cpNormName(shop), platform, country, date].join('|');
      if(seen[key]) errors.push({code:'dup', message:'Duplicate '+shop+' · '+platform+' · '+country+' on '+date+' (rows '+seen[key]+' and '+row.n+')'});
      else seen[key] = row.n;
    }
    if(countries.length && country && !countries.includes(country)) outside[country] = (outside[country]||0)+1;
    if(!tags.length) blankTag++;
    else {
      rec.phase = cpPhaseForTags(tags, ctx.phaseAliases, ctx.campaignId);
      if(!rec.phase){
        const u = unmapped[rec.tag] = unmapped[rec.tag]||{tag:rec.tag, rows:0, numeric:typeof cell('campaign_name')==='number'};
        u.rows++;
      }
    }
    parsed.push(rec);
  }
  if(badShop) errors.push({code:'shop', message:badShop+' row'+(badShop===1?'':'s')+' with no shop name'});
  if(badPlat) errors.push({code:'platform', message:badPlat+' row'+(badPlat===1?'':'s')+' with a channel that is not Shopee, Lazada, TikTok, Shopify or Brand.com'});
  if(badDate) errors.push({code:'date', message:badDate+' row'+(badDate===1?'':'s')+' with no usable date'});
  if(negative) errors.push({code:'neg', message:negative+' negative number'+(negative===1?'':'s')+' — a target cannot be below zero'});
  Object.values(unknown).forEach(u=>{
    errors.push({code:'unknown', shop:u.shop, rows:u.rows, message:'Unknown brand “'+u.shop+'” · '+u.rows.length+' row'+(u.rows.length===1?'':'s')});
  });
  const outN = Object.values(outside).reduce((s,n)=>s+n,0);
  if(outN) warnings.push({code:'country', message:outN+' row'+(outN===1?'':'s')+' outside this campaign ('+Object.entries(outside).map(([k,n])=>k+' '+n).join(', ')+')'});
  if(blankTag) warnings.push({code:'tagblank', message:blankTag+' row'+(blankTag===1?'':'s')+' with a blank campaign tag'});
  Object.values(unmapped).forEach(u=>{
    const note = u.numeric ? ' (read as a number — “10.10” becomes 10.1)' : '';
    warnings.push({code:'tag', tag:u.tag, message:'Campaign tag “'+u.tag+'” is not mapped to a phase'+note+' · '+u.rows+' row'+(u.rows===1?'':'s')});
  });
  return {errors, warnings, parsed, blocked:errors.length>0, blanks:sheet.blanks||0};
}
function cpImportCtx(c, im){
  const phaseAliases = (S.cpPhaseAliases||[]).slice();
  Object.entries(im.phaseMap||{}).forEach(([alias, phase_kind])=>{
    phaseAliases.push({campaign_id:c.id, alias, phase_kind, alias_norm:cpNormTagText(alias).toLowerCase()});
  });
  return {campaignId:c.id, countries:c.countries||['TH'], aliases:im.aliases||{}, phaseAliases};
}
function cpApplyImport(lines, incoming){
  const rows = (incoming||[]).filter(r=>r && r.brandId && r.platform && r.date);
  if(!rows.length) return (lines||[]).map(l=>({...l, targets:(l.targets||[]).slice()}));
  const dates = rows.map(r=>r.date).sort();
  const lo = dates[0], hi = dates[dates.length-1];
  const next = (lines||[]).map(l=>({...l, targets:(l.targets||[]).filter(t=> t.date < lo || t.date > hi)}));
  rows.forEach(row=>{
    let line = next.find(l=> l.brandId===row.brandId && l.platform===row.platform && l.country===row.country);
    if(!line){
      const people = cpPeopleFor(row.brandId, row.platform);
      line = {
        id: row.lineId || ('ln-'+Math.random().toString(36).slice(2,10)),
        brandId:row.brandId, brand:row.brand||row.shop, vertical:row.vertical||'',
        platform:row.platform, country:row.country, lead:row.lead||people.lead||'', kam:row.kam||people.kam||'',
        leadId:row.leadId||people.leadId||null, kamId:row.kamId||people.kamId||null,
        associate:people.associate||'', targets:[], reason:''
      };
      next.push(line);
    }
    line.targets.push({
      date:row.date, phase:row.phase||null, state:'draft',
      gmv:row.gmv, visitors:row.visitors, buyers:row.buyers, orders:row.orders, aov:row.aov, cr:row.cr,
      ads:row.ads, fb:row.fb, search:row.search, ams:row.ams, budgetGmv:row.budgetGmv, actual:row.actual
    });
  });
  next.forEach(l=> l.targets.sort((a,b)=> a.date<b.date ? -1 : 1));
  return next;
}
function cpParsedIncoming(r){
  const people = cpPeopleFor(r.brandId, r.platform);
  return Object.assign({}, r, {lead:people.lead, kam:people.kam, leadId:people.leadId, kamId:people.kamId});
}

function cpOpenDailyImport(id){
  if(typeof XLSX==='undefined') return toast('The Excel engine is still loading — try again in a second', true);
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    try{
      const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
      cpBeginImport(id, f.name, wb);
    }catch(e){ toast('Could not read that file', true); }
  };
  inp.click();
}
function cpBeginImport(id, fileName, wb){
  const ranked = cpRankSheets(wb);
  const good = ranked.filter(s=>s.score>=4);
  if(!ranked.length || !ranked[0].read) return toast('That file has no header row', true);
  if(good.length===1 || (good.length && /daily|\braw\b/i.test(good[0].name) && good[0].score===4)){
    cpStartMap(id, fileName, good[0]);
    return;
  }
  S._cpImport = {campaignId:id, fileName, ranked, step:'sheet'};
  cpShowImportModal();
}
function cpRankSheets(wb){
  const names = wb.SheetNames||[];
  const prefer = names.filter(n=>/daily|\braw\b/i.test(n));
  const order = prefer.concat(names.filter(n=>prefer.indexOf(n)<0));
  const out = [];
  for(const name of order){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
    const read = cpSheetRows(aoa);
    let score = 0;
    if(read){
      const map = cpGuessDailyMapping(read.headers);
      score = ['date','brand','platform','target_gmv'].filter(k=>map.some(m=>m.target===k)).length;
    }
    out.push({name, score, read});
    if(score===4 && prefer.indexOf(name)>=0) break;
  }
  out.sort((a,b)=> b.score-a.score);
  return out;
}
function cpStartMap(id, fileName, sheet){
  const c = cpById(id);
  S._cpImport = {
    campaignId:id, fileName, sheet:sheet.read, sheetName:sheet.name,
    mapping: cpGuessDailyMapping(sheet.read.headers),
    aliases:{}, phaseMap:{}, step:'map'
  };
  S._cpImport.report = cpValidateDaily(sheet.read, S._cpImport.mapping, cpImportCtx(c, S._cpImport));
  cpShowImportModal();
}
function cpShowImportModal(){
  const im = S._cpImport; if(!im) return;
  modal(`<div class="modal-head"><h2>Import daily targets</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body" id="cp-imp-body"></div>
    <div class="modal-foot" id="cp-imp-foot"></div>`, true);
  cpRenderImport();
}
function cpRenderImport(){
  const im = S._cpImport; if(!im) return;
  const body = document.getElementById('cp-imp-body');
  const foot = document.getElementById('cp-imp-foot');
  if(!body || !foot) return;
  const step = im.step || 'map';
  const steps = `<div class="cp-steps"><b class="${step==='sheet'?'on':'done'}">1 · Upload</b><b class="${step==='map'?'on':step==='check'?'done':''}">2 · Map</b><b class="${step==='check'?'on':''}">3 · Check</b></div>`;
  if(step==='sheet'){
    body.innerHTML = steps+`<p class="imp-note">Which sheet is the daily-target export?</p>`+
      im.ranked.map((s,i)=>`<button type="button" class="btn btn-ghost" style="margin:0 8px 8px 0" onclick="cpPickSheet(${i})">${esc(s.name)} · ${s.score}/4</button>`).join('');
    foot.innerHTML = `<button class="btn btn-ghost" onclick="closeModals()">Cancel</button>`;
    return;
  }
  if(step==='map'){
    const shim = {headers:im.sheet.headers, rows:im.sheet.rows.map(r=>r.cells)};
    body.innerHTML = steps+`<p class="imp-note"><b>${im.sheet.rows.length.toLocaleString('en-US')}</b> data rows in ${esc(im.sheetName||im.fileName)}${im.sheet.blanks? ' · '+im.sheet.blanks.toLocaleString('en-US')+' blank rows will be dropped':''}. Match each header to a target field.</p>
      <div id="cp-imp-map">${im.mapping.map((m,idx)=>{
        const sample = (typeof importColValues==='function' ? importColValues(shim, m.ci) : []).slice(0,3)
          .map(v=> v instanceof Date ? cpISO(v) : String(v)).join(' · ');
        const opts = `<option value="skip" ${m.target==='skip'?'selected':''}>Skip</option>`+
          CP_DAILY_FIELDS.map(([k,l])=>`<option value="${k}" ${m.target===k?'selected':''}>${l}${['date','brand','platform','target_gmv'].includes(k)?' *':''}</option>`).join('');
        return `<div class="imp-row"><div class="imp-col"><div class="imp-head">${esc(m.label)}</div><div class="imp-sample">${esc(sample||'—')}</div></div>
          <span class="imp-arrow">→</span><div class="imp-to"><select aria-label="Map ${esc(m.label)}" onchange="cpImpTarget(${idx}, this.value)">${opts}</select></div></div>`;
      }).join('')}</div>`;
    foot.innerHTML = `<button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" onclick="cpImpCheck()">Check rows</button>`;
    return;
  }
  const rep = im.report || {errors:[], warnings:[], parsed:[], blocked:true};
  const brands = cpBrandCatalog();
  /* Unknown brands and missing columns are shown in full — each one has to be
     fixed before commit, and a cap would hide a shop the file actually contains.
     Duplicate-row messages are the ones that can run into the hundreds. */
  const primary = rep.errors.filter(e=>e.code==='unknown'||e.code==='column');
  const other = rep.errors.filter(e=>e.code!=='unknown'&&e.code!=='column');
  const errHtml = primary.concat(other.slice(0,30)).map(e=>{
    if(e.code==='unknown'){
      return `<li class="bad"><span class="cp-vmsg">✗ ${esc(e.message)}</span><select aria-label="Alias for ${esc(e.shop)}" onchange="cpAliasPick(${jsArg(e.shop)}, this.value)"><option value="">Choose the brand…</option>${brands.map(b=>`<option value="${b.id}" ${(im.aliases||{})[e.shop]===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></li>`;
    }
    return `<li class="bad">✗ ${esc(e.message)}</li>`;
  }).join('');
  const moreE = other.length>30 ? `<li class="bad">✗ And ${other.length-30} more</li>` : '';
  const warnHtml = rep.warnings.map(w=>{
    if(w.code==='tag'){
      return `<li class="warn"><span class="cp-vmsg">⚠ ${esc(w.message)}</span><select aria-label="Phase for ${esc(w.tag)}" onchange="cpPhasePick(${jsArg(w.tag)}, this.value)"><option value="">Leave unmapped</option>${CP_PHASES.map(p=>`<option value="${p.kind}" ${(im.phaseMap||{})[w.tag]===p.kind?'selected':''}>${p.label}</option>`).join('')}</select></li>`;
    }
    return `<li class="warn">⚠ ${esc(w.message)}</li>`;
  }).join('');
  const preview = rep.parsed.slice(0,8).map(r=>`<tr><td>${r.n}</td><td>${esc(r.date||'—')}</td><td>${esc(r.country)}</td><td>${esc(r.shop)}</td><td>${esc(r.platform||'—')}</td><td>${esc(r.tag||'—')}</td><td class="num">${r.gmv==null?'—':cpBaht(r.gmv)}</td></tr>`).join('');
  body.innerHTML = steps+`<ul class="cp-vlist">${errHtml}${moreE}${warnHtml}${!rep.errors.length && !rep.warnings.length ? '<li class="ok">✓ Nothing to fix. '+rep.parsed.length.toLocaleString('en-US')+' rows are ready.</li>' : ''}</ul>
    ${rep.parsed.length? `<table class="cp-prevtbl"><thead><tr><th>Row</th><th>Date</th><th>Country</th><th>Shop</th><th>Channel</th><th>Tag</th><th class="num">Target GMV</th></tr></thead><tbody>${preview}</tbody></table>`:''}`;
  foot.innerHTML = `<button class="btn btn-ghost" onclick="cpImpBack()">Back</button>
    <button class="btn btn-primary" id="cp-imp-go" ${rep.blocked?'disabled':''} onclick="cpCommitDaily()">${rep.blocked?'Fix the errors to import':'Import '+rep.parsed.length.toLocaleString('en-US')+' rows'}</button>`;
}
function jsArg(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"; }
function cpPickSheet(i){
  const im = S._cpImport; if(!im) return;
  const s = im.ranked[i]; if(!s || !s.read) return toast('That sheet has no header row', true);
  cpStartMap(im.campaignId, im.fileName, s);
}
function cpImpTarget(idx, value){
  const im = S._cpImport; if(!im) return;
  im.mapping[idx].target = value;
  cpRenderImport();
}
function cpImpCheck(){
  const im = S._cpImport; if(!im) return;
  const c = cpById(im.campaignId); if(!c) return;
  cpRememberMap(im.mapping);
  im.report = cpValidateDaily(im.sheet, im.mapping, cpImportCtx(c, im));
  im.step = 'check';
  cpRenderImport();
}
function cpImpBack(){ const im = S._cpImport; if(!im) return; im.step = 'map'; cpRenderImport(); }
function cpAliasPick(shop, brandId){
  const im = S._cpImport; if(!im) return;
  if(brandId) im.aliases[shop] = brandId; else delete im.aliases[shop];
  const c = cpById(im.campaignId);
  im.report = cpValidateDaily(im.sheet, im.mapping, cpImportCtx(c, im));
  cpRenderImport();
}
function cpPhasePick(tag, kind){
  const im = S._cpImport; if(!im) return;
  if(kind) im.phaseMap[tag] = kind; else delete im.phaseMap[tag];
  const c = cpById(im.campaignId);
  im.report = cpValidateDaily(im.sheet, im.mapping, cpImportCtx(c, im));
  cpRenderImport();
}
async function cpCommitDaily(){
  const im = S._cpImport; if(!im || !im.report || im.report.blocked) return;
  const c = cpById(im.campaignId); if(!c) return;
  const btn = document.getElementById('cp-imp-go');
  if(btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
  Object.entries(im.aliases||{}).forEach(([shop, brandId])=>{
    if(!(S.cpAliases||[]).some(a=>a.brand_id===brandId && cpNormName(a.alias)===cpNormName(shop))){
      S.cpAliases = S.cpAliases||[];
      S.cpAliases.push({brand_id:brandId, alias:shop, alias_norm:shop.trim().toLowerCase()});
    }
  });
  Object.entries(im.phaseMap||{}).forEach(([alias, phase_kind])=>{
    S.cpPhaseAliases = S.cpPhaseAliases||[];
    if(!S.cpPhaseAliases.some(a=>a.campaign_id===c.id && cpNormTagText(a.alias).toLowerCase()===cpNormTagText(alias).toLowerCase()))
      S.cpPhaseAliases.push({campaign_id:c.id, alias, phase_kind, alias_norm:cpNormTagText(alias).toLowerCase()});
  });
  im.report = cpValidateDaily(im.sheet, im.mapping, cpImportCtx(c, im));
  if(im.report.blocked){ cpRenderImport(); return; }
  const incoming = im.report.parsed.filter(r=>r.brandId && r.date && r.platform).map(cpParsedIncoming);
  if(S.cpSource==='db' && cpIsUuid(c.id)){
    for(const [shop, brandId] of Object.entries(im.aliases||{})){
      const ins = await db.from('brand_aliases').insert({brand_id:brandId, alias:shop, source:'import'});
      if(ins.error && !/duplicate|unique/i.test(ins.error.message||'')) { toast(ins.error.message, true); if(btn) btn.disabled=false; return; }
    }
    for(const [alias, phase_kind] of Object.entries(im.phaseMap||{})){
      await db.from('campaign_phase_aliases').insert({campaign_id:c.id, alias, phase_kind});
    }
    const payload = incoming.map(r=>({
      brand_id:r.brandId, platform:r.platform, country:r.country, target_date:r.date, phase_kind:r.phase||'',
      target_gmv:r.gmv, target_visitors:r.visitors, target_buyers:r.buyers, target_orders:r.orders,
      target_aov:r.aov, target_cr:r.cr, target_ads_spend:r.ads, target_fb_spend:r.fb,
      target_search_spend:r.search, target_ams_spend:r.ams, budget_gmv:r.budgetGmv, actual_gmv:r.actual
    }));
    const {data, error} = await db.rpc('replace_line_targets', {
      p_campaign:c.id, p_rows:payload,
      p_meta:{kind:'daily_targets', source_file:im.fileName, data_as_of:new Date().toISOString(), rows_skipped:im.report.blanks||0}
    });
    if(error){ toast(error.message, true); if(btn) btn.disabled=false; return; }
    toast('Imported '+(data&&data.inserted!=null ? data.inserted : payload.length)+' target rows');
    closeModals();
    S.cpLoaded = false; S.cpLoading = false;
    await cpLoadRemote();
    return;
  }
  c.lines = cpApplyImport(c.lines, incoming);
  const names = [...new Set(c.lines.map(l=>l.brand).filter(Boolean))];
  c.brands = names;
  incoming.forEach(r=>{ if(r.platform && c.channels.indexOf(r.platform)<0) c.channels.push(r.platform); });
  c.imports = c.imports||[];
  c.imports.unshift({kind:'daily_targets', file:im.fileName, at:new Date().toISOString(), asOf:new Date().toISOString(), rows:incoming.length, replaced:0});
  closeModals();
  toast(incoming.length+' daily targets imported into this session');
  cpGo(c.id, 'targets');
}
</script>
