<style>
/* ================= CAMPAIGN PLANNING ================= */
/* Channel colours sit on the existing palette so they clear 4.5:1 as text on their
   own -soft tint, the same contract every .chip pill in part1 keeps. */
:root{
  --cp-navy:#313A7E; --cp-navy-soft:#EAEBF6; --cp-purple:#7A3E9C;
  --cp-shopee:#C2410C; --cp-shopee-soft:#FBEDE6;
  --cp-lazada:#2B2FA0; --cp-lazada-soft:#E9EAF7;
  --cp-tiktok:#0A6E78; --cp-tiktok-soft:#E2F1F3;
  --cp-brand:#7A3E9C;  --cp-brand-soft:#F2E9F7;
}
/* Channel hues keep their identity in dark; only the pale -soft tints (designed against
   white) and the text weights are restated so the chips stay legible instead of glaring. */
:root[data-theme="dark"]{
  --cp-navy:#8F98DC;   --cp-navy-soft:#1E2140;
  --cp-shopee:#E8874F; --cp-shopee-soft:#3A2116;
  --cp-lazada:#8288E0; --cp-lazada-soft:#1D1F45;
  --cp-tiktok:#4FB6C0; --cp-tiktok-soft:#123035;
  --cp-brand:#B681D4;  --cp-brand-soft:#2B1B36;
  --cp-purple:#B681D4;
}
.cp-tl{overflow-x:auto}
.cp-tl-inner{min-width:1080px}
.cp-head{display:grid;grid-template-columns:226px 1fr;border-bottom:1px solid var(--line);background:var(--panel-2)}
.cp-head .cp-lab{padding:9px 14px;border-right:1px solid var(--line);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink3);font-weight:700;align-self:center}
.cp-months{display:flex}
.cp-month{border-right:1px solid var(--line);padding:5px 0 3px}
.cp-month:last-child{border-right:none}
.cp-month b{display:block;padding:0 10px;font-size:11.5px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--ink2)}
.cp-days{display:flex;padding-top:2px}
.cp-day{flex:1;text-align:center;font-size:9px;color:var(--ink3)}
.cp-grp{display:grid;grid-template-columns:226px 1fr;background:var(--panel-2);border-bottom:1px solid var(--line)}
.cp-grp span{padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700}
.cp-row{display:grid;grid-template-columns:226px 1fr;border-bottom:1px solid var(--line);min-height:44px}
.cp-row:last-child{border-bottom:none}
.cp-row:hover{background:var(--hover)}
.cp-name{padding:8px 12px 8px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  gap:2px;justify-content:center}
.cp-name b{font-size:12.5px;font-weight:600;line-height:1.25}
.cp-name .s{font-size:10.5px;color:var(--ink3)}
.cp-track{position:relative;padding:9px 0}
.cp-lines{position:absolute;inset:0;display:flex;pointer-events:none}
.cp-lines span{flex:1}
.cp-lines span.w{border-right:1px solid var(--line-2)}
.cp-lines span.m{border-left:1px solid var(--line)}
.cp-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);opacity:.7;pointer-events:none;z-index:3}
.cp-today.lab::after{content:"TODAY";position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--red);background:var(--red-soft);
  padding:1px 5px;border-radius:4px;white-space:nowrap}
.cp-bar{position:absolute;height:26px;border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 9px;
  font-size:11.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2;
  box-shadow:0 1px 2px rgba(22,24,29,.14)}
.cp-bar:hover{filter:brightness(1.08)}
.cp-bar .f{margin-left:auto;font-size:10px;font-weight:700;background:rgba(255,255,255,.24);
  padding:1px 5px;border-radius:5px}
.cp-bar.shopee{background:var(--cp-shopee)} .cp-bar.lazada{background:var(--cp-lazada)}
.cp-bar.tiktok{background:var(--cp-tiktok)} .cp-bar.brand{background:var(--cp-brand)}
.cp-bar.multi{background:linear-gradient(97deg,var(--cp-navy),var(--cp-purple))}
.cp-bar.draft{background:var(--gray-soft);color:var(--ink2);border:1px dashed var(--line-strong);box-shadow:none}
.cp-barlab{position:absolute;height:26px;display:flex;align-items:center;gap:7px;font-size:11.5px;
  font-weight:600;color:var(--ink2);white-space:nowrap;pointer-events:none;z-index:2}
.cp-barlab .f{font-size:10px;font-weight:700;color:var(--ink3);background:var(--gray-soft);
  padding:1px 5px;border-radius:5px}
.cp-legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);
  background:var(--panel-2);font-size:11.5px;color:var(--ink3)}
.cp-legend b{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink2)}
.cp-sw{width:14px;height:8px;border-radius:3px;display:inline-block}
.cp-meter{height:5px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.cp-meter i{display:block;height:100%;border-radius:99px;background:var(--cp-navy)}
.cp-meter i.green{background:var(--green)} .cp-meter i.amber{background:var(--amber)} .cp-meter i.red{background:var(--red)}
.cp-tick{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);flex:none;display:grid;
  place-items:center;font-size:10px;color:#fff;background:var(--field)}
.cp-tick.done{background:var(--green);border-color:var(--green)}
.cp-tick.prog{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.cp-task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;
  border-bottom:1px solid var(--line)}
.cp-task:last-child{border-bottom:none}
.cp-task:hover{background:var(--hover)}
.cp-task.fresh{background:var(--green-soft)}
.cp-task b{font-size:12.8px;font-weight:600;display:block}
.cp-task .m{font-size:11.2px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.cp-task .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.cp-assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
.cp-asset{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cp-asset .th{aspect-ratio:16/10;max-width:100%;background:var(--gray-soft);display:grid;place-items:center;
  border-bottom:1px solid var(--line);position:relative}
.cp-asset .th .t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.cp-asset .th .v{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;background:var(--panel);
  border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--ink2)}
.cp-asset .mt{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.cp-asset .mt b{font-size:12.5px;font-weight:600}
.cp-asset .mt .d{font-size:11px;color:var(--ink3)}
.cp-asset .ac{display:flex;gap:6px;padding:0 12px 11px;flex-wrap:wrap}
.cp-stat{display:flex;flex-direction:column}
.cp-stat .cp-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;margin-bottom:5px}
.cp-stat .n{font-family:'Fraunces',Georgia,serif;font-size:25px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cp-stat .n.navy{color:var(--cp-navy)}
.cp-stat .sub{margin-top:4px}
.cp-kv{display:flex;justify-content:space-between;gap:12px;font-size:12.8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cp-kv:last-child{border-bottom:none}
.cp-kv span:first-child{color:var(--ink3)}
.cp-kv span:last-child{font-weight:600;text-align:right}
.cp-grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
.cp-mech{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.cp-mech b{font-size:12.8px}
.cp-mech p{margin:3px 0 0;font-size:11.8px;color:var(--ink3)}
.cp-prev{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cp-prev .h{display:flex;padding:8px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);
  font-size:11px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.cp-prev ul{list-style:none;margin:0;padding:0;max-height:270px;overflow:auto}
.cp-prev li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--line);font-size:12.6px;align-items:center}
.cp-prev li:last-child{border-bottom:none}
.cp-prev li small{display:block;color:var(--ink3);font-size:11px;margin-top:1px}
.cp-prev li .du{font-size:11px;color:var(--ink3);white-space:nowrap;text-align:right}
@media(max-width:760px){ .cp-grid2{grid-template-columns:1fr} }

/* ---- month layer (18 Sep) ---- */
.cp-months{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.cp-mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);font:inherit;color:inherit}
.cp-mcard:hover{border-color:var(--ink3)}
.cp-mcard.on{border-color:var(--cp-navy);box-shadow:0 0 0 2px var(--cp-navy-soft),var(--shadow)}
.cp-mcard b{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
.cp-mcard .st{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cp-mcard .k{font-size:11.5px;color:var(--ink3)} .cp-mcard .k b{font-family:inherit;font-size:11.5px;color:var(--ink2)}
.cp-rhythm{padding:12px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.cp-psteps{display:flex;flex-wrap:wrap}
.cp-pstep{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 0;font-size:12.5px;color:var(--ink2)}
.cp-pstep+.cp-pstep{border-left:1px solid var(--line);padding-left:14px}
.cp-pstep .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:1.5px solid var(--line);color:var(--ink3);flex:none}
.cp-pstep.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.cp-pstep.now .dot{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.cp-pstep.done{color:var(--ink)}
.cp-pstep .when{font-size:11px;color:var(--ink3);font-weight:700}
.cp-plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;margin-bottom:16px}
.cp-mg{overflow-x:auto} .cp-mg-in{min-width:820px}
.cp-mg-h{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line);background:var(--panel-2)}
.cp-mg-h .days{display:flex} .cp-mg-h .d{flex:1;text-align:center;font-size:10px;color:var(--ink3);padding:6px 0}
.cp-mg-h .d.we{color:var(--ink3)}
.cp-mg-r{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line);min-height:46px}
.cp-mg-r:last-child{border-bottom:0} .cp-mg-r:hover{background:var(--hover)}
.cp-mg-n{padding:8px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cp-mg-n b{font-size:12.8px} .cp-mg-n span{font-size:11px;color:var(--ink3)}
.cp-mg-t{position:relative;padding:9px 0}
.cp-mg-t .grid{position:absolute;inset:0;display:flex;pointer-events:none} .cp-mg-t .grid i{flex:1;border-right:1px solid var(--line-2)}
.cp-bar.pay{background:var(--accent)} .cp-bar.brandday{background:var(--cp-shopee)} .cp-bar.ttk{background:var(--cp-tiktok)} .cp-bar.laz{background:var(--cp-lazada)}
.cp-bar.plan{background:var(--gray-soft);color:var(--ink2);border:1px dashed var(--ink3);box-shadow:none}
.cp-lane{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cp-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.cp-col>header{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.cp-col>header .cnt{margin-left:auto;font-size:11.5px;color:var(--ink3);background:var(--gray-soft);padding:1px 8px;border-radius:10px}
.cp-col.over>header{color:var(--red)} .cp-col.wait>header{color:var(--amber)} .cp-col.unb>header{color:var(--green)}
.cp-tk{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.cp-tk:last-child{border-bottom:0} .cp-tk:hover{background:var(--hover)}
.cp-tk b{font-size:12.8px;font-weight:600} .cp-tk .m{font-size:11.2px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap}
.cp-tk .r{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.cp-digest{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:14px;border-color:#C9CCE6}
.cp-digest .ic{width:34px;height:34px;border-radius:9px;background:var(--cp-navy-soft);color:var(--cp-navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.cp-digest p{margin:0;font-size:12.8px;color:var(--ink2)} .cp-digest p b{color:var(--ink)}
.cp-bl{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;width:100%}
.cp-bl:hover{border-color:var(--ink3)} .cp-bl .h{display:flex;align-items:center;gap:8px} .cp-bl .h b{font-size:14px;flex:1}
.cp-bl .nx{font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px} .cp-bl .nx b{font-weight:600;color:var(--ink)}
.cp-gw{overflow:auto;max-height:70vh}
table.cp-g{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.cp-g th{position:sticky;top:0;background:var(--panel-2);z-index:2;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:700;padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:bottom;max-width:120px;white-space:normal;line-height:1.25}
.cp-g th.ph{background:var(--panel);color:var(--ink2);letter-spacing:.08em;text-align:center}
.cp-g th:first-child,.cp-g td:first-child{position:sticky;left:0;z-index:3;background:var(--panel);min-width:200px;border-right:1px solid var(--line)}
.cp-g th:first-child{z-index:4;background:var(--panel-2)}
.cp-g td{padding:5px 6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);white-space:nowrap}
.cp-g td .bn{font-weight:600;font-size:12.5px} .cp-g td .bs{font-size:10.5px;color:var(--ink3)}
.cp-cell{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
.cp-cell.todo{background:var(--gray-soft);color:var(--ink3)} .cp-cell.prog{background:var(--blue-soft);color:var(--blue)} .cp-cell.wait{background:var(--amber-soft);color:var(--amber)}
.cp-cell.done{background:var(--green-soft);color:var(--green)} .cp-cell.over{background:var(--red-soft);color:var(--red)} .cp-cell.na{color:var(--line-strong);cursor:default}
/* status log popover — hover or focus any status chip / grid cell */
.cp-hh{cursor:pointer;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)} .cp-hh:focus-visible{outline:2px solid var(--cp-navy);outline-offset:1px}
.cp-hpop{position:fixed;z-index:1200;width:310px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 34px rgba(16,18,25,.16);font-size:12.5px;color:var(--ink2);animation:pop .12s ease;overflow:hidden;text-align:left;font-weight:400;text-transform:none;letter-spacing:0;white-space:normal}
.cp-hpop .hd{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--ink3)}
.cp-hpop .hd span:last-child{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.cp-hpop ol{list-style:none;margin:0;padding:6px 0;max-height:260px;overflow:auto}
.cp-hpop li{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:6px 12px 6px 14px;position:relative}
.cp-hpop li i{width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-top:5px;display:block;position:relative;z-index:1}
.cp-hpop li.status i{background:var(--cp-navy)} .cp-hpop li.done i{background:var(--green)} .cp-hpop li.handoff i{background:var(--amber)} .cp-hpop li.created i{background:var(--line-strong)}
.cp-hpop li:not(:last-child):after{content:'';position:absolute;left:17.5px;top:19px;bottom:-7px;width:1px;background:var(--line)}
.cp-hpop li b{color:var(--ink);font-weight:600;display:block;line-height:1.4;font-size:12.5px}
.cp-hpop li small{display:block;font-size:11.5px;color:var(--ink3);line-height:1.4}
.cp-hpop .ft{padding:7px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}
.cp-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cp-pk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--panel);font:inherit;color:inherit}
.cp-pk.on{border-color:var(--cp-navy);background:var(--cp-navy-soft)} .cp-pk b{font-size:13px} .cp-pk span{font-size:11.5px;color:var(--ink3)}
@media(max-width:760px){ .cp-plan{grid-template-columns:1fr} }

/* ---- campaign record (slice 1) ---- */
.cp-demo{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;margin-bottom:8px;background:var(--amber-soft);border:1px solid #E6D9B8;border-radius:10px;font-size:12.6px;color:var(--ink2)}
.cp-demo b{color:var(--ink)}
.cp-asof{font-size:12px;color:var(--ink3);margin:0 0 6px}
.cp-page .page-head{margin-bottom:4px}
.cp-page .stat-row{gap:8px;margin-bottom:8px}
.cp-page .stat{padding:8px 12px}
.cp-page .cp-stat .n{font-size:20px}
.cp-page .cp-stat .cp-l{margin-bottom:2px}
.cp-page .cp-stat .sub{margin-top:2px}
.cp-phases{display:flex;flex-wrap:wrap;gap:0;align-items:center;margin:2px 0 6px}
.cp-phs{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 0;font-size:12.5px;color:var(--ink2)}
.cp-phs+.cp-phs{border-left:1px solid var(--line);padding-left:12px}
.cp-phs b{font-weight:700;color:var(--ink)}
.cp-phs .when{color:var(--ink3);font-variant-numeric:tabular-nums}
.cp-phs.now b{color:var(--cp-navy)}
.cp-shell{display:grid;grid-template-columns:196px minmax(0,1fr);gap:8px 14px;align-items:start}
.cp-shell.has-bar>.cp-toolbar{grid-column:1 / -1;grid-row:1}
.cp-shell.has-bar>.cp-rail{grid-column:1;grid-row:2}
.cp-shell.has-bar>.cp-main{grid-column:2;grid-row:2}
.cp-rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:8px}
.cp-rail h3{margin:0 0 2px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.cp-rail label{font-size:11px;color:var(--ink3);font-weight:700;margin:0}
.cp-rail select{padding:6px 8px;font-size:12.5px}
/* Timeline bars already own .cp-bar (absolute, 26px, white). This row is separate. */
.cp-toolbar{position:static;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin:0;height:auto;overflow:visible;padding:0;color:inherit;background:transparent;box-shadow:none;white-space:normal;font-weight:inherit;cursor:default;z-index:auto}
.cp-strip{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;padding:4px 10px;margin:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;font-size:12.6px;color:var(--ink2);flex:0 1 auto;min-height:28px;white-space:nowrap}
.cp-strip b{color:var(--ink);font-variant-numeric:tabular-nums}
.cp-strip .hot{color:var(--amber);font-weight:700}
.cp-tools{display:flex;gap:6px;flex-wrap:nowrap;align-items:center;margin:0;flex:0 0 auto}
.cp-tools label{display:inline;width:auto;margin:0;font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}

<script>
/* ---------- dates ---------- */
const cpD   = s => s instanceof Date ? s : new Date(s+'T00:00:00');
const cpISO = x => { const d=cpD(x); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const cpAdd = (x,n) => { const d=new Date(cpD(x)); d.setDate(d.getDate()+n); return d; };
const cpDays= (a,b) => Math.round((cpD(b)-cpD(a))/86400000);
const cpToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
/* Holidays come from the SLA settings when they are loaded; the fixed 2026 Thai dates are
   the fallback so the count is still right on a cold open. */
function cpHolidays(){
  const rows = S.slaHolidays || S.holidays;
  if(Array.isArray(rows) && rows.length) return rows.map(h=>h.day||h);
  /* Cold-open fallback only — cpLoadCalendar() replaces it with sla_holidays from the database. */
  return ['2026-01-01','2026-04-06','2026-04-13','2026-04-14','2026-04-15','2026-05-01',
          '2026-05-04','2026-06-03','2026-07-28','2026-08-12','2026-10-13','2026-10-23',
          '2026-12-05','2026-12-10','2026-12-31'];
}
/* Working days as the company defines them in Admin → SLA (isodow 1–7; default Mon–Fri). */
function cpWorkDays(){ const w = S.slaWorkDays; return Array.isArray(w) && w.length ? w : [1,2,3,4,5]; }
function cpIsWorkDay(d){ const iso = ((d.getDay()+6)%7)+1; return cpWorkDays().includes(iso) && !cpHolidays().includes(cpISO(d)); }
/* Lead time NEVER includes weekends or holidays (April, 18 Sep). The same calendar the SLA engine
   uses — sla_settings.work_days minus sla_holidays — is loaded once per session by cpLoadCalendar(). */
let cpCalLoading = null;
function cpLoadCalendar(){
  if(S.slaHolidays !== undefined || cpCalLoading || typeof db === 'undefined') return;
  cpCalLoading = Promise.all([
    db.from('sla_holidays').select('day').order('day'),
    db.from('sla_settings').select('work_days').limit(1)
  ]).then(([h, st])=>{
    S.slaHolidays = (h && h.data) ? h.data.map(r=>r.day) : [];
    S.slaWorkDays = (st && st.data && st.data[0] && Array.isArray(st.data[0].work_days)) ? st.data[0].work_days : [1,2,3,4,5];
    if(S.route && S.route.view === 'campaigns') renderCampaigns(S.route.id, S.route.tab);
  }).catch(()=>{ S.slaHolidays = []; });
}
/* Signed count of working days from a to b — negative when b is in the past. */
function cpWD(a, b){
  let n=0, cur=cpD(a); const dir = cpD(b) >= cur ? 1 : -1;
  const stop = cpISO(b);
  let guard = 0;
  while(cpISO(cur) !== stop && guard++ < 2000){
    cur = cpAdd(cur, dir);
    if(cpIsWorkDay(cur)) n++;
  }
  return n*dir;
}
/* A ticket due D-n before go-live: n WORKING days back, so a D-7 never lands on a weekend or a holiday. */
function cpDueBack(start, off){
  let d = cpD(start), left = off, guard = 0;
  while(left > 0 && guard++ < 2000){
    d = cpAdd(d, -1);
    if(cpIsWorkDay(d)) left--;
  }
  return cpISO(d);
}
function cpTHB(n){
  if(!n) return '฿0';
  if(n >= 1000000) return '฿'+(n/1000000).toFixed(n>=10000000?1:2)+'M';
  if(n >= 1000) return '฿'+Math.round(n/1000)+'K';
  return '฿'+n;
}
const cpPct = (a,b) => b? Math.round(a/b*100) : 0;
const cpMeter = p => p>=95?'green' : p>=70?'' : p>=40?'amber':'red';

/* ---------- state ---------- */
/* Fills S.campaigns from Supabase. Until the migration is applied, cpLoadRemote falls
   back to CP_SEED plus one demo 10.10 record so the Targets tab can be reviewed.
   The first paint stays synchronous: an empty list, then the async load redraws. */
function cpLoad(){
  if(S.cpLoaded) return S.campaigns || [];
  if(!S.campaigns) S.campaigns = [];
  if(!S.cpLoading){
    S.cpLoading = true;
    S.cpSource = 'loading';
    cpLoadRemote();
  }
  return S.campaigns;
}
const cpById = id => (S.campaigns||[]).find(c=>c.id===id);
function cpBuildTasks(c, prog){
  const pb = CP_PLAYBOOKS[c.pb]; const n = pb.items.length;
  const seen = {};
  return pb.items.map((it,i)=>{
    const pool = CP_OWNER2[it.div] || [CP_OWNERS[it.div]||'Ton'];
    seen[it.div] = (seen[it.div]||0);
    const owner = pool[seen[it.div]++ % pool.length];
    const frac = (i+0.5)/n;
    let st = 'todo';
    if(prog > 0){
      if(frac <= prog) st='done';
      else if(frac <= prog+0.2) st='progress';
    }
    const nxt = pb.items[i+1]; const handoff = (nxt && nxt.div !== it.div) ? nxt.div : null;
    const t = {id:'CT-'+(++cpSeq), title:it.t, div:it.div, owner, due:cpDueBack(c.start, it.off),
               off:it.off, status:st, fresh:false};
    cpFakeHist('seed:'+t.id, st, owner, t.due, {handoff});
    return t;
  });
}
function cpBuildAssets(c, prog){
  const set = CP_ASSETS[c.pb]||[];
  return set.map((a,i)=>{
    const frac = (i+0.5)/set.length;
    let st = 'draft';
    if(frac <= prog-0.15) st='approved';
    else if(frac <= prog+0.05) st = (i%4===1 ? 'changes' : 'review');
    return {id:'CA-'+c.id.slice(2)+'-'+(i+1), name:a.n, dim:a.d, type:a.t,
            ver:'v'+(st==='approved'? (i%3)+2 : (i%2)+1), state:st,
            due:cpDueBack(c.start, 14-Math.min(13,i))};
  });
}
const cpDone     = c => c.tasks.filter(t=>t.status==='done').length;
const cpOverdue  = c => c.tasks.filter(t=>t.status!=='done' && cpWD(cpToday(), t.due) < 0).length;
const cpApproved = c => c.assets.filter(a=>a.state==='approved').length;
const cpWaiting  = c => c.assets.filter(a=>a.state==='review'||a.state==='changes').length;
function cpAllAssets(){
  const out=[]; (S.campaigns||[]).forEach(c=>c.assets.forEach(a=>out.push(Object.assign({cid:c.id,cname:c.name},a))));
  return out;
}

/* ---------- small pieces ---------- */
function cpStatusChip(k){
  const s = CP_STATUSES.find(x=>x.k===k)||CP_STATUSES[0];
  return `<span class="chip" style="background:${s.color}1A;color:${s.color}">${s.label}</span>`;
}
function cpChanChip(k){
  const c = CP_CHANNELS[k]; if(!c) return '';
  return `<span class="chip" style="background:var(--cp-${c.cls}-soft);color:var(--cp-${c.cls})">${c.label}</span>`;
}
function cpBarClass(c){
  if(!c.channels || c.channels.length!==1) return c.channels && c.channels.length>1 ? 'multi' : 'brand';
  return (CP_CHANNELS[c.channels[0]]||{cls:'brand'}).cls;
}
/* SLA state for one ticket, in the module's own working-day count. */
function cpSla(t){
  if(t.status==='done') return {bg:'var(--green-soft)', ink:'var(--green)', txt:'Met'};
  const w = cpWD(cpToday(), t.due);
  if(w < 0)  return {bg:'var(--red-soft)',   ink:'var(--red)',   txt:'Overdue '+Math.abs(w)+'d'};
  if(w === 0)return {bg:'var(--amber-soft)', ink:'var(--amber)', txt:'Due today'};
  if(w <= 2) return {bg:'var(--amber-soft)', ink:'var(--amber)', txt:'Due in '+w+'d'};
  return {bg:'var(--gray-soft)', ink:'var(--ink2)', txt:'On track '+w+'d'};
}
function cpPill(s, txt){ return `<span class="sla-pill" style="background:${s.bg};color:${s.ink}">${txt||s.txt}</span>`; }

/* ---------- Status log (hover) ----------
   Every status chip and tracker cell carries its log: who moved the status, from what to what, and when
   (April, 18 Sep). Seed rows get a deterministic log so the demo is stable across renders; real tasks read
   activity_log (action 'updated', detail.changes[].field === 'status') once and cache it for the session.
   Handoffs ride along: when a step finishes and the next step belongs to another team, the log shows the
   handoff and the Teams notification, and a step waiting on another team shows what it is waiting for. */
const CP_HIST = {};                       /* key -> [{at, who, from, to, kind, note}] newest first, or 'loading' */
const CP_ST_LABEL = {todo:'Not started', in_progress:'In progress', progress:'In progress', review:'Needs review', blocked:'Blocked', done:'Done', over:'Overdue', wait:'Waiting'};
const cpStLabel = s => CP_ST_LABEL[s] || (s ? String(s).replace(/_/g,' ') : '—');
function cpHash(s){ let h = 2166136261; for(const ch of String(s)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const cpAt = (d, h, m) => cpISO(d) + 'T' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':00';
function cpFakeHist(key, st, who, due, extra){
  if(CP_HIST[key]) return CP_HIST[key];
  extra = extra || {}; const r = cpHash(key);
  /* a log never runs ahead of today — for a future due date the moves happened over the past days */
  const ref = cpD(due) > cpToday() ? cpToday() : cpD(due);
  const created = cpAdd(ref, -(10 + r % 6)), started = cpAdd(ref, -(3 + (r >> 3) % 4));
  const log = [{at:cpAt(created, 9 + r % 2, 5 + r % 50), who:'DONE', kind:'created', note:'Created from the playbook'}];
  if(extra.unb) log.push({at:cpAt(cpToday(), 8 + (r >> 2) % 2, (r >> 5) % 60), who:'DONE', kind:'handoff', note:'Unblocked — upstream step finished (' + extra.unb + ')'});
  if(st==='progress' || st==='done' || (st==='over' && (r >> 5) % 2)) log.push({at:cpAt(started, 10 + (r >> 6) % 7, (r >> 9) % 60), who, from:'todo', to:'in_progress', kind:'status'});
  if(st==='done'){
    const at = cpAt(cpAdd(ref, -((r >> 4) % 2)), 13 + (r >> 7) % 5, (r >> 11) % 60);
    log.push({at, who, from:'in_progress', to:'done', kind:'status'});
    if(extra.handoff) log.push({at, who:'DONE', kind:'handoff', note:'Handed off → ' + extra.handoff + ' · Teams channel notified'});
  }
  if(st==='wait' && extra.on) log.push({at:cpAt(started, 8, 30 + (r >> 8) % 29), who:'DONE', kind:'handoff', note:'Waiting on ' + extra.on + (extra.up ? ' — ' + extra.up : '')});
  CP_HIST[key] = log.reverse(); return CP_HIST[key];
}
function cpFetchHist(key){
  if(typeof db === 'undefined'){ CP_HIST[key] = []; return Promise.resolve(); }
  CP_HIST[key] = 'loading';
  return db.from('activity_log').select('actor_id,action,detail,created_at').eq('entity_type','task').eq('entity_id', key.slice(5))
    .order('created_at', {ascending:false}).limit(80)
    .then(({data})=>{
      const out = [];
      (data||[]).forEach(row=>{
        const who = row.actor_id ? ownerName(row.actor_id) : 'DONE';
        const ch = (row.detail && Array.isArray(row.detail.changes)) ? row.detail.changes.filter(c=>c.field==='status') : [];
        ch.forEach(c=>out.push({at:row.created_at, who, from:c.from, to:c.to, kind:'status'}));
        if(row.action==='created') out.push({at:row.created_at, who, kind:'created', note:'Created'});
      });
      CP_HIST[key] = out;
    }).catch(()=>{ CP_HIST[key] = []; });
}
/* Attributes that turn any element into a status-log anchor. */
const cpHistAttrs = key => ` data-hist="${esc(key)}" tabindex="0" onmouseenter="cpShowHist(this)" onmouseleave="cpHideHist()" onfocus="cpShowHist(this)" onblur="cpHideHist()"`;
let cpHpopT = null;
function cpHideHist(){ clearTimeout(cpHpopT); cpHpopT = setTimeout(()=>{ const p = document.getElementById('cphpop'); if(p) p.remove(); }, 140); }
function cpShowHist(el){
  clearTimeout(cpHpopT);
  const key = el.dataset.hist; if(!key) return;
  let p = document.getElementById('cphpop');
  if(p && p.dataset.key === key) return;
  if(p) p.remove();
  p = document.createElement('div'); p.id = 'cphpop'; p.className = 'cp-hpop'; p.dataset.key = key; p.setAttribute('role','tooltip');
  p.onmouseenter = ()=>clearTimeout(cpHpopT); p.onmouseleave = cpHideHist;
  p.innerHTML = cpHistHTML(key);
  document.body.appendChild(p); cpPlaceHist(p, el);
  if(key.startsWith('task:') && !CP_HIST[key]) cpFetchHist(key).then(()=>{ const q = document.getElementById('cphpop'); if(q && q.dataset.key === key){ q.innerHTML = cpHistHTML(key); cpPlaceHist(q, el); } });
}
function cpPlaceHist(p, el){
  const r = el.getBoundingClientRect(), pb = p.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(r.left, innerWidth - pb.width - 8)) + 'px';
  p.style.top  = (r.bottom + pb.height + 10 > innerHeight ? Math.max(8, r.top - pb.height - 6) : r.bottom + 6) + 'px';
}
function cpHistHTML(key){
  const log = CP_HIST[key];
  const rows = (!log || log === 'loading') ? `<li><i></i><div><b>Loading…</b></div></li>`
    : !log.length ? `<li class="created"><i></i><div><b>No status changes yet</b><small>Still as generated from the playbook</small></div></li>`
    : log.map(e=>{
        const cls  = e.kind === 'status' ? (e.to === 'done' ? 'done' : 'status') : e.kind;
        const head = e.kind === 'status' ? `${cpStLabel(e.from)} → ${cpStLabel(e.to)}` : (e.note || 'Created');
        return `<li class="${cls}"><i></i><div><b>${esc(head)}</b><small>${esc(e.who || '—')} · ${esc(fmtDateTime(e.at))}</small></div></li>`;
      }).join('');
  const n = Array.isArray(log) ? log.filter(e=>e.kind === 'status').length : 0;
  return `<div class="hd"><span>Status log</span><span>${n ? n + ' change' + (n === 1 ? '' : 's') : ''}</span></div><ol>${rows}</ol><div class="ft">Newest first · date and time in your local time</div>`;
}
/* Seed helper for month-layer rows: registers a stable log and returns the chip. */
function cpSeedChip(t, st, extra){
  const key = 'seed:' + (t.b || '') + '|' + (t.s || '');
  cpFakeHist(key, st, t.k || (S.me && S.me.full_name ? S.me.full_name.split(' ')[0] : 'KAM'), t.due, extra);
  return cpTaskChip(st, key);
}
/* Owners are seed names. Show the real avatar when the tenant has a profile by that name. */
function cpWho(name){
  const p = (S.profiles||[]).find(x=>x.full_name===name || (x.full_name||'').split(' ')[0]===name);
  return p ? avatar(p, true)+' <span style="color:var(--ink2)">'+esc(name)+'</span>' : esc(name);
}
</script>
<script>
/* ================= ROUTE ================= */
/* #/campaigns                     the planning window
   #/campaigns/<id>                one campaign
   #/campaigns/<id>/<tab>          overview | tickets | assets | mechanics          */
function renderCampaigns(id, tab){
  cpLoad(); cpLoadCalendar();
  tab = cpTabClean(tab);
  if(id && String(id).indexOf('?')>=0) id = String(id).split('?')[0];
  if(id && cpById(id)) return cpRenderOne(cpById(id), tab||'overview');
  if(id && S.cpSource==='loading'){
    $('#content').innerHTML = `<div class="page-head"><h1>Campaigns</h1></div><div class="card empty">Loading this campaign…</div>`;
    return;
  }
  /* Strategy (management/admin) lands on the month; everyone else on their own brand lines. */
  if(!cpTab) cpTab = cpIsSuper()? 'months' : 'brands';
  setTopbar('Campaigns', canEdit()? `<button class="btn btn-primary btn-sm" onclick="cpPlanMonth()">＋ Plan a month</button>`:'');
  const C = $('#content');
  const body = cpTab==='months'   ? cpViewMonths()
             : cpTab==='lanes'    ? cpViewLane()
             : cpTab==='brands'   ? cpViewBrands()
             : cpTab==='grid'     ? cpViewGrid()
             : cpTab==='list'     ? cpViewList()
             : cpTab==='targets'  ? cpViewTargets()
             : cpTab==='assets'   ? cpViewAssets()
             :                      cpViewTimeline();
  C.innerHTML = `
    <div class="page-head"><h1>Campaigns</h1>
      <div class="tabs" style="max-width:100%;overflow-x:auto">
        ${[['months','Months'],['timeline','Timeline'],['list','All campaigns'],['lanes','Team lanes'],['brands','Brand lines'],['grid','Tracker grid'],['targets','Targets & budget'],['assets','Asset approvals']]
          .map(([k,l])=>`<button class="tab ${cpTab===k?'active':''}" style="flex:none" onclick="cpTab='${k}';renderCampaigns()">${l}</button>`).join('')}
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="cpExportCSV()">Export Excel</button>
        ${canEdit()? `<button class="btn btn-ghost" onclick="cpNewCampaign()">New campaign</button>`:''}
        ${canEdit()? `<button class="btn btn-primary" onclick="cpPlanMonth()">＋ Plan a month</button>`:''}
      </div>
    </div>
    ${cpDemoBanner()}
    ${body}`;
}

/* ---------- the planning window ---------- */
/* The window spans whole months, from the earliest campaign to the latest, so nothing is
   half-drawn at an edge. */
function cpWindow(){
  const cs = S.campaigns||[];
  if(!cs.length) return {start:cpToday(), months:[], days:1};
  let lo = cpD(cs[0].start), hi = cpD(cs[0].end);
  cs.forEach(c=>{ if(cpD(c.start)<lo) lo=cpD(c.start); if(cpD(c.end)>hi) hi=cpD(c.end); });
  const start = new Date(lo.getFullYear(), lo.getMonth(), 1);
  const months = [];
  let m = new Date(start);
  while(m <= hi && months.length < 8){
    const dim = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
    months.push({y:m.getFullYear(), m:m.getMonth(), d:dim,
      label:m.toLocaleDateString('en-GB',{month:'long', year:'numeric'})});
    m = new Date(m.getFullYear(), m.getMonth()+1, 1);
  }
  return {start, months, days:months.reduce((s,x)=>s+x.d,0)};
}
function cpViewTimeline(){
  const W = cpWindow();
  const list = (S.campaigns||[]).filter(c=>cpChan==='all' || c.channels.includes(cpChan));
  const today = cpToday();
  const idx = x => Math.round((cpD(x)-W.start)/86400000);

  const months = W.months.map(mo=>{
    let days='';
    for(let i=1;i<=mo.d;i++) days += `<span class="cp-day">${(i===1||i%5===0)?i:''}</span>`;
    return `<div class="cp-month" style="flex:${mo.d}"><b>${mo.label}</b><div class="cp-days">${days}</div></div>`;
  }).join('');

  let lines='', first=true;
  W.months.forEach(mo=>{
    for(let i=1;i<=mo.d;i++){
      const wd = new Date(mo.y, mo.m, i).getDay();
      lines += `<span class="${i===1&&!first?'m':(wd===1?'w':'')}"></span>`;
    }
    first=false;
  });
  const tLeft = (((idx(today)+0.5)/W.days)*100).toFixed(3);
  const inRange = idx(today) >= 0 && idx(today) < W.days;

  const groups = [
    ['Running now', list.filter(c=>cpD(c.start)<=today && cpD(c.end)>=today)],
    ['Upcoming',    list.filter(c=>cpD(c.start)>today)],
    ['Closed',      list.filter(c=>cpD(c.end)<today)]
  ];
  let rows='', firstRow=true;
  groups.forEach(([label, items])=>{
    if(!items.length) return;
    rows += `<div class="cp-grp"><span>${label} · ${items.length}</span><span></span></div>`;
    items.slice().sort((a,b)=>cpD(a.start)-cpD(b.start)).forEach(c=>{
      const s = Math.max(0, idx(c.start)), e = Math.min(W.days-1, idx(c.end));
      const left = (s/W.days*100), w = Math.max(2.2, (e-s+1)/W.days*100);
      const tot = c.tasks.length, frac = tot? cpDone(c)+'/'+tot : 'no tickets';
      const wide = w >= 24, right = left + w;
      const tip = `${c.name} — ${fmtDate(c.start)} to ${fmtDate(c.end)} · ${frac} tickets`;
      const lab = `${esc(c.name)}<span class="f">${frac}</span>`;
      const outside = wide ? ''
        : right > 78
          ? `<span class="cp-barlab" style="right:calc(${(100-left).toFixed(3)}% + 8px)">${lab}</span>`
          : `<span class="cp-barlab" style="left:calc(${right.toFixed(3)}% + 8px)">${lab}</span>`;
      rows += `<div class="cp-row">
        <div class="cp-name"><b>${esc(c.name)}</b><span class="s">${esc(c.brands[0])}${c.brands.length>1?' +'+(c.brands.length-1):''} · ${esc(c.owner)}</span></div>
        <div class="cp-track"><div class="cp-lines">${lines}</div>
          ${inRange? `<div class="cp-today${firstRow?' lab':''}" style="left:${tLeft}%"></div>`:''}
          <button type="button" class="cp-bar ${cpBarClass(c)}${c.status==='draft'?' draft':''}"
            style="left:${left.toFixed(3)}%;width:${w.toFixed(3)}%"
            title="${esc(tip)}" aria-label="${esc(tip)}"
            onclick="location.hash='#/campaigns/${c.id}'">${wide? `<span>${esc(c.name)}</span><span class="f">${frac}</span>`:''}</button>
          ${outside}</div></div>`;
      firstRow = false;
    });
  });

  const active  = (S.campaigns||[]).filter(c=>['planning','briefed','exec','live'].includes(c.status)).length;
  const overdue = (S.campaigns||[]).reduce((s,c)=>s+cpOverdue(c),0);
  const waiting = (S.campaigns||[]).reduce((s,c)=>s+cpWaiting(c),0);
  const tgt = (S.campaigns||[]).reduce((s,c)=>s+c.gmvTarget,0);
  const act = (S.campaigns||[]).reduce((s,c)=>s+c.gmvActual,0);

  return `
  <div class="stat-row">
    <div class="stat cp-stat"><div class="cp-l">Active campaigns</div><div class="n">${active}</div>
      <div class="sub">of ${(S.campaigns||[]).length} in the window</div></div>
    <div class="stat cp-stat"><div class="cp-l">Overdue tickets</div><div class="n ${overdue?'red':''}">${overdue}</div>
      <div class="sub">across every campaign brief</div></div>
    <div class="stat cp-stat"><div class="cp-l">Assets awaiting approval</div><div class="n ${waiting?'amber':''}">${waiting}</div>
      <div class="sub">in review or changes requested</div></div>
    <div class="stat cp-stat"><div class="cp-l">GMV settled</div><div class="n navy">${cpTHB(act)}</div>
      <div class="cp-meter" style="margin-top:7px"><i class="${cpMeter(cpPct(act,tgt))}" style="width:${Math.min(100,cpPct(act,tgt))}%"></i></div>
      <div class="sub">${cpPct(act,tgt)}% of the ${cpTHB(tgt)} window target</div></div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
    ${cpChanFilter()}
    <span style="color:var(--ink3);font-size:12.5px">${list.length} campaigns${W.months.length? ' · '+W.months[0].label+' – '+W.months[W.months.length-1].label : ''}</span>
  </div>
  <div class="card">
    <div class="cp-tl"><div class="cp-tl-inner">
      <div class="cp-head"><div class="cp-lab">Campaign</div><div class="cp-months">${months}</div></div>
      ${rows || '<div class="empty">No campaigns on this channel.</div>'}
    </div></div>
    <div class="cp-legend">
      ${Object.entries(CP_CHANNELS).map(([k,v])=>`<b><span class="cp-sw" style="background:var(--cp-${v.cls})"></span>${v.label}</b>`).join('')}
      <b><span class="cp-sw" style="background:linear-gradient(97deg,var(--cp-navy),var(--cp-purple))"></span>Multi-channel</b>
      <b><span class="cp-sw" style="background:var(--gray-soft);border:1px dashed var(--line-strong)"></span>Draft</b>
      <span>Tickets completed of tickets generated ${helpIcon('The brief for a campaign expands into tickets on the Creative, Product Listing, Store Operations and CS boards. The count on each bar is how many of those are Done.')}</span>
    </div>
  </div>`;
}
function cpChanFilter(){
  return `<div class="tabs">${['all'].concat(Object.keys(CP_CHANNELS)).map(k=>
    `<button class="tab ${cpChan===k?'active':''}" onclick="cpChan='${k}';renderCampaigns()">${k==='all'?'All channels':CP_CHANNELS[k].label}</button>`).join('')}</div>`;
}
</script>
<script>
/* ---------- all campaigns ---------- */
function cpViewList(){
  const list = (S.campaigns||[]).filter(c=>(cpChan==='all'||c.channels.includes(cpChan)) && (cpStat==='all'||c.status===cpStat));
  const rows = list.map(c=>{
    const tot=c.tasks.length, done=cpDone(c), od=cpOverdue(c), p=cpPct(done,tot);
    return `<tr class="rowlink" onclick="location.hash='#/campaigns/${c.id}'">
      <td style="font-weight:600"><span style="color:var(--ink3);font-weight:700;font-size:11.5px;margin-right:6px">${c.id}</span>${esc(c.name)}
        <div style="font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:2px">${esc(c.brands.join(', '))}</div></td>
      <td>${c.channels.map(cpChanChip).join(' ')}</td>
      <td style="color:var(--ink2);white-space:nowrap">${fmtDate(c.start)} – ${fmtDate(c.end)}</td>
      <td>${cpStatusChip(c.status)}</td>
      <td style="white-space:nowrap">${cpWho(c.owner)}</td>
      <td style="min-width:140px">${tot
        ? `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:12px">${done}/${tot}</b>
             <span class="cp-meter" style="flex:1;display:block"><i class="${cpMeter(p)}" style="width:${p}%"></i></span></div>
           ${od? `<div style="color:var(--red);font-weight:600;font-size:11px;margin-top:3px">${od} overdue</div>`:''}`
        : `<span style="color:var(--ink3);font-size:12px">not briefed</span>`}</td>
      <td style="text-align:right;white-space:nowrap">${cpTHB(c.gmvTarget)}</td>
      <td style="text-align:right;white-space:nowrap">${c.gmvActual? cpTHB(c.gmvActual) : '<span style="color:var(--ink3)">—</span>'}</td>
    </tr>`;
  }).join('');
  return `
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
    ${cpChanFilter()}
    <select onchange="cpStat=this.value;renderCampaigns()" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);font:inherit;font-size:12.5px">
      <option value="all">All statuses</option>
      ${CP_STATUSES.map(s=>`<option value="${s.k}" ${cpStat===s.k?'selected':''}>${s.label}</option>`).join('')}
    </select>
    <span style="color:var(--ink3);font-size:12.5px">${list.length} shown</span>
  </div>
  <div class="card" style="overflow-x:auto">${list.length? `<table class="tbl">
    <thead><tr><th>Campaign</th><th>Channels</th><th>Window</th><th>Status</th><th>Owner</th>
      <th>Tickets</th><th style="text-align:right">GMV target</th><th style="text-align:right">GMV actual</th></tr></thead>
    <tbody>${rows}</tbody></table>` : '<div class="empty">Nothing matches these filters.</div>'}</div>`;
}

/* ---------- targets & budget ---------- */
function cpViewTargets(){
  const list = (S.campaigns||[]).filter(c=>cpChan==='all'||c.channels.includes(cpChan));
  const T = list.reduce((s,c)=>s+c.gmvTarget,0), A = list.reduce((s,c)=>s+c.gmvActual,0);
  const B = list.reduce((s,c)=>s+c.budget,0),    Sp= list.reduce((s,c)=>s+c.spent,0);
  const rows = list.map(c=>{
    const settled = c.gmvActual>0, att = settled? cpPct(c.gmvActual,c.gmvTarget):null;
    const roas = settled && c.spent ? (c.gmvActual/c.spent).toFixed(1)+'×' : '—';
    return `<tr class="rowlink" onclick="location.hash='#/campaigns/${c.id}'">
      <td style="font-weight:600">${esc(c.name)}
        <div style="font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:2px">${fmtDate(c.start)} – ${fmtDate(c.end)} · ${c.channels.map(k=>CP_CHANNELS[k].label).join(', ')}</div></td>
      <td style="text-align:right;white-space:nowrap">${cpTHB(c.gmvTarget)}</td>
      <td style="text-align:right;white-space:nowrap">${settled? cpTHB(c.gmvActual):'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="min-width:132px">${att===null? '<span style="color:var(--ink3);font-size:12px">not started</span>'
        : `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:12px;color:var(--${att>=100?'green':att>=85?'amber':'red'})">${att}%</b>
             <span class="cp-meter" style="flex:1;display:block"><i class="${cpMeter(att)}" style="width:${Math.min(100,att)}%"></i></span></div>`}</td>
      <td style="text-align:right;white-space:nowrap">${cpTHB(c.budget)}</td>
      <td style="text-align:right;white-space:nowrap">${c.spent? cpTHB(c.spent):'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="text-align:right">${c.spent? cpPct(c.spent,c.budget)+'%':'<span style="color:var(--ink3)">—</span>'}</td>
      <td style="text-align:right;font-weight:600">${roas}</td></tr>`;
  }).join('');
  return `
  <div class="stat-row">
    <div class="stat cp-stat"><div class="cp-l">GMV target</div><div class="n">${cpTHB(T)}</div>
      <div class="sub">${list.length} campaigns in the window</div></div>
    <div class="stat cp-stat"><div class="cp-l">GMV settled</div><div class="n green">${cpTHB(A)}</div>
      <div class="cp-meter" style="margin-top:7px"><i class="${cpMeter(cpPct(A,T))}" style="width:${Math.min(100,cpPct(A,T))}%"></i></div>
      <div class="sub">closed and wrap-up campaigns only</div></div>
    <div class="stat cp-stat"><div class="cp-l">Committed budget</div><div class="n">${cpTHB(B)}</div>
      <div class="sub">seller-funded, excludes platform co-fund</div></div>
    <div class="stat cp-stat"><div class="cp-l">Spent to date</div><div class="n navy">${cpTHB(Sp)}</div>
      <div class="sub">${cpPct(Sp,B)}% of committed · blended ${Sp?(A/Sp).toFixed(1):'0.0'}× ROAS</div></div>
  </div>
  <div style="margin-bottom:14px">${cpChanFilter()}</div>
  <div class="card" style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>Campaign</th><th style="text-align:right">GMV target</th><th style="text-align:right">GMV actual</th>
      <th>Attainment</th><th style="text-align:right">Budget</th><th style="text-align:right">Spent</th>
      <th style="text-align:right">Burn</th><th style="text-align:right">ROAS</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="background:var(--panel-2);font-weight:700">
      <td>Total</td><td style="text-align:right">${cpTHB(T)}</td><td style="text-align:right">${cpTHB(A)}</td><td></td>
      <td style="text-align:right">${cpTHB(B)}</td><td style="text-align:right">${cpTHB(Sp)}</td>
      <td style="text-align:right">${cpPct(Sp,B)}%</td><td style="text-align:right">${Sp?(A/Sp).toFixed(1):'0.0'}×</td></tr></tfoot>
  </table></div>`;
}

/* ---------- asset approvals ---------- */
function cpAssetCard(a, withCampaign){
  const st = CP_ASTATES[a.state];
  const w = cpWD(cpToday(), a.due), late = a.state!=='approved' && w < 0;
  return `<article class="cp-asset">
    <div class="th"><span class="v">${a.ver}</span><span class="t">${esc(a.type)}</span></div>
    <div class="mt"><b>${esc(a.name)}</b><span class="d">${a.dim} px · ${a.id}</span>
      ${withCampaign? `<a href="#/campaigns/${a.cid}" style="font-size:11.5px;color:var(--accent-ink);font-weight:600">${esc(a.cname)}</a>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span class="chip" style="background:${st.bg};color:${st.ink}">${st.label}</span>
        <span class="sla-pill" style="background:${a.state==='approved'?'var(--green-soft)':late?'var(--red-soft)':'var(--gray-soft)'};color:${a.state==='approved'?'var(--green)':late?'var(--red)':'var(--ink2)'}">${a.state==='approved'?'Signed off':late? Math.abs(w)+'d late':'due '+fmtDate(a.due)}</span>
      </div></div>
    ${a.state==='approved'||!canEdit()? '' : `<div class="ac">
      <button class="btn btn-green btn-sm" onclick="cpSetAsset('${a.id}','approved')">Approve</button>
      <button class="btn btn-ghost btn-sm" onclick="cpSetAsset('${a.id}','changes')">Request changes</button></div>`}
  </article>`;
}
function cpViewAssets(){
  const all = cpAllAssets();
  const n = {all:all.length,
             pending:all.filter(a=>a.state==='review'||a.state==='changes').length,
             approved:all.filter(a=>a.state==='approved').length,
             draft:all.filter(a=>a.state==='draft').length};
  const shown = all.filter(a=> cpAFil==='all' ? true
    : cpAFil==='pending' ? (a.state==='review'||a.state==='changes') : a.state===cpAFil);
  return `
  <div class="stat-row">
    <div class="stat cp-stat"><div class="cp-l">Deliverables in flight</div><div class="n">${n.all}</div>
      <div class="sub">across every briefed campaign</div></div>
    <div class="stat cp-stat"><div class="cp-l">Waiting on approval</div><div class="n ${n.pending?'amber':''}">${n.pending}</div>
      <div class="sub">in review or changes requested</div></div>
    <div class="stat cp-stat"><div class="cp-l">Approved</div><div class="n green">${n.approved}</div>
      <div class="cp-meter" style="margin-top:7px"><i class="green" style="width:${cpPct(n.approved,n.all)}%"></i></div>
      <div class="sub">${cpPct(n.approved,n.all)}% of all deliverables</div></div>
    <div class="stat cp-stat"><div class="cp-l">Not started</div><div class="n">${n.draft}</div>
      <div class="sub">briefed to Creative, no version yet</div></div>
  </div>
  <div style="margin-bottom:14px"><div class="tabs">
    ${[['pending','Waiting'],['all','All'],['approved','Approved'],['draft','Not started']].map(([k,l])=>
      `<button class="tab ${cpAFil===k?'active':''}" onclick="cpAFil='${k}';renderCampaigns()">${l} · ${n[k]}</button>`).join('')}
  </div></div>
  ${shown.length? `<div class="cp-assets">${shown.map(a=>cpAssetCard(a,true)).join('')}</div>`
                : '<div class="card empty">Nothing waiting here.</div>'}`;
}
function cpSetAsset(aid, state){
  for(const c of (S.campaigns||[])){
    const a = c.assets.find(x=>x.id===aid);
    if(!a) continue;
    a.state = state;
    if(state==='changes') a.ver = 'v'+((parseInt(a.ver.slice(1))||1)+1);
    toast(state==='approved'? 'Approved — '+a.name : 'Changes requested — '+a.name);
    renderCampaigns(S.route.id, S.route.tab);
    return;
  }
}
</script>
<script>
/* ---------- one campaign ---------- */
function cpRenderOne(c, tab){
  tab = cpTabClean(tab) || 'overview';
  if(!['overview','targets','readiness','live','compare','data','tickets','assets','mechanics'].includes(tab)) tab = 'overview';
  cpEnsureShape(c);
  setTopbar(`<a href="#/campaigns">Campaigns</a> <span style="color:var(--ink3)">/</span> ${esc(c.name)}`,
    canEdit()? `<button class="btn btn-ghost btn-sm" onclick="cpEditCampaign('${c.id}')">Edit</button>`:'');
  const body = tab==='targets' ? cpViewLineTargets(c)
             : tab==='readiness' ? cpPlaceholder(c, 'readiness')
             : tab==='live' ? cpPlaceholder(c, 'live')
             : tab==='compare' ? cpPlaceholder(c, 'compare')
             : tab==='data' ? cpViewData(c)
             : tab==='tickets' ? cpDetTickets(c)
             : tab==='assets' ? cpDetAssets(c)
             : tab==='mechanics' ? cpDetMech(c)
             : cpDetOverview(c);
  const showRail = ['overview','targets','readiness','live','compare','data'].includes(tab);
  const tabs = [['overview','Overview'],['targets','Targets'],['readiness','Readiness'],['live','Live'],['compare','Compare'],['data','Data']];
  $('#content').innerHTML = `<div class="cp-page">
    ${cpCampaignHead(c)}
    <div class="tabs" style="margin-bottom:8px;width:max-content;max-width:100%;overflow-x:auto">
      ${tabs.map(([k,l])=>`<button class="tab ${tab===k?'active':''}" onclick="cpGo('${c.id}','${k}')">${l}</button>`).join('')}
    </div>
    ${cpAsOfBanner(c)}
    ${showRail ? `<div class="cp-shell${tab==='targets'?' has-bar':''}">${tab==='targets' ? cpTargetBar(c) : ''}<aside class="cp-rail">${cpFilterRail(c)}</aside><div class="cp-main">${body}</div></div>` : body}</div>`;
}
function cpDetOverview(c){
  const byDiv = {};
  c.tasks.forEach(t=>{ (byDiv[t.div] = byDiv[t.div]||{n:0,d:0}).n++; if(t.status==='done') byDiv[t.div].d++; });
  const divs = Object.entries(byDiv).map(([k,v])=>{
    const p = cpPct(v.d,v.n);
    return `<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.8px;margin-bottom:4px">
      <b style="font-weight:600">${esc(k)}</b><span style="color:var(--ink2)">${v.d}/${v.n}</span></div>
      <div class="cp-meter"><i class="${cpMeter(p)}" style="width:${p}%"></i></div></div>`;
  }).join('') || '<div style="color:var(--ink3);font-size:12.8px">No tickets yet.</div>';
  const next = c.tasks.slice().sort((a,b)=>cpD(a.due)-cpD(b.due)).filter(t=>t.status!=='done').slice(0,6);
  return `${typeof cpDataHealth==='function' ? cpDataHealth(c) : ''}<div class="cp-grid2">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:15px 16px">
        <div class="section-title" style="margin-top:0">Readiness by division ${helpIcon('How many of the tickets this brief created on each division board are Done.')}</div>
        ${divs}</div>
      <div class="card" style="padding:15px 16px">
        <div class="section-title" style="margin-top:0">What is due next</div>
        ${next.length? next.map(t=>{ const s=cpSla(t);
          return `<div class="cp-kv"><span style="color:var(--ink)">${fmtDate(t.due)} · ${esc(t.title)}</span><span>${cpPill(s)}</span></div>`;
        }).join('') : '<div style="color:var(--ink3);font-size:12.8px">Nothing outstanding.</div>'}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" style="padding:15px 16px">
        <div class="section-title" style="margin-top:0">Brief</div>
        <div class="cp-kv"><span>Playbook</span><span>${CP_PLAYBOOKS[c.pb].name}</span></div>
        <div class="cp-kv"><span>Campaign owner</span><span>${esc(c.owner)}</span></div>
        <div class="cp-kv"><span>Channels</span><span>${c.channels.map(k=>(CP_CHANNELS[k]||{label:k}).label).join(', ')||'—'}</span></div>
        <div class="cp-kv"><span>Brands</span><span>${esc((c.brands||[]).join(', ')||'—')}</span></div>
        <div class="cp-kv"><span>Completion evidence</span><span>Screenshot + live URL</span></div>
        <div style="margin-top:8px;font-size:12.5px"><a href="#/campaigns/${c.id}/tickets">Playbook tickets</a> · <a href="#/campaigns/${c.id}/assets">Assets</a> · <a href="#/campaigns/${c.id}/mechanics">Mechanics</a></div>
      </div>
      <div class="card" style="padding:15px 16px">
        <div class="section-title" style="margin-top:0">Assets</div>
        <div class="cp-kv"><span>Approved</span><span>${cpApproved(c)} / ${c.assets.length}</span></div>
        <div class="cp-kv"><span>Waiting on approval</span><span>${cpWaiting(c)}</span></div>
        <div class="cp-kv"><span>Not started</span><span>${c.assets.filter(a=>a.state==='draft').length}</span></div>
      </div>
    </div></div>`;
}
function cpDetTickets(c){
  if(!c.tasks.length) return `<div class="card empty">
    <div class="big">◷</div>
    <div style="font-size:15px;font-weight:600;color:var(--ink)">No tickets yet</div>
    <p style="max-width:460px;margin:8px auto 16px;line-height:1.55">Running the brief expands the
      <b>${CP_PLAYBOOKS[c.pb].name}</b> playbook onto the Creative, Product Listing, Store Operations
      and CS boards, each ticket dated back from go-live in working days.</p>
    ${canEdit()? `<button class="btn btn-primary" onclick="cpBriefModal('${c.id}')">Generate tickets from brief</button>`:''}</div>`;
  const divs = [...new Set(c.tasks.map(t=>t.div))];
  const shown = c.tasks.filter(t=> cpTFil==='all' ? true
    : cpTFil==='open' ? t.status!=='done'
    : cpTFil==='overdue' ? (t.status!=='done' && cpWD(cpToday(),t.due) < 0)
    : t.div===cpTFil);
  const rows = shown.map(t=>{
    const s = cpSla(t);
    const tick = t.status==='done'? '<span class="cp-tick done">✓</span>'
               : t.status==='progress'? '<span class="cp-tick prog">•</span>' : '<span class="cp-tick"></span>';
    const lab = t.status==='done'?'Done' : t.status==='progress'?'In progress':'Not started';
    const bg  = t.status==='done'?'var(--green-soft)' : t.status==='progress'?'var(--amber-soft)':'var(--gray-soft)';
    const ink = t.status==='done'?'var(--green)' : t.status==='progress'?'var(--amber)':'var(--ink2)';
    return `<div class="cp-task${t.fresh?' fresh':''}">${tick}
      <div><b>${esc(t.title)}</b><span class="m"><span>${t.id}</span><span>${esc(t.div)}</span><span>${esc(t.owner)}</span><span>due ${fmtDate(t.due)} (D-${t.off})</span></span></div>
      <div class="r">${cpPill(s)}<span class="chip cp-hh" style="background:${bg};color:${ink}"${cpHistAttrs('seed:'+t.id)}>${lab}</span></div></div>`;
  }).join('');
  return `<div class="card">
    <div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="tabs" style="width:max-content;max-width:100%;overflow-x:auto">
      ${[['all','All'],['open','Open'],['overdue','Overdue']].concat(divs.map(d=>[d,d])).map(([k,l])=>
        `<button class="tab ${cpTFil===k?'active':''}" onclick="cpTFil='${k}';renderCampaigns('${c.id}','tickets')">${esc(l)}</button>`).join('')}
    </div><span style="font-size:12px;color:var(--ink3);margin-left:auto">Lead time in working days ${helpIcon('D-n counts working days only. Weekends and the holidays in Admin → SLA are skipped, so a D-7 never lands on a Saturday or a public holiday. Due dates move automatically when a holiday is added.')}</span></div>
    ${rows || '<div class="empty">No tickets match this filter.</div>'}</div>`;
}
function cpDetAssets(c){
  if(!c.assets.length) return '<div class="card empty">No deliverables yet — run the brief first.</div>';
  return `<div class="cp-assets">${c.assets.map(a=>cpAssetCard(Object.assign({cid:c.id,cname:c.name},a),false)).join('')}</div>`;
}
function cpDetMech(c){
  return `<div style="display:flex;flex-direction:column;gap:12px">
    ${c.mech.map(m=>`<div class="cp-mech"><b>${esc(m.t)}</b><p>${esc(m.d)}</p></div>`).join('')}
    <div class="card" style="padding:14px 16px;border-color:#E6D9B8">
      <div class="section-title" style="margin-top:0;color:var(--amber)">Pricing guard ${helpIcon('Every discount on this campaign is checked against the MSP floor before it can be submitted, and an override needs maker–checker sign-off. A breach holds the <b>Price &amp; TB setup</b> ticket until it clears.')}</div>
      <div style="font-size:12.8px;color:var(--ink2)">${c.mech.length} mechanic${c.mech.length===1?'':'s'} on this campaign, all subject to the RSP/MSP check.</div>
    </div></div>`;
}
</script>
<script>
/* ---------- brief → tickets ---------- */
function cpPreviewRows(c, pbKey){
  const pb = CP_PLAYBOOKS[pbKey];
  const seen = {};
  return pb.items.map(it=>{
    const pool = CP_OWNER2[it.div]||['Ton'];
    seen[it.div] = (seen[it.div]||0);
    const owner = pool[seen[it.div]++ % pool.length];
    const due = cpDueBack(c.start, it.off);
    const past = cpWD(cpToday(), due) < 0;
    return `<li><div><b>${esc(it.t)}</b><small>${esc(it.div)} · ${esc(owner)} · D-${it.off}</small></div>
      <div class="du" ${past? 'style="color:var(--red);font-weight:700"':''}>${fmtDate(due)}${past?' · past':''}</div></li>`;
  }).join('');
}
function cpBriefModal(id){
  const c = cpById(id); if(!c) return;
  const m = modal(`<div class="modal-head"><h2>Expand brief into tickets</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div style="color:var(--ink2);font-size:13px;margin-bottom:14px">${esc(c.name)} · go-live ${fmtDate(c.start)}</div>
      <label>Playbook ${helpIcon('The set of tickets this kind of campaign always needs. Due dates are counted back from go-live over working days, skipping weekends and the holidays in Admin → SLA.')}</label>
      <select id="cp-pb">${Object.entries(CP_PLAYBOOKS).map(([k,v])=>
        `<option value="${k}" ${k===c.pb?'selected':''}>${v.name} — ${v.items.length} tickets</option>`).join('')}</select>
      <div class="cp-prev" style="margin-top:14px">
        <div class="h"><span style="flex:1">Tickets to create</span><span>Due</span></div>
        <ul id="cp-prev-list">${cpPreviewRows(c, c.pb)}</ul>
      </div>
      ${c.tasks.length? `<div style="margin-top:12px;font-size:12.3px;color:var(--amber)">This campaign already has ${c.tasks.length} tickets. Re-running replaces the ones nobody has started; completed work is kept.</div>`:''}
    </div>
    <div class="modal-foot">
      <span style="margin-right:auto;color:var(--ink3);font-size:12px" id="cp-prev-count">${CP_PLAYBOOKS[c.pb].items.length} tickets · 4 boards</span>
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="cpRunBrief('${c.id}')">Create tickets</button>
    </div>`, true);
  const sel = m.querySelector('#cp-pb');
  sel.onchange = ()=>{
    m.querySelector('#cp-prev-list').innerHTML = cpPreviewRows(c, sel.value);
    m.querySelector('#cp-prev-count').textContent = CP_PLAYBOOKS[sel.value].items.length+' tickets · 4 boards';
  };
}
function cpRunBrief(id){
  const c = cpById(id); if(!c) return;
  const pick = document.querySelector('#cp-pb');
  if(pick && pick.value) c.pb = pick.value;
  const kept = c.tasks.filter(t=>t.status==='done');
  const fresh = cpBuildTasks(c, 0).filter(t=>!kept.some(k=>k.title===t.title));
  fresh.forEach(t=>t.fresh = true);
  c.tasks = kept.concat(fresh);
  if(!c.assets.length) c.assets = cpBuildAssets(c, 0);
  if(c.status==='draft') c.status = 'briefed';
  if(S.cpSource==='db' && typeof cpIsUuid==='function' && cpIsUuid(c.id)){
    db.from('campaigns').update({playbook:c.pb, status:c.status}).eq('id', c.id);
  }
  closeModals();
  cpTFil = 'all';
  location.hash = '#/campaigns/'+c.id+'/tickets';
  renderCampaigns(c.id, 'tickets');
  toast(fresh.length+' tickets created across the division boards');
  /* The green flash is a "these are the ones I just made" cue, not a state — drop it. */
  setTimeout(()=>{
    c.tasks.forEach(t=>t.fresh = false);
    if(S.route.view==='campaigns' && S.route.id===c.id) renderCampaigns(c.id, S.route.tab||'tickets');
  }, 2600);
}

/* ---------- new campaign ---------- */
function cpNewCampaign(){
  const today = cpISO(cpToday());
  const chans = Object.entries(CP_CHANNELS).map(([k,v])=>
    `<label style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:13px"><input type="checkbox" name="cp-ch" value="${k}" ${k==='shopee'?'checked':''}> ${v.label}</label>`).join('');
  modal(`<div class="modal-head"><h2>New campaign</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Campaign name <span class="req">*</span></label><input id="cp-n" placeholder="10.10 Mega 2026">
      <label style="margin-top:12px">Countries</label><input id="cp-co" value="TH" placeholder="TH, MY, SG">
      <label style="margin-top:12px">Channels</label>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:4px">${chans}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <div><label>Teasing starts</label><input id="cp-s" type="date" value="${today}"></div>
        <div><label>D-day</label><input id="cp-e" type="date" value="${today}"></div>
      </div>
      <label style="margin-top:12px">Playbook ${helpIcon('Decides which tickets the brief will create. Due dates are working days back from D-day.')}</label>
      <select id="cp-p">${Object.entries(CP_PLAYBOOKS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
        <div><label>GMV target (฿)</label><input id="cp-g" type="number" min="0" placeholder="0"></div>
        <div><label>Budget (฿)</label><input id="cp-u" type="number" min="0" placeholder="0"></div>
      </div>
      <p style="margin:12px 0 0;font-size:12.5px;color:var(--ink3)">Brand lines arrive with the daily-target import. Vertical, lead and KAM come from the brand master.</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="cpCreate()">Create campaign</button>
    </div>`, true);
}
async function cpCreate(){
  const _nav = S.nav;
  const v = s => (document.querySelector(s)?.value||'').trim();
  const name = v('#cp-n');
  if(!name) return toast('Give the campaign a name', true);
  const start = v('#cp-s'), end = v('#cp-e') || v('#cp-s');
  if(!start) return toast('Pick a go-live date', true);
  if(cpD(end) < cpD(start)) return toast('The end date is before D-day', true);
  const channels = [...document.querySelectorAll('input[name=cp-ch]:checked')].map(el=>el.value);
  if(!channels.length) return toast('Pick at least one channel', true);
  if(S.cpSource==='loading') return toast('Campaigns are still loading — try again in a moment', true);
  const countries = v('#cp-co').split(/[, ]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
  const draft = {
    name, brands:[], channels, countries: countries.length? countries : ['TH'],
    start, end, status:'draft', owner:(S.me&&S.me.full_name)||'—', ownerId:S.me&&S.me.id,
    pb:v('#cp-p')||'mega', prog:0,
    gmvTarget:Number(v('#cp-g'))||0, gmvActual:0, budget:Number(v('#cp-u'))||0, spent:0,
    mech:[{t:'Mechanics not set', d:'Add the discount, voucher and GWP mechanics before the pricing review.'}],
    tasks:[], assets:[], lines:[], imports:[],
    phases: cpDefaultPhases(start, end),
    baselineId:null, baselineMode:'target', persisted:false
  };
  if(S.cpSource==='db'){
    const saved = await cpInsertCampaign(draft);
    if(!saved) return;
    if(navStale(_nav)) return;
    closeModals();
    location.hash = '#/campaigns/'+saved.id+'/targets';
    toast('Campaign created');
    return;
  }
  const n = (S.campaigns||[]).length;
  draft.id = 'C-26'+String(15+n).padStart(2,'0');
  cpEnsureShape(draft);
  S.campaigns.push(draft);
  closeModals();
  location.hash = '#/campaigns/'+draft.id+'/targets';
  renderCampaigns(draft.id, 'targets');
  toast(S.cpDemo ? 'Campaign created in this demo session — it is not saved to the database' : 'Campaign created');
}

/* ---------- export ---------- */
function cpExportCSV(){
  const out = [['ID','Campaign','Brands','Channels','Status','Owner','Go-live','Ends',
                'Tickets done','Tickets total','Overdue','Assets approved','Assets total',
                'GMV target','GMV actual','Budget','Spent']];
  (S.campaigns||[]).forEach(c=>out.push([
    c.id, c.name, c.brands.join(', '), c.channels.map(k=>CP_CHANNELS[k].label).join(', '),
    (CP_STATUSES.find(s=>s.k===c.status)||{}).label||c.status, c.owner, c.start, c.end,

    c.gmvTarget, c.gmvActual, c.budget, c.spent
  ]));
  downloadXLSX(xlsxFilename('Campaigns'), out);
}

const CP_DEMO_BRANDS = [

];

const cpIsUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(s||''));
const cpTabClean = tab => String(tab||'').split('?')[0];
function cpHashQuery(){
  const h = (typeof location!=='undefined' && location.hash) || '';
  const i = h.indexOf('?');
  return new URLSearchParams(i>=0 ? h.slice(i+1) : '');
}
function cpRouteId(){ return String((S.route&&S.route.id)||'').split('?')[0]; }
function cpGo(id, tab){
  const qs = cpHashQuery().toString();
  location.hash = '#/campaigns/'+id+'/'+tab+(qs ? '?'+qs : '');
}
function cpSetFilter(key, value){
  const p = cpHashQuery();
  if(value) p.set(key, value); else p.delete(key);
  const qs = p.toString();
  const tab = cpTabClean(S.route&&S.route.tab) || 'targets';
  location.hash = '#/campaigns/'+cpRouteId()+'/'+tab+(qs ? '?'+qs : '');
}
function cpFilters(){
  const p = cpHashQuery();
  return {
    vertical:p.get('vertical')||'', platform:p.get('platform')||'', country:p.get('country')||'',
    lead:p.get('lead')||'', kam:p.get('kam')||'', status:p.get('status')||'', group:p.get('group')||'vertical'
  };
}
function cpJump(status){
  const p = cpHashQuery();
  if(status) p.set('status', status); else p.delete('status');
  const qs = p.toString();
  location.hash = '#/campaigns/'+cpRouteId()+'/targets'+(qs ? '?'+qs : '');
}

function cpDefaultPhases(start, end){
  const dday = end || start;
  const d1 = cpISO(cpAdd(dday, -1));
  let teaseEnd = cpISO(cpAdd(d1, -1));
  if(teaseEnd < start) teaseEnd = start;
  const teaseStart = start && start <= teaseEnd ? start : teaseEnd;
  return [
    {kind:'teasing', label:'Teasing', start:teaseStart, end:teaseEnd},
    {kind:'d1', label:'D-1', start:d1, end:d1},
    {kind:'dday', label:'D-day', start:dday, end:dday},
    {kind:'rerun', label:'Rerun/Cont.', start:cpISO(cpAdd(dday, 1)), end:cpISO(cpAdd(dday, 2))},
    {kind:'after', label:'After party', start:cpISO(cpAdd(dday, 3)), end:cpISO(cpAdd(dday, 5))}
  ];
}
function cpEnsureShape(c){
  if(!c) return c;
  if(!c.pb || !CP_PLAYBOOKS[c.pb]) c.pb = 'mega';
  if(!c.phases || !c.phases.length) c.phases = cpDefaultPhases(c.start, c.end);
  if(!c.lines) c.lines = [];
  if(!c.tasks) c.tasks = [];
  if(!c.assets) c.assets = [];
  if(!c.mech) c.mech = [];
  if(!c.channels) c.channels = [];
  if(!c.brands) c.brands = [];
  if(!c.countries || !c.countries.length) c.countries = ['TH'];
  if(!c.imports) c.imports = [];
  if(!c.baselineMode) c.baselineMode = 'target';
  return c;
}
function cpTableMissing(error){
  if(!error) return false;
  const m = String(error.message||'')+' '+String(error.code||'');
  return /PGRST205|42P01|does not exist|schema cache|could not find the table/i.test(m);
}
function cpOwnerName(id){
  if(!id) return '—';
  const p = (S.profiles||[]).find(x=>x.id===id);
  return (p && p.full_name) || '—';
}
function cpPeopleFor(brandId, platform){
  const rows = (S.cpAssign||[]).filter(a=>a.brand_id===brandId && a.platform===platform);
  const g = role => rows.find(a=>a.role===role) || {};
  const lead = g('lead'), kam = g('kam'), asso = g('associate');
  return {
    lead:lead.person_name||'', leadId:lead.user_id||null,
    kam:kam.person_name||'', kamId:kam.user_id||null,
    associate:asso.person_name||'', associateId:asso.user_id||null
  };
}
function cpTargetFromRow(t){
  return {
    id:t.id, date:t.target_date, phase:t.phase_kind||null,
    gmv:t.target_gmv==null?null:Number(t.target_gmv),
    visitors:t.target_visitors==null?null:Number(t.target_visitors),
    buyers:t.target_buyers==null?null:Number(t.target_buyers),
    orders:t.target_orders==null?null:Number(t.target_orders),
    aov:t.target_aov==null?null:Number(t.target_aov),
    cr:t.target_cr==null?null:Number(t.target_cr),
    ads:t.target_ads_spend==null?null:Number(t.target_ads_spend),
    fb:t.target_fb_spend==null?null:Number(t.target_fb_spend),
    search:t.target_search_spend==null?null:Number(t.target_search_spend),
    ams:t.target_ams_spend==null?null:Number(t.target_ams_spend),
    budgetGmv:t.budget_gmv==null?null:Number(t.budget_gmv),
    actual:t.actual_gmv==null?null:Number(t.actual_gmv),
    state:t.approval_state||'draft'
  };
}
function cpAssemble(camps, phases, lines, targets, imps){
  const by = {};
  (camps||[]).forEach(raw=>{
    by[raw.id] = cpEnsureShape({
      id:raw.id, name:raw.name, status:raw.status||'draft', pb:raw.playbook||'mega',
      ownerId:raw.owner_id||null, owner:cpOwnerName(raw.owner_id),
      start:raw.start_date, end:raw.end_date,
      gmvTarget:Number(raw.gmv_target)||0, gmvActual:Number(raw.gmv_actual)||0,
      budget:Number(raw.budget)||0, spent:Number(raw.spent)||0,
      mech:Array.isArray(raw.mechanics)?raw.mechanics:[],
      countries:(raw.countries&&raw.countries.length)?raw.countries:['TH'],
      channels:raw.channels||[],
      baselineId:raw.baseline_campaign_id||null, baselineMode:raw.baseline_mode||'target',
      lockedAt:raw.locked_at||null, persisted:true,
      phases:[], lines:[], imports:[], tasks:[], assets:[], brands:[]
    });
  });
  (phases||[]).forEach(p=>{
    const c = by[p.campaign_id]; if(!c) return;
    c.phases.push({id:p.id, kind:p.kind, label:p.label, start:p.start_date, end:p.end_date, position:p.position||0});
  });
  Object.values(by).forEach(c=>{
    c.phases.sort((a,b)=>(a.position||0)-(b.position||0));
    if(!c.phases.length) c.phases = cpDefaultPhases(c.start, c.end);
  });
  const lineById = {};
  (lines||[]).forEach(l=>{
    const c = by[l.campaign_id]; if(!c) return;
    const b = l.brands || {};
    const people = cpPeopleFor(l.brand_id, l.platform);
    const row = {
      id:l.id, brandId:l.brand_id, brand:b.name||'—', vertical:b.vertical||'',
      platform:l.platform, country:l.country||'TH',
      lead:people.lead, leadId:people.leadId, kam:people.kam, kamId:people.kamId,
      associate:people.associate, associateId:people.associateId,
      targets:[], reason:''
    };
    c.lines.push(row); lineById[l.id] = row;
    if(b.name && !c.brands.includes(b.name)) c.brands.push(b.name);
    if(l.platform && !c.channels.includes(l.platform)) c.channels.push(l.platform);
  });
  (targets||[]).forEach(t=>{
    const line = lineById[t.brand_line_id]; if(!line) return;
    line.targets.push(cpTargetFromRow(t));
    if(t.outlier_reason && !line.reason) line.reason = t.outlier_reason;
  });
  (imps||[]).forEach(i=>{
    const c = by[i.campaign_id]; if(!c) return;
    c.imports.push({id:i.id, kind:i.kind, file:i.source_file, at:i.created_at, asOf:i.data_as_of, rows:i.row_count, replaced:i.rows_replaced});
  });
  Object.values(by).forEach(c=> c.imports.sort((a,b)=> String(b.at||'').localeCompare(String(a.at||''))));
  return Object.values(by).sort((a,b)=> String(a.start||'').localeCompare(String(b.start||'')));
}

function cpHydrateSeed(c){
  const row = JSON.parse(JSON.stringify(c));
  row.tasks = row.status==='draft' ? [] : cpBuildTasks(row, row.prog);
  row.assets = row.tasks.length ? cpBuildAssets(row, row.prog) : [];
  return cpEnsureShape(row);
}

async function cpLoadRemote(){
  const _nav = S.nav;
  try{
    if(S.cpForceDemo || typeof db==='undefined' || !S.me){
      cpUseDemo();
      if(S.route && S.route.view==='campaigns' && !navStale(_nav)) renderCampaigns(cpRouteId(), S.route.tab);
      return;
    }
    const camps = await allRows(()=>db.from('campaigns').select('*').order('start_date'));
    if(navStale(_nav)) return;
    if(!camps || camps.error){
      if(cpTableMissing(camps && camps.error)){
        cpUseDemo();
      } else {
        S.cpLoaded = true; S.cpSource = 'error';
        toast('Could not load campaigns', true);
      }
      if(S.route && S.route.view==='campaigns' && !navStale(_nav)) renderCampaigns(cpRouteId(), S.route.tab);
      return;
    }
    const [phases, lines, targets, imps, aliases, assign, palias] = await Promise.all([
      allRows(()=>db.from('campaign_phases').select('*').order('position')),
      allRows(()=>db.from('brand_lines').select('*, brands(id,name,vertical,country,service_model)').order('id')),
      allRows(()=>db.from('line_targets').select('*').order('target_date')),
      allRows(()=>db.from('imports').select('*').order('created_at', {ascending:false})),
      allRows(()=>db.from('brand_aliases').select('*').order('alias')),
      allRows(()=>db.from('brand_assignments').select('*').order('platform')),
      allRows(()=>db.from('campaign_phase_aliases').select('*'))
    ]);
    if(navStale(_nav)) return;
    const failed = [phases, lines, targets, imps, aliases, assign, palias].find(r=>r && r.error);
    if(failed){
      if(cpTableMissing(failed.error)) cpUseDemo();
      else {
        S.cpLoaded = true; S.cpSource = 'error';
        toast('Could not load campaigns', true);
      }
      if(S.route && S.route.view==='campaigns' && !navStale(_nav)) renderCampaigns(cpRouteId(), S.route.tab);
      return;
    }
    S.cpAliases = (aliases && aliases.data) || [];
    S.cpAssign = (assign && assign.data) || [];
    S.cpPhaseAliases = (palias && palias.data) || [];
    S.campaigns = cpAssemble(camps.data||[], (phases&&phases.data)||[], (lines&&lines.data)||[], (targets&&targets.data)||[], (imps&&imps.data)||[]);
    S.cpDemo = false;
    S.cpSource = 'db';
    S.cpLoaded = true;
    if(S.route && S.route.view==='campaigns' && !navStale(_nav)) renderCampaigns(cpRouteId(), S.route.tab);
  }catch(e){
    S.cpLoaded = true;
    S.cpSource = S.cpSource==='demo' ? 'demo' : 'error';
    if(S.cpSource==='error') toast('Could not load campaigns', true);
    if(S.route && S.route.view==='campaigns' && !navStale(_nav)) renderCampaigns(cpRouteId(), S.route.tab);
  }finally{
    S.cpLoading = false;
  }
}

async function cpInsertCampaign(draft){
  const {data, error} = await db.from('campaigns').insert({
    name:draft.name, status:'draft', playbook:draft.pb, owner_id:draft.ownerId||null,
    start_date:draft.start, end_date:draft.end,
    gmv_target:draft.gmvTarget||0, budget:draft.budget||0,
    countries:draft.countries, channels:draft.channels, mechanics:draft.mech||[]
  }).select().single();
  if(error){ toast(error.message, true); return null; }
  const phases = (draft.phases||cpDefaultPhases(draft.start, draft.end)).map((p,i)=>({
    campaign_id:data.id, kind:p.kind, label:p.label, start_date:p.start, end_date:p.end, position:i
  }));
