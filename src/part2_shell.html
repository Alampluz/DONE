<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "__SUPABASE_URL__";
const SUPABASE_ANON = "__SUPABASE_ANON__";
const ADMIN_API = SUPABASE_URL + "/functions/v1/admin-api";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const STATUSES = [
  {k:'todo', label:'To Do', color:'#8E93A8'},
  {k:'in_progress', label:'In Progress', color:'#2273C9'},
  {k:'review', label:'Review', color:'#B97A08'},
  {k:'blocked', label:'Blocked', color:'#D6455B'},
  {k:'done', label:'Done', color:'#12915E'},
];
const PRIORITIES = [
  {k:'urgent', label:'Urgent', color:'var(--red)', soft:'var(--red-soft)'},
  {k:'high', label:'High', color:'var(--amber)', soft:'var(--amber-soft)'},
  {k:'normal', label:'Normal', color:'var(--blue)', soft:'var(--blue-soft)'},
  {k:'low', label:'Low', color:'var(--ink3)', soft:'var(--gray-soft)'},
];
const PLATFORMS = [
  {k:'TikTok Shop', label:'TikTok Shop', color:'#111827'},
  {k:'Shopee',      label:'Shopee',      color:'#EE4D2D'},
  {k:'Lazada',      label:'Lazada',      color:'#0F146D'},
  {k:'Shopify',     label:'Shopify',     color:'#5E8E3E'},
  {k:'Amazon',      label:'Amazon',      color:'#E28C13'},
  {k:'LINE',        label:'LINE',        color:'#06C755'},
  {k:'Facebook',    label:'Facebook',    color:'#1877F2'},
  {k:'Instagram',   label:'Instagram',   color:'#C13584'},
  {k:'Website',     label:'Website',     color:'#2273C9'},
  {k:'Other',       label:'Other',       color:'#8E93A8'},
];
const REQ_STATUSES = [
  {k:'submitted', label:'Submitted', color:'var(--blue)', soft:'var(--blue-soft)'},
  {k:'in_review', label:'In Review', color:'var(--amber)', soft:'var(--amber-soft)'},
  {k:'approved', label:'Approved', color:'var(--green)', soft:'var(--green-soft)'},
  {k:'rejected', label:'Rejected', color:'var(--red)', soft:'var(--red-soft)'},
  {k:'in_progress', label:'In Progress', color:'var(--purple)', soft:'var(--purple-soft)'},
  {k:'pending_info', label:'Pending Information', color:'var(--amber)', soft:'var(--amber-soft)'},
  {k:'done', label:'Done', color:'var(--green)', soft:'var(--green-soft)'},
  {k:'cancelled', label:'Cancelled', color:'var(--ink3)', soft:'var(--gray-soft)'},
];

/* ================= STATE ================= */
const S = {
  session:null, me:null,
  profiles:[], workspaces:[], projects:[], requestTypes:[],
  route:{view:'home'},
};
const isStaff = ()=> S.me && ['admin','internal','management'].includes(S.me.role);
const isAdmin = ()=> S.me && S.me.role==='admin';
const isMgmt  = ()=> S.me && S.me.role==='management';
const isExternal = ()=> S.me && ['partner','freelancer'].includes(S.me.role);
/* requester = read-only + can raise tickets/tasks and comment */
const isRequester = ()=> S.me && S.me.role==='requester';
const canEdit = ()=> isStaff() && !isRequester();
const canCreate = ()=> isStaff() || isRequester();
/* Per-board edit presets (projects.edit_preset). The database enforces these in the
   tasks / subtasks / checklist policies; these mirrors only decide what the UI offers.
   Admins, management and the board's owners are never restricted. */
const BOARD_PRESETS = [
  {k:'everything', label:'Edit everything',        blurb:'Anyone with access can create, edit and move any task. The default.'},
  {k:'assigned',   label:'Edit assigned tasks only', blurb:'People can create tasks and edit the ones assigned to them or created by them. Everything else is read-only for them.'},
  {k:'view',       label:'View only',              blurb:'People can read and comment. Only owners, admins and management change tasks.'},
];
function boardPreset(pid){ const p=(S.projects||[]).find(x=>x.id===pid); return (p&&p.edit_preset)||'everything'; }
function presetExempt(pid){ return isAdmin() || (S.me&&S.me.role==='management') || (typeof canManageBoard==='function' && canManageBoard(pid)); }
function canEditOnBoard(pid){ if(!canEdit()) return false; return presetExempt(pid) || boardPreset(pid)!=='view'; }
function canEditTask(t){
  if(!t || !canEdit()) return false;
  if(presetExempt(t.project_id)) return true;
  const pr = boardPreset(t.project_id);
  if(pr==='everything') return true;
  if(pr==='assigned') return t.assignee_id===S.me.id || t.created_by===S.me.id;
  return false;
}
/* What a restricted member sees at the top of the board, or '' when unrestricted. */
function presetNoticeHTML(pid){
  if(!S.me || isRequester() || presetExempt(pid)) return '';
  const pr = boardPreset(pid);
  if(pr==='assigned') return `<div class="preset-note">You can edit the tasks assigned to you or created by you on this board. Everything else is read-only.</div>`;
  if(pr==='view')     return `<div class="preset-note">This board is view-only for you — you can open tasks and comment, but not change them.</div>`;
  return '';
}
/* ---- Ownership: board and workspace SETTINGS are owner-or-admin.
   Task create/edit is unchanged — that still runs off canEdit(). These mirror
   can_manage_board() / can_manage_ws() in the database, which is what actually
   enforces it; these only keep the UI from offering a button that would fail. */
const boardOwnerIds = pid => (S.boardOwners||[]).filter(o=>o.project_id===pid).map(o=>o.user_id);
const wsOwnerIds    = wid => (S.wsOwners||[]).filter(o=>o.workspace_id===wid).map(o=>o.user_id);
const ownsBoard = pid => !!(S.me && boardOwnerIds(pid).includes(S.me.id));
const ownsWs    = wid => !!(S.me && wsOwnerIds(wid).includes(S.me.id));
/* A workspace owner runs everything inside their workspace, boards included.
   Deleting the workspace itself is admin-only — it destroys every board and
   task in it. Mirrors can_manage_board() / can_manage_ws() in the database. */
const canManageBoard = pid => {
  if(isAdmin()) return true;
  if(!canEdit()) return false;
  const p = (S.projects||[]).find(x=>x.id===pid);
  return ownsBoard(pid) || !!(p && ownsWs(p.workspace_id));
};
const canManageWs    = wid => isAdmin() || (canEdit() && ownsWs(wid));
const canDeleteWs    = () => isAdmin();
/* Search-and-add: one filter used by both member dialogs. Rows carry
   data-search; role headings carry data-group and fold away when empty. */
const searchBoxHTML = (id, ph) => `<input id="${id}" class="member-search" placeholder="${esc(ph)}" autocomplete="off">`
  + `<div id="${id}-none" class="empty" hidden style="padding:12px 0">Nobody matches that. New accounts are created in Admin → Users.</div>`;
/* Teams are a named group of people, nothing more — they bulk-tick members in
   the pickers. No policy depends on them, so being in a team grants nothing. */
const teamById      = id  => (S.teams||[]).find(t=>t.id===id);
const teamMemberIds = tid => (S.teamMembers||[]).filter(r=>r.team_id===tid).map(r=>r.user_id);
const teamsForUser  = uid => (S.teamMembers||[]).filter(r=>r.user_id===uid)
                              .map(r=>teamById(r.team_id)).filter(Boolean);
/* Team names ride along in the search key, so "search by name, team, or email"
   is one box rather than three. */
const searchKey = p => `${p.full_name||''} ${p.email||''} ${p.job_title||''} ${p.role||''} `
  .concat(teamsForUser(p.id).map(t=>t.name).join(' '))
  .toLowerCase().replace(/"/g,'');
const TEAM_COLORS = ['#0F766E','#3E5C95','#8C5A3B','#5A6B4F','#6E56B8','#A8770E','#7D3C55','#C2434F'];
const teamChip = t => `<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">`

/* Supabase returns at most 1,000 rows per request. allRows() walks a query in
   pages so a big board (the CS inquiry board has 3,000+ rows) loads whole.
   `build` must return a FRESH builder each call, ordered deterministically. */
async function allRows(build, page=1000){
  let out=[], from=0;
  for(;;){
    const q = build();
    if(typeof q.range!=='function') return await q;   // test stubs without paging
    const {data, error} = await q.range(from, from+page-1);
    if(error) return {data:out, error};
    out = out.concat(data||[]);
    if(!data || data.length<page) break;
    from += page;
  }
  return {data:out, error:null};
}

   year end, and campaigns here routinely do. Format is "31 Aug 2026". */
const DATE_FMT = {day:'numeric', month:'short', year:'numeric'};
function fmtDate(d){ if(!d) return ''; const dt=new Date(d); return isNaN(dt)? '' : dt.toLocaleDateString('en-GB', DATE_FMT); }
function fmtDateTime(d){ if(!d) return ''; const dt=new Date(d); return isNaN(dt)? '' : dt.toLocaleString('en-GB',{...DATE_FMT, hour:'2-digit', minute:'2-digit'}); }
function timeAgo(d){
  if(!d) return '';
  const s = Math.max(0, (Date.now() - new Date(d).getTime())/1000);
  if(s < 60) return 'just now';
  const m = Math.floor(s/60);   if(m < 60) return m+'m ago';
  const h = Math.floor(m/60);   if(h < 24) return h+'h ago';
  const dd = Math.floor(h/24);  if(dd < 7) return dd+'d ago';

}

/* ---- CSV (RFC 4180) ---- */
function csvCell(v){
  const s = v==null? '' : String(v);
  return /[",\n\r]|^\s|\s$/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(filename, rows){
  // BOM so Excel opens Thai text as UTF-8
  const csv = '\uFEFF' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function downloadXLSX(filename, rows){
  if(typeof XLSX === 'undefined') return downloadCSV(filename.replace(/\.xlsx$/i,'.csv'), rows);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Export');

}

function fileSize(b){
  if(b==null) return '';

/* Uploads a list of File objects and returns the attachment rows that stuck. */
async function uploadFiles(entity_type, entity_id, files){
  const list = [...(files||[])];
  const made = [];
  for(const f of list){
    if(f.size > MAX_UPLOAD){ toast(`${f.name} is ${fileSize(f.size)} — the limit is 25 MB`, true); continue; }
    const path = entity_type + '/' + entity_id + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,7)
      + '_' + (f.name||'file').replace(/[^\w.\-]+/g,'_');
    const {error} = await db.storage.from('attachments').upload(path, f, {contentType:f.type||undefined});
    if(error){ toast(`Couldn't upload ${f.name}: ${error.message}`, true); continue; }
    const {data, error:dbErr} = await db.from('attachments')
      .insert({entity_type, entity_id, file_name:f.name||'file', storage_path:path, size_bytes:f.size, uploaded_by:S.me.id})
      .select().single();
    if(dbErr){ toast(`Saved the file but couldn't attach it: ${dbErr.message}`, true); continue; }
    made.push(data);
  }
  return made;
}

async function uploadAttachments(entity_type, entity_id, fileInput){
  const made = await uploadFiles(entity_type, entity_id, fileInput?.files);

  return made.length;

function attLink(a, opts={}){
  const url = attUrl(a.storage_path);
  const rm = opts.canRemove
    ? `<button class="att-x" title="Remove" onclick="event.preventDefault();event.stopPropagation();removeAttachment('${a.id}','${a.storage_path.replace(/'/g,"\\'")}')">✕</button>` : '';
  if(isImageName(a.file_name)){
    return `<span class="att att-img" data-aid="${a.id}">
      <a href="${url}" target="_blank" rel="noopener" title="${esc(a.file_name)}"><img src="${url}" alt="${esc(a.file_name)}" loading="lazy"></a>${rm}</span>`;
  }
  return `<span class="att att-file" data-aid="${a.id}">
    <a href="${url}" target="_blank" rel="noopener" title="${esc(a.file_name)}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
      <span class="att-n">${esc(a.file_name)}</span><span class="att-s">${fileSize(a.size_bytes)}</span></a>${rm}</span>`;
}
function attListHTML(rows, canRemove){
  if(!rows || !rows.length) return '<span class="att-none">No files attached</span>';

async function removeAttachment(id, path){
  const box = document.querySelector(`[data-aid="${id}"]`);
  const {error} = await db.from('attachments').delete().eq('id', id);
  if(error) return toast(error.message, true);

/* A drop zone that uploads the moment a file arrives — no second button to press. */
function attachZoneHTML(id){
  return `<div class="att-drop" id="${id}">
    <input type="file" multiple hidden>
    <span class="att-cta">Drop files here, or <b>browse</b></span>
    <span class="att-busy hidden">Uploading…</span>
  </div>`;

function wireAttachZone(root, zoneId, entity_type, entity_id, listEl, onDone){
  const z = root.querySelector('#'+zoneId); if(!z) return;
  const input = z.querySelector('input[type=file]');
  const busy = z.querySelector('.att-busy'), cta = z.querySelector('.att-cta');
  const go = async (files)=>{
    if(!files || !files.length) return;
    busy.classList.remove('hidden'); cta.classList.add('hidden'); z.classList.add('busy');
    const made = await uploadFiles(entity_type, entity_id, files);
    busy.classList.add('hidden'); cta.classList.remove('hidden'); z.classList.remove('busy');
    input.value = '';
    if(!made.length) return;
    if(listEl){
      if(listEl.querySelector('.att-none')) listEl.innerHTML = '<div class="att-list"></div>';
      const list = listEl.querySelector('.att-list') || listEl;
      list.insertAdjacentHTML('beforeend', made.map(a=>attLink(a,{canRemove:true})).join(''));
    }
    toast(made.length===1? `${made[0].file_name} attached` : `${made.length} files attached`);
    onDone?.(made);
  };
  z.onclick = ()=> input.click();
  input.onchange = ()=> go(input.files);
  z.ondragover = e=>{ e.preventDefault(); z.classList.add('over'); };
  z.ondragleave = ()=> z.classList.remove('over');
  z.ondrop = e=>{ e.preventDefault(); z.classList.remove('over'); go(e.dataTransfer.files); };
}

/* People you can tag: active colleagues, minus yourself. */
function mentionables(){
  return (S.profiles||[]).filter(p=>p.active && p.id!==S.me.id);

/* Attach @-autocomplete to a text input. Chosen people are remembered on the
   element so a name typed by hand can't accidentally ping the wrong person. */
function wireMentions(input){
  if(!input || input._mentionsWired) return;
  input._mentionsWired = true;
  input._picked = new Map();           // full_name -> id
  let menu = null, anchorPos = -1;
  const close = ()=>{ menu?.remove(); menu=null; anchorPos=-1; };
  const pick = (p)=>{
    const v = input.value, before = v.slice(0, anchorPos), after = v.slice(input.selectionStart);
    input.value = before + '@' + p.full_name + ' ' + after;
    input._picked.set(p.full_name, p.id);
    const caret = (before + '@' + p.full_name + ' ').length;
    input.focus(); input.setSelectionRange(caret, caret);
    close();
  };
  const render = (q)=>{
    const list = mentionables().filter(p=>p.full_name.toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q)).slice(0,6);
    if(!list.length) return close();
    if(!menu){ menu = document.createElement('div'); menu.className='mention-menu'; document.body.appendChild(menu); }
    menu.innerHTML = list.map((p,i)=>`<div class="mopt${i===0?' on':''}" data-id="${p.id}">${avatar(p,true)}<span><b>${esc(p.full_name)}</b></span></div>`).join('');
    menu.querySelectorAll('.mopt').forEach(o=> o.onmousedown = e=>{ e.preventDefault(); pick(list.find(p=>p.id===o.dataset.id)); });
    const r = input.getBoundingClientRect(), h = menu.getBoundingClientRect().height;
    menu.style.left = r.left+'px';
    menu.style.top = (r.top - h - 6 > 8 ? r.top - h - 6 : r.bottom + 6) + 'px';
    menu.style.width = Math.max(240, Math.min(r.width, 340)) + 'px';
  };
  input.addEventListener('input', ()=>{
    const upto = input.value.slice(0, input.selectionStart);
    const mth = upto.match(/(?:^|\s)@([^@]{0,30})$/);
    if(!mth) return close();
    anchorPos = input.selectionStart - mth[1].length - 1;
    render(mth[1].toLowerCase());
  });
  input.addEventListener('keydown', e=>{
    if(!menu) return;
    const opts = [...menu.querySelectorAll('.mopt')];
    let i = opts.findIndex(o=>o.classList.contains('on'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      opts[i]?.classList.remove('on');
      i = e.key==='ArrowDown' ? (i+1)%opts.length : (i-1+opts.length)%opts.length;
      opts[i].classList.add('on');
    } else if(e.key==='Enter'||e.key==='Tab'){
      e.preventDefault();
      const id = opts[i<0?0:i]?.dataset.id;
      pick(mentionables().find(p=>p.id===id));
    } else if(e.key==='Escape'){ close(); }
  });
  input.addEventListener('blur', ()=> setTimeout(close, 120));
}
/* Which of the picked people are still named in the final text. */
function extractMentions(input){
  const text = input.value, ids = [];
  (input._picked||new Map()).forEach((id,name)=>{ if(text.includes('@'+name) && !ids.includes(id)) ids.push(id); });
  return ids;
}
function renderMentionText(body, mentions){
  const names = (mentions||[]).map(id=>prof(id)?.full_name).filter(Boolean);
  let out = esc(body);

  return out;
}

function commentComposerHTML(prefix){
  return `<div class="cmp">
    <div class="cmp-row">
      <textarea id="${prefix}-comment" rows="3" placeholder="Write a comment… type @ to tag someone (Shift+Enter for a new line)"></textarea>

/* Holds the File objects picked/pasted/dropped for a comment not yet sent. */
function wireComposer(root, prefix){
  const input = root.querySelector('#'+prefix+'-comment');
  const clip  = root.querySelector('#'+prefix+'-clip');
  const picker= root.querySelector('#'+prefix+'-files');
  const tray  = root.querySelector('#'+prefix+'-staged');
  input._staged = [];
  const draw = ()=>{
    tray.classList.toggle('hidden', !input._staged.length);
    tray.innerHTML = input._staged.map((f,i)=>`<span class="stg">${
      isImageName(f.name)? `<img src="${URL.createObjectURL(f)}" alt="">` : '<span class="stg-ic">▢</span>'
    }<span class="stg-n">${esc(f.name)}</span><span class="stg-s">${fileSize(f.size)}</span>
      <button class="stg-x" data-i="${i}" title="Remove">✕</button></span>`).join('');
    tray.querySelectorAll('.stg-x').forEach(b=> b.onclick = ()=>{ input._staged.splice(+b.dataset.i,1); draw(); });
  };
  const add = files=>{ [...(files||[])].forEach(f=>input._staged.push(f)); draw(); };
  clip.onclick = ()=> picker.click();
  picker.onchange = ()=>{ add(picker.files); picker.value=''; };
  // paste a screenshot straight into the box
  input.addEventListener('paste', e=>{
    const files = [...(e.clipboardData?.files||[])];
    if(files.length){ e.preventDefault(); add(files); }
  });
  const zone = root.querySelector('.cmp');
  zone.ondragover = e=>{ e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = ()=> zone.classList.remove('over');
  zone.ondrop = e=>{ e.preventDefault(); zone.classList.remove('over'); add(e.dataTransfer.files); };
  input._redrawStaged = draw;
  return input;
}
/* Post a comment and ping everyone tagged in it. */
async function postComment(entityType, entityId, entityTitle, input, box){
  const staged = input._staged || [];
  const body = input.value.trim();
  if(!body && !staged.length) return null;
  const mentions = extractMentions(input);
  const {data, error} = await db.from('comments')
    .insert({entity_type:entityType, entity_id:entityId, author_id:S.me.id, body, mentions})
    .select().single();
  if(error){ toast(error.message, true); return null; }
  if(staged.length){
    const made = await uploadFiles('comment', data.id, staged);
    // If the files were the whole point and none of them landed, don't leave an
    // empty comment sitting in the thread — take it back out.
    if(!made.length && !body){
      await db.from('comments').delete().eq('id', data.id);
      return null;
    }
    data.atts = made;
    input._staged = []; input._redrawStaged?.();
  }
  if(mentions.length){
    const rows = mentions.map(uid=>({
      user_id:uid, actor_id:S.me.id, kind:'mention',
      entity_type:entityType, entity_id:entityId,
      title:entityTitle, body: (body || `sent ${staged.length} file${staged.length>1?'s':''}`).slice(0,180),
    }));
    const {error:nErr} = await db.from('notifications').insert(rows);
    if(nErr) toast('Comment saved, but the notification failed: '+nErr.message, true);
    else toast(mentions.length===1 ? `${prof(mentions[0])?.full_name||'They'} was notified` : `${mentions.length} people notified`);
  }
  if(box){
    if(box.firstElementChild && !box.firstElementChild.classList.contains('comment')) box.innerHTML='';
    box.insertAdjacentHTML('beforeend', commentRow(data));
    box.lastElementChild?.scrollIntoView?.({block:'nearest'});
  }
  input.value=''; input._picked?.clear();
  return data;
}

let notifPoll = null;
async function refreshNotifs(){
  if(!S.me) return;

  S._notifs = data||[];

function startNotifPolling(){

}
function notifPanelHTML(){
  const list = S._notifs||[];
  const unread = list.filter(n=>!n.read_at).length;
  return `<div class="np-head"><span>Notifications${unread? ` · ${unread}`:''}</span><span style="display:flex;gap:2px">${unread? `<button onclick="markAllNotifsRead()">Mark all read</button>`:''}<button onclick="emailSettingsModal()" title="Which of these also reach your inbox">Email settings</button></span></div>
    <div class="np-body">${list.length? list.map(n=>{
      const who = prof(n.actor_id);
      return `<div class="np-item ${n.read_at?'':'unread'}" onclick="openNotif('${n.id}')">
        ${avatar(who,true)}
        <div class="np-txt"><div>${notifLine(n, who)}</div>
          <div class="np-body-txt">${esc(n.body||'')}</div>
          <div class="np-when">${timeAgo(n.created_at)}</div></div>
      </div>`;
    }).join('') : '<div class="np-empty">Nothing yet.</div>'}</div>`;
}
function notifLine(n, who){
  const name = `<b>${esc(who?.full_name||'Someone')}</b>`;
  const t = n.title? `<b>${esc(n.title)}</b>` : 'something';
  switch(n.kind){
    case 'assigned':    return `${name} assigned you ${t}`;
    case 'review':      return `${t} is ready for review`;
    case 'request':     return `New ticket: ${t}`;
    case 'sla_warning': return `${t} is close to its SLA`;
    case 'sla_breach':  return `${t} has breached its SLA`;
    case 'overdue':     return `${t} is overdue`;
    case 'automation':  return n.body? `${t} — ${esc(n.body)}` : `An automation flagged ${t}`;
    case 'approval':    return `${name} asked you to sign off on ${t}`;
    case 'approval_decided': {
      // body = 'approved' or 'rejected — note'
      const ok = (n.body||'').startsWith('approved');
      const note = (n.body||'').includes(' — ')? n.body.slice(n.body.indexOf(' — ')+3) : '';
      return `${name} ${ok?'approved':'declined'} your sign-off — ${t}${note? ` <span style="color:var(--ink3)">· ${esc(note)}</span>`:''}`;
    }
    default:            return `${name} mentioned you${n.title? ` in ${t}`:''}`;
  }
}

async function openNotif(id){
  const n = (S._notifs||[]).find(x=>x.id===id); if(!n) return;
  if(!n.read_at){ await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',id); }
  $('#notif-panel')?.remove();
  await refreshNotifs();
  if(n.entity_type==='task') openTask(n.entity_id);
  else if(n.entity_type==='request') openRequest(n.entity_id);
}

/* ================= PUBLIC FORM (no login) ================= */
function pfTitleLabel(def){ return def.title_label || (/creative|campaign|artwork/i.test(def.name||'')? 'Campaign Name' : 'Subject'); }
async function renderPublicForm(token){
  $('#login-screen').classList.add('hidden');
  $('#app').classList.add('hidden');
  const mount = el('<div style="position:fixed;inset:0;overflow-y:auto;background:radial-gradient(1200px 700px at 18% -10%,#14403A 0%,#101114 58%);padding:5vh 16px;z-index:150"><div id="pf-card" style="max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:34px 34px 28px;box-shadow:0 30px 80px rgba(0,0,0,.45)"><div style="color:#9DA1A7">Loading form…</div></div></div>');
  document.body.appendChild(mount);
  const card = mount.querySelector('#pf-card');
  try{
    const res = await fetch(ADMIN_API + '/form-def?token=' + encodeURIComponent(token), {headers:{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}});
    const def = await res.json();
    if(!res.ok) throw new Error(def.error||'Form not found');
    S.brandsList = (def.brands||[]).map(n=>({name:n, active:true}));
    card.innerHTML = `
      <div style="font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)">${esc(def.company)}</div>
      <h1 style="font-family:'Fraunces',Georgia,serif;font-size:24px;font-weight:600;margin:6px 0 4px">${esc(def.name)}</h1>
      <p style="color:var(--ink2);font-size:13.5px">${esc(def.description||'')}</p>
      <label>Your name <span class="req">*</span></label><input id="pf-name">
      <label>Your email <span class="req">*</span></label><input id="pf-email" type="email">
      <label>${esc(pfTitleLabel(def))}${pfTitleLabel(def)!=='Subject'?' <span class="req">*</span>':''}</label><input id="pf-title" placeholder="${esc(def.title_hint||(pfTitleLabel(def)!=='Subject'?'BRAND x PLATFORM - CAMPAIGN NAME - PERIOD':'Short summary (optional)'))}">
      ${(def.fields||[]).map(fieldInput).join('')}
      <button class="btn btn-primary" id="pf-send" style="width:100%;justify-content:center;margin-top:22px;padding:12px">Submit request</button>
      <p style="margin-top:14px;font-size:11.5px;color:var(--ink3);text-align:center">Response SLA: ${def.sla_hours} hours · Powered by DONE</p>`;
    card.querySelector('#pf-send').onclick = async ()=>{
      const guest_name=card.querySelector('#pf-name').value.trim(), guest_email=card.querySelector('#pf-email').value.trim();
      if(!guest_name||!guest_email) return toast('Please fill your name and email', true);
      const tl = pfTitleLabel(def);
      if(tl!=='Subject' && !card.querySelector('#pf-title').value.trim()) return toast('"'+tl+'" is required', true);
      const values={};
      for(const f of (def.fields||[])){
        const v = readField(card, f);
        if(f.required && !v) return toast('"'+f.label+'" is required', true);
        values[f.key]=v;
      }
      const btn=card.querySelector('#pf-send'); btn.disabled=true; btn.textContent='Submitting…';
      try{
        const r2 = await fetch(ADMIN_API+'/public-submit', {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON}, body:JSON.stringify({token, guest_name, guest_email, title:card.querySelector('#pf-title').value, values})});
        const out = await r2.json();
        if(!r2.ok) throw new Error(out.error||'Failed');
        card.innerHTML = '<div style="text-align:center;padding:30px 0"><div style="font-family:\'Fraunces\',Georgia,serif;font-size:26px;font-weight:600">Request received</div><p style="color:var(--ink2);margin-top:12px;line-height:1.6">Your ticket number is <b>WO-'+out.ticket_no+'</b>.<br>The team will get back to you within '+def.sla_hours+' hours.</p></div>';
      }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Submit request'; }
    };
  }catch(e){ card.innerHTML = '<div style="text-align:center;color:var(--ink2);padding:20px 0">'+esc(e.message)+'</div>'; }
}
</script>
