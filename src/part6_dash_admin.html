<script>
/* ================= DASHBOARD ================= */
/* One engine, two homes: the personal Dashboard, and each workspace's Report tab.
   `wsSel` (a workspace id, or null for everything) scopes every widget. */
async function buildDashCtx(wsSel){
  const [tks, reqs, apprs] = await Promise.all([
    allRows(()=>db.from('tasks').select('id,project_id,title,status,priority,assignee_id,due_date,completed_at,created_at').order('id')),
    db.from('requests').select('id,ticket_no,title,status,sla_due_at,completed_at,created_at,request_type_id,decided_at,submitted_by,assigned_to'),
    db.from('approvals').select('id,status,request_id'),
  ]);
  let tasks=tks.data||[], requests=reqs.data||[], approvals=apprs.data||[];
  const scopeProjects = wsSel ? S.projects.filter(p=>p.workspace_id===wsSel) : S.projects;
  if(wsSel){
    const pidSet = new Set(scopeProjects.map(p=>p.id));
    tasks = tasks.filter(t=>pidSet.has(t.project_id));
    const rtSet = new Set(S.requestTypes.filter(rt=>rt.default_workspace_id===wsSel).map(rt=>rt.id));
    requests = requests.filter(r=>rtSet.has(r.request_type_id));
    const reqSet = new Set(requests.map(r=>r.id));
    approvals = approvals.filter(a=>a.request_id && reqSet.has(a.request_id));
  }
  const open = tasks.filter(t=>t.status!=='done');
  const overdue = open.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const dueWeek = open.filter(t=>t.due_date && daysDiff(t.due_date)>=0 && daysDiff(t.due_date)<=7);
  const doneTasks = tasks.filter(t=>t.status==='done');
  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;
  const openReqs = requests.filter(r=>['submitted','in_review','approved','in_progress'].includes(r.status));
  const slaBreach = openReqs.filter(r=>r.sla_due_at && new Date(r.sla_due_at)<Date.now());
  const pendingAppr = approvals.filter(a=>a.status==='pending').length;
  S._dashCtx = {tasks, requests, open, overdue, dueWeek, doneTasks, openReqs, slaBreach, scopeProjects, wsSel};
  return {open, overdue, dueWeek, onTimePct, openReqs, slaBreach, pendingAppr};
}
function statRowHTML(k){
  return `<div class="stat-row">
      <div class="stat"><div class="n accent">${k.open.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n ${k.overdue.length?'red':''}">${k.overdue.length}</div><div class="l">Overdue</div></div>
      <div class="stat"><div class="n amber">${k.dueWeek.length}</div><div class="l">Due within 7 days</div></div>
      <div class="stat"><div class="n ${k.onTimePct===null?'':k.onTimePct>=80?'green':k.onTimePct>=50?'amber':'red'}">${k.onTimePct===null?'—':k.onTimePct+'%'}</div><div class="l">On-time completion</div></div>
      <div class="stat"><div class="n">${k.openReqs.length}</div><div class="l">Open requests</div></div>
      <div class="stat"><div class="n ${k.slaBreach.length?'red':'green'}">${k.slaBreach.length}</div><div class="l">SLA breached</div></div>
      <div class="stat"><div class="n ${k.pendingAppr?'amber':''}">${k.pendingAppr}</div><div class="l">Pending approvals</div></div>
    </div>`;
}
/* Which widget set is on screen: personal dashboard, a workspace report, or one board's report. */
let widgetScope = null;        // workspace id
let widgetProjScope = null;    // board (project) id
const widgetsEditable = ()=> (widgetScope||widgetProjScope) ? canEdit() : isStaff();
function reRenderWidgets(){
  if(widgetProjScope) renderBoardReport(widgetProjScope);
  else if(widgetScope) renderWorkspaceReport(widgetScope);
  else renderDashboard();
}

/* ================= BOARD REPORT ================= */
/* One board's numbers and widgets — shared with everyone who can open the board. */
async function renderBoardReport(pid){
  const p = projById(pid); if(!p){ location.hash='#/home'; return; }
  widgetProjScope = pid; widgetScope = null;
  const C=$('#board-body') || $('#content');
  C.innerHTML='<div class="empty">Loading report…</div>';
  const [{data:reqs},{data:wdg}] = await Promise.all([
    db.from('requests').select('id,ticket_no,title,status,sla_due_at,completed_at,created_at,request_type_id,decided_at,submitted_by,assigned_to').eq('project_id',pid),
    db.from('dashboard_widgets').select('*').eq('project_id',pid).order('position'),
  ]);
  const tasks = (S._tasksAll||[]).filter(t=>!t.archived_at);
  const open = tasks.filter(t=>t.status!=='done');
  const overdue = open.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const dueWeek = open.filter(t=>t.due_date && daysDiff(t.due_date)>=0 && daysDiff(t.due_date)<=7);
  const doneTasks = tasks.filter(t=>t.status==='done');
  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;
  // Throughput: what came in and what got finished this week, and how long finishing takes.
  const wk = daysAgoISO(7), mo = daysAgoISO(30);
  const done7 = doneTasks.filter(t=>(t.completed_at||'')>=wk), new7 = tasks.filter(t=>(t.created_at||'')>=wk);
  const solveDays = doneTasks.filter(t=>t.completed_at && (t.completed_at>=mo)).map(t=>(new Date(t.completed_at)-new Date(t.created_at))/86400000).filter(d=>d>=0).sort((a,b)=>a-b);
  const medianDays = solveDays.length? Math.round(solveDays[Math.floor(solveDays.length/2)]*10)/10 : null;
  const requests = reqs||[];
  const openReqs = requests.filter(r=>['submitted','in_review','approved','in_progress'].includes(r.status));
  const slaBreach = openReqs.filter(r=>r.sla_due_at && new Date(r.sla_due_at)<Date.now());
  S._dashCtx = {tasks, requests, open, overdue, dueWeek, doneTasks, done7, new7, openReqs, slaBreach,
                scopeProjects:[p], wsSel:p.workspace_id, groups:S._groups||[]};
  S._widgets = wdg||[];
  if(!S._widgets.length && canEdit() && !(S._seededBoardReports?.[pid])){
    (S._seededBoardReports = S._seededBoardReports||{})[pid] = true;
    const defaults = [
      {wtype:'donut', title:'Tasks by status',    config:{entity:'tasks', groupBy:'status'},   position:0},
      {wtype:'bar',   title:'Open tasks by group',config:{entity:'tasks', groupBy:'group'},    position:1},
      {wtype:'bar',   title:'Workload by person', config:{entity:'tasks', groupBy:'assignee'}, position:2},
      {wtype:'list',  title:'Overdue',            config:{entity:'tasks', show:'overdue'},     position:3},
    ].map(x=>({...x, project_id:pid, user_id:S.me.id}));
    const {data:seeded, error} = await db.from('dashboard_widgets').insert(defaults).select();
    if(!error) S._widgets = seeded||[];
  }
  S._reportName = p.name + ' report';
  S._reportStats = [
    ['Open tasks', open.length], ['Overdue', overdue.length], ['Due within 7 days', dueWeek.length],
    ['On-time completion', onTimePct===null? '—' : onTimePct+'%'], ['Done', doneTasks.length],
    ['Done this week', done7.length], ['New this week', new7.length], ['Median days to finish (30d)', medianDays===null? '—' : medianDays],
    ...(requests.length? [['SLA breached', slaBreach.length]] : []),
  ];
  C.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="n accent">${open.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n ${overdue.length?'red':''}">${overdue.length}</div><div class="l">Overdue</div></div>
      <div class="stat"><div class="n amber">${dueWeek.length}</div><div class="l">Due within 7 days</div></div>
      <div class="stat"><div class="n ${onTimePct===null?'':onTimePct>=80?'green':onTimePct>=50?'amber':'red'}">${onTimePct===null?'—':onTimePct+'%'}</div><div class="l">On-time completion</div></div>
      <div class="stat"><div class="n">${doneTasks.length}</div><div class="l">Done</div></div>
      <div class="stat"><div class="n green">${done7.length}</div><div class="l">Done this week</div><div class="sub">${new7.length} new this week</div></div>
      <div class="stat"><div class="n">${medianDays===null?'—':medianDays}</div><div class="l">Median days to finish</div><div class="sub">last 30 days${solveDays.length?` · ${solveDays.length} tasks`:''}</div></div>
      ${requests.length? `<div class="stat"><div class="n ${slaBreach.length?'red':'green'}">${slaBreach.length}</div><div class="l">SLA breached</div></div>`:''}
    </div>
    <div class="section-title" style="margin-top:22px;display:flex;align-items:center;gap:12px">Widgets
      <span style="flex:1"></span>${isStaff()? `<button class="btn btn-ghost btn-sm" onclick="exportReportCSV()">Export report</button>`:''}${canEdit()? `<button class="btn btn-primary btn-sm" onclick="widgetModal(null,null,'${pid}')">＋ Add widget</button>`:''}</div>
    <div class="wgrid" id="wgrid">${(S._widgets||[]).map(x=>widgetCard(x)).join('')
      || `<div class="card empty" style="grid-column:1/-1">${canEdit()? 'No widgets yet — add the first one.':'No widgets on this report yet.'}</div>`}</div>`;
}

let dashWs = 'all';
async function renderDashboard(){
  if(!isStaff() && !isRequester()){ location.hash='#/home'; return; }
  widgetScope = null; widgetProjScope = null;
  setTopbar('Dashboard', `<select id="dash-ws" style="width:auto;min-width:200px" onchange="dashWs=this.value;renderDashboard()">
    <option value="all">All workspaces</option>
    ${S.workspaces.map(w=>`<option value="${w.id}" ${dashWs===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>`);
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const wsSel = dashWs !== 'all' ? dashWs : null;
  const [k, wdg] = await Promise.all([
    buildDashCtx(wsSel),
    db.from('dashboard_widgets').select('*').eq('user_id', S.me.id).is('workspace_id', null).order('position'),
  ]);
  S._widgets = wdg.data||[];
  if(!S._widgets.length && !S._widgetsSeeded && isStaff()){
    S._widgetsSeeded = true;
    const defaults = [
      {wtype:'bar',   title:'Open tasks by workspace', config:{entity:'tasks', groupBy:'workspace'}, position:0},
      {wtype:'donut', title:'Tasks by status',         config:{entity:'tasks', groupBy:'status'},    position:1},
      {wtype:'bar',   title:'Open workload by person', config:{entity:'tasks', groupBy:'assignee'},  position:2},
      {wtype:'list',  title:'My tasks due soon',       config:{entity:'tasks', show:'due7', mine:true}, position:3},
    ].map(w=>({...w, user_id:S.me.id}));
    const {data:seeded} = await db.from('dashboard_widgets').insert(defaults).select();
    S._widgets = seeded||[];
  }
  const wsObj = wsSel ? wsById(wsSel) : null;
  C.innerHTML = `
    <div class="page-head"><div><h1>${wsObj? esc(wsObj.name):'Operations Dashboard'}</h1><div class="sub">${wsObj? 'Workspace view — tasks, requests and approvals routed here':'Live view across all workspaces'}</div></div></div>
    ${statRowHTML(k)}
    <div class="section-title" style="margin-top:22px;display:flex;align-items:center;gap:12px">Widgets
      <span style="flex:1"></span>${isStaff()? `<button class="btn btn-primary btn-sm" onclick="widgetModal()">＋ Add widget</button>`:''}</div>
    <div class="wgrid" id="wgrid">${(S._widgets||[]).map(w=>widgetCard(w)).join('') || `<div class="card empty" style="grid-column:1/-1">No widgets yet — add your first one.</div>`}</div>
    ${k.overdue.length? `<div class="section-title" style="margin-top:22px">Overdue tasks <span class="count">${k.overdue.length}</span></div>
      <div class="card">${taskTable(k.overdue)}</div>`:''}`;
}

/* ================= WORKSPACE REPORT ================= */
/* A shared report per workspace — everyone on the team sees the same widgets. */
async function renderWorkspaceReport(wsId){
  const w = wsById(wsId); if(!w){ location.hash='#/home'; return; }
  widgetScope = wsId; widgetProjScope = null;
  const C=$('#content'); C.innerHTML='<div class="empty">Loading report…</div>';
  const [k, wdg] = await Promise.all([
    buildDashCtx(wsId),
    db.from('dashboard_widgets').select('*').eq('workspace_id', wsId).order('position'),
  ]);
  S._widgets = wdg.data||[];
  if(!S._widgets.length && canEdit() && !S._seededReports?.[wsId]){
    (S._seededReports = S._seededReports||{})[wsId] = true;
    const defaults = [
      {wtype:'donut', title:'Tasks by status',        config:{entity:'tasks', groupBy:'status'},   position:0},
      {wtype:'bar',   title:'Workload by person',     config:{entity:'tasks', groupBy:'assignee'}, position:1},
      {wtype:'bar',   title:'Open tasks by board',    config:{entity:'tasks', groupBy:'project'},  position:2},
      {wtype:'list',  title:'Overdue',                config:{entity:'tasks', show:'overdue'},     position:3},
    ].map(x=>({...x, workspace_id:wsId, user_id:S.me.id}));
    const {data:seeded, error} = await db.from('dashboard_widgets').insert(defaults).select();
    if(!error) S._widgets = seeded||[];
  }
  S._reportName = w.name + ' report';
  S._reportStats = [
    ['Open tasks', k.open.length], ['Overdue', k.overdue.length], ['Due within 7 days', k.dueWeek.length],
    ['On-time completion', k.onTimePct===null? '—' : k.onTimePct+'%'], ['Open requests', k.openReqs.length],
    ['SLA breached', k.slaBreach.length], ['Pending approvals', k.pendingAppr],
  ];
  C.innerHTML = `
    ${wsTabsHTML(wsId,'report')}
    <div class="page-head"><div><h1>${esc(w.name)} — Report</h1>
      <div class="sub">Shared with everyone in this workspace${canEdit()? ' · your changes are visible to the whole team':''}</div></div></div>
    ${statRowHTML(k)}
    <div class="section-title" style="margin-top:22px;display:flex;align-items:center;gap:12px">Widgets
      <span style="flex:1"></span>${isStaff()? `<button class="btn btn-ghost btn-sm" onclick="exportReportCSV()">Export report</button>`:''}${canEdit()? `<button class="btn btn-primary btn-sm" onclick="widgetModal(null,'${wsId}')">＋ Add widget</button>`:''}</div>
    <div class="wgrid" id="wgrid">${(S._widgets||[]).map(x=>widgetCard(x)).join('')
      || `<div class="card empty" style="grid-column:1/-1">${canEdit()? 'No widgets yet — add the first one.':'No widgets on this report yet.'}</div>`}</div>`;
}

/* ================= DASHBOARD WIDGETS ================= */
const W_SHOWS_TASKS = [['open','Open'],['overdue','Overdue'],['due7','Due within 7 days'],['done','Done'],['done7','Done this week'],['new7','New this week'],['blocked','Blocked'],['review','In review'],['all','All']];
const W_SHOWS_REQS  = [['open','Open'],['sla','SLA breached'],['all','All']];
const W_GROUPS_TASKS= [['status','Status'],['priority','Priority'],['workspace','Workspace'],['project','Board'],['assignee','Assignee'],['group','Group']];
const W_GROUPS_REQS = [['status','Status'],['type','Request type']];

function widgetTaskRows(cfg){
  const c=S._dashCtx;
  let rows = cfg.entity==='requests'? c.requests : c.tasks;
  if(cfg.entity==='requests'){
    if(cfg.show==='open') rows=c.openReqs;
    else if(cfg.show==='sla') rows=c.slaBreach;
  } else {
    if(cfg.show==='open') rows=c.open;
    else if(cfg.show==='overdue') rows=c.overdue;
    else if(cfg.show==='due7') rows=c.dueWeek;
    else if(cfg.show==='done') rows=c.doneTasks;
    else if(cfg.show==='done7') rows=c.done7 || c.doneTasks.filter(t=>(t.completed_at||'')>=daysAgoISO(7));
    else if(cfg.show==='new7') rows=c.new7 || c.tasks.filter(t=>(t.created_at||'')>=daysAgoISO(7));
    else if(cfg.show==='blocked') rows=rows.filter(t=>t.status==='blocked');
    else if(cfg.show==='review') rows=rows.filter(t=>t.status==='review');
    if(cfg.mine) rows=rows.filter(t=>t.assignee_id===S.me.id);
  }
  return rows;
}
function widgetGroups(cfg){
  const c=S._dashCtx;
  if(cfg.entity==='requests'){
    if(cfg.groupBy==='type') return S.requestTypes.map(rt=>({label:rt.name, color:'#0F766E', n:c.requests.filter(r=>r.request_type_id===rt.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
    return REQ_STATUSES.map(s=>({label:s.label, color:s.color.startsWith('var')? '#0F766E':s.color, n:c.requests.filter(r=>r.status===s.k).length})).filter(x=>x.n>0);
  }
  if(cfg.groupBy==='priority') return PRIORITIES.map(p=>({label:p.label, color:p.color.startsWith('var')? '#8E93A8':p.color, n:c.open.filter(t=>t.priority===p.k).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='workspace') return (c.wsSel? c.scopeProjects.map(p=>({label:p.name,color:p.color,n:c.open.filter(t=>t.project_id===p.id).length}))
    : S.workspaces.map(w=>{ const pids=new Set(S.projects.filter(p=>p.workspace_id===w.id).map(p=>p.id)); return {label:w.name,color:w.color,n:c.open.filter(t=>pids.has(t.project_id)).length}; })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(cfg.groupBy==='project') return c.scopeProjects.map(p=>({label:p.name, color:p.color, n:c.open.filter(t=>t.project_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  if(cfg.groupBy==='group') return (c.groups||[]).map(g=>({label:g.name, color:g.color, n:c.open.filter(t=>t.group_id===g.id).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='assignee') return S.profiles.map(p=>({label:p.full_name, color:p.avatar_color||'#0F766E', n:c.open.filter(t=>t.assignee_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,8);
  return STATUSES.map(s=>({label:s.label, color:s.color, n:c.tasks.filter(t=>t.status===s.k).length})).filter(x=>x.n>0);
}
function donutSVG(rows){
  const total = rows.reduce((a,r)=>a+r.n,0);
  if(!total) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const C1=2*Math.PI*44; let acc=0;
  const segs = rows.map(r=>{
    const frac=r.n/total, off=acc; acc+=frac;
    return `<circle r="44" cx="60" cy="60" fill="none" stroke="${r.color}" stroke-width="16"
      stroke-dasharray="${(frac*C1).toFixed(2)} ${(C1-frac*C1).toFixed(2)}" stroke-dashoffset="${(-off*C1+C1/4).toFixed(2)}"></circle>`;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="140" height="140">${segs}
      <text x="60" y="58" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${total}</text>
      <text x="60" y="76" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink3);letter-spacing:.6px">TOTAL</text></svg>
    <div class="donut-legend">${rows.map(r=>`<div class="dl-row"><span class="dl-dot" style="background:${r.color}"></span><span class="dl-l" title="${esc(r.label)}">${esc(r.label)}</span><b>${r.n}</b></div>`).join('')}</div></div>`;
}
function widgetCard(w){
  const cfg = w.config||{};
  let body='';
  if(w.wtype==='stat'){
    const rows = widgetTaskRows(cfg);
    const danger = ['overdue','sla'].includes(cfg.show);
    body = `<div class="w-stat ${danger&&rows.length?'red':''}">${rows.length}</div><div class="w-stat-l">${esc(cfg.entity==='requests'?'requests':'tasks')}</div>`;
  }
  else if(w.wtype==='bar') body = hbars(widgetGroups(cfg));
  else if(w.wtype==='donut') body = donutSVG(widgetGroups(cfg));
  else if(w.wtype==='progress'){
    const c=S._dashCtx, total=c.tasks.length, done=c.doneTasks.length;
    const pct = total? Math.round(done/total*100):0;
    body = `<div class="w-stat accent">${pct}%</div><div class="w-stat-l">${done} of ${total} tasks done</div>
      <div class="prog-bar" style="margin-top:10px"><div class="prog-fill" style="width:${pct}%"></div></div>`;
  }
  else if(w.wtype==='list'){
    let rows = widgetTaskRows(cfg);
    if(cfg.entity==='requests') rows=[...rows].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,6);
    else rows=[...rows].sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')).slice(0,6);
    body = rows.length? (cfg.entity==='requests'? requestTable(rows): taskTable(rows)) : '<div style="color:var(--ink3);font-size:13px;padding:8px 0">Nothing here</div>';
  }
  const acts = (isStaff()? `<span onclick="exportWidgetCSV('${w.id}')">Excel</span>`:'')
    + (widgetsEditable()? `<span onclick="widgetModal('${w.id}')">Edit</span><span onclick="deleteWidget('${w.id}')">Remove</span>`:'');
  return `<div class="card widget-card ${w.wtype==='list'?'w-wide':''}" draggable="${widgetsEditable()}" data-wid="${w.id}"
      ondragstart="wDragStart(event,'${w.id}')" ondragover="event.preventDefault()" ondrop="wDrop(event,'${w.id}')">
    <div class="w-head"><h3>${esc(w.title)}</h3>
      ${acts? `<span class="w-actions">${acts}</span>`:''}</div>
    ${body}</div>`;
}
function exportWidgetCSV(id){
  const w = (S._widgets||[]).find(x=>x.id===id); if(!w) return;
  downloadXLSX(xlsxFilename(w.title||'Widget'),
    [['Label','Count'], ...widgetGroups(w.config||{}).map(g=>[g.label, g.n])]);
}
/* Stat tiles, a blank line, then every widget's grouped numbers — one file. */
function exportReportCSV(){
  const out = [['Label','Value'], ...(S._reportStats||[])];
  (S._widgets||[]).forEach(w=>{
    out.push([], [w.title], ['Label','Count']);
    widgetGroups(w.config||{}).forEach(g=>out.push([g.label, g.n]));
  });
  downloadXLSX(xlsxFilename(S._reportName||'Report'), out);
}
let wDragId=null;
function wDragStart(e,id){ wDragId=id; }
async function wDrop(e,targetId){
  e.preventDefault();
  if(!widgetsEditable()) return;
  if(!wDragId || wDragId===targetId) return;
  const ws=S._widgets, from=ws.findIndex(x=>x.id===wDragId), to=ws.findIndex(x=>x.id===targetId);
  if(from<0||to<0) return;
  const [m]=ws.splice(from,1); ws.splice(to,0,m); wDragId=null;
  document.getElementById('wgrid').innerHTML = ws.map(widgetCard).join('');
  for(let i=0;i<ws.length;i++){ if(ws[i].position!==i){ ws[i].position=i; await db.from('dashboard_widgets').update({position:i}).eq('id',ws[i].id); } }
}
async function deleteWidget(id){

function widgetModal(id, wsId, projId){

  const pScope = projId || (w? w.project_id : null) || widgetProjScope || null;
  const cfg = w? (w.config||{}) : {entity:'tasks', show:'open', groupBy:'status'};
  const types=[['stat','Number','A single big number'],['bar','Bar chart','Compare groups side by side'],['donut','Donut','Share of a total'],['list','List','The items themselves'],['progress','Progress','Done vs total']];
  const m = modal(`<div class="modal-head"><h2>${w?'Edit widget':'Add widget'}</h2><button class="x" onclick="closeModals()">✕</button></div>

      <div style="margin-top:12px;font-size:12.5px;color:var(--ink3)">${pScope? 'On this board\'s report' : scope? 'On the workspace report' : 'On your dashboard'}${helpIcon(pScope? 'Everyone who can open the board sees this widget.' : scope? 'Everyone on the team sees this widget.' : 'Widgets follow the workspace selector at the top of the dashboard, and only you see them.')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="wm-save">${w?'Save':'Add widget'}</button></div>`);

    const t = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const ent = m.querySelector('#wm-entity').value;
    const dim = m.querySelector('#wm-dim');
    if(t==='bar'||t==='donut'){
      const gs = ent==='requests'? W_GROUPS_REQS: W_GROUPS_TASKS;
      dim.innerHTML = `<label>Group by</label><select id="wm-group">${gs.map(([k,l])=>`<option value="${k}" ${cfg.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>`;
    } else if(t==='stat'||t==='list'){
      const ss = ent==='requests'? W_SHOWS_REQS: W_SHOWS_TASKS;
      dim.innerHTML = `<label>Show</label><select id="wm-show">${ss.map(([k,l])=>`<option value="${k}" ${cfg.show===k?'selected':''}>${l}</option>`).join('')}</select>`;
    } else dim.innerHTML='';
    m.querySelector('#wm-mine-wrap').style.display = (ent==='tasks' && (t==='stat'||t==='list'))? 'flex':'none';
  };
  wmRefresh();
  m.querySelector('#wm-save').onclick = async ()=>{
    const wtype = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const entity = m.querySelector('#wm-entity').value;
    const config = {entity};
    if(wtype==='bar'||wtype==='donut') config.groupBy = m.querySelector('#wm-group')?.value || 'status';
    if(wtype==='stat'||wtype==='list'){ config.show = m.querySelector('#wm-show')?.value || 'open'; config.mine = m.querySelector('#wm-mine')?.checked || false; }
    let title = m.querySelector('#wm-title').value.trim();
    if(!title){
      const dimL = config.groupBy? ' by '+config.groupBy : config.show? ' — '+config.show : '';
      title = (entity==='requests'?'Requests':'Tasks') + dimL;
    }
    let error;
    if(w){ ({error} = await db.from('dashboard_widgets').update({wtype, title, config}).eq('id',w.id)); }
    else { ({error} = await db.from('dashboard_widgets').insert({user_id:S.me.id, workspace_id:pScope? null : scope, project_id:pScope, wtype, title, config, position:(S._widgets||[]).length})); }
    if(error) return toast(error.message,true);
    closeModals(); toast(w?'Widget updated':'Widget added'); reRenderWidgets();
  };
}
function hbars(rows){
  if(!rows.length) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const max = Math.max(...rows.map(r=>r.n));
  return rows.map(r=>`<div class="hbar-row">
    <div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(r.n/max*100)}%;background:${r.color}"></div></div>
    <div class="hbar-val">${r.n}</div></div>`).join('');
}

async function slaSave(btn){
  const days = [...document.querySelectorAll('.sla-day:checked')].map(x=>parseInt(x.dataset.d,10));
  if(!days.length) return toast('Pick at least one working day', true);
  const ws = document.getElementById('sla-ws').value, we = document.getElementById('sla-we').value;
  if(!ws || !we || ws >= we) return toast('Work must start before it ends', true);
  const prio = {}; [...document.querySelectorAll('.sla-prio')].forEach(x=>{ prio[x.dataset.p] = Math.min(500, Math.max(10, parseInt(x.value,10)||100)); });
  const payload = {
    company_id: S.me.company_id,
    use_working_time: document.getElementById('sla-wt').checked,
    work_start: ws, work_end: we, work_days: days,
    warn_pct: Math.min(95, Math.max(10, parseInt(document.getElementById('sla-warn').value,10)||80)),
    pause_statuses: [...document.querySelectorAll('.sla-pause:checked')].map(x=>x.dataset.s),
    prio_pct: prio, updated_at: new Date().toISOString(),
  };
  btn.disabled = true;
  const {error} = await db.from('sla_settings').upsert(payload);
  let terr = null;
  for(const inp of document.querySelectorAll('.sla-th')){
    const rt = (S._slaTypes||[]).find(t=>t.id===inp.dataset.id);
    const hrs = Math.min(2000, Math.max(1, parseInt(inp.value,10)||24));
    if(rt && rt.sla_hours !== hrs){
      const {error:e2} = await db.from('request_types').update({sla_hours:hrs}).eq('id',rt.id);
      if(e2) terr = e2;
    }
  }
  btn.disabled = false;
  if(error||terr) return toast((error||terr).message, true);
  toast('SLA settings saved — new tickets use them right away');
  await refreshCore(); renderAdmin();
}

/* Turn a draft into the sentence shown in the list and used as the rule's name. */
function caSentence(d){
  const sL = k => (STATUSES.find(s=>s.k===k)||{}).label||k;
  const pL = k => (PRIORITIES.find(p=>p.k===k)||{}).label||k;
  const uN = id => { const u=(S.profiles||[]).find(p=>p.id===id); return u? u.full_name : 'someone'; };
  const pid = d.scope.startsWith('p:')? d.scope.slice(2) : null;
  const tc = d.tc||{};
  let when='';
  switch(d.trigger){
    case 'status_changed':   when = 'When status changes' + (tc.from? ` from ${sL(tc.from)}`:'') + (tc.to? ` to ${sL(tc.to)}`:''); break;
    case 'priority_changed': when = 'When priority changes' + (tc.from? ` from ${pL(tc.from)}`:'') + (tc.to? ` to ${pL(tc.to)}`:''); break;
    case 'task_assigned':    when = 'When a task is assigned' + (tc.user_id? ` to ${uN(tc.user_id)}`:''); break;
    case 'task_unassigned':  when = 'When a task loses its assignee'; break;
    case 'task_created':     when = 'When a task is created'; break;
    case 'moved_to_group':   when = 'When a task moves' + (tc.group_id? ` to ${caGroupName(pid,tc.group_id)}`:' to a new group'); break;
    case 'field_changed':    when = 'When ' + (tc.field_id? caFieldName(pid,tc.field_id):'a column') + (tc.to? ` becomes ${tc.to}`:' changes'); break;
    case 'due_date_changed': when = 'When the due date is set'; break;
    case 'due_date_arrives': when = 'When the due date arrives'; break;
    case 'due_date_passed':  { const n=Math.max(1,parseInt(tc.days??1,10)||1); when = `When the due date is ${n} day${n===1?'':'s'} past`; break; }
  }
  const condTxt = (d.conds||[]).map(c=>{
    const what = c.k==='field'? (c.field_id? caFieldName(pid,c.field_id):'a column') : (CA_COND_KEYS.find(x=>x.key===c.k)||{}).label||c.k;
    const opL = (CA_OPS.find(o=>o.key===c.op)||{}).label||'is';
    let val='';
    if(c.op==='is'||c.op==='is_not'){
      val = c.k==='status'? sL(c.v) : c.k==='priority'? pL(c.v) : c.k==='assignee'? uN(c.v) : c.k==='group'? caGroupName(pid,c.v) : (c.v||'…');

    return `${what.toLowerCase()} ${opL}${val? ' '+val:''}`;
  });
  const acts = (d.acts||[]).map(a=>{
    const cfg=a.cfg||{};
    switch(a.key){
      case 'notify_person':   return `notify ${uN(cfg.user_id)}`;
      case 'notify_assignee': return 'notify the assignee';
      case 'notify_creator':  return 'notify whoever created it';
      case 'notify_owners':   return 'notify the workspace owners';
      case 'notify_team':     return 'notify the whole workspace';
      case 'add_comment':     return 'add a comment';
      case 'set_status':      return `set status to ${sL(cfg.status||'todo')}`;
      case 'set_priority':    return `set priority to ${pL(cfg.priority||'urgent')}`;
      case 'assign_person':   return `assign it to ${uN(cfg.user_id)}`;
      case 'assign_creator':  return 'assign it to whoever created it';
      case 'unassign':        return 'clear the assignee';
      case 'move_to_group':   return `move it to ${caGroupName(pid,cfg.group_id)}`;
      case 'set_field':       return `set ${cfg.field_id? caFieldName(pid,cfg.field_id):'a column'}${cfg.value? ` to ${cfg.value}`:''}`;
      case 'clear_field':     return `clear ${cfg.field_id? caFieldName(pid,cfg.field_id):'a column'}`;
      case 'set_due_in_days': { const n=parseInt(cfg.days??1,10); return `set the due date ${n} day${n===1?'':'s'} from now`; }
      case 'push_due':        { const n=parseInt(cfg.days??1,10); return `push the due date ${Math.abs(n)} day${Math.abs(n)===1?'':'s'} ${n<0?'earlier':'later'}`; }
      case 'clear_due':       return 'clear the due date';
      case 'create_task':     return 'create a follow-up task';
      case 'archive_task':    return 'archive it';

/* Editable draft: {id, trigger, tc, conds:[{k,op,v,field_id}], acts:[{key,cfg}], scope} */
let _ca = null;
function caDraft(rec, defScope){
  if(!rec) return {id:null, trigger:'status_changed', tc:{}, conds:[], acts:[{key:'notify_assignee', cfg:{}}], scope:defScope||''};
  const tc = (rec.trigger_config && Object.keys(rec.trigger_config).length)? {...rec.trigger_config} : {...(rec.condition||{})};
  const conds = Array.isArray(rec.conditions)? rec.conditions.map(c=>{
    const k = String(c.k||''); const isField = k.startsWith('field:');
    return {k: isField? 'field' : k, field_id: isField? k.slice(6) : undefined, op: c.op||'is', v: Array.isArray(c.v)? c.v[0] : (c.v??'')};
  }) : [];
  const acts = (Array.isArray(rec.actions) && rec.actions.length)? rec.actions.map(a=>({key:a.key, cfg:{...(a.cfg||{})}}))
             : [{key:rec.action_key, cfg:{...(rec.action_config||{})}}];
  return {id:rec.id, trigger:rec.trigger_key, tc, conds, acts,
          scope: rec.project_id? 'p:'+rec.project_id : (rec.workspace_id? 'w:'+rec.workspace_id : '')};
}
function caModal(id, defScope){
  const rec = id? (S._customAutos||[]).find(x=>x.id===id) : null;
  _ca = caDraft(rec, defScope);
  // Opened from a board: that board is the answer, not a question - and the person may not
  // even be allowed to widen it, so the picker is replaced by the board's name.
  _ca.lockScope = !!(defScope||'').startsWith('p:') || (!isAdmin() && _ca.scope.startsWith('p:'));
  const m = modal(`<div class="modal-head"><h2>${id? 'Edit automation':'Add automation'}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body" id="ca-body"></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" id="ca-save" onclick="caSave()">${id? 'Save changes':'Add automation'}</button></div>`);
  m.querySelector('.modal').classList.add('wide');
  const pid = _ca.scope.startsWith('p:')? _ca.scope.slice(2) : null;
  if(pid) caLoadGroups(pid); else caDraw();
}
function caDuplicate(id){
  const rec = (S._customAutos||[]).find(x=>x.id===id); if(!rec) return;
  const copy = {...rec, id:null, name:(rec.name||'Automation')+' (copy)'};
  caModal(null, '');
  _ca = caDraft(copy, ''); _ca.id = null;
  const pid = _ca.scope.startsWith('p:')? _ca.scope.slice(2) : null;
  if(pid) caLoadGroups(pid); else caDraw();
  toast('Copied — change what you need and add it');
}
async function caLoadGroups(pid){
  window._caGroups = window._caGroups||{}; window._caFields = window._caFields||{};
  const jobs=[];
  if(!window._caGroups[pid]) jobs.push(db.from('project_groups').select('id,name').eq('project_id',pid)
    .then(({data})=>{window._caGroups[pid]=data||[];}));
  if(!window._caFields[pid]) jobs.push(db.from('project_fields').select('id,label,ftype,options').eq('project_id',pid)
    .then(({data})=>{window._caFields[pid]=(data||[]).filter(f=>!['formula','mirror'].includes(f.ftype));}));
  if(jobs.length) await Promise.all(jobs);
  caDraw();
}

function caTc(k, v){ if(v==='' || v==null) delete _ca.tc[k]; else _ca.tc[k]=v; caDraw(); }
function caCondAdd(){ _ca.conds.push({k:'status', op:'is', v:''}); caDraw(); }
function caCondDel(i){ _ca.conds.splice(i,1); caDraw(); }
function caCondSet(i, k, v){ const c=_ca.conds[i]; if(!c) return; c[k]=v; if(k==='k'){ c.v=''; delete c.field_id; } if(k==='field_id') c.v=''; caDraw(); }

function caActDel(i){ if(_ca.acts.length<=1) return toast('A rule needs at least one action', true); _ca.acts.splice(i,1); caDraw(); }

function caActKey(i, k){ _ca.acts[i]={key:k, cfg:{}}; caDraw(); }

/* Validate the draft and turn it into the row the engine expects. Returns {error} or {payload}. */
function caPayload(d){
  const pid = d.scope.startsWith('p:')? d.scope.slice(2) : null;
  const wid = d.scope.startsWith('w:')? d.scope.slice(2) : null;
  const trg = CA_TRIGGERS.find(t=>t.key===d.trigger)||{};
  const tc = {};
  if(trg.tc==='status' || trg.tc==='priority'){ if(d.tc.from) tc.from=d.tc.from; if(d.tc.to) tc.to=d.tc.to; if(tc.from && tc.from===tc.to) return {error:'“From” and “to” cannot be the same value'}; }
  if(trg.tc==='person' && d.tc.user_id) tc.user_id = d.tc.user_id;
  if(trg.tc==='group'){ if(!pid) return {error:'Choose a board — groups belong to a board'}; if(d.tc.group_id) tc.group_id=d.tc.group_id; }
  if(trg.tc==='field'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!d.tc.field_id) return {error:'Pick which column to watch'}; tc.field_id=d.tc.field_id; if(d.tc.to) tc.to=d.tc.to; }
  if(trg.tc==='days') tc.days = Math.max(1, parseInt(d.tc.days??1,10)||1);
  const conditions = [];
  for(const c of d.conds){
    const valueless = c.op==='empty'||c.op==='not_empty';
    if(c.k==='field'){ if(!pid) return {error:'Conditions on a column need a board — pick one under “Where it applies”'}; if(!c.field_id) return {error:'Pick which column the condition looks at'}; }
    if(c.k==='group' && !pid) return {error:'Conditions on a group need a board — pick one under “Where it applies”'};
    if(!valueless && !c.v) return {error:'Every “only if” line needs a value, or use “is empty” / “is set”'};
    const row = {k: c.k==='field'? 'field:'+c.field_id : c.k, op:c.op};
    if(!valueless) row.v = c.v;
    conditions.push(row);
  }
  const actions = [];
  for(const a of d.acts){
    const act = CA_ACTIONS.find(x=>x.key===a.key); if(!act) return {error:'Unknown action'};
    const cfg = {}; const c=a.cfg||{};
    if(act.cfg==='person'){ if(!c.user_id) return {error:'Pick who to '+(a.key==='assign_person'?'assign':'notify')}; cfg.user_id=c.user_id; }
    if(act.cfg==='status')   cfg.status = c.status||'todo';
    if(act.cfg==='priority') cfg.priority = c.priority||'urgent';
    if(act.cfg==='group'){ if(!pid) return {error:'Choose a board — groups belong to a board'}; if(!c.group_id) return {error:'Pick the group to move to'}; cfg.group_id=c.group_id; }
    if(act.cfg==='field'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!c.field_id) return {error:'Pick which column to set'}; if(!c.value) return {error:'Pick the value to set'}; cfg.field_id=c.field_id; cfg.value=c.value; }
    if(act.cfg==='fieldonly'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!c.field_id) return {error:'Pick which column to clear'}; cfg.field_id=c.field_id; }
    if(act.cfg==='text'){ if(!(c.text||'').trim()) return {error:'Type the comment to add'}; cfg.text=c.text.trim(); }
    if(act.cfg==='days')     cfg.days = Math.max(0, parseInt(c.days??1,10)||0);
    if(act.cfg==='pushdays'){ const n=parseInt(c.days??1,10); if(!n) return {error:'Push the due date by at least one day'}; cfg.days=n; }
    if(act.cfg==='newtask'){ if(c.title) cfg.title=c.title.trim(); if(c.project_id) cfg.project_id=c.project_id; if(c.user_id && c.user_id!=='__same') cfg.user_id=c.user_id; if(c.same_assignee==='true') cfg.same_assignee='true'; if(c.due_in_days!=='' && c.due_in_days!=null) cfg.due_in_days=Math.max(0,parseInt(c.due_in_days,10)||0); }
    actions.push({key:a.key, cfg});
  }
  if(!actions.length) return {error:'Add at least one action'};
  return {payload:{workspace_id:wid, project_id:pid, trigger_key:d.trigger, trigger_config:tc, conditions, actions,
                   condition:tc, action_key:actions[0].key, action_config:actions[0].cfg, name:caSentence(d)}};
}

function caSaveError(e){
  const msg = e.message||'';
  if(/points at a board you do not manage/i.test(msg)) return 'That action points at a board you don\'t manage — pick one of your own boards';
  if(/rule that applies everywhere/i.test(msg))        return 'Only an admin can make a rule that applies everywhere or to a whole workspace';
  if(/row-level security/i.test(msg))                  return 'You can only set up automations on a board you own';
  return msg;
}

/* One line per step of a run: "assign → ok · move → skipped (already there)" */
function caStepsText(run){
  const steps = run?.detail?.steps;
  if(!Array.isArray(steps) || !steps.length) return run?.detail?.notified? `${run.detail.notified} notified` : '';
  const lbl = k => (CA_ACTIONS.find(a=>a.key===k)||{}).label || k;
  return steps.map(s=>`${lbl(s.action)} → ${s.result}${s.reason? ` (${esc(s.reason)})`:''}${s.notified!=null? ` (${s.notified})`:''}`).join(' · ');
}

    const {data, error} = await db.from('workspaces').insert({name,
      description:m.querySelector('#nw-desc').value.trim(), color:colors[Math.floor(Math.random()*colors.length)],
      position:S.workspaces.length+1}).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Workspace created'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin(); else if(data) location.hash='#/ws/'+data.id;
  };
}

/* ================= PLATFORM (SaaS console) ================= */
async function renderPlatform(){
  if(!S.me.platform_admin){ location.hash='#/home'; return; }
  setTopbar('Platform');
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const [{data:cos}, {data:pf}] = await Promise.all([
    db.from('companies').select('*').order('created_at'),
    db.from('profiles').select('id, company_id, active'),
  ]);
  const counts = {};
  (pf||[]).forEach(p=>{ if(p.company_id && p.active){ counts[p.company_id]=(counts[p.company_id]||0)+1; } });
  const PLANS=['internal','trial','starter','pro','enterprise'];
  const STATS=['trial','active','past_due','suspended','cancelled'];
  C.innerHTML = `
    <div class="page-head"><div><h1>Platform</h1><div class="sub">Customer companies, plans and subscription status</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n accent">${(cos||[]).length}</div><div class="l">Companies</div></div>
      <div class="stat"><div class="n green">${(cos||[]).filter(c=>c.status==='active').length}</div><div class="l">Active subscriptions</div></div>
      <div class="stat"><div class="n amber">${(cos||[]).filter(c=>c.status==='trial').length}</div><div class="l">On trial</div></div>
      <div class="stat"><div class="n">${(pf||[]).filter(p=>p.active).length}</div><div class="l">Total active users</div></div>
    </div>
    <div class="card"><table class="tbl"><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Seats</th><th>Users</th><th>Trial ends</th><th></th></tr></thead><tbody>
    ${(cos||[]).map(c=>`<tr id="co-${c.id}">
      <td style="font-weight:600">${esc(c.name)}<div style="font-size:11px;color:var(--ink3)">${esc(c.slug||'')} · since ${fmtDate(c.created_at)}</div></td>
      <td><select data-k="plan" style="width:auto;padding:5px 8px">${PLANS.map(p=>`<option ${p===c.plan?'selected':''}>${p}</option>`).join('')}</select></td>
      <td><select data-k="status" style="width:auto;padding:5px 8px">${STATS.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><input data-k="seats" type="number" value="${c.seats}" style="width:70px;padding:5px 8px"></td>
      <td>${counts[c.id]||0}</td>
      <td style="color:var(--ink2)">${c.trial_ends_at? fmtDate(c.trial_ends_at):'—'}</td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="savePlatformCo('${c.id}')">Save</button></td>
    </tr>`).join('')}</tbody></table></div>
    `;
}
async function savePlatformCo(id){
  const row = document.getElementById('co-'+id); if(!row) return;
  const plan = row.querySelector('select[data-k=plan]').value;
  const status = row.querySelector('select[data-k=status]').value;
  const seats = parseInt(row.querySelector('input[data-k=seats]').value)||10;
  const {error} = await db.from('companies').update({plan, status, seats}).eq('id',id);
  if(error) return toast(error.message, true);
  toast('Company updated');
}

/* ================= INIT ================= */
(async ()=>{
  if(location.hash.startsWith('#/f/')){ renderPublicForm(location.hash.slice(4).split('?')[0]); return; }
  const {data:{session}} = await db.auth.getSession();
  S.session = session;
  if(session) await boot();
  else $('#login-screen').classList.remove('hidden');
})();
</script>

<script>
/* ================= TEAMS (admin) =================
   A team is a saved group of people, used to bulk-tick members in the
   workspace and board pickers. It grants nothing by itself. */
function editTeamModal(tid){
  const t = tid? teamById(tid) : null;
  let colour = t? (t.color||TEAM_COLORS[0]) : TEAM_COLORS[0];
  const m = modal(`<div class="modal-head"><h2>${t?'Rename team':'New team'}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Team name <span class="req">*</span></label>
      <input id="tt-name" value="${t? esc(t.name):''}" placeholder="e.g. Customer Service">
      <label style="margin-top:14px">Colour</label>
      <div id="tt-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        ${TEAM_COLORS.map(c=>`<span data-c="${c}" style="width:26px;height:26px;border-radius:50%;background:${c};cursor:pointer;box-shadow:${c===colour?'0 0 0 3px #fff,0 0 0 5px '+c:'none'}"></span>`).join('')}
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tt-save">Save</button></div>`);
  m.querySelectorAll('#tt-cols span').forEach(s=> s.onclick=()=>{
    colour = s.dataset.c;
    m.querySelectorAll('#tt-cols span').forEach(x=> x.style.boxShadow = x.dataset.c===colour? '0 0 0 3px #fff,0 0 0 5px '+colour : 'none');
  });
  m.querySelector('#tt-save').onclick = async ()=>{
    const name = m.querySelector('#tt-name').value.trim();
    if(!name) return toast('Name required', true);
    const {error} = t
      ? await db.from('teams').update({name, color:colour}).eq('id', tid)
      : await db.from('teams').insert({name, color:colour});
    // The unique index is on (company, lower(name)) — say so in words.
    if(error) return toast(/duplicate|unique/i.test(error.message)? `There is already a team called ${name}` : error.message, true);
    closeModals(); toast(t? 'Team renamed':'Team created'); await refreshCore(); renderAdmin();
  };
}
async function teamMembersEditModal(tid){
  const t = teamById(tid); if(!t) return;
  const inTeam = new Set(teamMemberIds(tid));
  const pool = S.profiles.filter(p=>p.active && !(p.email||'').startsWith('forms+'))
    .sort((a,b)=> (inTeam.has(b.id)) - (inTeam.has(a.id)) || (a.full_name||'').localeCompare(b.full_name||''));
  const m = modal(`<div class="modal-head"><h2>People in ${esc(t.name)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      ${searchBoxHTML('tp-q','Search by name, role, or email address')}
      <div id="tp-count" style="font-size:12.5px;color:var(--ink2);margin:2px 0"></div>
      ${pool.map(p=>`<div class="chk" data-search="${esc(searchKey(p))}">
        <input type="checkbox" data-uid="${p.id}" ${inTeam.has(p.id)?'checked':''}>
        ${avatar(p,true)} <span style="flex:1">${esc(p.full_name||p.email)}
          <span style="color:var(--ink3)">· ${esc(p.email)}</span></span></div>`).join('')
      || '<div class="empty">No active accounts yet.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="tp-save">Save</button></div>`);
  wireMemberSearch(m, 'tp-q');
  const boxes = [...m.querySelectorAll('input[data-uid]')], countEl = m.querySelector('#tp-count');
  const recount = ()=>{ countEl.textContent = `${boxes.filter(b=>b.checked).length} of ${boxes.length} people in this team`; };
  boxes.forEach(b=> b.addEventListener('change', recount)); recount();
  m.querySelector('#tp-save').onclick = async ()=>{
    const want = new Set(boxes.filter(b=>b.checked).map(b=>b.dataset.uid));
    const add = [...want].filter(u=>!inTeam.has(u)).map(user_id=>({team_id:tid, user_id}));
    const rm  = [...inTeam].filter(u=>!want.has(u));
    if(add.length){ const {error} = await db.from('team_members').insert(add); if(error) return toast(error.message, true); }
    if(rm.length){ const {error} = await db.from('team_members').delete().eq('team_id',tid).in('user_id',rm); if(error) return toast(error.message, true); }
    closeModals(); toast('Team updated'); await refreshCore(); renderAdmin();
  };
}
async function deleteTeamModal(tid){
  const t = teamById(tid); if(!t) return;
  const n = teamMemberIds(tid).length;
  // Deleting a team takes nobody's access away — it is only a saved grouping.
  if(!confirm(`Delete the team ${t.name}?`
    + (n? ` Its ${n} ${n===1?'person keeps':'people keep'} every workspace and board they are on — only the grouping goes.`:''))) return;
  const {error} = await db.from('teams').delete().eq('id', tid);
  if(error) return toast(error.message, true);
  toast('Team deleted'); await refreshCore(); renderAdmin();
}
</script>
