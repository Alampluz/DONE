<style>
/* ============================================================================
   ONBOARDING — "the Excel tracker, but live" (v2, 13 Oct 2026)
   One tracker per brand. Activities are copied from the service checklists when the
   tracker is created and edited in place; deadlines hang off the Shop Live date.
   Activities live here (and on the PIC's My Work), not on division boards.
   ============================================================================ */
.ob-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ob-head h1{margin:0}
.ob-head .sp{flex:1}
.ob-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.ob-kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ob-kpi b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:4px}
.ob-kpi .v{font-size:18px;font-weight:700;line-height:1.2}
.ob-kpi .v small{color:var(--ink3);font-weight:500;font-size:13px}
.ob-bar{height:6px;border-radius:5px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.ob-bar i{display:block;height:100%;background:var(--green)}
.ob-tbl{width:100%;border-collapse:collapse;font-size:13px}
.ob-tbl th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);padding:10px 10px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:1}
.ob-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ob-tbl tr.svc td{background:var(--ink);color:var(--panel);font-weight:700;font-size:12px;letter-spacing:.5px;padding:9px 10px}
.ob-tbl tr.svc td .sp{float:right;font-weight:500;opacity:.85}
.ob-tbl tr.ph td{background:var(--gray-soft);font-weight:700;color:var(--ink2);font-size:12px;cursor:pointer;user-select:none}
.ob-tbl tr.ph td .n{font-weight:500;color:var(--ink3)}
.ob-tbl tr.over td.dl{color:var(--red);font-weight:700}
.ob-tbl td.ed{background:var(--gray-soft);border-left:2px solid var(--accent-soft)}
.ob-tbl td.ed input,.ob-tbl td.ed select{width:100%;min-width:0;padding:4px 6px;font-size:12.5px;border:1px solid transparent;background:transparent;border-radius:6px;color:var(--ink)}
.ob-tbl td.ed input:hover,.ob-tbl td.ed select:hover{border-color:var(--line);background:var(--panel)}
.ob-tbl td.ed input:focus,.ob-tbl td.ed select:focus{border-color:var(--accent);background:var(--panel);outline:none}
.ob-tbl td.ed input[type=number]{width:62px}
.ob-tbl td.ed select{width:140px;min-width:0}
.ob-tbl td.ed select.ob-team{width:92px}
.ob-tbl td.ed select.ob-stsel{width:140px}
.ob-tbl td.ed input.ob-remark{width:160px}
.ob-tbl td.ed{white-space:nowrap}
.ob-tbl td.muted{max-width:220px}
.ob-tbl.ob-compact .ob-desc{display:none}
.ob-tbl td.ed input[type=date]{width:124px}
/* DONE swaps every <select> for a .sel-pick button that inherits the select's classes — size those, not the select */
.ob-tbl td.ed .sel-pick{height:30px;width:130px;min-width:0;max-width:none;font-size:12.5px;padding:0 8px;border-radius:7px;background:transparent;border-color:transparent}
.ob-tbl td.ed .sel-pick:hover,.ob-tbl td.ed .sel-pick:focus{background:var(--panel);border-color:var(--line)}
.ob-tbl td.ed .sel-pick.ob-team{width:88px}
.ob-tbl td.ed .sel-pick.ob-stsel{width:150px;font-weight:700}
.ob-tbl td.ed .sel-pick.ob-stsel.not_started{color:var(--ink2)} .ob-tbl td.ed .sel-pick.ob-stsel.in_progress{color:var(--accent-ink)} .ob-tbl td.ed .sel-pick.ob-stsel.waiting_brand{color:var(--amber)} .ob-tbl td.ed .sel-pick.ob-stsel.done{color:var(--green)} .ob-tbl td.ed .sel-pick.ob-stsel.na{color:var(--ink3)}
.ob-tbl td.ed input[type=date]{width:132px}
.ob-tbl .muted{color:var(--ink3);font-size:12px}
.ob-t{display:inline-block;background:var(--purple-soft);color:var(--purple);font-weight:700;font-size:11px;padding:1px 6px;border-radius:5px;margin-right:2px;white-space:nowrap}
.ob-st{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.ob-st.not_started{background:var(--gray-soft);color:var(--ink2)}
.ob-st.in_progress{background:var(--accent-soft);color:var(--accent-ink)}
.ob-st.waiting_brand{background:var(--amber-soft);color:var(--amber)}
.ob-st.done{background:var(--green-soft);color:var(--green)}
.ob-st.na{background:var(--gray-soft);color:var(--ink3)}
.ob-tbl select.ob-stsel{font-weight:700;font-size:12px}
.ob-legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink3);font-size:12px;padding:10px 12px;border-top:1px solid var(--line)}
.ob-list .ob-tbl td{vertical-align:middle}
.ob-brand-pub{max-width:1200px;margin:0 auto;padding:28px 20px 60px}
.ob-pub-card{background:#fff;color:#16181D;border:1px solid #E6EAE8;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ob-chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ob-chk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.ob-chk:hover{border-color:var(--accent)}
.ob-chk h4{margin:0 0 4px;font-size:14px}
.ob-wait{color:var(--amber)}
.ob-over{color:var(--red)}
.ob-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
</style>
<script>
/* ---------- state ---------- */
const OB = { loaded:false, types:[], templates:[], ttasks:[], onboardings:[], acts:{} /* onboarding id -> rows */, collapsed:{}, details:null };
const obShowDetails = () => OB.details==null? (typeof window!=='undefined' && window.innerWidth>=1500) : OB.details;
const OB_STATUS = [
  {k:'not_started', label:'Not started'}, {k:'in_progress', label:'In progress'},
  {k:'waiting_brand', label:'Waiting on brand'}, {k:'done', label:'Done'}, {k:'na', label:'N/A'},
];
const OB_PLATFORMS = ['TikTok Shop','Shopee','Lazada','Brand.com'];
/* Known platforms = the defaults + anything already used on a tracker or a checklist. */
function obPlatformList(){
  const set=new Set(OB_PLATFORMS);
  OB.onboardings.forEach(o=>(o.platforms||[]).forEach(p=>set.add(p)));
  OB.types.forEach(t=>(t.channels||[]).forEach(p=>set.add(p)));
  return [...set].filter(p=>p && p!=='Other');
}
function obPlatformBoxes(cls, selected){
  return `<div id="${cls}-wrap" style="display:flex;flex-wrap:wrap;gap:6px 16px">${obPlatformList().map(p=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink)"><input type="checkbox" class="${cls}" value="${esc(p)}" ${(selected||[]).includes(p)?'checked':''} style="width:15px;height:15px;accent-color:var(--accent)">${esc(p)}</label>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:6px"><input id="${cls}-new" placeholder="Add a platform…" style="max-width:220px;padding:6px 9px"><button type="button" class="btn btn-ghost btn-sm" onclick="obAddPlatformBox('${cls}')">Add</button></div>`;
}
function obAddPlatformBox(cls){
  const inp=document.getElementById(cls+'-new'); const v=(inp.value||'').trim(); if(!v) return;
  const wrap=document.getElementById(cls+'-wrap');
  if([...wrap.querySelectorAll('input')].some(i=>i.value.toLowerCase()===v.toLowerCase())){ inp.value=''; return; }
  wrap.insertAdjacentHTML('beforeend', `<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink)"><input type="checkbox" class="${cls}" value="${esc(v)}" checked style="width:15px;height:15px;accent-color:var(--accent)">${esc(v)}</label>`);
  inp.value='';
}
const obStLabel = k => (OB_STATUS.find(s=>s.k===k)||{}).label || k;
const obStChip  = k => `<span class="ob-st ${k}">${esc(obStLabel(k))}</span>`;
const obIsSuper = () => !!(S.me && ['admin','management'].includes(S.me.role));
const obType  = id => OB.types.find(t=>t.id===id);
const obBrand = id => (S.brandsList||[]).find(b=>b.id===id);
const obDefaultWs = () => (S.workspaces||[]).find(w=>/onboarding/i.test(w.name||'')) || null;
const obTeamName = id => (teamById(id)||{}).name || '';
function obTeamShort(id){ const n=obTeamName(id); const m={'Business Development':'BD','Onboarding':'OB','Commercial Team':'KAM','Creative Team':'Graphic','Tech & Data Team':'Tech','Customer Service':'CS','Marketing':'MKT','Livestreaming':'LIVE','Store Operation & Product Listing':'Store Ops','Affiliate Marketing':'Affiliate','Video Production':'Video','Supply Chain':'Supply','Warehouse':'WH'}; return m[n] || n.replace(/ Team$/,''); }
const obTeamTag = id => id? `<span class="ob-t" title="${esc(obTeamName(id))}">${esc(obTeamShort(id))}</span>` : '';
const obOpen = a => !['done','na'].includes(a.status);
const obOverdue = a => obOpen(a) && !!a.deadline && a.deadline < obISO(obToday());
/* People picker: the activity's team members first, then everyone else. */
function obPeopleOptions(teamId, cur){
  const people=S.profiles.filter(p=>p.active && (!p.role || p.role!=='partner'));
  const ids=teamId? new Set(teamMemberIds(teamId)) : new Set();
  const mine=people.filter(p=>ids.has(p.id)), rest=people.filter(p=>!ids.has(p.id));
  const opt=p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.full_name)}</option>`;
  return `<option value="">—</option>${mine.length? `<optgroup label="${esc(obTeamName(teamId))}">${mine.map(opt).join('')}</optgroup><optgroup label="Everyone">${rest.map(opt).join('')}</optgroup>` : people.map(opt).join('')}`;
}

/* ---------- working-day calendar (the SLA engine's own: sla_holidays + sla_settings.work_days) ---------- */
const obD   = s => s instanceof Date ? new Date(s) : new Date(String(s).slice(0,10)+'T00:00:00');
const obISO = x => { const d=obD(x); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const obAddDays = (x,n) => { const d=obD(x); d.setDate(d.getDate()+n); return d; };
const obToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function obHolidays(){ const h = S.slaHolidays; return Array.isArray(h)? h.map(x=>x.day||x) : []; }
function obWorkDays(){ const w = S.slaWorkDays; return Array.isArray(w)&&w.length? w : [1,2,3,4,5]; }
function obIsWorkDay(d){ const iso=((obD(d).getDay()+6)%7)+1; return obWorkDays().includes(iso) && !obHolidays().includes(obISO(d)); }
function obBack(x, n){ let d=obD(x), left=n, g=0; while(g++<3000){ if(left<=0 && obIsWorkDay(d)) break; d=obAddDays(d,-1); if(obIsWorkDay(d)) left--; if(left<=0 && obIsWorkDay(d)) break; } return obISO(d); }
function obFwd(x, n){ let d=obD(x), left=n, g=0; while(g++<3000){ if(left<=0 && obIsWorkDay(d)) break; d=obAddDays(d,1); if(obIsWorkDay(d)) left--; if(left<=0 && obIsWorkDay(d)) break; } return obISO(d); }
/* Where an activity lands. offset = days BEFORE go-live (negative = after).
   calendar: the checklist's WORKDAY(golive+n+1,-1) — calendar days, then the last working day on or before.
   working:  count working days back (or forward). */
function obAnchor(goLive, offset, unit){
  if(unit==='calendar') return obBack(obAddDays(goLive, -offset), 0);
  return offset>=0 ? obBack(goLive, offset) : obFwd(goLive, -offset);
}
function obWDBetween(a,b){ let d=obAddDays(a,1), n=0, g=0; const end=obD(b); while(d<end && g++<3000){ if(obIsWorkDay(d)) n++; d=obAddDays(d,1); } return n; }
let obCalLoading=null;
function obLoadCalendar(){
  if(S.slaHolidays!==undefined || obCalLoading || typeof db==='undefined') return Promise.resolve();
  obCalLoading = Promise.all([ db.from('sla_holidays').select('day').order('day'), db.from('sla_settings').select('work_days').limit(1) ])
    .then(([h,st])=>{ S.slaHolidays=(h&&h.data)? h.data.map(r=>r.day):[]; S.slaWorkDays=(st&&st.data&&st.data[0]&&Array.isArray(st.data[0].work_days))? st.data[0].work_days:[1,2,3,4,5]; })
    .catch(()=>{ S.slaHolidays=[]; });
  return obCalLoading;
}

/* ---------- data ---------- */
async function obLoad(force){
  if(OB.loaded && !force) return;
  const [ty, tp, tt, ob] = await Promise.all([
    db.from('service_types').select('*').order('position'),
    db.from('service_templates').select('*').order('version'),
    db.from('template_tasks').select('*').order('position'),
    allRows(()=>db.from('onboardings').select('*').order('created_at',{ascending:false})),
  ]);
  const err=[ty,tp,tt,ob].find(r=>r&&r.error); OB.error = err? err.error.message : null;
  OB.types=ty.data||[]; OB.templates=tp.data||[]; OB.ttasks=tt.data||[]; OB.onboardings=ob.data||[];
  OB.loaded=true; OB.acts={};
  await obLoadCalendar();
}
async function obLoadActs(oid, force){
  if(OB.acts[oid] && !force) return OB.acts[oid];
  const {data} = await allRows(()=>db.from('onboarding_activities').select('*').eq('onboarding_id',oid).order('position'));
  OB.acts[oid] = data||[]; return OB.acts[oid];
}
/* the checklist a service type uses = its newest template (published preferred) */
function obChecklistOf(typeId){ const all=OB.templates.filter(t=>t.service_type_id===typeId); return all.filter(t=>t.status==='published').sort((a,b)=>b.version-a.version)[0] || all.sort((a,b)=>b.version-a.version)[0]; }
const obChecklistRows = tpl => tpl? OB.ttasks.filter(t=>t.template_id===tpl.id).sort((a,b)=>a.position-b.position) : [];

/* ---------- summary numbers ---------- */
function obSummary(o, acts){
  const real = acts.filter(a=>a.status!=='na'); const done = real.filter(a=>a.status==='done');
  const open = acts.filter(obOpen);
  const next = open.filter(a=>a.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];
  const byService = {}; acts.forEach(a=>{ const s=byService[a.service_name]=byService[a.service_name]||{n:0,d:0}; if(a.status!=='na'){ s.n++; if(a.status==='done') s.d++; } });
  return { pct: real.length? Math.round(done.length/real.length*100):0, done:done.length, total:real.length,
    waiting: acts.filter(a=>a.status==='waiting_brand').length, overdue: acts.filter(obOverdue).length,
    next, days: o.go_live? Math.round((obD(o.go_live)-obToday())/86400000) : null, byService };
}

/* ======================= ROUTER ======================= */
async function renderOnboarding(sub, id){
  const _nav = S.nav;
  if(!isStaff()){ $('#content').innerHTML='<div class="card empty">Onboarding is for staff.</div>'; return; }
  setTopbar('Onboarding');
  const C=$('#content'); if(!OB.loaded) C.innerHTML='<div class="empty">Loading…</div>';
  await obLoad();
  if(navStale(_nav)) return;
  if(OB.error && /does not exist|relation/.test(OB.error)){
    C.innerHTML=`<div class="card empty" style="padding:30px">Onboarding tables are not applied yet.<br><span class="muted">Run <code>migrations/2026-10-13_onboarding_tracker.sql</code> and reload.</span></div>`; return;
  }
  if(sub==='checklists') return id? obRenderChecklist(id) : obRenderChecklists();
  if(sub) return obRenderTracker(sub);
  obRenderList();
}

/* ======================= LIST ======================= */
let obListTab='active';
async function obRenderList(){
  const _nav = S.nav; const C=$('#content');
  const rows = OB.onboardings.filter(o=> obListTab==='active'? ['active','on_hold'].includes(o.status||'active') : obListTab==='live'? o.status==='live' : true);
  await Promise.all(rows.map(o=>obLoadActs(o.id)));
  if(navStale(_nav)) return;
  C.innerHTML = `
    <div class="page-head"><h1>Onboarding — all brands</h1>
      <div class="tabs">
        <button class="tab ${obListTab==='active'?'active':''}" onclick="obListTab='active';obRenderList()">In progress</button>
        <button class="tab ${obListTab==='live'?'active':''}" onclick="obListTab='live';obRenderList()">Live</button>
        <button class="tab ${obListTab==='all'?'active':''}" onclick="obListTab='all';obRenderList()">All</button>
      </div>
      <div class="actions">${obDefaultWs()? `<button class="btn btn-ghost" onclick="location.hash='#/ws/${obDefaultWs().id}'">Workspace</button>`:''}<button class="btn btn-ghost" onclick="location.hash='#/onboarding/checklists'">Checklists</button><button class="btn btn-primary" onclick="obNewModal()">＋ New onboarding</button></div>
    </div>
    <div class="card ob-list">${obListTableHTML(rows)}</div>`;
}
function obListTableHTML(rows){
  if(!rows.length) return `<div class="empty">No onboarding here yet. Click <b>＋ New onboarding</b>, pick the brand and its services, set the Shop Live date — the tracker appears with every activity filled in.</div>`;
  return `<table class="ob-tbl"><thead><tr><th>Brand</th><th>Services</th><th>Shop Live</th><th>Days to go</th><th>Progress</th><th>Waiting on brand</th><th>Overdue</th><th>Next deadline</th><th>Lead</th></tr></thead><tbody>
      ${rows.map(o=>{ const s=obSummary(o, OB.acts[o.id]||[]); const b=obBrand(o.brand_id)||{};
        return `<tr class="rowlink" onclick="location.hash='#/onboarding/${o.id}'">
          <td><b>${esc(b.name||o.name)}</b><br><span class="muted">${esc(o.platform||'')}${o.status&&o.status!=='active'? ' · '+esc(o.status.replace('_',' ')):''}</span></td>
          <td class="muted">${Object.keys(s.byService).map(n=>esc(n.replace(/ — .*$/,''))).join(', ')||'—'}</td>
          <td>${fmtDate(o.go_live)||'—'}</td>
          <td>${s.days==null? '—' : s.days<0? `<span class="muted">live ${-s.days}d ago</span>` : s.days}</td>
          <td style="min-width:120px"><b>${s.pct}%</b> <span class="muted">${s.done}/${s.total}</span><div class="ob-bar"><i style="width:${s.pct}%"></i></div></td>
          <td>${s.waiting? `<b class="ob-wait">${s.waiting}</b>`:'<span class="muted">0</span>'}</td>
          <td>${s.overdue? `<b class="ob-over">${s.overdue}</b>`:'<span class="muted">0</span>'}</td>
          <td>${s.next? `${esc(s.next.title)}<br><span class="muted">${fmtDate(s.next.deadline)}</span>`:'<span class="muted">all done</span>'}</td>
          <td>${avatar(prof(o.lead_id),true)}</td></tr>`; }).join('')}
      </tbody></table>`;
}
/* Workspace page hook (renderWorkspace calls this): the trackers of this workspace, above the boards. */
async function obWorkspaceSection(wsId){
  const _nav = S.nav;
  await obLoad(); if(navStale(_nav)) return;
  if(OB.error) return;
  const dflt=obDefaultWs();
  const rows=OB.onboardings.filter(o=>o.workspace_id===wsId || (!o.workspace_id && dflt && dflt.id===wsId)).filter(o=>!['cancelled'].includes(o.status));
  if(!rows.length && !(dflt && dflt.id===wsId)) return;
  await Promise.all(rows.map(o=>obLoadActs(o.id))); if(navStale(_nav)) return;
  const live=rows.filter(o=>o.status==='live'), open=rows.filter(o=>o.status!=='live');
  const sec=el(`<section aria-label="Onboarding trackers" style="margin-bottom:18px">
    <div class="section-title" style="margin-top:4px">Onboarding trackers <span class="count">${open.length}</span><span style="flex:1"></span>
      ${isStaff()? `<button class="btn btn-ghost btn-sm" onclick="location.hash='#/onboarding'">All brands</button><button class="btn btn-ghost btn-sm" onclick="location.hash='#/onboarding/checklists'">Checklists</button><button class="btn btn-primary btn-sm" onclick="obNewModal('${wsId}')">＋ New onboarding</button>`:''}</div>
    <div class="card ob-list">${obListTableHTML(open)}</div>
    ${live.length? `<div class="muted" style="margin:6px 2px 0;font-size:12px;color:var(--ink3)">${live.length} live: ${live.map(o=>`<a href="#/onboarding/${o.id}">${esc((obBrand(o.brand_id)||{}).name||o.name)}</a>`).join(', ')}</div>`:''}
  </section>`);
  const C=$('#content'); const anchor=C.querySelector('.ws-board-directory, .card.empty');
  if(anchor) anchor.parentNode.insertBefore(sec, anchor); else C.appendChild(sec);
}

function obNewModal(wsId){
  const ws=(S.workspaces||[]); const dflt=wsId||(obDefaultWs()||{}).id||'';
  const types = OB.types.filter(t=>t.active!==false && obChecklistRows(obChecklistOf(t.id)).length);
  const brands = (S.brandsList||[]).filter(b=>b.active!==false);
  const m = modal(`<div class="modal-head"><h2>New onboarding</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Brand</label><select id="on-brand"><option value="__new">＋ New brand…</option>${brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>
      <input id="on-brand-name" placeholder="Brand name" style="margin-top:6px">
      <label>Platforms ${helpIcon('Tick every platform this onboarding covers. Type a new one and press Add if it is not listed.')}</label>${obPlatformBoxes('on-plat', ['TikTok Shop'])}
      <label>Services ${helpIcon('Each ticked service brings its checklist into the tracker as a section. Add more later with ＋ Service.')}</label>
      ${types.length? types.map(t=>{ const n=obChecklistRows(obChecklistOf(t.id)).length; return `<label style="display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:500;color:var(--ink)"><input type="checkbox" class="on-svc" value="${t.id}" style="width:15px;height:15px;accent-color:var(--accent)">${esc(t.name)} <span class="muted">· ${n} activities</span></label>`; }).join('') : '<p class="muted">No checklist has activities yet — add one under Checklists first.</p>'}
      <label>Shop Live date <span class="req">*</span></label><input id="on-date" type="date">
      <label>Workspace ${helpIcon('The tracker is listed on this workspace\u2019s page, next to its boards.')}</label><select id="on-ws">${ws.map(x=>`<option value="${x.id}" ${x.id===dflt?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <label>Onboarding lead</label><select id="on-lead"><option value="">—</option>${S.profiles.filter(p=>p.active&&['admin','internal','management'].includes(p.role)).map(p=>`<option value="${p.id}" ${p.id===S.me.id?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    </div>

    if(brandId==='__new'){ brandName=nm.value.trim(); if(!brandName) return toast('Brand name is required', true);
      const {data:b, error} = await db.from('brands').insert({name:brandName, active:true, platforms:[]}).select().single(); if(error) return toast(error.message, true);
      S.brandsList=(S.brandsList||[]).concat([b]); brandId=b.id; }
    else brandName=(obBrand(brandId)||{}).name||'Brand';
    const platforms=[...m.querySelectorAll('.on-plat:checked')].map(i=>i.value); if(!platforms.length) return toast('Tick at least one platform', true);
    const platform=platforms.join(', ');
    const btn=m.querySelector('#on-save'); btn.disabled=true; btn.textContent='Creating…';
    const {data:o, error:e1} = await db.from('onboardings').insert({brand_id:brandId, name:brandName+' — '+platform, platform, platforms, go_live:date, status:'active', workspace_id:m.querySelector('#on-ws').value||null, lead_id:m.querySelector('#on-lead').value||null, created_by:S.me.id}).select().single();
    if(e1){ btn.disabled=false; btn.textContent='Create tracker'; return toast(e1.message, true); }
    const rows=obActivitiesFromChecklists(o, svcIds, 0);

    if(e2){ btn.disabled=false; btn.textContent='Create tracker'; return toast(e2.message, true); }
    OB.onboardings.unshift(o); OB.acts[o.id]=acts||[];
    logActivity('onboarding', o.id, 'created', {services:svcIds.length, go_live:date});
    closeModals(); toast(`Tracker created with ${rows.length} activities`); location.hash='#/onboarding/'+o.id;
  };
}
/* rows for the activities table, from each service's checklist, deadlines computed from go-live */
function obActivitiesFromChecklists(o, typeIds, startPos){
  const rows=[]; let pos=startPos||0;
  typeIds.forEach(tid=>{ const t=obType(tid); const tpl=obChecklistOf(tid); if(!t||!tpl) return;
    obChecklistRows(tpl).forEach(tt=>{ const unit=tpl.offset_unit||'calendar';
      rows.push({onboarding_id:o.id, service_type_id:tid, service_name:t.name, code:tt.code, phase:tt.phase||null, title:tt.title,
        crea_delivers:tt.evidence_rule||null, brand_provides:tt.required_input||null, responsibility:tt.responsibility||null,
        team_id:tt.team_id||null, assignee_id:tt.default_assignee_id||null, offset_days:tt.offset_wd, offset_unit:unit,
        deadline: (tt.offset_wd!=null && o.go_live)? obAnchor(o.go_live, tt.offset_wd, unit) : null,
        status: 'not_started', position: ++pos}); }); });
  return rows;
}

      <td class="ed"><input type="date" value="${a.done_date||''}" onchange="obSetDone('${a.id}',this.value)"></td>
      <td class="ed"><select class="ob-stsel ${a.status}" onchange="obSetStatus('${a.id}',this.value)">${OB_STATUS.map(st=>`<option value="${st.k}" ${st.k===a.status?'selected':''}>${st.label}</option>`).join('')}</select></td>
      <td class="ed"><input class="ob-remark" value="${esc(a.remark||'')}" placeholder="…" onchange="obSetAct('${a.id}',{remark:this.value.trim()||null},false)"></td>
    </tr>`;
  let body='';
  acts.forEach(a=>{
    if(a.service_name!==lastSvc){ lastSvc=a.service_name; lastPh=null; svcIdx++; const sv=s.byService[a.service_name]||{n:0,d:0}; const svActs=acts.filter(x=>x.service_name===a.service_name);
      body+=`<tr class="svc"><td colspan="11">${String.fromCharCode(64+svcIdx)} · ${esc(a.service_name.toUpperCase())}<span class="sp">${svActs.length} activities · ${[...new Set(svActs.map(x=>x.phase).filter(Boolean))].length} phases · ${sv.d}/${sv.n} done</span></td></tr>`; }
    const key=a.service_name+'|'+(a.phase||'');
    if((a.phase||'')!==lastPh){ lastPh=a.phase||''; const n=acts.filter(x=>x.service_name===a.service_name && (x.phase||'')===lastPh); const d=n.filter(x=>x.status==='done').length;
      body+=`<tr class="ph" data-key="${esc(key)}" onclick="obTogglePhase('${oid}',this.dataset.key)"><td colspan="11">${col[key]?'▸':'▾'} ${esc(lastPh||'Activities')} <span class="n">· ${d}/${n.length} done${col[key]? ' · collapsed':''}</span></td></tr>`; }
    if(!col[key]) body+=rowHTML(a);
  });
  const unit=(acts[0]||{}).offset_unit||'calendar';
  C.innerHTML = `
    <div class="ob-head"><h1>${esc(o.name)}</h1>
      ${o.status&&o.status!=='active'? `<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${esc(o.status.replace('_',' '))}</span>`:''}

      <button class="btn btn-ghost" onclick="obAddActivityModal('${oid}')">＋ Activity</button>
      <button class="btn btn-ghost" onclick="obExport('${oid}')">Export Excel</button>

      <button class="btn btn-ghost" onclick="obTrackerMenu(this,'${oid}')" aria-label="More">⋯</button>

      <thead><tr><th style="width:40px">#</th><th style="min-width:200px">Activity</th><th class="ob-desc" style="min-width:140px">What CREA delivers</th><th class="ob-desc" style="min-width:140px">What brand provides</th><th>Team</th><th>PIC</th><th title="Days before go-live">D-</th><th>Deadline</th><th>Done</th><th>Status</th><th>Remark</th></tr></thead>

}
function obTogglePhase(oid, key){ const c=OB.collapsed[oid]=OB.collapsed[oid]||{}; c[key]=!c[key]; obRenderTracker(oid); }
function obFindAct(aid){ for(const k in OB.acts){ const a=OB.acts[k].find(x=>x.id===aid); if(a) return a; } return null; }
async function obSetAct(aid, patch, rerender){
  const a=obFindAct(aid); if(!a) return;
  const {data, error} = await db.from('onboarding_activities').update(patch).eq('id',aid).select().single();
  if(error) return toast(error.message, true);
  Object.assign(a, data);
  if(rerender!==false) obRenderTracker(a.onboarding_id);
}
function obSetStatus(aid, st){
  const a=obFindAct(aid); if(!a) return; const patch={status:st};
  if(st==='done' && !a.done_date) patch.done_date=obISO(obToday());
  if(st!=='done' && a.status==='done') patch.done_date=null;
  obSetAct(aid, patch);
}
function obSetDone(aid, v){
  const a=obFindAct(aid); if(!a) return; const patch={done_date:v||null};
  if(v && a.status!=='done') patch.status='done';
  if(!v && a.status==='done') patch.status='in_progress';
  obSetAct(aid, patch);
}
function obSetDays(aid, v){
  const a=obFindAct(aid); if(!a) return; const o=OB.onboardings.find(x=>x.id===a.onboarding_id);
  const days = v===''? null : parseInt(v);
  const patch={offset_days: (days==null||isNaN(days))? null : days};
  patch.deadline = (patch.offset_days!=null && o && o.go_live)? obAnchor(o.go_live, patch.offset_days, a.offset_unit||'calendar') : a.deadline;
  obSetAct(aid, patch);
}

/* ---------- xlsx import (Store Live Tracker layout) ---------- */
const OB_TEAM_CODE_HINTS = {BD:'Business Dev', OB:'Onboarding', KAM:'Commercial', GRAPHIC:'Creative', DATA:'Tech', TECH:'Tech', CS:'Customer Service', MKT:'Marketing', LIVE:'Livestream', WAREHOUSE:'Warehouse', SUPPLY:'Supply', FINANCE:'Finance', HR:'HR'};
function obParseChecklist(aoa){
  const norm = v => (v==null? '' : String(v)).replace(/\s+/g,' ').trim();
  let hi=-1, col={};
  for(let i=0;i<aoa.length && i<60;i++){
    const row=(aoa[i]||[]).map(norm); const li=row.map(x=>x.toLowerCase());
    const a=li.findIndex(x=>x==='activity'), d=li.findIndex(x=>/days vs go-?live/.test(x));
    if(a>=0 && d>=0){ hi=i; col={phase:li.findIndex(x=>x==='phase'), code:li.findIndex(x=>x==='#'), activity:a, deliver:li.findIndex(x=>/what crea delivers/.test(x)), brand:li.findIndex(x=>/what brand provides/.test(x)), resp:li.findIndex(x=>/^responsib/.test(x)), team:li.findIndex(x=>/crea team/.test(x)), days:d}; break; }
  }
  if(hi<0) return {error:'No header row with "Activity" and "Days vs Go-Live" found. Is this the Store Live Tracker sheet?'};
  const get=(row,k)=> col[k]>=0? norm(row[col[k]]) : '';
  const sections=[]; let cur=null, phase=''; const codes=new Set();
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i]||[]; const ph=get(row,'phase'), code=get(row,'code'), act=get(row,'activity');
    if(/^crea e-?mail|^shop link|^lead:/i.test(ph)) break;
    if(ph && !code && !act && (/^[A-Z]\.\s/.test(ph) || /\|/.test(ph))){
      const parts=ph.replace(/^[A-Z]\.\s*/,'').split('|').map(x=>x.trim());
      const nm=parts[0].toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\s+Service$/,'');
      cur={title:ph, name:nm+(parts[1]? ' — '+parts[1]:''), channel:parts[1]||'', tasks:[]}; sections.push(cur); phase=''; continue;
    }
    if(ph) phase=ph;
    if(!code || !act) continue;
    if(!cur){ cur={title:'Checklist', name:'Checklist', channel:'', tasks:[]}; sections.push(cur); }
    const days=get(row,'days'); let offset=null;
    if(/go-?live/i.test(days)) offset=0; else { const m=days.match(/([+-]?)\s*(\d+)/); if(m) offset=(m[1]==='+'? -1:1)*parseInt(m[2]); }
    const teams=get(row,'team').split(/[,/&]+/).map(x=>x.trim().toUpperCase()).filter(Boolean); teams.forEach(t=>codes.add(t));
    cur.tasks.push({code:code.toUpperCase(), title:act, phase, deliverable:get(row,'deliver'), brand_input:get(row,'brand'), responsibility:get(row,'resp'), teams, offset});
  }
  return {sections:sections.filter(s=>s.tasks.length), teamCodes:[...codes]};
}
function obGuessTeam(code){
  const hint=OB_TEAM_CODE_HINTS[code]||code; const t=(S.teams||[]).find(x=>x.name.toLowerCase().startsWith(hint.toLowerCase())) || (S.teams||[]).find(x=>x.name.toLowerCase().includes(hint.toLowerCase()));
  return t? t.id : '';
}
function obImportPick(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
    if(typeof XLSX==='undefined') return toast('Excel reader not loaded — reload and try again', true);
    const wb=XLSX.read(await f.arrayBuffer(), {cellDates:true}); let parsed=null;
    for(const n of wb.SheetNames){ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}); const r=obParseChecklist(aoa); if(!r.error){ parsed=r; break; } }
    if(!parsed) return toast('No Store Live Tracker sheet found in '+f.name, true);
    obImportPreview(parsed, f.name);
  };
  inp.click();
}
function obImportPreview(parsed, fileName){
  const m = modal(`<div class="modal-head"><h2>Import checklist · ${esc(fileName)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <p class="muted" style="margin:0 0 6px;color:var(--ink3);font-size:13px">${parsed.sections.length} service section${parsed.sections.length===1?'':'s'}, ${parsed.sections.reduce((n,s)=>n+s.tasks.length,0)} activities. Days vs Go-Live are read as calendar days (the sheet's rule). Importing into an existing checklist replaces its rows; trackers already created keep theirs.</p>
      ${parsed.sections.map((sec,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px"><b>${esc(sec.title)}</b> <span style="color:var(--ink3)">· ${sec.tasks.length} activities</span>
        <label>Checklist</label><select id="imp-type-${i}"><option value="__new">＋ Create "${esc(sec.name)}"</option>${OB.types.map(t=>`<option value="${t.id}" ${t.name===sec.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`).join('')}
      <label>CREA team codes → DONE teams</label>
      <div class="ob-grid2">${parsed.teamCodes.map(c=>`<div><label style="margin-top:6px">${esc(c)}</label><select id="imp-team-${esc(c)}"><option value="">— unassigned —</option>${(S.teams||[]).map(t=>`<option value="${t.id}" ${t.id===obGuessTeam(c)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`).join('')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="imp-go">Import</button></div>`, true);
  m.querySelector('#imp-go').onclick = async ()=>{
    const btn=m.querySelector('#imp-go'); btn.disabled=true; btn.textContent='Importing…';
    const teamMap={}; parsed.teamCodes.forEach(c=>{ teamMap[c]=m.querySelector('#imp-team-'+CSS.escape(c))?.value||''; });
    let made=0, lastType=null;
    for(let i=0;i<parsed.sections.length;i++){
      const sec=parsed.sections[i]; let typeId=m.querySelector('#imp-type-'+i).value;
      if(typeId==='__new'){
        const code=(sec.name.replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).map(w=>w.slice(0,5)).join('_').toUpperCase().slice(0,30))||('SVC_'+(OB.types.length+1));
        const {data:st, error} = await db.from('service_types').insert({code, name:sec.name, channels:sec.channel? [sec.channel]:[], scope_level:'store', team_id:teamMap[(sec.tasks[0]||{}).teams?.[0]]||null, position:OB.types.length+10}).select().single();
        if(error){ btn.disabled=false; btn.textContent='Import'; return toast(error.message, true); }
        OB.types.push(st); typeId=st.id;
      }
      // a fresh version per import; the previous one is retired so trackers created from it are unaffected
      const existing=OB.templates.filter(t=>t.service_type_id===typeId); const v=(Math.max(0,...existing.map(t=>t.version)))+1;
      for(const old of existing){ if(old.status==='published'){ await db.from('service_templates').update({status:'retired'}).eq('id',old.id); old.status='retired'; } }
      const {data:tpl, error:e2} = await db.from('service_templates').insert({service_type_id:typeId, version:v, name:(obType(typeId)||{}).name+' v'+v, status:'published', offset_unit:'calendar', source:fileName, published_at:new Date().toISOString(), created_by:S.me.id}).select().single();
      if(e2){ btn.disabled=false; btn.textContent='Import'; return toast(e2.message, true); }
      const rows=sec.tasks.map((t,j)=>({template_id:tpl.id, code:t.code, title:t.title, phase:t.phase||null, scope_level:'service', duration_wd:1, offset_wd:t.offset,
        team_id:teamMap[t.teams[0]]||null, responsibility:t.responsibility||null, evidence_rule:t.deliverable||null, required_input:t.brand_input||null, gate:false, input_wait:/^brand$/i.test(t.responsibility), position:j+1}));
      const {data:tt, error:e3} = await db.from('template_tasks').insert(rows).select();
      if(e3){ btn.disabled=false; btn.textContent='Import'; return toast(e3.message, true); }
      OB.templates.push(tpl); OB.ttasks.push(...(tt||[])); made++; lastType=typeId;
    }
    closeModals(); toast(made+' checklist'+(made===1?'':'s')+' imported'); location.hash='#/onboarding/checklists/'+lastType;
  };
}
</script>
