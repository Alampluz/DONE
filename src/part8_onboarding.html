<style>
/* ============================================================================
   ONBOARDING — BD → Onboarding registry + scheduler (Blueprint stages 1–2, 13 Oct 2026)
   Brand master = public.brands. Stores and service subscriptions are separate rows.
   BD confirmation gates every service. Plans are back-scheduled in WORKING days from
   the go-live date and, on approval, become REAL tasks on the team boards.
   ============================================================================ */
.ob-wrap{display:flex;flex-direction:column;gap:14px}
.ob-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.ob-grid{grid-template-columns:1fr}}
.ob-sec{padding:14px 16px}
.ob-sec h3{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ob-sec h3 .sp{flex:1}
.ob-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:0 0 12px}
.ob-kv b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.ob-kv div{font-size:13.5px}
.ob-feas{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:4px 10px;border-radius:20px}
.ob-feas.feasible{background:var(--green-soft);color:var(--green)}
.ob-feas.at_risk{background:var(--amber-soft);color:var(--amber)}
.ob-feas.infeasible{background:var(--red-soft);color:var(--red)}
.ob-plan .tbl td{padding:8px 12px;font-size:13px}
.ob-plan .ws{background:var(--gray-soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.ob-plan .late td{background:var(--red-soft)}
.ob-plan .soon td{background:var(--amber-soft)}
.ob-dep{font-size:11.5px;color:var(--ink3)}
.ob-bar{height:8px;border-radius:6px;background:var(--gray-soft);overflow:hidden;margin:6px 0 4px}
.ob-bar i{display:block;height:100%;background:var(--green)}
.ob-chip-row{display:flex;flex-wrap:wrap;gap:6px}
.ob-store{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.ob-store h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
.ob-store h4 .sp{flex:1}
.ob-svc{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.ob-svc:first-of-type{border-top:none}
.ob-svc .nm{flex:1}
.ob-muted{color:var(--ink3);font-size:12.5px}
.ob-search{width:280px;max-width:100%}
.ob-rowbtn{text-align:right;white-space:nowrap}
.ob-gate{font-size:11px;font-weight:700;color:var(--purple);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px}
.ob-tt-edit{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.ob-missing{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
</style>
<script>
/* ---------- state ---------- */
let obTab = 'brands';
const OB = { loaded:false, types:[], templates:[], ttasks:[], stores:[], services:[], confirms:[], projects:[], links:[], changes:[] };
window.obTeamBoards = window.obTeamBoards || {};   // team id -> board id chosen this session

const OB_SVC_STATUS = {
  proposed:  {label:'Proposed',   bg:'var(--amber-soft)', ink:'var(--amber)'},
  confirmed: {label:'BD confirmed', bg:'var(--accent-soft)', ink:'var(--accent-ink)'},
  onboarding:{label:'Onboarding', bg:'var(--purple-soft)', ink:'var(--purple)'},
  live:      {label:'Live',       bg:'var(--green-soft)', ink:'var(--green)'},
  paused:    {label:'Paused',     bg:'var(--gray-soft)',  ink:'var(--ink2)'},
  ended:     {label:'Ended',      bg:'var(--gray-soft)',  ink:'var(--ink3)'},
};
const OB_PROJ_STATUS = {
  draft:'Draft', review:'In review', approved:'Approved', in_progress:'In progress', live:'Live', cancelled:'Cancelled'
};
const OB_PLATFORMS = ['Shopee','Lazada','TikTok Shop','Brand.com','Other'];

function obSvcChip(st){ const s = OB_SVC_STATUS[st]||{label:st,bg:'var(--gray-soft)',ink:'var(--ink2)'}; return `<span class="chip" style="background:${s.bg};color:${s.ink}">${esc(s.label)}</span>`; }
function obFeasChip(f){ if(!f) return '<span class="ob-muted">Not calculated</span>'; const l={feasible:'Feasible',at_risk:'At risk',infeasible:'Infeasible'}[f]||f; return `<span class="ob-feas ${f}">${l}</span>`; }
const obType  = id => OB.types.find(t=>t.id===id);
const obStore = id => OB.stores.find(s=>s.id===id);
const obBrand = id => (S.brandsList||[]).find(b=>b.id===id);
const obTeamName = id => (teamById(id)||{}).name || 'Unassigned team';
const obIsSuper = () => !!(S.me && ['admin','management'].includes(S.me.role));

/* ---------- working-day calendar (the SLA engine's own: sla_holidays + sla_settings.work_days) ---------- */
const obD   = s => s instanceof Date ? new Date(s) : new Date(String(s).slice(0,10)+'T00:00:00');
const obISO = x => { const d=obD(x); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const obAddDays = (x,n) => { const d=obD(x); d.setDate(d.getDate()+n); return d; };
const obToday = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
function obHolidays(){ const h = S.slaHolidays; return Array.isArray(h)? h.map(x=>x.day||x) : []; }
function obWorkDays(){ const w = S.slaWorkDays; return Array.isArray(w)&&w.length? w : [1,2,3,4,5]; }
function obIsWorkDay(d){ const iso=((obD(d).getDay()+6)%7)+1; return obWorkDays().includes(iso) && !obHolidays().includes(obISO(d)); }
/* n working days BEFORE x (n=0 → x itself, moved back onto a working day). */
function obBack(x, n){ let d=obD(x), left=n, g=0; while(g++<3000){ if(left<=0 && obIsWorkDay(d)) break; d=obAddDays(d,-1); if(obIsWorkDay(d)) left--; if(left<=0 && obIsWorkDay(d)) break; } return obISO(d); }
/* n working days AFTER x */
function obFwd(x, n){ let d=obD(x), left=n, g=0; while(g++<3000){ if(left<=0 && obIsWorkDay(d)) break; d=obAddDays(d,1); if(obIsWorkDay(d)) left--; if(left<=0 && obIsWorkDay(d)) break; } return obISO(d); }
/* Where an anchored task lands. offset = days BEFORE go-live (negative = after).
   working:  count working days back (or forward).
   calendar: the checklist's WORKDAY(golive+n+1,-1) — calendar days, then the last working day on or before. */
function obAnchor(goLive, offset, unit){
  if(unit==='calendar') return obBack(obAddDays(goLive, -offset), 0);
  return offset>=0 ? obBack(goLive, offset) : obFwd(goLive, -offset);
}
/* working days strictly between a and b (a<b) */
function obWDBetween(a,b){ let d=obAddDays(a,1), n=0, g=0; const end=obD(b); while(d<end && g++<3000){ if(obIsWorkDay(d)) n++; d=obAddDays(d,1); } return n; }
let obCalLoading=null;
function obLoadCalendar(){
  if(S.slaHolidays!==undefined || obCalLoading || typeof db==='undefined') return Promise.resolve();
  obCalLoading = Promise.all([
    db.from('sla_holidays').select('day').order('day'),
    db.from('sla_settings').select('work_days').limit(1)
  ]).then(([h,st])=>{
    S.slaHolidays = (h&&h.data)? h.data.map(r=>r.day) : [];
    S.slaWorkDays = (st&&st.data&&st.data[0]&&Array.isArray(st.data[0].work_days))? st.data[0].work_days : [1,2,3,4,5];
  }).catch(()=>{ S.slaHolidays=[]; });
  return obCalLoading;
}

/* ---------- data ---------- */
async function obLoad(force){
  if(OB.loaded && !force) return;
  const [ty, tp, tt, st, sv, cf, pj, ln, ch, ops] = await Promise.all([
    db.from('service_types').select('*').order('position'),
    db.from('service_templates').select('*').order('version'),
    db.from('template_tasks').select('*').order('position'),
    allRows(()=>db.from('brand_stores').select('*').order('name')),
    allRows(()=>db.from('brand_services').select('*').order('created_at')),
    allRows(()=>db.from('bd_confirmations').select('*').order('confirmed_at',{ascending:false})),
    db.from('onboarding_projects').select('*').order('created_at',{ascending:false}),
    allRows(()=>db.from('onboarding_task_links').select('*').order('created_at')),
    db.from('go_live_changes').select('*').order('created_at',{ascending:false}),
    allRows(()=>db.from('onboarding_project_services').select('*').order('project_id')),
  ]);
  const err = [ty,tp,tt,st,sv,cf,pj,ln,ch,ops].find(r=>r&&r.error);
  if(err){ OB.error = err.error.message; }
  OB.types=ty.data||[]; OB.templates=tp.data||[]; OB.ttasks=tt.data||[]; OB.stores=st.data||[]; OB.services=sv.data||[];
  OB.confirms=cf.data||[]; OB.projects=pj.data||[]; OB.links=ln.data||[]; OB.changes=ch.data||[];
  OB.projects.forEach(p=>{ p._svc=[]; p._tpl={}; });
  (ops.data||[]).forEach(r=>{ const p=OB.projects.find(x=>x.id===r.project_id); if(!p) return; p._svc.push(r.brand_service_id); if(r.template_id) p._tpl[r.brand_service_id]=r.template_id; });
  OB.loaded = true;
  await obLoadCalendar();
}
const obStoresOf   = bid => OB.stores.filter(s=>s.brand_id===bid);
const obServicesOf = bid => OB.services.filter(s=>s.brand_id===bid && s.status!=='ended');
const obProjectsOf = bid => OB.projects.filter(p=>p.brand_id===bid);
const obConfirmOf  = sid => OB.confirms.find(c=>c.brand_service_id===sid);
const obPublishedTemplate = typeId => OB.templates.filter(t=>t.service_type_id===(typeId||null) && t.status==='published').sort((a,b)=>b.version-a.version)[0];
const obTemplateById = id => OB.templates.find(t=>t.id===id);

/* ---------- router entry ---------- */
async function renderOnboarding(sub, id){
  const _nav = S.nav;
  if(!isStaff()){ $('#content').innerHTML='<div class="card empty">Onboarding is for staff.</div>'; return; }
  setTopbar('Onboarding');
  const C=$('#content'); if(!OB.loaded) C.innerHTML='<div class="empty">Loading…</div>';
  await obLoad();
  if(navStale(_nav)) return;
  if(OB.error && /does not exist|relation/.test(OB.error)){
    C.innerHTML=`<div class="card empty" style="padding:30px">Onboarding tables are not applied yet.<br><span class="ob-muted">Run <code>migrations/2026-10-13_onboarding_registry.sql</code> and reload.</span></div>`; return;
  }
  if(sub==='brand' && id)   return obRenderBrand(id);
  if(sub==='project' && id) return obRenderProject(id);
  if(sub && ['brands','projects','catalogue'].includes(sub)) obTab = sub;
  C.innerHTML = `
    <div class="page-head"><h1>Onboarding</h1>
      <div class="tabs">
        <button class="tab ${obTab==='brands'?'active':''}" onclick="obTab='brands';renderOnboarding()">Brand registry</button>
        <button class="tab ${obTab==='projects'?'active':''}" onclick="obTab='projects';renderOnboarding()">Onboarding projects</button>
        <button class="tab ${obTab==='catalogue'?'active':''}" onclick="obTab='catalogue';renderOnboarding()">Service catalogue</button>
      </div>
      <div class="actions">${obTab==='projects'? `<button class="btn btn-primary" onclick="obNewProjectPick()">＋ Start onboarding</button>`:''}</div>
    </div>
    <div id="ob-body"></div>`;
  if(obTab==='brands') obRenderBrandList();
  else if(obTab==='projects') obRenderProjectList();
  else obRenderCatalogue();
}

/* ======================= BRAND REGISTRY ======================= */
let obBrandQ = '';
function obRenderBrandList(){
  const B = $('#ob-body'); if(!B) return;
  const q = obBrandQ.trim().toLowerCase();
  const brands = (S.brandsList||[]).filter(b=>b.active!==false).filter(b=>!q || (b.name||'').toLowerCase().includes(q));
  B.innerHTML = `
    <div class="card ob-sec">
      <h3>Brands <span class="ob-muted" style="font-weight:500">${brands.length}</span>${helpIcon('One master record per brand (the same list the boards use). Stores and service subscriptions hang off it — adding a service never creates a second brand.')}
        <span class="sp"></span>
        <input class="ob-search" id="ob-q" placeholder="Search brands…" value="${esc(obBrandQ)}" oninput="obBrandQ=this.value;obRenderBrandList();const i=document.getElementById('ob-q');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
      </h3>
      <table class="tbl"><thead><tr><th>Brand</th><th>Stores</th><th>Services</th><th>Onboarding</th><th></th></tr></thead><tbody>
      ${brands.slice(0,300).map(b=>{
        const st=obStoresOf(b.id), sv=obServicesOf(b.id), pj=obProjectsOf(b.id).filter(p=>!['live','cancelled'].includes(p.status));
        const counts={}; sv.forEach(s=>counts[s.status]=(counts[s.status]||0)+1);
        return `<tr class="rowlink" onclick="location.hash='#/onboarding/brand/${b.id}'">
          <td style="font-weight:600">${esc(b.name)}${b.brand_group? ` <span class="ob-muted">· ${esc(b.brand_group)}</span>`:''}</td>
          <td>${st.length? st.map(s=>`<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${esc(s.platform)}</span>`).join(' ') : '<span class="ob-muted">none yet</span>'}</td>
          <td><div class="ob-chip-row">${Object.keys(counts).map(k=>`<span class="chip" style="background:${OB_SVC_STATUS[k]?.bg};color:${OB_SVC_STATUS[k]?.ink}">${counts[k]} ${OB_SVC_STATUS[k]?.label||k}</span>`).join('')||'<span class="ob-muted">—</span>'}</div></td>
          <td>${pj.length? pj.map(p=>`<a href="#/onboarding/project/${p.id}" onclick="event.stopPropagation()">${esc(p.name)}</a> ${obFeasChip(p.feasibility)}`).join('<br>') : '<span class="ob-muted">—</span>'}</td>
          <td class="ob-rowbtn"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();location.hash='#/onboarding/brand/${b.id}'">Open</button></td>
        </tr>`; }).join('') || `<tr><td colspan="5" class="empty">No brands match</td></tr>`}
      </tbody></table>
      ${brands.length>300? `<div class="ob-muted" style="padding:8px 0 0">Showing the first 300 — narrow the search.</div>`:''}
    </div>`;
}

async function obRenderBrand(bid){
  const b = obBrand(bid); const C=$('#content');
  if(!b){ C.innerHTML='<div class="card empty">Brand not found</div>'; return; }
  setTopbar(`<a href="#/onboarding">Onboarding</a> › ${esc(b.name)}`);
  const stores = obStoresOf(bid), services = obServicesOf(bid), projects = obProjectsOf(bid);
  const brandLevel = services.filter(s=>!s.store_id);
  const svcRow = s => {
    const t=obType(s.service_type_id)||{}; const c=obConfirmOf(s.id);
    return `<div class="ob-svc">
      <span class="nm"><b>${esc(t.name||'Service')}</b>${s.effective_from? ` <span class="ob-muted">· from ${fmtDate(s.effective_from)}</span>`:''}${c? ` <span class="ob-muted">· confirmed ${fmtDate(c.confirmed_at)}${c.agreed_go_live? ', target '+fmtDate(c.agreed_go_live):''}</span>`:''}</span>
      ${obSvcChip(s.status)}
      ${s.status==='proposed'? `<button class="btn btn-primary btn-sm" onclick="obConfirmModal('${s.id}')">BD confirm</button>`:''}
      ${['confirmed','onboarding','live'].includes(s.status)? `<button class="btn btn-ghost btn-sm" onclick="obServiceStatus('${s.id}','${s.status==='live'?'paused':'ended'}')">${s.status==='live'?'Pause':'End'}</button>`:''}
      ${s.status==='paused'? `<button class="btn btn-ghost btn-sm" onclick="obServiceStatus('${s.id}','live')">Resume</button>`:''}
      ${s.status==='proposed'? `<button class="btn btn-ghost btn-sm" onclick="obServiceStatus('${s.id}','ended')">Remove</button>`:''}
    </div>`; };
  C.innerHTML = `
    <div class="page-head"><h1>${esc(b.name)}</h1>
      <div class="actions">
        <button class="btn btn-ghost" onclick="obStoreModal('${bid}')">＋ Store</button>
        <button class="btn btn-ghost" onclick="obServiceModal('${bid}')">＋ Service</button>
        <button class="btn btn-primary" onclick="obNewProjectModal('${bid}')">Start onboarding</button>
      </div></div>
    <div class="ob-grid">
      <div class="card ob-sec">
        <h3>Stores & services ${helpIcon('Every brand has its own service mix — select any combination per store or platform. BD confirmation is required before Onboarding sees a service; adding a service later only generates the new work.')}</h3>
        ${brandLevel.length? `<div class="ob-store"><h4>Brand-level services <span class="sp"></span></h4>${brandLevel.map(svcRow).join('')}</div>`:''}
        ${stores.map(st=>{ const sv=services.filter(s=>s.store_id===st.id); return `<div class="ob-store">
          <h4><span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${esc(st.platform)}</span> ${esc(st.name)} <span class="ob-muted">${st.platform_store_id? 'ID '+esc(st.platform_store_id):''}</span><span class="sp"></span>
            <span class="chip" style="background:${st.launch_state==='live'?'var(--green-soft);color:var(--green)':'var(--gray-soft);color:var(--ink2)'}">${esc(st.launch_state)}</span>
            <button class="btn btn-ghost btn-sm" onclick="obServiceModal('${bid}','${st.id}')">＋ Service</button></h4>
          ${sv.map(svcRow).join('') || '<div class="ob-muted">No services on this store yet.</div>'}
        </div>`; }).join('') || (brandLevel.length? '' : '<div class="empty">No stores yet. Add the first store, then its services.</div>')}
      </div>
      <div>
        <div class="card ob-sec">
          <h3>Onboarding projects</h3>
          ${projects.length? `<table class="tbl"><thead><tr><th>Project</th><th>Go-live</th><th>Status</th><th></th></tr></thead><tbody>
            ${projects.map(p=>`<tr class="rowlink" onclick="location.hash='#/onboarding/project/${p.id}'"><td style="font-weight:600">${esc(p.name)}</td><td>${fmtDate(p.baseline_go_live||p.target_go_live)||'—'}</td><td>${esc(OB_PROJ_STATUS[p.status]||p.status)} ${obFeasChip(p.feasibility)}</td><td class="ob-rowbtn"><button class="btn btn-ghost btn-sm">Open</button></td></tr>`).join('')}
          </tbody></table>` : '<div class="ob-muted">None yet. Confirm the services, then start onboarding.</div>'}
        </div>
        <div class="card ob-sec" style="margin-top:14px">
          <h3>BD confirmations ${helpIcon('The commercial gate. Each confirmation records what was agreed, the promised go-live and the evidence, so Onboarding never starts on an unconfirmed scope.')}</h3>
          ${OB.confirms.filter(c=>services.some(s=>s.id===c.brand_service_id)).map(c=>{ const s=services.find(x=>x.id===c.brand_service_id); const t=obType(s.service_type_id)||{}; const st=s.store_id? obStore(s.store_id):null;
            return `<div class="ob-svc"><span class="nm"><b>${esc(t.name||'')}</b>${st? ` · ${esc(st.name)}`:''} <span class="ob-muted">· ${esc(c.kind)} · ${esc((prof(c.confirmed_by)||{}).full_name||'')} · ${fmtDateTime(c.confirmed_at)}</span>${c.evidence? `<br><span class="ob-muted">${esc(c.evidence)}</span>`:''}</span>${c.agreed_go_live? `<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">target ${fmtDate(c.agreed_go_live)}</span>`:''}</div>`; }).join('') || '<div class="ob-muted">No confirmations yet.</div>'}
        </div>
      </div>
    </div>`;
}

function obStoreModal(bid){
  const m = modal(`<div class="modal-head"><h2>Add store</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Platform</label><select id="os-platform">${OB_PLATFORMS.map(p=>`<option>${p}</option>`).join('')}</select>
      <label>Store name</label><input id="os-name" placeholder="e.g. ${esc((obBrand(bid)||{}).name||'Brand')} Official Store">
      <label>Platform store ID <span class="ob-muted">(stays the same when the name changes)</span></label><input id="os-pid" placeholder="optional">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="os-save">Add store</button></div>`);
  m.querySelector('#os-save').onclick = async ()=>{
    const name=m.querySelector('#os-name').value.trim(); if(!name) return toast('Store name is required', true);
    const {data, error} = await db.from('brand_stores').insert({brand_id:bid, name, platform:m.querySelector('#os-platform').value, platform_store_id:m.querySelector('#os-pid').value.trim()||null, created_by:S.me.id}).select().single();
    if(error) return toast(error.message, true);
    OB.stores.push(data); closeModals(); toast('Store added'); obRenderBrand(bid);
  };
}
function obServiceModal(bid, storeId){
  const stores = obStoresOf(bid);
  const m = modal(`<div class="modal-head"><h2>Add service</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Service</label><select id="osv-type">${OB.types.filter(t=>t.active).map(t=>`<option value="${t.id}">${esc(t.name)}${t.category? ' · '+esc(t.category):''}</option>`).join('')}</select>
      <label>Scope</label><select id="osv-store"><option value="">Brand-level (all stores)</option>${stores.map(s=>`<option value="${s.id}" ${s.id===storeId?'selected':''}>${esc(s.platform)} · ${esc(s.name)}</option>`).join('')}</select>
      <label>Notes</label><textarea id="osv-notes" rows="2" placeholder="Scope notes from the deal"></textarea>
      <p class="ob-muted" style="margin-top:10px">The service starts as <b>Proposed</b>. BD confirms it before Onboarding can plan it.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="osv-save">Add service</button></div>`);
  m.querySelector('#osv-save').onclick = async ()=>{
    const {data, error} = await db.from('brand_services').insert({brand_id:bid, store_id:m.querySelector('#osv-store').value||null, service_type_id:m.querySelector('#osv-type').value, notes:m.querySelector('#osv-notes').value.trim()||null, created_by:S.me.id}).select().single();
    if(error) return toast(/duplicate|unique/i.test(error.message)? 'That service is already on this brand/store.' : error.message, true);
    OB.services.push(data); closeModals(); toast('Service added as Proposed'); obRenderBrand(bid);
  };
}
function obConfirmModal(sid){
  const s = OB.services.find(x=>x.id===sid); if(!s) return;
  const t=obType(s.service_type_id)||{}; const hasOther = OB.services.some(x=>x.brand_id===s.brand_id && x.id!==sid && ['confirmed','onboarding','live'].includes(x.status));
  const m = modal(`<div class="modal-head"><h2>BD confirmation · ${esc(t.name||'')}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">

/* ---------- plan composition + working-day backward scheduler ---------- */
/* Returns {items:[{key, template_task_id, code, title, scope_key, scope_label, team_id, board_id, duration, offset, gate, input_wait, deps:[keys], start, due, required_input, evidence_rule}], feasibility, missingBoards:[team ids], warnings:[]} */
function obComposePlan(project, services, goLive){
  const items = []; const byKey = {};
  const storeIds = [...new Set(services.filter(s=>s.store_id).map(s=>s.store_id))];
  const scopeLabel = k => k==='brand'? 'Brand' : k.startsWith('store:')? ((obStore(k.slice(6))||{}).name||'Store') : (()=>{ const s=services.find(x=>'service:'+x.id===k); const st=s&&s.store_id? obStore(s.store_id):null; return st? st.name : 'Brand'; })();
  const add = (tt, scope_key, svc, tpl) => {
    const key = (tt.dedup_key||tt.code)+'@'+scope_key;
    if(byKey[key]){ byKey[key]._src.push(tt); return byKey[key]; }
    const it = {key, template_task_id:tt.id, code:tt.code, dedup_key:tt.dedup_key, title:tt.title, scope_key, scope_label:scopeLabel(scope_key),
      store_id: scope_key.startsWith('store:')? scope_key.slice(6) : (svc&&svc.store_id)||null,
      team_id:tt.team_id||null, board_id:tt.board_project_id||null, duration:Math.max(1,tt.duration_wd||1), offset:tt.offset_wd,
      gate:!!tt.gate, input_wait:!!tt.input_wait, required_input:tt.required_input||'', evidence_rule:tt.evidence_rule||'',
      phase:tt.phase||'', responsibility:tt.responsibility||'', offset_unit:(tpl&&tpl.offset_unit)||'working',
      depends_on_code:tt.depends_on_code||null, deps:[], _src:[tt], service_name:svc? ((obType(svc.service_type_id)||{}).name||'') : ''};
    byKey[key]=it; items.push(it); return it;
  };
  const instantiate = (tt, svc, tpl) => {
    if(tt.scope_level==='brand') add(tt, 'brand', svc, tpl);
    else if(tt.scope_level==='store'){ if(svc){ add(tt, svc.store_id? 'store:'+svc.store_id : 'brand', svc, tpl); } else if(storeIds.length) storeIds.forEach(id=>add(tt,'store:'+id, null, tpl)); else add(tt,'brand', null, tpl); }
    else add(tt, svc? 'service:'+svc.id : 'brand', svc, tpl);
  };
  const base = obPublishedTemplate(null);
  if(base) OB.ttasks.filter(t=>t.template_id===base.id).forEach(tt=>instantiate(tt, null, base));
  services.forEach(svc=>{
    const pinned = (project._tpl||{})[svc.id]; const tpl = (pinned && obTemplateById(pinned)) || obPublishedTemplate(svc.service_type_id);
    if(!tpl) return;
    OB.ttasks.filter(t=>t.template_id===tpl.id).forEach(tt=>instantiate(tt, svc, tpl));
  });
  // dependencies: predecessor = same code/dedup, closest matching scope (same key → same store → brand)
  items.forEach(it=>{
    if(!it.depends_on_code) return;
    const cands = items.filter(p=>p!==it && (p.code===it.depends_on_code || p.dedup_key===it.depends_on_code));
    const pick = cands.find(p=>p.scope_key===it.scope_key) || cands.find(p=>it.store_id && p.scope_key==='store:'+it.store_id) || cands.find(p=>p.scope_key==='brand') || cands[0];
    if(pick) it.deps.push(pick.key);
  });
  // tasks with no successor and no anchor finish before the anchored gate (go-live readiness / QA)
  const succ = {}; items.forEach(it=>it.deps.forEach(d=>{ (succ[d]=succ[d]||[]).push(it.key); }));
  const anchorGate = items.filter(it=>it.gate && it.offset!=null && it.offset>=0).sort((a,b)=>a.offset-b.offset)[0];
  items.forEach(it=>{ if(it.offset==null && !(succ[it.key]||[]).length && anchorGate && it!==anchorGate){ anchorGate.deps.push(it.key); (succ[it.key]=succ[it.key]||[]).push(anchorGate.key); } });
  // backward schedule
  const dueMemo = {}; const visiting = {};
  const dueOf = it => {
    if(dueMemo[it.key]) return dueMemo[it.key];
    if(visiting[it.key]){ return dueMemo[it.key] = obBack(goLive, 1); }   // cycle guard
    visiting[it.key]=true;
    let due = null;
    if(it.offset!=null) due = obAnchor(goLive, it.offset, it.offset_unit);
    const succs = (succ[it.key]||[]).map(k=>byKey[k]).filter(Boolean);
    succs.forEach(s=>{ const sd = dueOf(s); const sStart = obBack(sd, s.duration-1); const d = obBack(sStart, 1); if(!due || d<due) due=d; });
    if(!due) due = obBack(goLive, 1);
    visiting[it.key]=false;
    return dueMemo[it.key]=due;
  };
  items.forEach(it=>{ it.due = dueOf(it); it.start = obBack(it.due, it.duration-1); });
  // feasibility against today
  const today = obToday(); let feas='feasible';
  items.forEach(it=>{
    const linked = (project._links||{})[it.key];
    if(linked && linked.status==='done') { it.state='done'; return; }
    if(obD(it.start) < today) { it.state='late'; feas='infeasible'; }
    else if(obWDBetween(today, obD(it.start)) < 2){ it.state='soon'; if(feas==='feasible') feas='at_risk'; }
  });
  // boards
  items.forEach(it=>{ const k=it.team_id||'none'; if(obTeamBoards[k]) it.board_id = obTeamBoards[k]; });
  const missingBoards = [...new Set(items.filter(it=>!it.board_id).map(it=>it.team_id||'none'))];
  items.sort((a,b)=> (obTeamName(a.team_id)).localeCompare(obTeamName(b.team_id)) || a.start.localeCompare(b.start));
  return {items, feasibility:feas, missingBoards};
}

async function obHydrateProject(p){
  if(!p._svc){ p._svc=[]; p._tpl={}; }
  const links = OB.links.filter(l=>l.project_id===p.id);
  p._links = {};
  if(links.length){
    const ids = links.map(l=>l.task_id);
    const {data:tasks} = await allRows(()=>db.from('tasks').select('id,title,status,assignee_id,due_date,start_date,project_id,ticket_no').in('id', ids.slice(0,900)).order('id'));
    const tm = {}; (tasks||[]).forEach(t=>tm[t.id]=t);
    links.forEach(l=>{ p._links[l.plan_key] = tm[l.task_id]||{status:'?', missing:true}; });
  }
}

async function obGenerate(pid){
  const p = OB.projects.find(x=>x.id===pid); if(!p || !p._plan) return;
  const plan = p._plan;
  if(plan.missingBoards.length) return toast('Pick a board for every team first', true);
  if(!p.baseline_go_live && plan.feasibility==='infeasible' && !confirm('The plan is infeasible against today\'s date — some work would already have had to start. Create the tasks anyway?')) return;
  const goLive = p.baseline_go_live || p.target_go_live;
  const payload = plan.items.map(it=>({key:it.key, template_task_id:it.template_task_id, scope_key:it.scope_key, title:it.title,
    description:`Onboarding · ${p.name}\nScope: ${it.scope_label}${it.service_name? ' · '+it.service_name:''}\nRequired input: ${it.required_input||'—'}\nEvidence to complete: ${it.evidence_rule||'—'}\nGo-live: ${goLive}`,
    board_id:it.board_id, team_id:it.team_id, start:it.start, due:it.due, gate:it.gate, deps:it.deps}));
  const {data, error} = await db.rpc('ob_generate_tasks', {p_project:pid, p_plan:payload});
  if(error) return toast(error.message, true);
  const first = !p.baseline_go_live;
  const upd = {feasibility:plan.feasibility, status:'in_progress'}; if(first){ upd.baseline_go_live=goLive; upd.approved_by=S.me.id; upd.approved_at=new Date().toISOString(); }
  await db.from('onboarding_projects').update(upd).eq('id',pid);
  Object.assign(p, upd);
  // remember team → board defaults for the catalogue when allowed
  if(obIsSuper()){ const byTeam={}; plan.items.forEach(it=>{ if(it.team_id && it.board_id) byTeam[it.team_id]=it.board_id; });
    for(const [team, board] of Object.entries(byTeam)){ await db.from('template_tasks').update({board_project_id:board}).eq('team_id',team).is('board_project_id',null); OB.ttasks.forEach(t=>{ if(t.team_id===team && !t.board_project_id) t.board_project_id=board; }); } }
  const {data:links} = await db.from('onboarding_task_links').select('*').eq('project_id',pid);
  OB.links = OB.links.filter(l=>l.project_id!==pid).concat(links||[]);
  logActivity('onboarding_project', pid, first? 'plan_approved':'plan_updated', data||{});
  toast(`${data.inserted} task${data.inserted===1?'':'s'} created · ${data.redated} re-dated · ${data.deps} dependencies`);
  obRenderProject(pid);
}

function obChangePreview(pid){
  const p = OB.projects.find(x=>x.id===pid); const nd=document.getElementById('ogc-date').value; const out=document.getElementById('ogc-preview'); if(!p||!nd||!out) return;
  const services = OB.services.filter(s=>(p._svc||[]).includes(s.id));
  const np = obComposePlan(p, services, nd);
  const open = np.items.filter(it=>it.state!=='done');
  const late = np.items.filter(it=>it.state==='late').length;
  out.textContent = `Impact: ${open.length} open tasks re-dated · feasibility ${np.feasibility.replace('_',' ')}${late? ` · ${late} would already be late`:''} · earliest start ${fmtDate(open.map(i=>i.start).sort()[0]||nd)}`;
}
async function obDecideChange(cid, status){
  const c = OB.changes.find(x=>x.id===cid); if(!c) return;
  const p = OB.projects.find(x=>x.id===c.project_id);
  if(status==='approved' && !c.brand_agreed && !confirm('The brand has not agreed to this date yet. Approve anyway?')) return;
  const {error} = await db.from('go_live_changes').update({status, decided_by:S.me.id, decided_at:new Date().toISOString(), bd_confirmed_by: status==='approved'? S.me.id : null}).eq('id',cid);
  if(error) return toast(error.message, true);
  c.status=status;
  if(status==='approved' && p){
    const upd = {baseline_go_live:c.new_date}; if(!p.baseline_go_live) upd.target_go_live = p.target_go_live||c.new_date;
    await db.from('onboarding_projects').update(upd).eq('id',p.id); Object.assign(p, upd);
    logActivity('onboarding_project', p.id, 'golive_changed', {to:c.new_date});
    toast('Baseline moved to '+fmtDate(c.new_date)+(OB.links.some(l=>l.project_id===p.id)? ' — use "Update tasks from plan" to re-date the open tasks':''));
  } else toast('Change '+status);
  if(p) obRenderProject(p.id);
}

async function obNewVersion(tplId){
  const src = obTemplateById(tplId); if(!src) return;
  const existing = OB.templates.filter(t=>t.service_type_id===src.service_type_id); const v=(Math.max(0,...existing.map(t=>t.version)))+1;
  const {data, error} = await db.from('service_templates').insert({service_type_id:src.service_type_id, version:v, name:src.name.replace(/v\d+.*$/,'').trim()+' v'+v, status:'draft', offset_unit:src.offset_unit||'working', source:src.source||null, created_by:S.me.id}).select().single();
  if(error) return toast(error.message, true);
  const copies = OB.ttasks.filter(t=>t.template_id===tplId).map(t=>({template_id:data.id, code:t.code, title:t.title, scope_level:t.scope_level, duration_wd:t.duration_wd, offset_wd:t.offset_wd, depends_on_code:t.depends_on_code, dedup_key:t.dedup_key, team_id:t.team_id, board_project_id:t.board_project_id, required_input:t.required_input, evidence_rule:t.evidence_rule, gate:t.gate, input_wait:t.input_wait, phase:t.phase, responsibility:t.responsibility, position:t.position}));

}

    if(!confirm('Remove this task from the draft template?')) return;
    const {error} = await db.from('template_tasks').delete().eq('id',taskId); if(error) return toast(error.message, true);
    OB.ttasks = OB.ttasks.filter(x=>x.id!==taskId); closeModals(); toast('Removed'); obRenderCatalogue();
  });
}
async function obSetUnit(tplId, unit){
  const tpl=obTemplateById(tplId); if(!tpl) return;
  const {error} = await db.from('service_templates').update({offset_unit:unit}).eq('id',tplId); if(error) return toast(error.message, true);
  tpl.offset_unit=unit; toast('Lead time unit: '+unit+' days');
}

/* ======================= CHECKLIST IMPORT ======================= */
/* Parses the "Store Live Tracker" sheet of an Onboarding Checklist (Decathlon format, Oct 2026).
   Returns {sections:[{title, name, channel, tasks:[{code,title,phase,deliverable,brand_input,responsibility,teams:[codes],offset}]}], teamCodes:[…]} */
const OB_TEAM_CODE_HINTS = {BD:'Business Dev', OB:'Onboarding', KAM:'Commercial', GRAPHIC:'Creative', DATA:'Tech', TECH:'Tech', CS:'Customer Service', MKT:'Marketing', LIVE:'Livestream', WAREHOUSE:'Warehouse', SUPPLY:'Supply', FINANCE:'Finance', HR:'HR'};
function obParseChecklist(aoa){
  const norm = v => (v==null? '' : String(v)).replace(/\s+/g,' ').trim();
  let hi=-1, col={};
  for(let i=0;i<aoa.length && i<60;i++){
    const row=(aoa[i]||[]).map(norm); const li=row.map(x=>x.toLowerCase());
    const a=li.findIndex(x=>x==='activity'), d=li.findIndex(x=>/days vs go-?live/.test(x));
    if(a>=0 && d>=0){ hi=i; col={phase:li.findIndex(x=>x==='phase'), code:li.findIndex(x=>x==='#'), activity:a, deliver:li.findIndex(x=>/what crea delivers/.test(x)), brand:li.findIndex(x=>/what brand provides/.test(x)), resp:li.findIndex(x=>/^responsib/.test(x)), team:li.findIndex(x=>/crea team/.test(x)), days:d}; break; }
  }
  if(hi<0) return {error:'No header row with "Activity" and "Days vs Go-Live" found. Is this the Store Live Tracker sheet?'};
  const get=(row,k)=> col[k]>=0? norm(row[col[k]]) : '';
  const sections=[]; let cur=null, phase='';
  const codes=new Set();
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i]||[]; const ph=get(row,'phase'), code=get(row,'code'), act=get(row,'activity');
    if(/^crea e-?mail|^shop link|^lead:/i.test(ph)) break;
    if(ph && !code && !act && (/^[A-Z]\.\s/.test(ph) || /\|/.test(ph))){
      const parts=ph.replace(/^[A-Z]\.\s*/,'').split('|').map(x=>x.trim());
      const nm=parts[0].toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\s+Service$/,'');
      cur={title:ph, name:nm+(parts[1]? ' — '+parts[1]:''), channel:parts[1]||'', tasks:[]}; sections.push(cur); phase=''; continue;
    }
    if(ph) phase=ph;
    if(!code || !act) continue;
    if(!cur){ cur={title:'Checklist', name:'Checklist', channel:'', tasks:[]}; sections.push(cur); }
    const days=get(row,'days'); let offset=null;
    if(/go-?live/i.test(days)) offset=0; else { const m=days.match(/([+-]?)\s*(\d+)/); if(m) offset=(m[1]==='+'? -1:1)*parseInt(m[2]); }
    const teams=get(row,'team').split(/[,/&]+/).map(x=>x.trim().toUpperCase()).filter(Boolean); teams.forEach(t=>codes.add(t));
    cur.tasks.push({code:code.toUpperCase(), title:act, phase, deliverable:get(row,'deliver'), brand_input:get(row,'brand'), responsibility:get(row,'resp'), teams, offset});
  }
  return {sections:sections.filter(s=>s.tasks.length), teamCodes:[...codes]};
}
function obGuessTeam(code){
  const hint=OB_TEAM_CODE_HINTS[code]||code; const t=(S.teams||[]).find(x=>x.name.toLowerCase().startsWith(hint.toLowerCase())) || (S.teams||[]).find(x=>x.name.toLowerCase().includes(hint.toLowerCase()));
  return t? t.id : '';
}
function obImportPick(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
    if(typeof XLSX==='undefined') return toast('Excel reader not loaded — reload and try again', true);
    const wb=XLSX.read(await f.arrayBuffer(), {cellDates:true});
    let parsed=null;
    for(const n of wb.SheetNames){ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}); const r=obParseChecklist(aoa); if(!r.error){ parsed=r; break; } }
    if(!parsed) return toast('No Store Live Tracker sheet found in '+f.name, true);
    obImportPreview(parsed, f.name);
  };
  inp.click();
}
function obImportPreview(parsed, fileName){
  const m = modal(`<div class="modal-head"><h2>Import checklist · ${esc(fileName)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <p class="ob-muted" style="margin:0 0 6px">${parsed.sections.length} service section${parsed.sections.length===1?'':'s'}, ${parsed.sections.reduce((n,s)=>n+s.tasks.length,0)} activities. Offsets are read as <b>calendar days</b> rolled back to a working day (the sheet's WORKDAY rule) — change it on the template afterwards if you prefer working days. "Responsibility = Brand" becomes <i>waits on brand</i>. Each section becomes a <b>draft</b> version: review, mark the readiness gates, then publish.</p>
      ${parsed.sections.map((sec,i)=>`<div class="ob-store"><h4>${esc(sec.title)} <span class="ob-muted">· ${sec.tasks.length} tasks · ${[...new Set(sec.tasks.map(t=>t.phase))].filter(Boolean).length} phases</span></h4>
        <label>Service type</label><select id="imp-type-${i}"><option value="__new">＋ Create "${esc(sec.name)}"</option>${OB.types.map(t=>`<option value="${t.id}" ${t.name===sec.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
        <div class="ob-muted" style="margin-top:6px">${sec.tasks.slice(0,4).map(t=>esc(t.code+' '+t.title)).join(' · ')}${sec.tasks.length>4?' · …':''}</div></div>`).join('')}
      <label>CREA team codes → DONE teams</label>
      <div class="ob-tt-edit">${parsed.teamCodes.map(c=>`<div><label style="margin-top:6px">${esc(c)}</label><select id="imp-team-${esc(c)}"><option value="">— unassigned —</option>${(S.teams||[]).map(t=>`<option value="${t.id}" ${t.id===obGuessTeam(c)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`).join('')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="imp-go">Create draft templates</button></div>`, true);
  m.querySelector('#imp-go').onclick = async ()=>{
    const btn=m.querySelector('#imp-go'); btn.disabled=true; btn.textContent='Importing…';
    const teamMap={}; parsed.teamCodes.forEach(c=>{ teamMap[c]=m.querySelector('#imp-team-'+CSS.escape(c))?.value||''; });
    let made=0, lastTpl=null;
    for(let i=0;i<parsed.sections.length;i++){
      const sec=parsed.sections[i]; let typeId=m.querySelector('#imp-type-'+i).value;
      if(typeId==='__new'){
        const code=(sec.name.replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).map(w=>w.slice(0,5)).join('_').toUpperCase().slice(0,30))||('SVC_'+(OB.types.length+1));
        const {data:st, error} = await db.from('service_types').insert({code, name:sec.name, channels:sec.channel? [sec.channel]:[], scope_level:'store', team_id:teamMap[(sec.tasks[0]||{}).teams?.[0]]||null, position:OB.types.length+10}).select().single();
        if(error){ btn.disabled=false; btn.textContent='Create draft templates'; return toast(error.message, true); }
        OB.types.push(st); typeId=st.id;
      }
      const existing=OB.templates.filter(t=>t.service_type_id===typeId); const v=(Math.max(0,...existing.map(t=>t.version)))+1;
      const {data:tpl, error:e2} = await db.from('service_templates').insert({service_type_id:typeId, version:v, name:(obType(typeId)||{}).name+' v'+v, status:'draft', offset_unit:'calendar', source:fileName, created_by:S.me.id}).select().single();
      if(e2){ btn.disabled=false; btn.textContent='Create draft templates'; return toast(e2.message, true); }
      const rows=sec.tasks.map((t,j)=>({template_id:tpl.id, code:t.code, title:t.title, phase:t.phase||null, scope_level:(obType(typeId)||{}).scope_level==='brand'? 'brand':'service', duration_wd:1, offset_wd:t.offset,
        team_id:teamMap[t.teams[0]]||null, responsibility:t.responsibility||null, evidence_rule:t.deliverable||null, required_input:t.brand_input||null, gate:false, input_wait:/^brand$/i.test(t.responsibility), position:j+1}));
      const {data:tt, error:e3} = await db.from('template_tasks').insert(rows).select();
      if(e3){ btn.disabled=false; btn.textContent='Create draft templates'; return toast(e3.message, true); }
      OB.templates.push(tpl); OB.ttasks.push(...(tt||[])); made++; lastTpl=tpl.id;
    }
    if(lastTpl) logActivity('service_template', lastTpl, 'imported', {file:fileName, sections:made});
    closeModals(); toast(made+' draft template'+(made===1?'':'s')+' created — review and publish'); obRenderCatalogue();
  };
}
</script>
