name: Build, test, deploy

# Builds index.html from src/, runs every jsdom suite in tests/, and only then commits
# the built file that GitHub Pages serves. A failing suite blocks the deploy.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.sh'
      - 'run_tests.sh'
      - '.github/workflows/ci.yml'
      # A hand-uploaded root index.html (it has happened three times: 6 Sep twice, 9 Sep) went
      # live unchecked because nothing ran. Now it triggers a rebuild from src/, which
      # overwrites the upload within a couple of minutes. The bot's own deploy push does not
      # re-trigger (GITHUB_TOKEN pushes never do), and the job below also refuses to run for it.
      - 'index.html'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build.sh'
      - 'run_tests.sh'
  workflow_dispatch:

concurrency:
  group: build-test-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Say so loudly when the trigger was someone replacing the served bundle by hand.
      - name: Warn if the root index.html was edited directly
        if: github.event_name == 'push'
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qx 'index.html'; then
            echo "::warning title=index.html was uploaded by hand::${{ github.actor }} changed the served bundle directly. index.html is built from src/ and this run will overwrite the upload. Edit src/ instead."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build app/index.html from src/
        run: bash ./build.sh   # bash: files uploaded via the GitHub web UI land as 100644

      - name: Run the regression suites
        run: bash ./run_tests.sh

      # Only reached when every suite passed.
      - name: Publish the built bundle to the repo root
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cp app/index.html index.html
          if git diff --quiet -- index.html; then
            echo "index.html unchanged - nothing to deploy"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy: build from ${GITHUB_SHA::7}"
          # main can move while this job runs (uploads through the GitHub web UI land as
          # several commits seconds apart). Rebase onto the tip, keeping this build's
          # index.html, and retry the push rather than failing the deploy.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --hard origin/main; cp app/index.html index.html; git add index.html; git commit -m "Deploy: build from ${GITHUB_SHA::7}"; }
            if git push origin HEAD:main; then
              echo "deployed - users need a hard refresh (Ctrl/Cmd+Shift+R)"
              exit 0
            fi
            echo "push rejected (attempt $attempt) - main moved, retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after 4 attempts"; exit 1
