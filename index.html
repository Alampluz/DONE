/* Edit in place: the text swaps for an input; Enter saves, Escape cancels. */
function editComment(id){
  const c = (S._commentCache||{})[id]; if(!c) return;
  const body = document.querySelector(`.comment[data-cid="${id}"] .cmt-body`); if(!body) return;
  if(body.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.className = 'cmt-editbox'; inp.value = c.body||'';
  body.textContent=''; body.appendChild(inp); inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);
  let done=false;
  const cancel = ()=>{ if(done) return; done=true; body.innerHTML = renderMentionText(c.body, c.mentions); };
  const save = async ()=>{
    if(done) return;
    const val = inp.value.trim();
    if(!val || val===c.body) return cancel();
    done=true;
    const {data, error} = await db.from('comments')
      .update({body:val, edited_at:new Date().toISOString()}).eq('id',id).select().single();
    if(error){ done=false; return toast(error.message, true); }
    cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  };
  inp.onkeydown = e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') cancel(); };
  inp.onblur = ()=> setTimeout(save, 100);
}
function cacheComment(row){
  if(!row) return;
  const prev = (S._commentCache||{})[row.id];
  if(prev) row.atts = prev.atts;
  (S._commentCache = S._commentCache||{})[row.id] = row;
}
/* ---- task history ---- */
const statusLabel = k => (STATUSES.find(s=>s.k===k)||{}).label || k || '—';
const prioLabel   = k => (PRIORITIES.find(p=>p.k===k)||{}).label || k || '—';
const groupLabel  = id => ((S._groups||[]).find(g=>g.id===id)||{}).name || (id? 'another group':'no group');
const fieldLabel  = f => ({title:'Title', status:'Status', priority:'Priority', assignee:'Assignee',
                           due_date:'Due date', group:'Group', board:'Board', description:'Description',
                           archived:'Archive'})[f] || f;
function histValue(field, v, key){
  if(v===null || v===undefined || v==='') return '<em>empty</em>';
  if(field==='status')   return esc(statusLabel(v));
  if(field==='priority') return esc(prioLabel(v));
  if(field==='assignee') return esc(prof(v)?.full_name || 'someone');
  if(field==='group')    return esc(groupLabel(v));
  if(field==='board')    return esc(projById(v)?.name || 'another board');
  if(field==='due_date') return esc(fmtDate(v));
  return esc(String(v));
}
function histLine(a){
  const d = a.detail||{};
  switch(a.action){
    case 'created':        return 'created this task';
    case 'deleted':        return 'deleted this task';
    case 'commented':        return `commented${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_deleted':  return `removed a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_restored': return `restored a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_edited':   return `edited a comment${d.was? ` — “${esc(d.was)}” → “${esc(d.excerpt||'')}”` : (d.excerpt? ` — now “${esc(d.excerpt)}”`:'')}`;
    case 'file_added':     return `attached <b>${esc(d.file||'a file')}</b>`;
    case 'file_removed':   return `removed <b>${esc(d.file||'a file')}</b>`;
    case 'subtask_added':  return `added subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_removed':return `removed subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_status': return `marked subtask <b>${esc(d.title||'')}</b> ${esc(d.to==='done'?'done':'not done')}`;
    case 'checklist_added':  return `added checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_removed':return `removed checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_toggled':return `${d.done?'checked':'unchecked'} <b>${esc(d.label||'')}</b>`;
    case 'signoff_requested': return `requested a sign-off from <b>${esc(prof(d.approver)?.full_name||'someone')}</b>`;
    case 'signoff_approved':  return `approved the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    case 'signoff_rejected':  return `rejected the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    // entries written before the history engine existed
    case 'status_changed': return `changed <b>Status</b> from ${histValue('status',d.from)} to ${histValue('status',d.to)}`;
    case 'updated': {
      const cs = d.changes||[];
      if(!cs.length && d.status){ const rs=(typeof REQ_STATUSES!=='undefined'?REQ_STATUSES:[]).find(s=>s.k===d.status);
        return `moved this ticket to <b>${esc(rs?rs.label:d.status)}</b>`; }
      if(!cs.length) return 'made a change';
      return cs.map(c=>{
        if(c.field==='description') return 'edited the description';
        if(c.field==='archived')    return c.to==='archived'? 'archived this task' : 'restored this task';
        if(c.field==='custom'){
          const f = (S._fields||[]).find(x=>x.id===c.key);
          return `set <b>${esc(f?f.name:'a field')}</b> to ${histValue('custom', c.to)}`;
        }
        const from = histValue(c.field, c.from), to = histValue(c.field, c.to);
        if(c.field==='title') return `renamed it to <b>${to}</b>`;
        return `changed <b>${esc(fieldLabel(c.field))}</b> from ${from} to ${to}`;
      }).join(', ');
    }
    default: return esc(a.action.replace(/_/g,' '));
  }
}
function historyHTML(rows, showAll){
  if(!rows || !rows.length) return '<div style="color:var(--ink3);font-size:13px">Nothing recorded yet.</div>';
  const shown = showAll ? rows : rows.slice(0,8);
  return `<div class="hist">${shown.map(a=>{
    const who = prof(a.actor_id);
    const cid = a.action==='comment_deleted' ? (a.detail||{}).comment_id : null;
    const cRow = cid ? (S._commentCache||{})[cid] : null;
    const undo = cid && cRow && cRow.deleted_at && canRemoveComment(cRow)
      ? `<button class="hist-undo" onclick="undoDeleteComment('${cid}')">Undo</button>` : '';
    return `<div class="hist-row">
      ${avatar(who,true)}
      <div class="hist-txt"><b>${esc(who?.full_name||'Someone')}</b> ${histLine(a)}
        <span class="hist-when" title="${fmtDateTime(a.created_at)}">${timeAgo(a.created_at)}</span>${undo}</div>
    </div>`;
  }).join('')}</div>
  ${rows.length>8 && !showAll ? `<div class="hist-more" onclick="showAllHistory()">Show all ${rows.length} events</div>`:''}`;
}

  const ch = head.querySelector('.hist-chev'); if(ch) ch.textContent = box.hidden? '▸' : '▾';
}
/* Comments come back without their files; fetch them in one go and attach. */
async function hydrateCommentAtts(comments){
  const ids = (comments||[]).map(c=>c.id);
  if(!ids.length) return comments||[];
  const {data} = await db.from('attachments').select('*').eq('entity_type','comment').in('entity_id', ids).order('created_at');
  const by = {};
  (data||[]).forEach(a=> (by[a.entity_id] || (by[a.entity_id]=[])).push(a));
  comments.forEach(c=> c.atts = by[c.id] || []);
  return comments;
}
async function deleteTask(id, projectId){

  const {error} = await db.from('tasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  closeModals(); toast('Task deleted'); renderProject(projectId);
}

function exportRequestsCSV(){

function newRequestFlow(){

        <button class="btn btn-primary" onclick="closeModals();adminTab='types';location.hash='#/admin'">Open Request types</button>`
        : `<p style="margin:0;color:var(--ink2)">Ask an admin to create the first request type in Admin → Request types.</p>`}

function fieldInput(f){
  const req = f.required? '<span class="req">*</span>':'';
  if(f.type==='textarea') return `<label>${esc(f.label)} ${req}</label><textarea data-fk="${f.key}" rows="3"></textarea>`;
  if(f.type==='select') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select —</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='brand') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select brand —</option>${(S.brandsList||[]).filter(b=>b.active).map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`;
  if(f.type==='multiselect') return `<label>${esc(f.label)} ${req}</label><div style="display:flex;flex-wrap:wrap;gap:4px 16px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff">${(f.options||[]).map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink);cursor:pointer"><input type="checkbox" data-fkm="${f.key}" value="${esc(o)}" style="width:15px;height:15px;accent-color:var(--accent)">${esc(o)}</label>`).join('')}</div>`;
  return `<label>${esc(f.label)} ${req}</label><input data-fk="${f.key}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}">`;
}
function readField(m, f){
  if(f.type==='multiselect') return [...m.querySelectorAll(`input[data-fkm="${f.key}"]:checked`)].map(i=>i.value).join(', ');
  return m.querySelector(`[data-fk="${f.key}"]`)?.value?.trim()||'';
}
function newRequestForm(rtId){
  closeModals();
  const rt = S.requestTypes.find(x=>x.id===rtId); if(!rt) return;
  const m = modal(`<div class="modal-head"><h2>${esc(rt.name)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>${esc(rt.title_label||'Request title')} <span class="req">*</span></label><input id="rq-title" placeholder="${esc(rt.title_hint||'Short summary of this request')}">

      <p style="margin-top:14px;font-size:12px;color:var(--ink3)">Response SLA: ${rt.sla_hours} hours${rt.approval_required? ' · This request requires approval before work starts.':''}</p>
    </div>

    const data = {};
    for(const f of (rt.fields||[])){
      const v = readField(m, f);

      data[f.key]=v;

  };

async function decideApproval(id, status, reqIdToRefresh){
  let note = '';
  if(status==='rejected'){ note = prompt('Reason for rejection (optional):')||''; }
  const {data:a, error} = await db.from('approvals').update({status, note, decided_at:new Date().toISOString()}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  // reflect on the request if linked and staff
  if(a?.request_id){
    try{ await db.from('requests').update({status: status==='approved'?'approved':'rejected', decided_by:S.me.id, decided_at:new Date().toISOString(), decision_note:note}).eq('id',a.request_id).in('status',['submitted','in_review']); }catch(e){}
  }
  toast(status==='approved'? 'Approved':'Rejected'); logActivity('approval', id, status, {});
  updateApprovalBadge();
  closeModals();
  if(S.route.view==='approvals') renderApprovals(); else if(S.route.view==='home') renderHome(); else if(reqIdToRefresh) openRequest(reqIdToRefresh);
}

  const [tks, reqs, apprs] = await Promise.all([
    allRows(()=>db.from('tasks').select('id,project_id,title,status,priority,assignee_id,due_date,completed_at,created_at').order('id')),
    db.from('requests').select('id,ticket_no,title,status,sla_due_at,completed_at,created_at,request_type_id,decided_at,submitted_by,assigned_to'),
    db.from('approvals').select('id,status,request_id'),
  ]);
  let tasks=tks.data||[], requests=reqs.data||[], approvals=apprs.data||[];
  const scopeProjects = wsSel ? S.projects.filter(p=>p.workspace_id===wsSel) : S.projects;
  if(wsSel){
    const pidSet = new Set(scopeProjects.map(p=>p.id));
    tasks = tasks.filter(t=>pidSet.has(t.project_id));
    const rtSet = new Set(S.requestTypes.filter(rt=>rt.default_workspace_id===wsSel).map(rt=>rt.id));
    requests = requests.filter(r=>rtSet.has(r.request_type_id));
    const reqSet = new Set(requests.map(r=>r.id));
    approvals = approvals.filter(a=>a.request_id && reqSet.has(a.request_id));
  }
  const open = tasks.filter(t=>t.status!=='done');
  const overdue = open.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const dueWeek = open.filter(t=>t.due_date && daysDiff(t.due_date)>=0 && daysDiff(t.due_date)<=7);
  const doneTasks = tasks.filter(t=>t.status==='done');
  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;
  const openReqs = requests.filter(r=>['submitted','in_review','approved','in_progress'].includes(r.status));
  const slaBreach = openReqs.filter(r=>r.sla_due_at && new Date(r.sla_due_at)<Date.now());
  const pendingAppr = approvals.filter(a=>a.status==='pending').length;
  S._dashCtx = {tasks, requests, open, overdue, dueWeek, doneTasks, openReqs, slaBreach, scopeProjects, wsSel};
  return {open, overdue, dueWeek, onTimePct, openReqs, slaBreach, pendingAppr};
}

  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;

    ['Done this week', done7.length], ['New this week', new7.length], ['Median days to finish (30d)', medianDays===null? '—' : medianDays],
    ...(requests.length? [['SLA breached', slaBreach.length]] : []),

  C.innerHTML = `

      ${requests.length? `<div class="stat"><div class="n ${slaBreach.length?'red':'green'}">${slaBreach.length}</div><div class="l">SLA breached</div></div>`:''}

/* ================= DASHBOARD WIDGETS ================= */
const W_SHOWS_TASKS = [['open','Open'],['overdue','Overdue'],['due7','Due within 7 days'],['done','Done'],['done7','Done this week'],['new7','New this week'],['blocked','Blocked'],['review','In review'],['all','All']];
const W_SHOWS_REQS  = [['open','Open'],['sla','SLA breached'],['all','All']];
const W_GROUPS_TASKS= [['status','Status'],['priority','Priority'],['workspace','Workspace'],['project','Board'],['assignee','Assignee'],['group','Group']];
const W_GROUPS_REQS = [['status','Status'],['type','Request type']];

function widgetTaskRows(cfg){
  const c=S._dashCtx;
  let rows = cfg.entity==='requests'? c.requests : c.tasks;
  if(cfg.entity==='requests'){
    if(cfg.show==='open') rows=c.openReqs;
    else if(cfg.show==='sla') rows=c.slaBreach;
  } else {
    if(cfg.show==='open') rows=c.open;
    else if(cfg.show==='overdue') rows=c.overdue;
    else if(cfg.show==='due7') rows=c.dueWeek;
    else if(cfg.show==='done') rows=c.doneTasks;
    else if(cfg.show==='done7') rows=c.done7 || c.doneTasks.filter(t=>(t.completed_at||'')>=daysAgoISO(7));
    else if(cfg.show==='new7') rows=c.new7 || c.tasks.filter(t=>(t.created_at||'')>=daysAgoISO(7));
    else if(cfg.show==='blocked') rows=rows.filter(t=>t.status==='blocked');
    else if(cfg.show==='review') rows=rows.filter(t=>t.status==='review');
    if(cfg.mine) rows=rows.filter(t=>t.assignee_id===S.me.id);
  }
  return rows;
}
function widgetGroups(cfg){
  const c=S._dashCtx;
  if(cfg.entity==='requests'){
    if(cfg.groupBy==='type') return S.requestTypes.map(rt=>({label:rt.name, color:'#0F766E', n:c.requests.filter(r=>r.request_type_id===rt.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
    return REQ_STATUSES.map(s=>({label:s.label, color:s.color.startsWith('var')? '#0F766E':s.color, n:c.requests.filter(r=>r.status===s.k).length})).filter(x=>x.n>0);
  }
  if(cfg.groupBy==='priority') return PRIORITIES.map(p=>({label:p.label, color:p.color.startsWith('var')? '#8E93A8':p.color, n:c.open.filter(t=>t.priority===p.k).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='workspace') return (c.wsSel? c.scopeProjects.map(p=>({label:p.name,color:p.color,n:c.open.filter(t=>t.project_id===p.id).length}))
    : S.workspaces.map(w=>{ const pids=new Set(S.projects.filter(p=>p.workspace_id===w.id).map(p=>p.id)); return {label:w.name,color:w.color,n:c.open.filter(t=>pids.has(t.project_id)).length}; })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(cfg.groupBy==='project') return c.scopeProjects.map(p=>({label:p.name, color:p.color, n:c.open.filter(t=>t.project_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  if(cfg.groupBy==='group') return (c.groups||[]).map(g=>({label:g.name, color:g.color, n:c.open.filter(t=>t.group_id===g.id).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='assignee') return S.profiles.map(p=>({label:p.full_name, color:p.avatar_color||'#0F766E', n:c.open.filter(t=>t.assignee_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,8);
  return STATUSES.map(s=>({label:s.label, color:s.color, n:c.tasks.filter(t=>t.status===s.k).length})).filter(x=>x.n>0);
}
function donutSVG(rows){
  const total = rows.reduce((a,r)=>a+r.n,0);
  if(!total) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const C1=2*Math.PI*44; let acc=0;
  const segs = rows.map(r=>{
    const frac=r.n/total, off=acc; acc+=frac;
    return `<circle r="44" cx="60" cy="60" fill="none" stroke="${r.color}" stroke-width="16"
      stroke-dasharray="${(frac*C1).toFixed(2)} ${(C1-frac*C1).toFixed(2)}" stroke-dashoffset="${(-off*C1+C1/4).toFixed(2)}"></circle>`;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="140" height="140">${segs}
      <text x="60" y="58" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${total}</text>
      <text x="60" y="76" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink3);letter-spacing:.6px">TOTAL</text></svg>
    <div class="donut-legend">${rows.map(r=>`<div class="dl-row"><span class="dl-dot" style="background:${r.color}"></span><span class="dl-l" title="${esc(r.label)}">${esc(r.label)}</span><b>${r.n}</b></div>`).join('')}</div></div>`;
}
function widgetCard(w){
  const cfg = w.config||{};
  let body='';
  if(w.wtype==='stat'){
    const rows = widgetTaskRows(cfg);
    const danger = ['overdue','sla'].includes(cfg.show);
    body = `<div class="w-stat ${danger&&rows.length?'red':''}">${rows.length}</div><div class="w-stat-l">${esc(cfg.entity==='requests'?'requests':'tasks')}</div>`;
  }
  else if(w.wtype==='bar') body = hbars(widgetGroups(cfg));
  else if(w.wtype==='donut') body = donutSVG(widgetGroups(cfg));
  else if(w.wtype==='progress'){
    const c=S._dashCtx, total=c.tasks.length, done=c.doneTasks.length;
    const pct = total? Math.round(done/total*100):0;
    body = `<div class="w-stat accent">${pct}%</div><div class="w-stat-l">${done} of ${total} tasks done</div>
      <div class="prog-bar" style="margin-top:10px"><div class="prog-fill" style="width:${pct}%"></div></div>`;
  }
  else if(w.wtype==='list'){
    let rows = widgetTaskRows(cfg);
    if(cfg.entity==='requests') rows=[...rows].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,6);
    else rows=[...rows].sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')).slice(0,6);
    body = rows.length? (cfg.entity==='requests'? requestTable(rows): taskTable(rows)) : '<div style="color:var(--ink3);font-size:13px;padding:8px 0">Nothing here</div>';
  }
  const acts = (isStaff()? `<span onclick="exportWidgetCSV('${w.id}')">Excel</span>`:'')
    + (widgetsEditable()? `<span onclick="widgetModal('${w.id}')">Edit</span><span onclick="deleteWidget('${w.id}')">Remove</span>`:'');
  return `<div class="card widget-card ${w.wtype==='list'?'w-wide':''}" draggable="${widgetsEditable()}" data-wid="${w.id}"
      ondragstart="wDragStart(event,'${w.id}')" ondragover="event.preventDefault()" ondrop="wDrop(event,'${w.id}')">
    <div class="w-head"><h3>${esc(w.title)}</h3>
      ${acts? `<span class="w-actions">${acts}</span>`:''}</div>
    ${body}</div>`;
}
function exportWidgetCSV(id){
  const w = (S._widgets||[]).find(x=>x.id===id); if(!w) return;
  downloadXLSX(xlsxFilename(w.title||'Widget'),
    [['Label','Count'], ...widgetGroups(w.config||{}).map(g=>[g.label, g.n])]);
}
/* Stat tiles, a blank line, then every widget's grouped numbers — one file. */
function exportReportCSV(){
  const out = [['Label','Value'], ...(S._reportStats||[])];
  (S._widgets||[]).forEach(w=>{
    out.push([], [w.title], ['Label','Count']);
    widgetGroups(w.config||{}).forEach(g=>out.push([g.label, g.n]));
  });
  downloadXLSX(xlsxFilename(S._reportName||'Report'), out);
}
let wDragId=null;
function wDragStart(e,id){ wDragId=id; }
async function wDrop(e,targetId){
  e.preventDefault();
  if(!widgetsEditable()) return;
  if(!wDragId || wDragId===targetId) return;
  const ws=S._widgets, from=ws.findIndex(x=>x.id===wDragId), to=ws.findIndex(x=>x.id===targetId);
  if(from<0||to<0) return;
  const [m]=ws.splice(from,1); ws.splice(to,0,m); wDragId=null;
  document.getElementById('wgrid').innerHTML = ws.map(widgetCard).join('');
  for(let i=0;i<ws.length;i++){ if(ws[i].position!==i){ ws[i].position=i; await db.from('dashboard_widgets').update({position:i}).eq('id',ws[i].id); } }
}
async function deleteWidget(id){
  const {error}=await db.from('dashboard_widgets').delete().eq('id',id);
  if(error) return toast(error.message,true);
  S._widgets = S._widgets.filter(w=>w.id!==id);

function hbars(rows){
  if(!rows.length) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const max = Math.max(...rows.map(r=>r.n));
  return rows.map(r=>`<div class="hbar-row">
    <div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(r.n/max*100)}%;background:${r.color}"></div></div>
    <div class="hbar-val">${r.n}</div></div>`).join('');
}

async function slaSave(btn){

  {key:'notify_assignee', label:'Notify the assignee',          cfg:null,     group:'Notify'},

  {key:'add_comment',     label:'Add a comment',                cfg:'text',   group:'Notify'},
  {key:'set_status',      label:'Set status',                   cfg:'status', group:'Change the task'},
  {key:'set_priority',    label:'Set priority',                 cfg:'priority',group:'Change the task'},
  {key:'assign_person',   label:'Assign it to someone',         cfg:'person', group:'Change the task'},
  {key:'assign_creator',  label:'Assign it to whoever created it', cfg:null,  group:'Change the task'},
  {key:'unassign',        label:'Clear the assignee',           cfg:null,     group:'Change the task'},
  {key:'move_to_group',   label:'Move it to a group',           cfg:'group',  group:'Change the task'},

  {key:'assignee', label:'Assignee'},

/* Turn a draft into the sentence shown in the list and used as the rule's name. */
function caSentence(d){
  const sL = k => (STATUSES.find(s=>s.k===k)||{}).label||k;
  const pL = k => (PRIORITIES.find(p=>p.k===k)||{}).label||k;
  const uN = id => { const u=(S.profiles||[]).find(p=>p.id===id); return u? u.full_name : 'someone'; };
  const pid = d.scope.startsWith('p:')? d.scope.slice(2) : null;
  const tc = d.tc||{};
  let when='';
  switch(d.trigger){
    case 'status_changed':   when = 'When status changes' + (tc.from? ` from ${sL(tc.from)}`:'') + (tc.to? ` to ${sL(tc.to)}`:''); break;
    case 'priority_changed': when = 'When priority changes' + (tc.from? ` from ${pL(tc.from)}`:'') + (tc.to? ` to ${pL(tc.to)}`:''); break;
    case 'task_assigned':    when = 'When a task is assigned' + (tc.user_id? ` to ${uN(tc.user_id)}`:''); break;
    case 'task_unassigned':  when = 'When a task loses its assignee'; break;
    case 'task_created':     when = 'When a task is created'; break;
    case 'moved_to_group':   when = 'When a task moves' + (tc.group_id? ` to ${caGroupName(pid,tc.group_id)}`:' to a new group'); break;
    case 'field_changed':    when = 'When ' + (tc.field_id? caFieldName(pid,tc.field_id):'a column') + (tc.to? ` becomes ${tc.to}`:' changes'); break;
    case 'due_date_changed': when = 'When the due date is set'; break;
    case 'due_date_arrives': when = 'When the due date arrives'; break;
    case 'due_date_passed':  { const n=Math.max(1,parseInt(tc.days??1,10)||1); when = `When the due date is ${n} day${n===1?'':'s'} past`; break; }
  }
  const condTxt = (d.conds||[]).map(c=>{
    const what = c.k==='field'? (c.field_id? caFieldName(pid,c.field_id):'a column') : (CA_COND_KEYS.find(x=>x.key===c.k)||{}).label||c.k;
    const opL = (CA_OPS.find(o=>o.key===c.op)||{}).label||'is';
    let val='';
    if(c.op==='is'||c.op==='is_not'){
      val = c.k==='status'? sL(c.v) : c.k==='priority'? pL(c.v) : c.k==='assignee'? uN(c.v) : c.k==='group'? caGroupName(pid,c.v) : (c.v||'…');
    }
    return `${what.toLowerCase()} ${opL}${val? ' '+val:''}`;
  });
  const acts = (d.acts||[]).map(a=>{
    const cfg=a.cfg||{};
    switch(a.key){
      case 'notify_person':   return `notify ${uN(cfg.user_id)}`;
      case 'notify_assignee': return 'notify the assignee';
      case 'notify_creator':  return 'notify whoever created it';
      case 'notify_owners':   return 'notify the workspace owners';
      case 'notify_team':     return 'notify the whole workspace';
      case 'add_comment':     return 'add a comment';
      case 'set_status':      return `set status to ${sL(cfg.status||'todo')}`;
      case 'set_priority':    return `set priority to ${pL(cfg.priority||'urgent')}`;
      case 'assign_person':   return `assign it to ${uN(cfg.user_id)}`;
      case 'assign_creator':  return 'assign it to whoever created it';
      case 'unassign':        return 'clear the assignee';
      case 'move_to_group':   return `move it to ${caGroupName(pid,cfg.group_id)}`;
      case 'set_field':       return `set ${cfg.field_id? caFieldName(pid,cfg.field_id):'a column'}${cfg.value? ` to ${cfg.value}`:''}`;
      case 'clear_field':     return `clear ${cfg.field_id? caFieldName(pid,cfg.field_id):'a column'}`;
      case 'set_due_in_days': { const n=parseInt(cfg.days??1,10); return `set the due date ${n} day${n===1?'':'s'} from now`; }
      case 'push_due':        { const n=parseInt(cfg.days??1,10); return `push the due date ${Math.abs(n)} day${Math.abs(n)===1?'':'s'} ${n<0?'earlier':'later'}`; }
      case 'clear_due':       return 'clear the due date';
      case 'create_task':     return 'create a follow-up task';
      case 'archive_task':    return 'archive it';
      default: return a.key;
    }
  });
  const thenTxt = acts.length<=1? (acts[0]||'do nothing') : acts.slice(0,-1).join(', ') + ' and ' + acts[acts.length-1];
  return `${when}${condTxt.length? ', if '+condTxt.join(' and '):''}, ${thenTxt}`;
}
/* Editable draft: {id, trigger, tc, conds:[{k,op,v,field_id}], acts:[{key,cfg}], scope} */
let _ca = null;
function caDraft(rec, defScope){
  if(!rec) return {id:null, trigger:'status_changed', tc:{}, conds:[], acts:[{key:'notify_assignee', cfg:{}}], scope:defScope||''};
  const tc = (rec.trigger_config && Object.keys(rec.trigger_config).length)? {...rec.trigger_config} : {...(rec.condition||{})};
  const conds = Array.isArray(rec.conditions)? rec.conditions.map(c=>{
    const k = String(c.k||''); const isField = k.startsWith('field:');
    return {k: isField? 'field' : k, field_id: isField? k.slice(6) : undefined, op: c.op||'is', v: Array.isArray(c.v)? c.v[0] : (c.v??'')};
  }) : [];
  const acts = (Array.isArray(rec.actions) && rec.actions.length)? rec.actions.map(a=>({key:a.key, cfg:{...(a.cfg||{})}}))
             : [{key:rec.action_key, cfg:{...(rec.action_config||{})}}];
  return {id:rec.id, trigger:rec.trigger_key, tc, conds, acts,
          scope: rec.project_id? 'p:'+rec.project_id : (rec.workspace_id? 'w:'+rec.workspace_id : '')};
}

  caModal(null, '');
  _ca = caDraft(copy, ''); _ca.id = null;
  const pid = _ca.scope.startsWith('p:')? _ca.scope.slice(2) : null;
  if(pid) caLoadGroups(pid); else caDraw();
  toast('Copied — change what you need and add it');
}
async function caLoadGroups(pid){
  window._caGroups = window._caGroups||{}; window._caFields = window._caFields||{};
  const jobs=[];
  if(!window._caGroups[pid]) jobs.push(db.from('project_groups').select('id,name').eq('project_id',pid)
    .then(({data})=>{window._caGroups[pid]=data||[];}));
  if(!window._caFields[pid]) jobs.push(db.from('project_fields').select('id,label,ftype,options').eq('project_id',pid)
    .then(({data})=>{window._caFields[pid]=(data||[]).filter(f=>!['formula','mirror'].includes(f.ftype));}));
  if(jobs.length) await Promise.all(jobs);
  caDraw();
}
/* --- builder mutations (called from the drawn controls) --- */
function caSetTrigger(k){ _ca.trigger=k; _ca.tc={}; caDraw(); }
function caTc(k, v){ if(v==='' || v==null) delete _ca.tc[k]; else _ca.tc[k]=v; caDraw(); }
function caCondAdd(){ _ca.conds.push({k:'status', op:'is', v:''}); caDraw(); }
function caCondDel(i){ _ca.conds.splice(i,1); caDraw(); }
function caCondSet(i, k, v){ const c=_ca.conds[i]; if(!c) return; c[k]=v; if(k==='k'){ c.v=''; delete c.field_id; } if(k==='field_id') c.v=''; caDraw(); }
function caActAdd(){ _ca.acts.push({key:'notify_assignee', cfg:{}}); caDraw(); }
function caActDel(i){ if(_ca.acts.length<=1) return toast('A rule needs at least one action', true); _ca.acts.splice(i,1); caDraw(); }
function caActMove(i, d){ const j=i+d; if(j<0||j>=_ca.acts.length) return; const t=_ca.acts[i]; _ca.acts[i]=_ca.acts[j]; _ca.acts[j]=t; caDraw(); }
function caActKey(i, k){ _ca.acts[i]={key:k, cfg:{}}; caDraw(); }
function caActCfg(i, k, v){ const a=_ca.acts[i]; if(!a) return; a.cfg[k]=v; if(k==='field_id') a.cfg.value=''; caDraw(); }
function caScope(v){
  _ca.scope=v;
  delete _ca.tc.group_id; delete _ca.tc.field_id; delete _ca.tc.to;
  _ca.conds = _ca.conds.filter(c=> c.k!=='group' && c.k!=='field');
  _ca.acts.forEach(a=>{ delete a.cfg.group_id; delete a.cfg.field_id; });
  const p = v.startsWith('p:')? v.slice(2) : null;
  if(p) caLoadGroups(p); else caDraw();
}
function caDraw(){
  const B = document.getElementById('ca-body'); if(!B || !_ca) return;
  const trg = CA_TRIGGERS.find(t=>t.key===_ca.trigger)||CA_TRIGGERS[0];

  const selFields = fields.filter(f=>f.ftype==='select');

  const opt = (v, cur, label)=>`<option value="${esc(String(v))}" ${String(cur??'')===String(v)?'selected':''}>${esc(label)}</option>`;
  // People and boards are long lists at CREA (30+ staff, 10 workspaces, dozens of boards) — searchable pickers.

      groups:[ ...(blank? [{label:'', items:[{v:'', l:blank}]}] : []), {label:'People', items}],

  };
  const groupSel  = (cur, on, blank)=> pid? `<select onchange="${on}">${blank? `<option value="">${blank}</option>`:'<option value="">Pick a group…</option>'}${groups.map(g=>opt(g.id,cur,g.name)).join('')}</select>` : needBoard('groups');
  const fieldSel  = (cur, on, list)=> pid? (list.length? `<select onchange="${on}"><option value="">Pick a column…</option>${list.map(f=>opt(f.id,cur,f.label)).join('')}</select>` : '<div class="ca-hint">This board has no suitable columns yet.</div>') : needBoard('columns');
  const fieldValSel = (fid, cur, on, blank)=>{ const f=fields.find(x=>x.id===fid); if(!f) return '';
    if(f.ftype==='select') return `<select onchange="${on}">${blank? `<option value="">${blank}</option>`:'<option value="">Pick a value…</option>'}${(f.options||[]).map(o=>opt(o,cur,o)).join('')}</select>`;

  // --- When ---

  if(trg.tc==='priority') tcCtl = `<span class="ca-inline">from <select onchange="caTc('from',this.value)"><option value="">any priority</option>${PRIORITIES.map(p=>opt(p.k,_ca.tc.from,p.label)).join('')}</select>
      to <select onchange="caTc('to',this.value)"><option value="">any priority</option>${PRIORITIES.map(p=>opt(p.k,_ca.tc.to,p.label)).join('')}</select></span>`;
  if(trg.tc==='person') tcCtl = `<span class="ca-inline">to ${personSel(_ca.tc.user_id, "caTc('user_id',this.value)", 'anyone')}</span>`;
  if(trg.tc==='group')  tcCtl = `<span class="ca-inline">to ${groupSel(_ca.tc.group_id, "caTc('group_id',this.value)", 'any group')}</span>`;
  if(trg.tc==='field')  tcCtl = `<span class="ca-inline">${fieldSel(_ca.tc.field_id, "caTc('field_id',this.value);caTc('to','')", selFields)}
      ${_ca.tc.field_id? ' becomes '+fieldValSel(_ca.tc.field_id, _ca.tc.to, "caTc('to',this.value)", 'any value'):''}</span>`;
  if(trg.tc==='days')   tcCtl = `<span class="ca-inline">by <input type="number" min="1" max="365" style="width:80px" value="${Math.max(1,parseInt(_ca.tc.days??1,10)||1)}" onchange="caTc('days',this.value)"> day(s)</span>`;

  // --- Only if ---
  const condRow = (c,i)=>{
    const isField = c.k==='field';
    const valueless = c.op==='empty'||c.op==='not_empty';
    let valCtl='';
    if(!valueless){
      if(c.k==='status')   valCtl = `<select onchange="caCondSet(${i},'v',this.value)"><option value="">pick…</option>${STATUSES.map(s=>opt(s.k,c.v,s.label)).join('')}</select>`;
      if(c.k==='priority') valCtl = `<select onchange="caCondSet(${i},'v',this.value)"><option value="">pick…</option>${PRIORITIES.map(p=>opt(p.k,c.v,p.label)).join('')}</select>`;
      if(c.k==='assignee') valCtl = personSel(c.v, `caCondSet(${i},'v',this.value)`);
      if(c.k==='group')    valCtl = groupSel(c.v, `caCondSet(${i},'v',this.value)`);
      if(c.k==='due')      valCtl = `<input type="date" value="${esc(c.v||'')}" onchange="caCondSet(${i},'v',this.value)">`;

    }
    return `<div class="ca-row" data-cond="${i}">

      ${valCtl}
      <button class="btn btn-ghost btn-sm ca-x" title="Remove condition" onclick="caCondDel(${i})">✕</button></div>`;
  };

  // --- Then ---
  const actRow = (a,i)=>{
    const act = CA_ACTIONS.find(x=>x.key===a.key)||CA_ACTIONS[0]; const cfg=a.cfg;
    let cfgCtl='';
    if(act.cfg==='person')   cfgCtl = personSel(cfg.user_id, `caActCfg(${i},'user_id',this.value)`);
    if(act.cfg==='status')   cfgCtl = `<select onchange="caActCfg(${i},'status',this.value)">${STATUSES.map(s=>opt(s.k,cfg.status||'todo',s.label)).join('')}</select>`;
    if(act.cfg==='priority') cfgCtl = `<select onchange="caActCfg(${i},'priority',this.value)">${PRIORITIES.map(p=>opt(p.k,cfg.priority||'urgent',p.label)).join('')}</select>`;
    if(act.cfg==='group')    cfgCtl = groupSel(cfg.group_id, `caActCfg(${i},'group_id',this.value)`);
    if(act.cfg==='field')    cfgCtl = fieldSel(cfg.field_id, `caActCfg(${i},'field_id',this.value)`, selFields) + (cfg.field_id? ' to '+fieldValSel(cfg.field_id, cfg.value, `caActCfg(${i},'value',this.value)`):'');
    if(act.cfg==='fieldonly')cfgCtl = fieldSel(cfg.field_id, `caActCfg(${i},'field_id',this.value)`, fields);
    if(act.cfg==='text')     cfgCtl = `<input style="min-width:260px" value="${esc(cfg.text||'')}" placeholder="Comment text — {title} and {status} are filled in" onchange="caActCfg(${i},'text',this.value)">`;
    if(act.cfg==='days')     cfgCtl = `<span class="ca-inline"><input type="number" min="0" max="365" style="width:80px" value="${parseInt(cfg.days??1,10)}" onchange="caActCfg(${i},'days',this.value)"> days from the day it fires</span>`;
    if(act.cfg==='pushdays') cfgCtl = `<span class="ca-inline">by <input type="number" min="-365" max="365" style="width:80px" value="${parseInt(cfg.days??1,10)}" onchange="caActCfg(${i},'days',this.value)"> days (negative = earlier)</span>`;
    if(act.cfg==='newtask')  cfgCtl = `<div class="ca-sub">
        <input value="${esc(cfg.title||'')}" placeholder="Title — {title} is the original task's name (default: Follow-up: {title})" onchange="caActCfg(${i},'title',this.value)">
        <div class="ca-inline">on <select onchange="caActCfg(${i},'project_id',this.value)"><option value="">the same board</option>${(S.projects||[]).filter(p=>p.status!=='archived').map(p=>opt(p.id,cfg.project_id,p.name)).join('')}</select>
        assigned to <select onchange="caActCfg(${i},'user_id',this.value);caActCfg(${i},'same_assignee', this.value==='__same'?'true':'false')"><option value="">nobody</option><option value="__same" ${cfg.same_assignee==='true'?'selected':''}>the same person</option>${people.map(u=>opt(u.id,cfg.user_id,u.full_name)).join('')}</select>
        due in <input type="number" min="0" max="365" style="width:70px" value="${cfg.due_in_days??''}" placeholder="—" onchange="caActCfg(${i},'due_in_days',this.value)"> days</div></div>`;
    return `<div class="ca-row ca-act" data-act="${i}">
      <span class="ca-n">${i+1}</span>
      <select onchange="caActKey(${i},this.value)">${['Notify','Change the task','Dates','Create'].map(g=>`<optgroup label="${g}">${CA_ACTIONS.filter(x=>x.group===g).map(x=>opt(x.key,a.key,x.label)).join('')}</optgroup>`).join('')}</select>
      ${cfgCtl}
      <span class="ca-tools"><button class="btn btn-ghost btn-sm" title="Move up" onclick="caActMove(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn btn-ghost btn-sm" title="Move down" onclick="caActMove(${i},1)" ${i===_ca.acts.length-1?'disabled':''}>↓</button><button class="btn btn-ghost btn-sm ca-x" title="Remove action" onclick="caActDel(${i})">✕</button></span></div>`;
  };

  B.innerHTML = `
    <div class="ca-sec"><label>When</label>

    <div class="ca-sec"><label>Where it applies</label>

      groups:[{label:'', items:[{v:'', l:'Everywhere'}]},
              {label:'Workspaces', items:(S.workspaces||[]).map(w=>({v:'w:'+w.id, l:w.name}))},
              {label:'Boards', items:(S.projects||[]).filter(p=>p.status!=='archived').slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'',undefined,{sensitivity:'base'})).map(p=>{const w=wsById(p.workspace_id); return {v:'p:'+p.id, l:p.name, sub:w? w.name:''};})}]})}</div>

/* Validate the draft and turn it into the row the engine expects. Returns {error} or {payload}. */
function caPayload(d){
  const pid = d.scope.startsWith('p:')? d.scope.slice(2) : null;
  const wid = d.scope.startsWith('w:')? d.scope.slice(2) : null;
  const trg = CA_TRIGGERS.find(t=>t.key===d.trigger)||{};
  const tc = {};
  if(trg.tc==='status' || trg.tc==='priority'){ if(d.tc.from) tc.from=d.tc.from; if(d.tc.to) tc.to=d.tc.to; if(tc.from && tc.from===tc.to) return {error:'“From” and “to” cannot be the same value'}; }
  if(trg.tc==='person' && d.tc.user_id) tc.user_id = d.tc.user_id;
  if(trg.tc==='group'){ if(!pid) return {error:'Choose a board — groups belong to a board'}; if(d.tc.group_id) tc.group_id=d.tc.group_id; }
  if(trg.tc==='field'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!d.tc.field_id) return {error:'Pick which column to watch'}; tc.field_id=d.tc.field_id; if(d.tc.to) tc.to=d.tc.to; }
  if(trg.tc==='days') tc.days = Math.max(1, parseInt(d.tc.days??1,10)||1);
  const conditions = [];
  for(const c of d.conds){
    const valueless = c.op==='empty'||c.op==='not_empty';
    if(c.k==='field'){ if(!pid) return {error:'Conditions on a column need a board — pick one under “Where it applies”'}; if(!c.field_id) return {error:'Pick which column the condition looks at'}; }
    if(c.k==='group' && !pid) return {error:'Conditions on a group need a board — pick one under “Where it applies”'};
    if(!valueless && !c.v) return {error:'Every “only if” line needs a value, or use “is empty” / “is set”'};
    const row = {k: c.k==='field'? 'field:'+c.field_id : c.k, op:c.op};
    if(!valueless) row.v = c.v;
    conditions.push(row);
  }
  const actions = [];
  for(const a of d.acts){
    const act = CA_ACTIONS.find(x=>x.key===a.key); if(!act) return {error:'Unknown action'};
    const cfg = {}; const c=a.cfg||{};
    if(act.cfg==='person'){ if(!c.user_id) return {error:'Pick who to '+(a.key==='assign_person'?'assign':'notify')}; cfg.user_id=c.user_id; }
    if(act.cfg==='status')   cfg.status = c.status||'todo';
    if(act.cfg==='priority') cfg.priority = c.priority||'urgent';
    if(act.cfg==='group'){ if(!pid) return {error:'Choose a board — groups belong to a board'}; if(!c.group_id) return {error:'Pick the group to move to'}; cfg.group_id=c.group_id; }
    if(act.cfg==='field'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!c.field_id) return {error:'Pick which column to set'}; if(!c.value) return {error:'Pick the value to set'}; cfg.field_id=c.field_id; cfg.value=c.value; }
    if(act.cfg==='fieldonly'){ if(!pid) return {error:'Choose a board — columns belong to a board'}; if(!c.field_id) return {error:'Pick which column to clear'}; cfg.field_id=c.field_id; }
    if(act.cfg==='text'){ if(!(c.text||'').trim()) return {error:'Type the comment to add'}; cfg.text=c.text.trim(); }
    if(act.cfg==='days')     cfg.days = Math.max(0, parseInt(c.days??1,10)||0);
    if(act.cfg==='pushdays'){ const n=parseInt(c.days??1,10); if(!n) return {error:'Push the due date by at least one day'}; cfg.days=n; }
    if(act.cfg==='newtask'){ if(c.title) cfg.title=c.title.trim(); if(c.project_id) cfg.project_id=c.project_id; if(c.user_id && c.user_id!=='__same') cfg.user_id=c.user_id; if(c.same_assignee==='true') cfg.same_assignee='true'; if(c.due_in_days!=='' && c.due_in_days!=null) cfg.due_in_days=Math.max(0,parseInt(c.due_in_days,10)||0); }
    actions.push({key:a.key, cfg});
  }
  if(!actions.length) return {error:'Add at least one action'};
  return {payload:{workspace_id:wid, project_id:pid, trigger_key:d.trigger, trigger_config:tc, conditions, actions,
                   condition:tc, action_key:actions[0].key, action_config:actions[0].cfg, name:caSentence(d)}};
}
async function caSave(){
  const {error:verr, payload} = caPayload(_ca);
  if(verr) return toast(verr, true);
  const {error} = _ca.id
    ? await db.from('custom_automations').update(payload).eq('id',_ca.id)
    : await db.from('custom_automations').insert(payload);
  if(error) return toast(error.message, true);
  toast(_ca.id? 'Automation updated':'Automation added — it is live now');
  closeModals(); autoRerender();
}

  const c=(S._customAutos||[]).find(x=>x.id===id); if(c) c.enabled=on;

}

/* One line per step of a run: "assign → ok · move → skipped (already there)" */
function caStepsText(run){
  const steps = run?.detail?.steps;
  if(!Array.isArray(steps) || !steps.length) return run?.detail?.notified? `${run.detail.notified} notified` : '';
  const lbl = k => (CA_ACTIONS.find(a=>a.key===k)||{}).label || k;
  return steps.map(s=>`${lbl(s.action)} → ${s.result}${s.reason? ` (${esc(s.reason)})`:''}${s.notified!=null? ` (${s.notified})`:''}`).join(' · ');
}

        <td><a href="#/task/${x.entity_id}" onclick="closeModals()">${esc(x.detail?.task_title||'a task')}</a></td>

        <span class="ws-dot" style="display:inline-block;background:${w.color}"></span><span>${esc(w.name)}</span></div>`).join('') || '<div style="font-size:12.5px;color:var(--ink3)">No workspaces yet.</div>'}</div>
      <p id="iu-wsnote" style="margin-top:8px;font-size:12px;color:var(--ink3);display:none">Admin and management see every workspace — these ticks are ignored for those roles.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="iu-save">Create account</button></div>`);
  const roleSel = m.querySelector('#iu-role');
  const syncWsNote = ()=>{
    const sup = roleSel.value==='admin' || roleSel.value==='management';
    m.querySelector('#iu-ws').style.opacity = sup? '.4':'1';
    m.querySelectorAll('#iu-ws input').forEach(i=> i.disabled = sup);
    m.querySelector('#iu-wsnote').style.display = sup? 'block':'none';
  };
  roleSel.onchange = syncWsNote; syncWsNote();
  m.querySelector('#iu-save').onclick = async ()=>{
    const full_name=m.querySelector('#iu-name').value.trim(), email=m.querySelector('#iu-email').value.trim(),
          role=m.querySelector('#iu-role').value, password=m.querySelector('#iu-pass').value;
    if(!full_name||!email||password.length<8) return toast('Fill name, email, and a password of 8+ chars', true);
    const btn=m.querySelector('#iu-save'); btn.disabled=true; btn.textContent='Creating…';
    try{
      const res = await fetch(ADMIN_API+'/create-user', {method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.session.access_token, 'apikey':SUPABASE_ANON},
        body:JSON.stringify({email, password, full_name, role})});
      const out = await res.json();
      if(!res.ok) throw new Error(out.error||'Failed');
      // roles the server does not yet know about are applied straight to the profile
      if(out.user_id && role==='requester') await db.from('profiles').update({role:'requester'}).eq('id', out.user_id);
      // assign every ticked workspace — one person, as many workspaces as needed
      const wids = [...m.querySelectorAll('#iu-ws input[data-wid]:checked')].map(i=>i.dataset.wid);
      if(out.user_id && wids.length && role!=='admin' && role!=='management'){
        const {error:wmErr} = await db.from('workspace_members').insert(wids.map(workspace_id=>({workspace_id, user_id:out.user_id})));
        if(wmErr) toast('User created, but workspaces failed: '+wmErr.message, true);
      }
      closeModals(); toast('User created'+(wids.length&&role!=='admin'&&role!=='management'? ` · ${wids.length} workspace${wids.length>1?'s':''}`:'')); await refreshCore(); renderAdmin();
    }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Create account'; }
  };
}

async function deleteWorkspaceModal(wid){
  const w = wsById(wid); if(!w) return;
  // An owner runs everything inside a workspace, but deleting it destroys every
  // board and task in it, so that stays with admins.
  if(!canDeleteWs()) return toast('Only an admin can delete a workspace. As an owner you can rename it, manage its members and delete the boards inside it.', true);
  const projs = S.projects.filter(p=>p.workspace_id===wid);
  let nTasks = 0;
  if(projs.length){
    const {count} = await db.from('tasks').select('id',{count:'exact',head:true}).in('project_id', projs.map(p=>p.id));
    nTasks = count||0;
  }
  const m = modal(`<div class="modal-head"><h2>Delete “${esc(w.name)}”?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="danger-note"><b>This cannot be undone.</b> Deleting this workspace also deletes everything inside it.</div>
      <div style="display:flex;gap:26px;margin:14px 0 16px">
        <div><div style="font-size:26px;font-weight:800;line-height:1">${projs.length}</div><div style="font-size:12px;color:var(--ink3)">board${projs.length===1?'':'s'}</div></div>
        <div><div style="font-size:26px;font-weight:800;line-height:1;color:${nTasks?'var(--red)':'inherit'}">${nTasks}</div><div style="font-size:12px;color:var(--ink3)">task${nTasks===1?'':'s'}</div></div>
      </div>
      ${projs.length? `<div style="font-size:13px;color:var(--ink2);margin-bottom:14px">Boards that will go: ${projs.slice(0,6).map(p=>'<b>'+esc(p.name)+'</b>').join(', ')}${projs.length>6?' and '+(projs.length-6)+' more':''}.</div>`:''}
      <label>Type the workspace name to confirm</label>
      <input id="dw-confirm" autocomplete="off" placeholder="${esc(w.name)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-danger" id="dw-go" disabled>Delete workspace</button></div>`);
  const inp=m.querySelector('#dw-confirm'), go=m.querySelector('#dw-go');
  inp.oninput = ()=>{ go.disabled = inp.value.trim().toLowerCase() !== w.name.trim().toLowerCase(); };
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {data, error} = await db.from('workspaces').delete().eq('id',wid).select('id');
    if(error){ go.disabled=false; go.textContent='Delete workspace'; return toast(error.message, true); }
    if(!data || !data.length){ go.disabled=false; go.textContent='Delete workspace'; return toast('Nothing was deleted — only an admin can delete a workspace', true); }
    logActivity('workspace', wid, 'delete', {name:w.name, projects:projs.length, tasks:nTasks});
    closeModals(); toast('Workspace deleted'); await refreshCore();
    if(S.route.view==='ws' && S.route.id===wid) location.hash='#/home'; else { renderSidebar(); if(S.route.view==='admin') renderAdmin(); }
  };
  setTimeout(()=>inp.focus(), 30);
}

function editTeamModal(tid){

      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tt-save">Save</button></div>`);

  });
  m.querySelector('#tt-save').onclick = async ()=>{

      <div id="tp-count" style="font-size:12.5px;color:var(--ink2);margin:2px 0"></div>
      ${pool.map(p=>`<div class="chk" data-search="${esc(searchKey(p))}">
        <input type="checkbox" data-uid="${p.id}" ${inTeam.has(p.id)?'checked':''}>
        ${avatar(p,true)} <span style="flex:1">${esc(p.full_name||p.email)}
          <span style="color:var(--ink3)">· ${esc(p.email)}</span></span></div>`).join('')
      || '<div class="empty">No active accounts yet.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="tp-save">Save</button></div>`);
  wireMemberSearch(m, 'tp-q');
  const boxes = [...m.querySelectorAll('input[data-uid]')], countEl = m.querySelector('#tp-count');
  const recount = ()=>{ countEl.textContent = `${boxes.filter(b=>b.checked).length} of ${boxes.length} people in this team`; };
  boxes.forEach(b=> b.addEventListener('change', recount)); recount();
  m.querySelector('#tp-save').onclick = async ()=>{
    const want = new Set(boxes.filter(b=>b.checked).map(b=>b.dataset.uid));
    const add = [...want].filter(u=>!inTeam.has(u)).map(user_id=>({team_id:tid, user_id}));
    const rm  = [...inTeam].filter(u=>!want.has(u));
    if(add.length){ const {error} = await db.from('team_members').insert(add); if(error) return toast(error.message, true); }
    if(rm.length){ const {error} = await db.from('team_members').delete().eq('team_id',tid).in('user_id',rm); if(error) return toast(error.message, true); }
    closeModals(); toast('Team updated'); await refreshCore(); renderAdmin();
  };
}
async function deleteTeamModal(tid){
  const t = teamById(tid); if(!t) return;
  const n = teamMemberIds(tid).length;
  // Deleting a team takes nobody's access away — it is only a saved grouping.
  if(!confirm(`Delete the team ${t.name}?`
    + (n? ` Its ${n} ${n===1?'person keeps':'people keep'} every workspace and board they are on — only the grouping goes.`:''))) return;
  const {error} = await db.from('teams').delete().eq('id', tid);
  if(error) return toast(error.message, true);
  toast('Team deleted'); await refreshCore(); renderAdmin();
}
</script>
