/* Roles that need to be granted a workspace explicitly. admin + management
   already see every workspace, so they are shown as "all workspaces" and
   are not checkboxes. Anyone here can belong to as many workspaces as you like. */
const ASSIGNABLE_ROLES = ['internal','requester','partner','freelancer'];
const ROLE_LABEL = {internal:'Internal staff', requester:'Requester (view + raise + comment)', partner:'Partner (external)', freelancer:'Freelancer (external)'};
async function teamMembersModal(wsId){
  const w = wsById(wsId);
  const {data:members} = await db.from('workspace_members').select('*').eq('workspace_id',wsId);
  const memberIds = new Set((members||[]).map(m=>m.user_id));
  const pool = S.profiles.filter(p=>p.active && ASSIGNABLE_ROLES.includes(p.role));
  const supers = S.profiles.filter(p=>p.active && (p.role==='admin'||p.role==='management'));
  const wsCount = {}; // how many workspaces each person is already in — filled below
  const {data:allM} = await db.from('workspace_members').select('user_id');
  (allM||[]).forEach(r=>{ wsCount[r.user_id]=(wsCount[r.user_id]||0)+1; });
  const groupBlock = role=>{
    const list = pool.filter(p=>p.role===role);
    if(!list.length) return '';
    return `<div style="margin-top:14px"><div style="font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">${ROLE_LABEL[role]}</div>
      ${list.map(p=>{
        const others = (wsCount[p.id]||0) - (memberIds.has(p.id)?1:0);
        return `<div class="chk"><input type="checkbox" data-uid="${p.id}" ${memberIds.has(p.id)?'checked':''}>
          ${avatar(p,true)} <span>${esc(p.full_name)} <span style="color:var(--ink3)">· ${esc(p.email)}</span>
          ${others>0? `<span class="chip" style="background:var(--gray-soft);color:var(--ink3);margin-left:6px">+${others} other workspace${others>1?'s':''}</span>`:''}</span></div>`;
      }).join('')}</div>`;
  };
  const m = modal(`<div class="modal-head"><h2>Members of ${esc(w?w.name:'workspace')}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <p style="color:var(--ink2);font-size:13px;margin-top:6px">Tick anyone who should see this workspace. <b>A person can belong to as many workspaces as you like</b> — ticking them here does not remove them from any other one.</p>
      ${supers.length? `<div style="margin-top:12px;padding:9px 12px;background:var(--gray-soft);border-radius:8px;font-size:12.5px;color:var(--ink2)">
        <b>Always has access:</b> ${supers.map(p=>esc(p.full_name)).join(', ')} — admin and management see every workspace.</div>`:''}
      ${ASSIGNABLE_ROLES.map(groupBlock).join('') || '<div class="empty">No assignable accounts yet. Create them in Admin → Users.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="tm-save">Save</button></div>`);
  m.querySelector('#tm-save').onclick = async ()=>{
    const want = new Set([...m.querySelectorAll('input[data-uid]:checked')].map(i=>i.dataset.uid));
    const add=[...want].filter(u=>!memberIds.has(u)).map(user_id=>({workspace_id:wsId,user_id}));
    const rm=[...memberIds].filter(u=>!want.has(u) && pool.some(p=>p.id===u));
    if(add.length){ const {error} = await db.from('workspace_members').insert(add); if(error) return toast(error.message, true); }
    if(rm.length){ const {error} = await db.from('workspace_members').delete().eq('workspace_id',wsId).in('user_id',rm); if(error) return toast(error.message, true); }
    closeModals(); toast('Workspace members updated'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin();
  };
}

const boardFilters = {};

function bfActiveCount(pid){ const f=bfGet(pid); return ['q','status','priority','assignee','group'].filter(k=>f[k]).length; }

function bfApply(pid, rows){
  const f = bfGet(pid);

  return rows.filter(t=>
    (!q || (t.title||'').toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q))
    && (!f.status   || t.status===f.status)
    && (!f.priority || t.priority===f.priority)
    && (!f.assignee || (f.assignee==='__none__' ? !t.assignee_id : t.assignee_id===f.assignee))
    && (!f.group    || (f.group==='__none__' ? !t.group_id : t.group_id===f.group))
  );

/* ---- Workload view (M-13): assignments + capacity by employee ---- */
let WORKLOAD_CAP = 8;   // "open tasks" a person can comfortably hold before flagged Heavy
function renderWorkload(id, rows, host){
  const OPEN = new Set(['todo','in_progress','review','blocked']);
  // bucket the filtered rows by assignee (plus an Unassigned bucket)
  const buckets = new Map();
  const bucket = key => { let b=buckets.get(key); if(!b){ b={key, counts:{}, open:0, total:0}; buckets.set(key,b); } return b; };
  (rows||[]).forEach(t=>{
    const b = bucket(t.assignee_id||'__none__');
    b.counts[t.status] = (b.counts[t.status]||0)+1;
    b.total++; if(OPEN.has(t.status)) b.open++;
  });
  let list = [...buckets.values()];
  // real people first (by open desc), Unassigned always last
  list.sort((a,b)=> (a.key==='__none__') - (b.key==='__none__') || b.open-a.open || b.total-a.total);
  const maxOpen = Math.max(WORKLOAD_CAP, ...list.map(b=>b.open), 1);
  const totalOpen = list.reduce((s,b)=>s+b.open,0), people = list.filter(b=>b.key!=='__none__').length;
  const seg = b => STATUSES.map(s=> b.counts[s.k]? `<span class="wl-chip" style="background:${s.color}1C;color:${s.color}"><span class="cdot" style="background:${s.color}"></span>${s.label} ${b.counts[s.k]}</span>`:'').join('');
  const rowHTML = b=>{
    const none = b.key==='__none__';
    const p = none? null : prof(b.key);
    const heavy = b.open > WORKLOAD_CAP;
    const pct = Math.round(b.open/maxOpen*100);
    const barColor = heavy? 'var(--red)' : b.open>=WORKLOAD_CAP*0.75? 'var(--amber)' : 'var(--accent)';
    return `<div class="wl-row">
      <div class="wl-who">${none? `<span class="wl-av wl-none">?</span><span class="wl-name" style="color:var(--ink3)">Unassigned</span>` : `${avatar(p,true)}<span class="wl-name">${esc(p?p.full_name:'—')}</span>`}</div>
      <div class="wl-mid">
        <div class="wl-bar"><div class="wl-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="wl-segs">${seg(b)||'<span class="tv-empty">No tasks</span>'}</div>
      </div>
      <div class="wl-load"><b style="color:${heavy?'var(--red)':'var(--ink)'}">${b.open}</b> open${heavy?' <span class="wl-flag">Heavy</span>':''}<div class="wl-sub">${b.total} total</div></div>
    </div>`;
  };
  host.innerHTML = `<div class="card wl-wrap">
    <div class="wl-head">
      <div>${people} ${people===1?'person':'people'} · ${totalOpen} open task${totalOpen===1?'':'s'} on this board</div>
      <label class="wl-cap">Comfortable load
        <input type="number" min="1" max="99" value="${WORKLOAD_CAP}" onchange="WORKLOAD_CAP=Math.max(1,+this.value||8);renderBoardBody('${id}')"> open/person</label>
    </div>
    ${list.length? list.map(rowHTML).join('') : '<div class="empty">No tasks match the current filters</div>'}
  </div>`;
}

function wireDnD(projectId){
  let dragId=null;
  document.querySelectorAll('.tcard').forEach(c=>{
    c.addEventListener('dragstart', e=>{ dragId=c.dataset.id; c.classList.add('dragging'); });
    c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const status = col.dataset.status; if(!dragId) return;
      const t = S._tasks.find(x=>x.id===dragId); if(!t || t.status===status) return;
      const old = t.status; t.status=status;
      renderProjectFromCache(projectId);
      const {error} = await db.from('tasks').update({status}).eq('id',dragId);
      if(error){ t.status=old; renderProjectFromCache(projectId); toast(error.message, true); }

    });
  });
}

function tvFmtDate(v){
  if(!v) return '';
  const d = new Date(v+'T00:00:00'); if(isNaN(d)) return v;
  const s = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return d.getFullYear()===new Date().getFullYear()? s : s+' '+d.getFullYear();

function tvDisplay(kind, val, t){

  if(kind==='priority'){ const p=PRIORITIES.find(x=>x.k===val); return p? `<span class="tv-fill" style="background:${p.color}">${esc(p.label)}</span>` : esc(val); }
  if(kind==='people'){ const p=prof(val); return p? `${avatar(p,true)}<span>${esc(p.full_name)}</span>` : `<span class="tv-empty">—</span>`; }
  if(kind==='due') return dueBadge(val, t?.status==='done') || esc(tvFmtDate(val));
  if(kind==='date') return esc(tvFmtDate(val));
  if(kind==='number') return `<span class="tv-num">${esc(val)}</span>`;

    return `<a class="tv-link" href="${esc(val)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open ${esc(host)}</a>`;

  if(kind==='brand'||kind.startsWith('f_')) return `<span class="tv-chip" style="background:var(--gray-soft);color:var(--ink)">${esc(val)}</span>`;

function tvEdit(el, ev){
  const {kind, tid, field, cust} = el.dataset;
  const t = S._tasks.find(x=>x.id===tid); if(!t) return;
  const cur = cust==='1' ? (t.custom||{})[field] : t[field];

    if(cust!=='1' && (field==='status'||field==='priority') && (val===null||val==='')) return;

    else await tvCore(tid, field, val);
    el.innerHTML = tvDisplay(kind, cust==='1'? (t.custom||{})[field] : t[field], t);
  };
  // file field: click opens a picker, uploads to storage, stores {name,path} in custom
  if(kind==='file'){
    const cur2 = (t.custom||{})[field];
    const pick = ()=>{
      const inp=document.createElement('input'); inp.type='file';
      inp.onchange=async ()=>{
        const f=inp.files[0]; if(!f) return;
        if(f.size > MAX_UPLOAD) return toast(`${f.name} is ${fileSize(f.size)} — the limit is 25 MB`, true);
        const path='taskfield/'+tid+'/'+field+'/'+Date.now()+'_'+(f.name||'file').replace(/[^\w.\-]+/g,'_');
        const {error}=await db.storage.from('attachments').upload(path, f, {contentType:f.type||undefined});
        if(error) return toast("Couldn't upload: "+error.message, true);
        if(cur2&&cur2.path) db.storage.from('attachments').remove([cur2.path]);
        await tvCustom(tid, field, {name:f.name||'file', path});
        el.innerHTML=tvDisplay('file', (t.custom||{})[field], t);
      };
      inp.click();
    };
    if(cur2&&cur2.path){
      tvShowMenu(el, [{v:'replace',l:'Replace file'},{v:'clear',l:'Remove file'}], o=>esc(o.l), async v=>{
        if(v==='clear'){ if(cur2.path) db.storage.from('attachments').remove([cur2.path]); await tvCustom(tid, field, ''); el.innerHTML=tvDisplay('file','',t); }
        else pick();
      }, false, false);
    } else pick();
    return;
  }
  // inline editors for free-form types
  if(kind==='text'||kind==='number'||kind==='date'||kind==='due'){
    if(el.querySelector('input')) return;
    const inp=document.createElement('input');
    inp.type = kind==='number'?'number':(kind==='date'||kind==='due')?'date':'text';
    inp.value = cur??'';
    el.textContent=''; el.appendChild(inp); inp.focus();
    let cancelled=false;
    inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){ cancelled=true; inp.blur(); } };
    inp.onblur=async ()=>{
      if(cancelled){ el.innerHTML=tvDisplay(kind, cur, t); return; }
      const val=inp.value.trim();
      if(val===(cur??'')) { el.innerHTML=tvDisplay(kind, cur, t); return; }
      await save(val===''? null : val);

  const opts = TVO[kind]||[];
  const renderOpt = o=>
    kind==='status'? tvDotOpt(o, STATUSES, cur) :
    kind==='priority'? tvDotOpt(o, PRIORITIES, cur) :
    kind==='platform'? tvDotOpt(o, PLATFORMS, cur) :
    kind==='people'? `${avatar(prof(o.v),true)}<span>${esc(o.l)}</span>` : esc(o.l);
  const canClear = !(cust!=='1' && (field==='status'||field==='priority'));

/* One option row for the status/priority popover: 10px colored dot + label,

/* ---- formula columns ----------------------------------------------------
   A small, safe expression language — no eval(). Supports numbers, "text",
   {Field} references (core + custom, by name), + - * / & comparisons, and
   the usual sheet functions. */
function fxEval(expr, t, depth=0){
  if(!expr || !expr.trim()) throw new Error('The formula is empty');
  const flds = S._fields||[];
  const res = name=>{
    const n = name.trim().toLowerCase();
    const core = {
      'name': t.title??'', 'title': t.title??'',
      'status': (STATUSES.find(x=>x.k===t.status)||{}).label||t.status||'',
      'priority': (PRIORITIES.find(x=>x.k===t.priority)||{}).label||t.priority||'',
      'assignee': (prof(t.assignee_id)||{}).full_name||'',
      'due date': t.due_date||'', 'due': t.due_date||'',
      'group': ((S._groups||[]).find(g=>g.id===t.group_id)||{}).name||'',
      'created': (t.created_at||'').slice(0,10),
    };
    if(n in core) return core[n];
    const fld = flds.find(x=>x.label.toLowerCase()===n);
    if(!fld) throw new Error('Unknown field {'+name+'}');
    if(fld.ftype==='formula'){
      if(depth>=3) throw new Error('Formulas reference each other in a loop');
      return fxEval((fld.options&&fld.options.expr)||'', t, depth+1);
    }
    let v = (t.custom||{})[fld.id];
    if(fld.ftype==='person') return (prof(v)||{}).full_name||'';
    return v==null? '' : v;
  };
  const toks=[]; let i=0; const src=expr;
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){i++;continue;}
    if(c==='{'){ const j=src.indexOf('}',i); if(j<0) throw new Error('A { is missing its }'); toks.push({t:'field',v:src.slice(i+1,j)}); i=j+1; continue; }
    if(c==='"'||c==="'"){ const q=c; let j=i+1,buf=''; while(j<src.length&&src[j]!==q){buf+=src[j++];} if(j>=src.length) throw new Error('A quote is not closed'); toks.push({t:'str',v:buf}); i=j+1; continue; }
    if(/[0-9.]/.test(c)){ let j=i; while(j<src.length&&/[0-9.]/.test(src[j]))j++; toks.push({t:'num',v:parseFloat(src.slice(i,j))}); i=j; continue; }
    if(/[A-Za-z_]/.test(c)){ let j=i; while(j<src.length&&/[A-Za-z_0-9]/.test(src[j]))j++; toks.push({t:'id',v:src.slice(i,j).toUpperCase()}); i=j; continue; }
    if(c==='<'&&src[i+1]==='>'){toks.push({t:'op',v:'<>'});i+=2;continue;}
    if((c==='<'||c==='>')&&src[i+1]==='='){toks.push({t:'op',v:c+'='});i+=2;continue;}
    if('+-*/&(),=<>'.includes(c)){toks.push({t:'op',v:c});i++;continue;}
    throw new Error('Unexpected character "'+c+'"');
  }
  let p=0;
  const peek=()=>toks[p], eat=v=>{const k=toks[p]; if(!k||(v&&k.v!==v)) throw new Error('Expected '+(v||'more')); p++; return k;};
  const num=x=>{ const n=typeof x==='number'?x:parseFloat(x); if(isNaN(n)) throw new Error('"'+x+'" is not a number'); return n; };
  const truthy=x=> x===true || x==='true' || (typeof x==='number'&&x!==0) || (typeof x==='string'&&x!==''&&x.toLowerCase()!=='false');
  function E(){ let a=A(); while(peek()&&peek().t==='op'&&['=','<>','<','>','<=','>='].includes(peek().v)){ const op=eat().v, b=A();
    if(op==='=') a=String(a??'').toLowerCase()===String(b??'').toLowerCase();
    else if(op==='<>') a=String(a??'').toLowerCase()!==String(b??'').toLowerCase();
    else a= op==='<'? num(a)<num(b) : op==='>'? num(a)>num(b) : op==='<='? num(a)<=num(b) : num(a)>=num(b); }
    return a; }
  function A(){ let a=M(); while(peek()&&peek().t==='op'&&['+','-','&'].includes(peek().v)){ const op=eat().v, b=M();
    if(op==='&') a=String(a??'')+String(b??'');
    else if(op==='+'){ const x=parseFloat(a), y=parseFloat(b); a=(!isNaN(x)&&!isNaN(y))? x+y : String(a??'')+String(b??''); }
    else a=num(a)-num(b); }
    return a; }
  function M(){ let a=U(); while(peek()&&peek().t==='op'&&['*','/'].includes(peek().v)){ const op=eat().v, b=U(); a= op==='*'? num(a)*num(b) : num(a)/num(b); } return a; }
  function U(){ if(peek()&&peek().t==='op'&&peek().v==='-'){ eat(); return -num(U()); } return P(); }
  function P(){
    const k=peek(); if(!k) throw new Error('The formula ends too early');
    if(k.t==='num'){eat();return k.v;}
    if(k.t==='str'){eat();return k.v;}
    if(k.t==='field'){eat();return res(k.v);}
    if(k.t==='op'&&k.v==='('){eat('('); const v=E(); eat(')'); return v;}
    if(k.t==='id'){ const name=eat().v;
      if(name==='TRUE') return true; if(name==='FALSE') return false;
      if(name==='TODAY' && !(peek()&&peek().v==='(')) return new Date().toISOString().slice(0,10);
      eat('('); const args=[];
      if(!(peek()&&peek().v===')')){ args.push(E()); while(peek()&&peek().v===','){eat(','); args.push(E());} }
      eat(')');
      return fxCall(name,args,num,truthy);
    }
    throw new Error('Unexpected "'+(k.v??'?')+'"');
  }
  const out=E();
  if(p<toks.length) throw new Error('Unexpected "'+toks[p].v+'" near the end');
  return out;
}
function fxCall(name,a,num,truthy){
  const D=s=>{ const d=new Date(s); if(isNaN(d)) throw new Error('"'+s+'" is not a date'); return d; };
  switch(name){
    case 'CONCATENATE': return a.map(x=>String(x??'')).join('');
    case 'UPPER': return String(a[0]??'').toUpperCase();
    case 'LOWER': return String(a[0]??'').toLowerCase();
    case 'TRIM':  return String(a[0]??'').trim();
    case 'LEN':   return String(a[0]??'').length;
    case 'LEFT':  return String(a[0]??'').slice(0, num(a[1]));
    case 'RIGHT': return String(a[0]??'').slice(-num(a[1]));
    case 'REPLACE': return String(a[0]??'').split(String(a[1]??'')).join(String(a[2]??''));
    case 'IF':  return truthy(a[0])? a[1] : (a.length>2? a[2] : '');
    case 'AND': return a.every(truthy);
    case 'OR':  return a.some(truthy);
    case 'NOT': return !truthy(a[0]);
    case 'ROUND': { const d=a.length>1? num(a[1]):0; return Math.round(num(a[0])*Math.pow(10,d))/Math.pow(10,d); }
    case 'ABS': return Math.abs(num(a[0]));
    case 'MIN': return Math.min(...a.map(num));
    case 'MAX': return Math.max(...a.map(num));
    case 'SUM': return a.reduce((x,y)=>x+num(y),0);
    case 'AVERAGE': return a.length? a.reduce((x,y)=>x+num(y),0)/a.length : 0;
    case 'DAYS': return Math.round((D(a[0])-D(a[1]))/86400000);
    case 'TODAY': return new Date().toISOString().slice(0,10);
    default: throw new Error(name+' is not a known function');
  }
}
function fxFormat(v){
  if(typeof v==='number') return String(Math.round(v*100)/100);
  if(v===true) return 'Yes'; if(v===false) return 'No';
  return String(v??'');
}
function fxDisplay(f, t){
  try{ return `<span class="tv-fxv">${esc(fxFormat(fxEval((f.options&&f.options.expr)||'', t)))}</span>`; }
  catch(e){ return `<span class="tv-fxerr" title="${esc(e.message)}">⚠</span>`; }
}
/* ---- link & mirror columns --------------------------------------------
   link:   options {project_id} — the cell value is a task uuid on that board.
   mirror: options {via: <link field id here>, show: <core key or target field id>}
           — read-only, computed from the linked task. */
async function loadLinkedData(tasks, fields){
  S._linkedTasks = {}; S._linkedFields = {};
  const linkFields = (fields||[]).filter(f=>f.ftype==='link');
  if(!linkFields.length) return;                    // no link columns → no queries
  const ids = new Set();
  (tasks||[]).forEach(t=> linkFields.forEach(f=>{ const v=(t.custom||{})[f.id]; if(v) ids.add(v); }));
  const targets = [...new Set(linkFields.map(f=>(f.options||{}).project_id).filter(Boolean))];
  const [lt, lf] = await Promise.all([
    ids.size? db.from('tasks').select('id,title,status,priority,assignee_id,due_date,group_id,project_id,custom').in('id',[...ids]) : Promise.resolve({data:[]}),
    targets.length? db.from('project_fields').select('id,label,ftype,options').in('project_id',targets) : Promise.resolve({data:[]}),
  ]);
  (lt.data||[]).forEach(x=> S._linkedTasks[x.id]=x);
  (lf.data||[]).forEach(x=> S._linkedFields[x.id]=x);
}
const tvLinkIcon = ()=> `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
function tvLinkCell(t, f){
  const v = (t.custom||{})[f.id];
  const lt = v? (S._linkedTasks||{})[v] : null;   // broken link / missing cache → dash
  const title = lt? String(lt.title||'') : '';
  const chip = lt? `<span class="tv-linkchip" title="${esc(title)}" onclick="event.stopPropagation();location.hash='#/task/${lt.id}'">${tvLinkIcon()}<span class="lt">${esc(title.length>24? title.slice(0,24)+'…' : title)}</span></span>`
    : `<span class="tv-empty">—</span>`;
  if(!canEdit()) return `<div class="tv-pickv ro">${chip}</div>`;
  return `<div class="tv-pickv" onclick="tvLinkPick(this,'${t.id}','${f.id}')">${chip}</div>`;
}
/* Target-board task lists for the link picker, cached per board for the session. */
const _linkPickCache = {};
async function tvLinkPick(el, tid, fid){
  const f = (S._fields||[]).find(x=>x.id===fid); if(!f) return;
  const target = (f.options||{}).project_id;
  if(!target) return toast('This link column has no target board yet — edit the column', true);
  let opts = _linkPickCache[target];
  if(!opts){
    const {data, error} = await db.from('tasks').select('id,title').eq('project_id',target).is('archived_at',null).order('position');
    if(error) return toast(error.message, true);
    opts = _linkPickCache[target] = (data||[]).map(x=>({v:x.id, l:x.title||'(untitled)'}));
  }
  tvShowMenu(el, opts, o=>`${tvLinkIcon()}<span>${esc(o.l)}</span>`, async v=>{
    await tvCustom(tid, fid, v===null? '' : v);   // same save path as every other custom cell
    if(v && !(S._linkedTasks||{})[v]){            // picker rows carry id+title only — mirrors need the full row
      const {data:full} = await db.from('tasks').select('id,title,status,priority,assignee_id,due_date,group_id,project_id,custom').eq('id',v).single();
      if(full){ (S._linkedTasks||(S._linkedTasks={}))[full.id]=full; }
    }
    const y=scrollY; renderBoardBody(tvPid); scrollTo(0,y);
  }, opts.length>5, true);
}
function mirrorResolve(t, f){
  const via = (f.options||{}).via;
  const lv = via? (t.custom||{})[via] : null;
  return lv? ((S._linkedTasks||{})[lv]||null) : null;
}
/* Plain-text value of a mirror cell — shared by the table view and the Excel export. */
function mirrorText(t, f){
  const lt = mirrorResolve(t, f), show = (f.options||{}).show;
  if(!lt || !show) return '';
  if(show==='status')   return (STATUSES.find(s=>s.k===lt.status)||{}).label||lt.status||'';
  if(show==='priority') return (PRIORITIES.find(p=>p.k===lt.priority)||{}).label||lt.priority||'';
  if(show==='assignee') return (prof(lt.assignee_id)||{}).full_name||'';
  if(show==='due_date') return lt.due_date||'';
  if(show==='group')    return '';                 // remote group names aren't loaded — shown as a dash
  const rf = (S._linkedFields||{})[show];
  if(rf && rf.ftype==='formula') return '';        // remote formulas aren't evaluated here

  return rv==null? '' : String(rv);
}
/* A mirror is editable when the remote value has a sensible editor — edits save

function mirrorEditable(f, lt){
  if(!lt) return false;
  const show = (f.options||{}).show;
  if(['status','priority','assignee','due_date'].includes(show)) return true;
  const rf = (S._linkedFields||{})[show];
  return !!rf && ['select','text','number','date','checkbox','brand','platform'].includes(rf.ftype);
}
function tvMirrorCell(t, f){
  const lt = mirrorResolve(t, f), show = (f.options||{}).show;
  let inner = `<span class="tv-empty">—</span>`;
  if(lt && show){
    if(show==='status')        inner = statusChip(lt.status);
    else if(show==='priority') inner = prioChip(lt.priority);
    else if(show==='assignee'){ const p=prof(lt.assignee_id); inner = p? `${avatar(p,true)}<span>${esc(p.full_name)}</span>` : inner; }
    else if(show==='due_date') inner = lt.due_date? esc(fmtDate(lt.due_date)) : inner;
    else { const s = mirrorText(t, f); inner = s? esc(s) : inner; }
  }
  if(canEdit() && mirrorEditable(f, lt))
    return `<div class="tv-pickv tv-mirror" title="Mirrored — editing here updates the linked task" onclick="tvMirrorEdit(this,'${t.id}','${f.id}')">${inner}</div>`;
  return `<div class="tv-pickv ro tv-mirror" title="Mirrored from the linked task">${inner}</div>`;
}
async function tvMirrorEdit(el, tid, fid){
  const f = (S._fields||[]).find(x=>x.id===fid); if(!f) return;
  const t = (S._tasks||[]).find(x=>x.id===tid); if(!t) return;
  const lt = mirrorResolve(t, f); if(!lt) return toast('Link this row to a task first', true);
  const show = (f.options||{}).show;
  const save = async patch=>{
    const {error} = await db.from('tasks').update(patch).eq('id', lt.id);
    if(error) return toast(error.message, true);
    Object.assign(lt, patch);
    const y=scrollY; renderBoardBody(tvPid); scrollTo(0,y);
    toast('Updated on the linked board');
  };
  if(show==='status')
    return tvShowMenu(el, STATUSES.map(s=>({v:s.k,l:s.label})), o=>tvDotOpt(o, STATUSES, lt.status), v=>v&&save({status:v}));
  if(show==='priority')
    return tvShowMenu(el, PRIORITIES.map(p=>({v:p.k,l:p.label})), o=>tvDotOpt(o, PRIORITIES, lt.priority), v=>v&&save({priority:v}));
  if(show==='assignee')
    return tvShowMenu(el, S.profiles.filter(p=>p.active).map(p=>({v:p.id,l:p.full_name})),
      o=>`${avatar(prof(o.v),true)}<span>${esc(o.l)}</span>${o.v===lt.assignee_id?'<span class="opt-cur">✓</span>':''}`,
      v=>save({assignee_id:v||null}), true, true);
  if(show==='due_date')
    return miniInputModal(f.label, 'date', lt.due_date||'', v=>save({due_date:v||null}), 'Editing here updates the linked task on the other board.');
  const rf = (S._linkedFields||{})[show]; if(!rf) return;
  const saveRemoteCustom = v=>{
    const custom = Object.assign({}, lt.custom||{});
    if(v===''||v==null){ delete custom[show]; } else { custom[show]=v; }
    return save({custom});
  };
  if(rf.ftype==='select')
    return tvShowMenu(el, (rf.options||[]).map(o=>({v:o,l:o})),
      o=>`<span>${esc(o.l)}</span>${o.v===(lt.custom||{})[show]?'<span class="opt-cur">✓</span>':''}`,
      v=>saveRemoteCustom(v), (rf.options||[]).length>5, true);
  if(rf.ftype==='platform')
    return tvShowMenu(el, PLATFORMS.map(p=>({v:p.k,l:p.label})),
      o=>tvDotOpt(o, PLATFORMS, (lt.custom||{})[show]),
      v=>saveRemoteCustom(v), true, true);
  if(rf.ftype==='checkbox')
    return saveRemoteCustom(!( /^(true|yes|1)$/i.test(String((lt.custom||{})[show]||'')) ));
  miniInputModal(rf.label, rf.ftype==='number'?'number':rf.ftype==='date'?'date':'text',
    (lt.custom||{})[show]||'', v=>saveRemoteCustom(v), 'Editing here updates the linked task on the other board.');
}
/* One-field editor used for mirrored dates / text / numbers.
   Optional `hint` renders a "!" the user can click to read the explanation. */
function miniInputModal(title, type, value, cb, hint){
  const info = hint ? `<button class="mi-info" title="Read more" onclick="var h=this.parentNode.parentNode.querySelector('.mi-hint');h.hidden=!h.hidden;">!</button>` : '';
  const hintRow = hint ? `<div class="mi-hint" hidden>${esc(hint)}</div>` : '';
  const m = modal(`<div class="modal-head"><h2 style="font-size:15px;display:flex;align-items:center;gap:6px">${esc(title)}${info}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">${hintRow}<input id="mi-val" type="${type}" value="${esc(value)}"></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-primary" id="mi-save">Save</button></div>`);
  const inp = m.querySelector('#mi-val'); inp.focus();
  const go = ()=>{ const v=inp.value.trim(); closeModals(); cb(v); };
  m.querySelector('#mi-save').onclick = go;
  inp.onkeydown = e=>{ if(e.key==='Enter') go(); };
}
function tvCell(t, f){

  const v = (t.custom||{})[f.id];
  if(f.ftype==='checkbox') return `<input type="checkbox" ${v?'checked':''} ${canEdit()?`onchange="tvCustom('${t.id}','${f.id}', this.checked)"`:'disabled'}>`;
  if(f.ftype==='number')   return tvPickHTML('number', t.id, f.id, true, v);
  if(f.ftype==='date')     return tvPickHTML('date', t.id, f.id, true, v);
  if(f.ftype==='select')   return tvPickHTML('f_'+f.id, t.id, f.id, true, v);
  if(f.ftype==='person')   return tvPickHTML('people', t.id, f.id, true, v);
  if(f.ftype==='brand')    return tvPickHTML('brand', t.id, f.id, true, v);
  if(f.ftype==='platform') return tvPickHTML('platform', t.id, f.id, true, v);
  if(f.ftype==='file')     return tvPickHTML('file', t.id, f.id, true, v, t);
  return tvPickHTML('text', t.id, f.id, true, v);
}
/* Export the rows the table is showing right now (filters applied), in display order. */
function exportBoardCSV(pid){
  const p = projById(pid);
  const flds = S._fields||[], groups = S._groups||[];
  let rows = S._lastRowSet || bfApply(pid, S._tasks||[]);
  const byPos = (a,b)=> (a.position||0)-(b.position||0);
  if(groups.length){
    const gids = new Set(groups.map(g=>g.id));
    rows = groups.flatMap(g=> rows.filter(t=>t.group_id===g.id).sort(byPos))
      .concat(rows.filter(t=>!t.group_id || !gids.has(t.group_id)).sort(byPos));
  } else rows = [...rows].sort(byPos);
  const cell = (t,f)=>{
    if(f.ftype==='formula'){ try{ return fxFormat(fxEval((f.options&&f.options.expr)||'', t)); }catch(e){ return ''; } }
    if(f.ftype==='link'){ const lv=(t.custom||{})[f.id]; const lt=lv? (S._linkedTasks||{})[lv]:null; return lt? (lt.title||'') : ''; }
    if(f.ftype==='mirror') return mirrorText(t, f);
    const v = (t.custom||{})[f.id];
    if(f.ftype==='checkbox') return v? 'Yes':'No';
    if(f.ftype==='file') return (v&&v.name)? v.name : '';
    return v==null? '' : v;
  };
  const out = [['Task','Group','Status','Priority','Assignee','Due date', ...flds.map(f=>f.label), 'Created']];
  rows.forEach(t=> out.push([
    t.title||'',
    (groups.find(g=>g.id===t.group_id)||{}).name||'',
    (STATUSES.find(s=>s.k===t.status)||{}).label||t.status||'',
    (PRIORITIES.find(x=>x.k===t.priority)||{}).label||t.priority||'',
    (prof(t.assignee_id)||{}).full_name||'',
    t.due_date||'',
    ...flds.map(f=>cell(t,f)),
    (t.created_at||'').slice(0,10),
  ]));
  downloadXLSX(xlsxFilename(p? p.name : 'Board'), out);
}
/* ---- Import Excel: first sheet, header row with a "Task" column, columns matched by name ---- */
function importExcel(pid){

  const inp = document.createElement('input');

/* Pure mapping: array-of-arrays -> task rows + warnings. Kept separate so it is testable. */
function mapImportRows(aoa, pid){
  const warnings = []; const tasks = []; let skipped = 0;
  const hi = (aoa||[]).findIndex(r=> (r||[]).some(c=> String(c).trim().toLowerCase()==='task'));
  if(hi < 0) return {tasks, warnings:['No "Task" column found in the header row'], skipped};
  const head = aoa[hi].map(c=> String(c).trim());
  const low  = head.map(h=> h.toLowerCase());
  const col  = name => low.indexOf(name);
  const flds = S._fields||[], groups = S._groups||[];
  const fieldByLabel = {}; flds.forEach(f=>{ fieldByLabel[f.label.trim().toLowerCase()] = f; });
  const known = new Set(['task','group','status','priority','assignee','due date','created']);
  const unknown = [];
  head.forEach((h,i)=>{ if(h && !known.has(low[i]) && !fieldByLabel[low[i]]) unknown.push(h); });
  if(unknown.length) warnings.push(`Ignored column${unknown.length>1?'s':''}: ${unknown.join(', ')}`);
  if(head.some((h,i)=> fieldByLabel[low[i]] && fieldByLabel[low[i]].ftype==='formula'))
    warnings.push('Formula columns are computed automatically and were skipped');
  if(head.some((h,i)=> fieldByLabel[low[i]] && ['link','mirror','file'].includes(fieldByLabel[low[i]].ftype)))
    warnings.push('Link, Mirror and File columns can\'t be imported and were skipped');
  const statusOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return 'todo';
    const m = STATUSES.find(x=> x.k===s || x.label.toLowerCase()===s); return m? m.k : 'todo'; };
  const prioOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return 'normal';
    const m = PRIORITIES.find(x=> x.k===s || x.label.toLowerCase()===s); return m? m.k : 'normal'; };
  const personOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return null;
    const m = (S.profiles||[]).find(p=> p.active && (p.full_name||'').trim().toLowerCase()===s); return m? m.id : null; };
  const groupOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return null;
    const m = groups.find(g=> (g.name||'').trim().toLowerCase()===s); return m? m.id : null; };
  const dateOf = v=>{
    if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    if(typeof v === 'number' && v > 20000) return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
    const s = String(v).trim(); if(!s) return null;
    const d = new Date(s); return isNaN(d)? null : d.toISOString().slice(0,10);
  };
  let misses = 0;
  for(let i=hi+1; i<aoa.length; i++){
    const r = aoa[i]||[];
    const title = String(r[col('task')]??'').trim();
    if(!title){ skipped++; continue; }
    const t = {project_id:pid, title, status:'todo', priority:'normal', assignee_id:null, group_id:null, due_date:null, custom:{}, created_by:S.me.id};
    if(col('status')>=0)   t.status = statusOf(r[col('status')]);
    if(col('priority')>=0) t.priority = prioOf(r[col('priority')]);
    if(col('assignee')>=0){ t.assignee_id = personOf(r[col('assignee')]);
      if(!t.assignee_id && String(r[col('assignee')]).trim()) misses++; }
    if(col('group')>=0)    t.group_id = groupOf(r[col('group')]);
    if(col('due date')>=0) t.due_date = dateOf(r[col('due date')]);
    head.forEach((h,ci)=>{
      const f = fieldByLabel[low[ci]]; if(!f || ['formula','link','mirror','file'].includes(f.ftype)) return;
      const v = r[ci]; if(v===''||v==null) return;
      t.custom[f.id] = f.ftype==='checkbox'? /^(yes|true|1|y|✓)$/i.test(String(v).trim())
        : f.ftype==='date'? (dateOf(v)||'') : String(v instanceof Date? v.toISOString().slice(0,10) : v);
    });
    tasks.push(t);
  }
  if(misses) warnings.push(`${misses} assignee name${misses>1?'s':''} didn't match anyone — those rows import unassigned`);
  return {tasks, warnings, skipped};
}

async function doImportExcel(){

  const base = Math.max(0, ...(S._tasks||[]).map(t=>t.position||0));

  inp.oninput = ()=>{ go.disabled = inp.value.trim() !== String(ids.length); };
  m.querySelector('#bd-archive').onclick = ()=>{ closeModals(); tvBulkArchive(); };
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {error}=await db.from('tasks').delete().in('id',ids);
    if(error){ go.disabled=false; go.textContent='Delete permanently'; return toast(error.message, true); }
    S._tasksAll = (S._tasksAll||[]).filter(t=>!tvSel.has(t.id));
    tvSel.clear(); tvBulkBar(); tvApplyArch(); closeModals(); toast(ids.length+' task'+(ids.length>1?'s':'')+' deleted');
    const y=scrollY; renderBoardBody(tvPid); scrollTo(0,y);
  };
  setTimeout(()=>inp.focus(), 30);
}
/* ---- per-row task menu (monday-style ⋯) ---- */
function rowMenu(anchor, tid){
  const t = (S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  const items = [
    {label:'Open task', fn:()=>openTask(tid)},
    {label:'Copy task link', fn:()=>copyTaskLink(tid)},
  ];
  if(canEdit() && !t.archived_at){
    items.push('-');
    items.push({label:'Move to top of group', fn:()=>taskMoveTop(tid)});
    if((S._groups||[]).length) items.push({label:'Move to group…', fn:()=>taskMoveGroup(anchor, tid)});
    items.push({label:'Move to another board…', fn:()=>taskMoveBoard(anchor, tid)});
    items.push({label:'Duplicate', fn:()=>taskDuplicate(tid)});
    items.push({label:'New task below', fn:()=>newTaskModal(t.project_id, t.status, t.group_id)});
    items.push('-');
    items.push({label:'Archive', fn:()=>taskArchiveOne(tid)});
    if(isAdmin()) items.push({label:'Delete', danger:true, fn:()=>rowDelete(tid)});
  }
  ctxMenu(anchor, items);
}
function copyTaskLink(tid){
  const url = location.origin + location.pathname + '#/task/' + tid;
  const done = ()=>toast('Task link copied');
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done, ()=>prompt('Copy this link:', url));
  else prompt('Copy this link:', url);
}
async function taskMoveTop(tid){
  const t=(S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  const peers=(S._tasksAll||[]).filter(x=>x.group_id===t.group_id && x.id!==tid);
  const pos = Math.min(0, ...peers.map(x=>x.position||0)) - 1;
  const {error}=await db.from('tasks').update({position:pos}).eq('id',tid);
  if(error) return toast(error.message, true);
  t.position=pos; renderBoardBody(t.project_id);
}
function taskMoveGroup(anchor, tid){
  const t=(S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  tvShowMenu(anchor, (S._groups||[]).filter(g=>g.id!==t.group_id).map(g=>({v:g.id,l:g.name})), o=>esc(o.l),
    async v=>{ if(!v) return;
      const {error}=await db.from('tasks').update({group_id:v}).eq('id',tid);
      if(error) return toast(error.message, true);
      t.group_id=v; renderBoardBody(t.project_id); toast('Moved to '+esc((S._groups.find(g=>g.id===v)||{}).name||'group'));
    }, (S._groups||[]).length>5, false);
}
function taskMoveBoard(anchor, tid){
  const t=(S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  const boards = S.projects.filter(p=>p.id!==t.project_id && p.status==='active');
  if(!boards.length) return toast('No other board to move to', true);
  tvShowMenu(anchor, boards.map(p=>({v:p.id,l:p.name})), o=>esc(o.l),
    async v=>{ if(!v) return;
      const {error}=await db.from('tasks').update({project_id:v, group_id:null}).eq('id',tid);
      if(error) return toast(error.message, true);
      S._tasksAll = S._tasksAll.filter(x=>x.id!==tid); tvApplyArch();
      renderBoardBody(t.project_id);
      toast('Moved to '+esc((projById(v)||{}).name||'board'));
    }, boards.length>5, false);
}
async function taskDuplicate(tid){
  const t=(S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  const {data, error}=await db.from('tasks').insert({
    project_id:t.project_id, group_id:t.group_id, title:t.title+' (copy)',
    description:t.description, status:t.status, priority:t.priority,
    assignee_id:t.assignee_id, due_date:t.due_date, tags:t.tags,
    custom:t.custom||{}, created_by:S.me.id, position:(t.position||0)+0.5,
  }).select().single();
  if(error) return toast(error.message, true);
  S._tasksAll.push(data); tvApplyArch(); renderBoardBody(t.project_id);
  toast('Task duplicated');
}
async function taskArchiveOne(tid){
  const t=(S._tasksAll||[]).find(x=>x.id===tid); if(!t) return;
  const at=new Date().toISOString();
  const {error}=await db.from('tasks').update({archived_at:at}).eq('id',tid);
  if(error) return toast(error.message, true);
  t.archived_at=at; tvApplyArch(); renderBoardBody(t.project_id);
  toastUndo('Task archived', ()=>tvUnarchive(tid));
}
function rowDelete(tid){
  tvSel.clear(); tvSel.add(tid); tvBulkDelete();
}
function tvQuickAdd(e, pid, gid){
  if(e.key!=='Enter') return;
  const inp=e.target, title=inp.value.trim(); if(!title) return;
  inp.disabled=true;
  const maxPos=Math.max(0,...(S._tasks||[]).map(t=>t.position||0));
  db.from('tasks').insert({project_id:pid, title, group_id:gid, status:'todo', priority:'normal', created_by:S.me.id, position:maxPos+1}).select().single().then(({data,error})=>{
    if(error){ toast(error.message, true); inp.disabled=false; return; }
    S._tasks.push(data);
    const y=scrollY; renderBoardBody(pid); scrollTo(0,y);
  });
}
window.addEventListener('hashchange', ()=>{ tvSel.clear(); document.getElementById('tvbulk')?.remove(); document.getElementById('tvmenu')?.remove(); });
function tvToggleGroup(gid){
  const box = document.getElementById('tvg-'+gid); if(!box) return;
  if(tvCollapsed.has(gid)) tvCollapsed.delete(gid); else tvCollapsed.add(gid);
  box.classList.toggle('collapsed', tvCollapsed.has(gid));

let tvDragId=null;
function tvDragStart(e, tid){ tvDragId=tid; e.currentTarget.closest('tr')?.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
function tvDragEnd(e){ e.currentTarget.closest('tr')?.classList.remove('dragging'); }
function tvDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('dragover'); }
function tvDragLeave(e){ e.currentTarget.classList.remove('dragover'); }
async function tvDrop(e, pid){
  e.preventDefault(); const wrap=e.currentTarget; wrap.classList.remove('dragover');
  const gid = wrap.dataset.gid||null; if(!tvDragId) return;
  const t=S._tasks.find(x=>x.id===tvDragId); tvDragId=null;

  const old=t.group_id||null; t.group_id=gid;
  renderBoardBody(pid);
  const {error}=await db.from('tasks').update({group_id:gid}).eq('id',t.id);
  if(error){ t.group_id=old; renderBoardBody(pid); toast(error.message, true); }
}
function addGroupModal(pid){ groupModal(pid, null); }
function editGroupModal(gid, pid){ const g=(S._groups||[]).find(x=>x.id===gid); if(g) groupModal(pid, g); }
function groupModal(pid, g){
  const palette=['#0F766E','#2273C9','#B97A08','#D6455B','#6C5CE7','#12915E','#E17055','#8E93A8'];

    <div class="modal-body">

      <label>Color</label>
      <div id="gr-colors" style="display:flex;gap:8px;margin-top:4px">${palette.map(c=>
        `<span data-c="${c}" onclick="[...this.parentNode.children].forEach(x=>x.style.outline='none');this.style.outline='2px solid var(--ink)';this.parentNode.dataset.sel=this.dataset.c"
          style="width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;outline:${c===cur?'2px solid var(--ink)':'none'};outline-offset:2px"></span>`).join('')}</div>

}
async function tvCore(tid, field, val){
  const t=S._tasks.find(x=>x.id===tid); if(!t) return;
  const old=t[field]; t[field]=val;
  const {error}=await db.from('tasks').update({[field]:val}).eq('id',tid);
  if(error){ t[field]=old; toast(error.message, true); }

}
async function tvCustom(tid, fid, val){
  const t=S._tasks.find(x=>x.id===tid); if(!t) return;
  t.custom = Object.assign({}, t.custom||{});
  if(val===''||val===null){ delete t.custom[fid]; } else { t.custom[fid]=val; }
  const {error}=await db.from('tasks').update({custom:t.custom}).eq('id',tid);
  if(error) toast(error.message, true);
}
function addColumnModal(pid){ columnModal(pid, null); }
function editColumnModal(fid, pid){ const f=(S._fields||[]).find(x=>x.id===fid); if(f) columnModal(pid, f); }
function columnModal(pid, f){
  const types=[['text','Text'],['number','Number'],['date','Date'],['select','Dropdown'],['checkbox','Checkbox'],['person','Person'],['brand','Brand'],['platform','Platform'],['file','File'],['formula','Formula'],['link','Link to board'],['mirror','Mirror']];
  const linkFields = (S._fields||[]).filter(x=>x.ftype==='link' && (!f || x.id!==f.id));
  const m = modal(`<div class="modal-head"><h2>${f?'Edit column':'New column'}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Column name <span class="req">*</span></label><input id="cf-label" value="${f? esc(f.label):''}" placeholder="e.g. Store Location">
      <label>Type</label><select id="cf-type" ${f?'disabled':''}>${types.map(([k,l])=>`<option value="${k}" ${f&&f.ftype===k?'selected':''}>${l}</option>`).join('')}</select>
      <div id="cf-opts-wrap" style="display:${(f? f.ftype:'text')==='select'?'block':'none'}">
        <label>Dropdown options (one per line)</label>
        <textarea id="cf-opts" rows="4" placeholder="Option A&#10;Option B">${f && Array.isArray(f.options)? esc(f.options.join('\n')):''}</textarea>
      </div>
      <div id="cf-fx-wrap" style="display:${(f? f.ftype:'text')==='formula'?'block':'none'}">
        <label>Formula</label>
        <textarea id="cf-fx" rows="3" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:13px" placeholder='IF({Status} = "Done", "✓", DAYS({Due date}, TODAY()) & " days left")'>${f && f.options && f.options.expr? esc(f.options.expr):''}</textarea>
        <div style="font-size:11.5px;color:var(--ink3);margin:7px 0 4px">Click to insert a field:</div>
        <div id="cf-fx-fields" style="display:flex;flex-wrap:wrap;gap:5px"></div>
        <div style="font-size:11.5px;color:var(--ink3);margin:9px 0 4px">Functions: <span style="font-family:ui-monospace,Menlo,monospace">CONCATENATE UPPER LOWER LEFT RIGHT LEN REPLACE IF AND OR NOT ROUND ABS MIN MAX SUM AVERAGE DAYS TODAY</span> · text joins with <b>&amp;</b>, numbers use <b>+ − × ÷</b></div>
        <div id="cf-fx-prev" style="margin-top:9px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--gray-soft);font-size:12.5px;color:var(--ink2)">Preview appears as you type</div>
      </div>
      <div id="cf-link-wrap" style="display:${(f? f.ftype:'text')==='link'?'block':'none'}">
        <label>Board to link to</label>
        <select id="cf-link-board"><option value="">Choose a board…</option>
          ${(S.projects||[]).filter(p=>p.id!==pid).map(p=>`<option value="${p.id}" ${f&&f.options&&f.options.project_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        <p style="color:var(--ink3);font-size:12px;margin-top:6px">Each row can point at one task on that board.</p>
      </div>
      <div id="cf-mirror-wrap" style="display:${(f? f.ftype:'text')==='mirror'?'block':'none'}">
        ${linkFields.length? `<label>Via link column</label>
        <select id="cf-mirror-via">${linkFields.map(x=>`<option value="${x.id}" ${f&&f.options&&f.options.via===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
        <label>Show</label>
        <select id="cf-mirror-show">${[['status','Status'],['priority','Priority'],['assignee','Assignee'],['due_date','Due date']].map(([v,l])=>`<option value="${v}" ${f&&f.options&&f.options.show===v?'selected':''}>${l}</option>`).join('')}</select>`
        : `<p style="color:var(--ink3);font-size:12.5px;margin-top:8px">Add a <b>Link to board</b> column first — a mirror shows a value from the task each row links to.</p>`}
      </div>
      ${f? `<p style="color:var(--ink3);font-size:12.5px;margin-top:10px">Type cannot be changed after creation. Deleting a column keeps task data but hides it.</p>`:''}
    </div>

      <button class="btn btn-primary" id="cf-save">${f?'Save':'Add column'}</button>
    </div>`);
  const syncType = v=>{
    m.querySelector('#cf-opts-wrap').style.display = v==='select'?'block':'none';
    m.querySelector('#cf-fx-wrap').style.display   = v==='formula'?'block':'none';
    m.querySelector('#cf-link-wrap').style.display = v==='link'?'block':'none';
    m.querySelector('#cf-mirror-wrap').style.display = v==='mirror'?'block':'none';
  };
  m.querySelector('#cf-type').onchange = e=> syncType(e.target.value);
  // mirror wiring: when the link column changes, offer the target board's own fields too
  const viaSel = m.querySelector('#cf-mirror-via'), showSel = m.querySelector('#cf-mirror-show');
  let mirrorInit = true;   // on open, keep the saved "show" (it may be a target-board field id)
  async function loadMirrorShow(){
    if(!viaSel || !showSel || !viaSel.value) return;
    const lf = (S._fields||[]).find(x=>x.id===viaSel.value);
    const tb = lf && lf.options && lf.options.project_id;
    const keep = (mirrorInit && f && f.options && f.options.show) || showSel.value || 'status';

    const core = [['status','Status'],['priority','Priority'],['assignee','Assignee'],['due_date','Due date']];
    let extra = [];
    if(tb){
      const {data:tf} = await db.from('project_fields').select('id,label,ftype').eq('project_id',tb);

    }
    showSel.innerHTML = core.concat(extra).map(([v,l])=>`<option value="${esc(v)}" ${v===keep?'selected':''}>${esc(l)}</option>`).join('');

  if(viaSel){ viaSel.onchange = loadMirrorShow; loadMirrorShow(); }
  // formula builder wiring: field chips + live preview against a real row
  const fxIn = m.querySelector('#cf-fx'), fxPrev = m.querySelector('#cf-fx-prev');
  const chipNames = ['Name','Status','Assignee','Due date','Priority','Group']
    .concat((S._fields||[]).filter(x=>(!f || x.id!==f.id) && !['link','mirror'].includes(x.ftype)).map(x=>x.label));

  m.querySelectorAll('.fx-chip').forEach(ch=> ch.onclick = ()=>{
    const pos = fxIn.selectionStart ?? fxIn.value.length;
    fxIn.value = fxIn.value.slice(0,pos) + ch.textContent + fxIn.value.slice(fxIn.selectionEnd ?? pos);

  });
  const sampleTask = ()=> (S._tasks||[]).find(t=>!t.archived_at) || (S._tasks||[])[0] || {title:'Sample task', status:'todo', priority:'normal', custom:{}, created_at:new Date().toISOString()};
  function fxPreview(){
    const src = fxIn.value.trim();
    if(!src){ fxPrev.innerHTML = 'Preview appears as you type'; return; }

    catch(e){ fxPrev.innerHTML = '⚠ '+esc(e.message); fxPrev.style.color='var(--amber)'; }
  }
  fxIn.oninput = fxPreview;
  if(f && f.ftype==='formula') fxPreview();
  if(f){
    m.querySelector('#cf-del').onclick = async ()=>{
      const {error}=await db.from('project_fields').delete().eq('id',f.id);
      if(error) return toast(error.message, true);
      closeModals(); toast('Column deleted'); renderProject(pid);
    };
  }
  m.querySelector('#cf-save').onclick = async ()=>{
    const label=m.querySelector('#cf-label').value.trim(); if(!label) return toast('Column name is required', true);
    const ftype=m.querySelector('#cf-type').value;
    let options = ftype==='select'? m.querySelector('#cf-opts').value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
    if(ftype==='select' && !options.length) return toast('Add at least one dropdown option', true);
    if(ftype==='formula'){
      const expr = m.querySelector('#cf-fx').value.trim();
      if(!expr) return toast('Write a formula first', true);
      try{ fxEval(expr, {title:'x', status:'todo', priority:'normal', custom:{}, created_at:new Date().toISOString()}); }
      catch(e){ if(/Unknown field|not a known function|missing|not closed|Unexpected|too early|loop/i.test(e.message)) return toast('Formula problem: '+e.message, true); }
      options = {expr};

    if(ftype==='link'){

      if(!target) return toast('Pick the board this column links to', true);
      options = {project_id: target};
    }

      const via = m.querySelector('#cf-mirror-via')?.value;
      const show = m.querySelector('#cf-mirror-show')?.value;
      if(!via) return toast('A mirror needs a "Link to board" column on this board first', true);

      options = {via, show};

    let error;
    if(f){ ({error} = await db.from('project_fields').update({label, options}).eq('id',f.id)); }
    else { ({error} = await db.from('project_fields').insert({project_id:pid, label, ftype, options, position:(S._fields||[]).length, created_by:S.me.id})); }
    if(error) return toast(error.message, true);
    closeModals(); toast(f?'Column updated':'Column added'); renderProject(pid);
  };
}
async function projectMembersModal(pid){
  const {data:members} = await db.from('project_members').select('*').eq('project_id',pid);
  const memberIds = new Set((members||[]).map(m=>m.user_id));
  const externals = S.profiles.filter(p=>['partner','freelancer'].includes(p.role));
  const board = (S.projects||[]).find(x=>x.id===pid) || {};
  const vis = board.visibility || 'collaborate';

    <div class="modal-body">

      ${canGuest? '' : `<div style="margin-top:12px;padding:10px 12px;background:var(--gray-soft);border-radius:8px;font-size:12.5px;color:var(--ink2)">
        This board is <b>${VIS[vis].label}</b>, so outside guests can't be added. Switch it to <b>Shareable</b> first.
        ${canEdit()? `<button class="btn btn-ghost btn-sm" style="margin-left:8px" id="pm-tovis">Make Shareable</button>`:''}</div>`}
      ${externals.length? externals.map(p=>`
        <div class="chk" ${canGuest?'':'style="opacity:.45"'}><input type="checkbox" data-uid="${p.id}" ${memberIds.has(p.id)?'checked':''} ${canGuest?'':'disabled'}>
        ${avatar(p,true)} <span>${esc(p.full_name)} <span style="color:var(--ink3)">· ${esc(p.email)}</span></span></div>`).join('')
      : '<div class="empty">No partner or freelancer accounts yet. Create them in Admin → Users.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="pm-save" ${canGuest?'':'disabled'}>Save</button></div>`);
  m.querySelector('#pm-tovis')?.addEventListener('click', async ()=>{
    const {error} = await db.from('projects').update({visibility:'shareable'}).eq('id',pid);
    if(error) return toast(error.message, true);
    board.visibility='shareable'; await refreshCore();
    closeModals(); toast('Board is now Shareable'); projectMembersModal(pid);
  });
  m.querySelector('#pm-save').onclick = async ()=>{
    const want = new Set([...m.querySelectorAll('input[data-uid]:checked')].map(i=>i.dataset.uid));
    const add=[...want].filter(u=>!memberIds.has(u)).map(user_id=>({project_id:pid,user_id}));
    const rm=[...memberIds].filter(u=>!want.has(u));
    if(add.length){ const {error} = await db.from('project_members').insert(add); if(error) return toast(error.message, true); }

    closeModals(); toast('Members updated');
  };
}

<script>

function newTaskModal(projectId, status='todo', groupId=null){

  const m = modal(`<div class="modal-head"><h2>New task</h2><button class="x" onclick="closeModals()">✕</button></div>

/* #/task/<id> — a shareable link straight to one task */
async function openTaskRoute(id){
  const {data:t} = await db.from('tasks').select('id,project_id').eq('id',id).single();
  if(!t){ toast('Task not found — it may have been deleted or you may not have access', true); location.hash='#/home'; return; }
  location.hash = '#/project/' + t.project_id;
  setTimeout(()=>openTask(id), 450);
}
async function openTask(id){
  const [{data:t}, {data:chk}, {data:comments}, {data:atts}, {data:subs}, {data:hist}, {data:apprs}, {data:depsOn}, {data:depsBy}] = await Promise.all([
    db.from('tasks').select('*').eq('id',id).single(),
    db.from('task_checklist').select('*').eq('task_id',id).order('position'),
    db.from('comments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('attachments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('subtasks').select('*').eq('task_id',id).order('position').order('created_at'),
    db.from('activity_log').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at',{ascending:false}).limit(200),
    db.from('approvals').select('*').eq('task_id',id).order('created_at'),
    db.from('task_deps').select('*').eq('task_id',id),
    db.from('task_deps').select('*').eq('depends_on',id),
  ]);
  S._taskHist = hist||[]; S._histEntity = id; S._histType = 'task';
  if(!t) return toast('Task not found', true);
  S._taskDeps = depsOn||[];
  // Titles/statuses for what this task waits on — the board cache usually has them.
  let depTasks = [];

  if(depIds.length){
    depTasks = (S._tasksAll||S._tasks||[]).filter(x=>depIds.includes(x.id));
    const missing = depIds.filter(i=>!depTasks.some(x=>x.id===i));
    if(missing.length){ const {data:mt} = await db.from('tasks').select('id,title,status').in('id',missing); depTasks = depTasks.concat(mt||[]); }
  }
  await hydrateCommentAtts(comments||[]);

  const p = projById(t.project_id);
  const m = modal(`<div class="modal-head">
      <h2><span id="tv-title-view">${esc(t.title)}</span></h2>
      ${isStaff()? `<button class="x" title="Delete task" onclick="deleteTask('${t.id}','${t.project_id}')" style="font-size:12px;font-weight:600">Delete</button>`:''}

    <div class="modal-body">

        <div><label>Priority</label><select id="tv-prio" ${canEdit()?'':'disabled'}>${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k===t.priority?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div><label>Assignee</label><select id="tv-assignee" ${canEdit()?'':'disabled'}><option value="">Unassigned</option>${assigneeOptions(t.project_id, t.assignee_id)}</select></div>
        <div><label>Due date</label><input id="tv-due" type="date" value="${t.due_date||''}" ${canEdit()?'':'disabled'}></div>
      </div>
      <label>Title</label><input id="tv-title" value="${esc(t.title)}" ${canEdit()?'':'disabled'}>
      <label>Description</label><textarea id="tv-desc" rows="3" ${canEdit()?'':'disabled'}>${esc(t.description)}</textarea>
      <label>Subtasks</label>
      <div id="tv-subprog">${subProgressBar(subs||[])}</div>
      <div id="tv-subs">${(subs||[]).map(stRow).join('')}</div>

        <button class="btn btn-ghost btn-sm" id="tv-sub-add">Add</button></div>`:''}
      <label>Checklist</label>
      <div id="tv-chk">${(chk||[]).map(c=>chkRow(c)).join('')}</div>
      ${canEdit()? `<div style="display:flex;gap:8px;margin-top:6px"><input id="tv-chk-new" placeholder="Add checklist item…" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-chk-add">Add</button></div>`:''}
      <label>Attachments</label>
      <div id="tv-atts">${attListHTML(atts, canEdit())}</div>
      ${canCreate()? attachZoneHTML('tv-drop') : ''}
      ${(p?.approval_gate?.on || (apprs||[]).length)? signoffSectionHTML(t, apprs||[], p?.approval_gate||{}) : ''}
      ${(isStaff() || (depsOn||[]).length || (depsBy||[]).length)? depsSectionHTML(t, depsOn||[], depsBy||[], depTasks) : ''}
      <label>Comments</label>
      <div id="tv-comments">${(comments||[]).map(commentRow).join('')||'<div style="color:var(--ink3);font-size:13px">No comments yet</div>'}</div>
      ${canCreate()? commentComposerHTML('tv') : ''}
      ${historySectionHTML()}
      <div style="margin-top:14px;font-size:11.5px;color:var(--ink3)">Created ${fmtDateTime(t.created_at)} by ${esc(prof(t.created_by)?.full_name||'—')} · in ${esc(p?.name||'')}</div>

    wireMentions(cIn);
    cIn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !document.querySelector('.mention-menu')){ e.preventDefault(); m.querySelector('#tv-comment-add').click(); } });
    m.querySelector('#tv-comment-add').onclick = ()=> postComment('task', t.id, t.title, cIn, m.querySelector('#tv-comments'));
  }

/* ---- sign-off (maker-checker) ----
   The DB enforces the gate: moving into the gated status without an approved
   row raises, and maker-cannot-be-checker is rejected on insert. The UI just
   shows the rows and passes error messages through. */
function signoffRow(a){
  const ap = prof(a.approver_id), rq = prof(a.requested_by);
  const chip = a.status==='approved'? `<span class="chip" style="background:var(--green-soft);color:var(--green)">approved</span>`
    : a.status==='rejected'? `<span class="chip" style="background:var(--red-soft);color:var(--red)">rejected</span>`
    : `<span class="chip" style="background:var(--amber-soft);color:var(--amber)">pending</span>`;
  const mine = a.status==='pending' && S.me && a.approver_id===S.me.id;
  return `<div class="so-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;font-size:13px">
    ${avatar(ap,true)} <b>${esc(ap?.full_name||'—')}</b> ${chip}
    <span style="color:var(--ink3);font-size:12px">asked by ${esc(rq?.full_name||'—')} · ${timeAgo(a.created_at)}</span>
    ${a.note? `<span style="color:var(--ink2);font-size:12px">“${esc(a.note)}”</span>`:''}
    ${mine? `<span style="margin-left:auto;white-space:nowrap"><button class="btn btn-green btn-sm" onclick="decideTaskApproval('${a.id}','approved','${a.task_id}')">Approve</button>
      <button class="btn btn-danger btn-sm" onclick="decideTaskApproval('${a.id}','rejected','${a.task_id}')">Reject</button></span>`:''}
  </div>`;
}
function signoffSectionHTML(t, apprs, gate){
  const last = apprs[apprs.length-1];
  const gateLabel = (STATUSES.find(s=>s.k===(gate.status||'done'))||{}).label||'Done';
  return `<label>Sign-off</label>
    <div id="tv-signoff">
      ${apprs.map(signoffRow).join('') || '<div style="color:var(--ink3);font-size:13px">No sign-off requested yet</div>'}
      ${last && last.status==='approved'? `<div style="font-size:12.5px;color:var(--green);margin-top:4px">Sign-off complete — this task can be marked ${esc(gateLabel)}</div>`:''}
      ${isStaff()? `<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="requestSignoffModal('${t.id}')">Request sign-off</button>`:''}
    </div>`;
}
async function requestSignoffModal(taskId){
  const {data:t} = await db.from('tasks').select('id,title,project_id').eq('id',taskId).single();
  if(!t) return toast('Task not found', true);
  const gate = (projById(t.project_id)||{}).approval_gate||{};
  // gate approvers pre-fill the picker; never offer myself — the DB rejects self-approval
  let pool = (gate.approvers||[]).map(prof).filter(u=>u && u.active && u.id!==S.me.id);
  if(!pool.length) pool = S.profiles.filter(u=>u.active && ['admin','internal','management'].includes(u.role) && u.id!==S.me.id && !(u.email||'').startsWith('forms+'));
  if(!pool.length) return toast('No one else can sign off yet — add another staff member first', true);
  const m = modal(`<div class="modal-head"><h2>Request sign-off</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--ink2);margin-bottom:10px">${esc(t.title)}</div>
      <label>Who signs off</label><select id="so-approver">${pool.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select>
      <label>Note (optional)</label><input id="so-note" placeholder="Anything they should look at?">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="so-send">Send request</button></div>`);
  m.querySelector('#so-send').onclick = async ()=>{
    const approver_id = m.querySelector('#so-approver').value;
    if(!approver_id) return toast('Pick an approver', true);
    const {error} = await db.from('approvals').insert({task_id:t.id, title:t.title,
      approver_id, requested_by:S.me.id, note:m.querySelector('#so-note').value.trim()});
    if(error) return toast(error.message, true);
    closeModals(); toast('Sign-off requested'); openTask(t.id);
  };
}
/* ---- dependencies ----
   The DB blocks moving a task forward while a dependency isn't done; the
   error message it raises is human-readable and the status handlers already
   toast it. The UI just lists and edits the links. */
function depsSectionHTML(t, depsOn, depsBy, depTasks){
  return `<label>Waiting on</label>
    <div id="tv-deps">
      ${depsOn.map(d=>{
        const dt = (depTasks||[]).find(x=>x.id===d.depends_on);
        return `<div class="dep-row" style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px">
          <span style="flex:1;min-width:0">${esc(dt?.title||'(task)')}</span>${statusChip(dt?.status||'todo')}
          ${isStaff()? `<span style="cursor:pointer;color:var(--ink3)" title="Remove dependency" onclick="removeDep('${d.task_id}','${d.depends_on}')">✕</span>`:''}
        </div>`;}).join('') || '<div style="color:var(--ink3);font-size:13px">Not waiting on anything</div>'}
      ${depsBy.length? `<div style="font-size:12px;color:var(--ink3);margin-top:4px">${depsBy.length} task${depsBy.length>1?'s are':' is'} waiting on this one</div>`:''}
      ${isStaff()? `<button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="addDepModal('${t.id}')">＋ Add dependency</button>`:''}
    </div>`;
}
function addDepModal(taskId){
  const linked = new Set((S._taskDeps||[]).map(d=>d.depends_on));
  const pool = (S._tasks||[]).filter(x=>x.id!==taskId && x.status!=='done' && !x.archived_at && !linked.has(x.id));
  if(!pool.length) return toast('No open tasks on this board to wait on', true);
  const m = modal(`<div class="modal-head"><h2>Add dependency</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--ink2);margin-bottom:10px">This task can't move forward until the chosen one is done.</div>
      <label>Waits on</label><select id="dep-pick">${pool.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="dep-add">Add</button></div>`);
  m.querySelector('#dep-add').onclick = async ()=>{
    const depends_on = m.querySelector('#dep-pick').value;
    if(!depends_on) return toast('Pick a task', true);
    const {error} = await db.from('task_deps').insert({task_id:taskId, depends_on});
    if(error) return toast(error.message, true);
    (S._deps||(S._deps=[])).push({task_id:taskId, depends_on});
    toast('Dependency added'); closeModals(); openTask(taskId);
  };
}
async function removeDep(taskId, dependsOn){
  const {error} = await db.from('task_deps').delete().eq('task_id',taskId).eq('depends_on',dependsOn);
  if(error) return toast(error.message, true);
  S._deps = (S._deps||[]).filter(d=>!(d.task_id===taskId && d.depends_on===dependsOn));
  toast('Dependency removed'); closeModals(); openTask(taskId);
}
/* Same decision as decideApproval, but lands back in the task drawer.
   The DB writes the notification + history rows itself. */
async function decideTaskApproval(id, status, taskId){
  let note = '';
  if(status==='rejected'){ note = prompt('Reason for rejection (optional):')||''; }
  const {error} = await db.from('approvals').update({status, note, decided_at:new Date().toISOString()}).eq('id',id);
  if(error) return toast(error.message, true);
  toast(status==='approved'? 'Approved':'Rejected');
  updateApprovalBadge();
  closeModals(); openTask(taskId);
}
/* ---- paste a list, get items: one per line, bullets/numbering stripped ---- */
function splitPasteLines(text){
  return String(text||'').split(/\r?\n/)
    .map(s=> s.replace(/^\s*(?:[-–—•*▪◦✓☐]|\d+[.)])\s*/,'').trim())
    .filter(Boolean);
}
function wireListPaste(input, addMany){
  if(!input) return;
  input.addEventListener('paste', e=>{
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const lines = splitPasteLines(txt);
    if(lines.length < 2) return;              // single line pastes normally
    e.preventDefault();
    addMany(lines);
  });
}
async function addSubtasksBulk(taskId, lines, m){

  if(error) return toast(error.message, true);
  (data||[]).forEach(s=> m.querySelector('#tv-subs').insertAdjacentHTML('beforeend', stRow(s)));
  m.querySelector('#tv-sub-new').value=''; refreshSubProg(taskId);
  toast(`${(data||[]).length} subtasks added`);
}
async function addChecklistBulk(taskId, lines, m){

    lines.map((label,i)=>({task_id:taskId, label, position:base+i+1}))).select();
  if(error) return toast(error.message, true);
  (data||[]).forEach(c=> m.querySelector('#tv-chk').insertAdjacentHTML('beforeend', chkRow(c)));

function subProgressBar(subs){
  const total=subs.length, done=subs.filter(s=>s.status==='done').length;
  if(!total) return '';
  const pct = Math.round(done/total*100);
  return `<div class="prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><span class="prog-lbl">${done}/${total} done</span></div>`;
}
async function refreshSubProg(taskId){
  const {data:subs} = await db.from('subtasks').select('status').eq('task_id',taskId);
  const box = document.getElementById('tv-subprog'); if(box) box.innerHTML = subProgressBar(subs||[]);
}

    <span style="font-size:12.5px">${esc(s.title)}</span><span style="font-size:12px;color:var(--ink3)">${esc(s.stype||'')}</span>

    <span style="font-size:12px;color:var(--ink3)">${s.due_date||''}</span><span></span></div>`;
  return `<div class="strow" id="st-${s.id}" data-task="${s.task_id}">
    <select onchange="stUpd('${s.id}','status',this.value,'${s.task_id}')">${STATUSES.map(x=>`<option value="${x.k}" ${x.k===s.status?'selected':''}>${x.label}</option>`).join('')}</select>
