    <select onchange="stUpd('${s.id}','assignee_id',this.value||null,'${s.task_id}')"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active && !(p.email||'').startsWith('forms+')).map(p=>`<option value="${p.id}" ${p.id===s.assignee_id?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    <input type="date" value="${s.due_date||''}" onchange="stUpd('${s.id}','due_date',this.value||null,'${s.task_id}')">
    <button class="del" onclick="delSubtask('${s.id}','${s.task_id}')">✕</button></div>`;
}
async function stUpd(id, field, val, taskId){
  const {error} = await db.from('subtasks').update({[field]:val}).eq('id',id);
  if(error) return toast(error.message, true);
  if(field==='status') refreshSubProg(taskId);
}
async function delSubtask(id, taskId){
  const {error} = await db.from('subtasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  document.getElementById('st-'+id)?.remove(); refreshSubProg(taskId);
}
function chkRow(c){
  if(!canEdit()) return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} disabled><span>${esc(c.label)}</span></div>`;
  return `<div class="chk ${c.done?'done':''}" id="chk-${c.id}">
    <input type="checkbox" ${c.done?'checked':''} onchange="toggleChk('${c.id}', this.checked)">
    <span>${esc(c.label)}</span>
    <button class="del" onclick="delChk('${c.id}')">✕</button></div>`;
}
async function toggleChk(id, done){
  await db.from('task_checklist').update({done}).eq('id',id);
  const row = document.getElementById('chk-'+id); if(row) row.classList.toggle('done', done);
}
async function delChk(id){
  await db.from('task_checklist').delete().eq('id',id);
  document.getElementById('chk-'+id)?.remove();
}
function canRemoveComment(c){ return S.me && (c.author_id===S.me.id || isStaff()); }
function canEditComment(c){ return S.me && c.author_id===S.me.id; }
/* A removed comment disappears from the thread entirely — its trace, and the
   Undo, live on the task History instead. */
function commentRow(c){
  if(c.deleted_at) return '';
  const a = prof(c.author_id);
  const atts = c.atts || [];
  return `<div class="comment" data-cid="${c.id}">${avatar(a,true)}<div class="body">
    <b>${esc(a?.full_name||'Unknown')}</b><span class="when">${fmtDateTime(c.created_at)}${c.edited_at? ' · edited':''}</span>
    <span class="cmt-acts">
      ${canEditComment(c)? `<button class="cmt-act" title="Edit" onclick="editComment('${c.id}')">Edit</button>`:''}
      ${canRemoveComment(c)? `<button class="cmt-act danger" title="Remove" onclick="deleteComment('${c.id}')">Remove</button>`:''}
    </span>
    <p class="cmt-body">${c.body? renderMentionText(c.body, c.mentions):''}</p>
    ${atts.length? `<div class="att-list in-comment">${atts.map(x=>attLink(x)).join('')}</div>`:''}
  </div></div>`;
}
function commentsBoxEl(){ return document.querySelector('#tv-comments, #rv-comments'); }
function renderCommentsBox(){
  const box = commentsBoxEl(); if(!box) return;
  const rows = Object.values(S._commentCache||{}).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
  box.innerHTML = rows.map(commentRow).join('') || '<div style="color:var(--ink3);font-size:13px">No comments yet</div>';
}
async function refreshTaskHistory(){
  const boxEl = document.getElementById('tv-history'); if(!boxEl || !S._histEntity) return;
  const {data} = await db.from('activity_log').select('*').eq('entity_type', S._histType||'task')
    .eq('entity_id', S._histEntity).order('created_at',{ascending:false}).limit(200);
  S._taskHist = data||[];
  boxEl.innerHTML = historyHTML(S._taskHist);
}
async function deleteComment(id){
  const {data, error} = await db.from('comments')
    .update({deleted_at:new Date().toISOString(), deleted_by:S.me.id}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  toastUndo('Comment removed', ()=>undoDeleteComment(id));
}
async function undoDeleteComment(id){
  const {data, error} = await db.from('comments')
    .update({deleted_at:null, deleted_by:null}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  toast('Comment restored');
}
/* Edit in place: the text swaps for an input; Enter saves, Escape cancels. */
function editComment(id){
  const c = (S._commentCache||{})[id]; if(!c) return;
  const body = document.querySelector(`.comment[data-cid="${id}"] .cmt-body`); if(!body) return;
  if(body.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.className = 'cmt-editbox'; inp.value = c.body||'';
  body.textContent=''; body.appendChild(inp); inp.focus();
  inp.setSelectionRange(inp.value.length, inp.value.length);
  let done=false;
  const cancel = ()=>{ if(done) return; done=true; body.innerHTML = renderMentionText(c.body, c.mentions); };
  const save = async ()=>{
    if(done) return;
    const val = inp.value.trim();
    if(!val || val===c.body) return cancel();
    done=true;
    const {data, error} = await db.from('comments')
      .update({body:val, edited_at:new Date().toISOString()}).eq('id',id).select().single();
    if(error){ done=false; return toast(error.message, true); }
    cacheComment(data); renderCommentsBox(); refreshTaskHistory();
  };
  inp.onkeydown = e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') cancel(); };
  inp.onblur = ()=> setTimeout(save, 100);
}
function cacheComment(row){
  if(!row) return;
  const prev = (S._commentCache||{})[row.id];
  if(prev) row.atts = prev.atts;
  (S._commentCache = S._commentCache||{})[row.id] = row;
}
/* ---- task history ---- */
const statusLabel = k => (STATUSES.find(s=>s.k===k)||{}).label || k || '—';
const prioLabel   = k => (PRIORITIES.find(p=>p.k===k)||{}).label || k || '—';
const groupLabel  = id => ((S._groups||[]).find(g=>g.id===id)||{}).name || (id? 'another group':'no group');
const fieldLabel  = f => ({title:'Title', status:'Status', priority:'Priority', assignee:'Assignee',
                           due_date:'Due date', group:'Group', board:'Board', description:'Description',
                           archived:'Archive'})[f] || f;
function histValue(field, v, key){
  if(v===null || v===undefined || v==='') return '<em>empty</em>';
  if(field==='status')   return esc(statusLabel(v));
  if(field==='priority') return esc(prioLabel(v));
  if(field==='assignee') return esc(prof(v)?.full_name || 'someone');
  if(field==='group')    return esc(groupLabel(v));
  if(field==='board')    return esc(projById(v)?.name || 'another board');
  if(field==='due_date') return esc(fmtDate(v));
  return esc(String(v));
}
function histLine(a){
  const d = a.detail||{};
  switch(a.action){
    case 'created':        return 'created this task';
    case 'deleted':        return 'deleted this task';
    case 'commented':        return `commented${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_deleted':  return `removed a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_restored': return `restored a comment${d.excerpt? ` — “${esc(d.excerpt)}”`:''}`;
    case 'comment_edited':   return `edited a comment${d.was? ` — “${esc(d.was)}” → “${esc(d.excerpt||'')}”` : (d.excerpt? ` — now “${esc(d.excerpt)}”`:'')}`;
    case 'file_added':     return `attached <b>${esc(d.file||'a file')}</b>`;
    case 'file_removed':   return `removed <b>${esc(d.file||'a file')}</b>`;
    case 'subtask_added':  return `added subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_removed':return `removed subtask <b>${esc(d.title||'')}</b>`;
    case 'subtask_status': return `marked subtask <b>${esc(d.title||'')}</b> ${esc(d.to==='done'?'done':'not done')}`;
    case 'checklist_added':  return `added checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_removed':return `removed checklist item <b>${esc(d.label||'')}</b>`;
    case 'checklist_toggled':return `${d.done?'checked':'unchecked'} <b>${esc(d.label||'')}</b>`;
    case 'signoff_requested': return `requested a sign-off from <b>${esc(prof(d.approver)?.full_name||'someone')}</b>`;
    case 'signoff_approved':  return `approved the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    case 'signoff_rejected':  return `rejected the sign-off${d.note? ` — “${esc(d.note)}”`:''}`;
    // entries written before the history engine existed
    case 'status_changed': return `changed <b>Status</b> from ${histValue('status',d.from)} to ${histValue('status',d.to)}`;
    case 'updated': {
      const cs = d.changes||[];
      if(!cs.length && d.status){ const rs=(typeof REQ_STATUSES!=='undefined'?REQ_STATUSES:[]).find(s=>s.k===d.status);
        return `moved this ticket to <b>${esc(rs?rs.label:d.status)}</b>`; }
      if(!cs.length) return 'made a change';
      return cs.map(c=>{
        if(c.field==='description') return 'edited the description';
        if(c.field==='archived')    return c.to==='archived'? 'archived this task' : 'restored this task';
        if(c.field==='custom'){
          const f = (S._fields||[]).find(x=>x.id===c.key);
          return `set <b>${esc(f?f.name:'a field')}</b> to ${histValue('custom', c.to)}`;
        }
        const from = histValue(c.field, c.from), to = histValue(c.field, c.to);
        if(c.field==='title') return `renamed it to <b>${to}</b>`;
        return `changed <b>${esc(fieldLabel(c.field))}</b> from ${from} to ${to}`;
      }).join(', ');
    }
    default: return esc(a.action.replace(/_/g,' '));
  }
}
function historyHTML(rows, showAll){
  if(!rows || !rows.length) return '<div style="color:var(--ink3);font-size:13px">Nothing recorded yet.</div>';
  const shown = showAll ? rows : rows.slice(0,8);
  return `<div class="hist">${shown.map(a=>{
    const who = prof(a.actor_id);
    const cid = a.action==='comment_deleted' ? (a.detail||{}).comment_id : null;
    const cRow = cid ? (S._commentCache||{})[cid] : null;
    const undo = cid && cRow && cRow.deleted_at && canRemoveComment(cRow)
      ? `<button class="hist-undo" onclick="undoDeleteComment('${cid}')">Undo</button>` : '';
    return `<div class="hist-row">
      ${avatar(who,true)}
      <div class="hist-txt"><b>${esc(who?.full_name||'Someone')}</b> ${histLine(a)}
        <span class="hist-when" title="${fmtDateTime(a.created_at)}">${timeAgo(a.created_at)}</span>${undo}</div>
    </div>`;
  }).join('')}</div>
  ${rows.length>8 && !showAll ? `<div class="hist-more" onclick="showAllHistory()">Show all ${rows.length} events</div>`:''}`;
}
function showAllHistory(){
  const box = document.getElementById('tv-history'); if(!box) return;
  box.innerHTML = historyHTML(S._taskHist||[], true);
}
/* The activity log stays folded until asked for — a click on the header opens it. */
function historySectionHTML(){
  const n = (S._taskHist||[]).length;
  return `<div class="hist-toggle" onclick="toggleHistoryPanel(this)">
      <label style="cursor:pointer;margin:0">Activity log</label>
      <span class="hist-count">${n||''}</span><span class="hist-chev">▸</span>
    </div>
    <div id="tv-history" hidden>${historyHTML(S._taskHist)}</div>`;
}
function toggleHistoryPanel(head){
  const box = document.getElementById('tv-history'); if(!box) return;
  box.hidden = !box.hidden;
  const ch = head.querySelector('.hist-chev'); if(ch) ch.textContent = box.hidden? '▸' : '▾';
}
/* Comments come back without their files; fetch them in one go and attach. */
async function hydrateCommentAtts(comments){
  const ids = (comments||[]).map(c=>c.id);
  if(!ids.length) return comments||[];
  const {data} = await db.from('attachments').select('*').eq('entity_type','comment').in('entity_id', ids).order('created_at');
  const by = {};
  (data||[]).forEach(a=> (by[a.entity_id] || (by[a.entity_id]=[])).push(a));
  comments.forEach(c=> c.atts = by[c.id] || []);
  return comments;
}
async function deleteTask(id, projectId){
  if(!confirm('Delete this task permanently?')) return;
  const {error} = await db.from('tasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  closeModals(); toast('Task deleted'); renderProject(projectId);
}
</script>
<script>
/* ================= REQUESTS ================= */
let reqTab = 'mine';
async function renderRequests(){
  setTopbar('Requests', `<button class="btn btn-primary btn-sm" onclick="newRequestFlow()">＋ New request</button>`);
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';

  const {data:reqs, error} = await q;
  if(error){ C.innerHTML=`<div class="card empty">${esc(error.message)}</div>`; return; }

  C.innerHTML = `
    <div class="page-head"><h1>Requests</h1>
      ${isStaff()? `<div class="tabs">
        <button class="tab ${reqTab==='open'?'active':''}" onclick="reqTab='open';renderRequests()">Open queue</button>
        <button class="tab ${reqTab==='all'?'active':''}" onclick="reqTab='all';renderRequests()">All</button>
        <button class="tab ${reqTab==='mine'?'active':''}" onclick="reqTab='mine';renderRequests()">Mine</button>
      </div>`:''}
      <div class="actions">${isStaff()? `<button class="btn btn-ghost" onclick="exportRequestsCSV()">Export Excel</button>`:''}<button class="btn btn-primary" onclick="newRequestFlow()">＋ New request</button></div></div>
    <div class="card">${(reqs||[]).length? requestTable(reqs) : `<div class="empty">No requests here yet</div>`}</div>`;
}
function exportRequestsCSV(){
  const out = [['WO','Title','Type','Status','Priority','Submitted by','Assigned to','Created','SLA due','Paused']];
  (S._lastReqRows||[]).forEach(r=>{
    const rt = S.requestTypes.find(x=>x.id===r.request_type_id);
    out.push([
      r.ticket_no? 'WO-'+r.ticket_no : '',

      rt? rt.name : '',

      (PRIORITIES.find(x=>x.k===r.priority)||{}).label||r.priority||'',

function newRequestFlow(){
  const m = modal(`<div class="modal-head"><h2>What do you need?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body" style="padding-top:14px"><div class="rt-grid">
      ${S.requestTypes.map(rt=>`<button class="rt-pick" onclick="newRequestForm('${rt.id}')">

      </button>`).join('')}
    </div></div>`, true);
}
function fieldInput(f){
  const req = f.required? '<span class="req">*</span>':'';
  if(f.type==='textarea') return `<label>${esc(f.label)} ${req}</label><textarea data-fk="${f.key}" rows="3"></textarea>`;
  if(f.type==='select') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select —</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='brand') return `<label>${esc(f.label)} ${req}</label><select data-fk="${f.key}"><option value="">— select brand —</option>${(S.brandsList||[]).filter(b=>b.active).map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>`;
  if(f.type==='multiselect') return `<label>${esc(f.label)} ${req}</label><div style="display:flex;flex-wrap:wrap;gap:4px 16px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff">${(f.options||[]).map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--ink);cursor:pointer"><input type="checkbox" data-fkm="${f.key}" value="${esc(o)}" style="width:15px;height:15px;accent-color:var(--accent)">${esc(o)}</label>`).join('')}</div>`;
  return `<label>${esc(f.label)} ${req}</label><input data-fk="${f.key}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}">`;
}
function readField(m, f){
  if(f.type==='multiselect') return [...m.querySelectorAll(`input[data-fkm="${f.key}"]:checked`)].map(i=>i.value).join(', ');
  return m.querySelector(`[data-fk="${f.key}"]`)?.value?.trim()||'';
}
function newRequestForm(rtId){
  closeModals();
  const rt = S.requestTypes.find(x=>x.id===rtId); if(!rt) return;
  const m = modal(`<div class="modal-head"><h2>${esc(rt.name)}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">

async function convertToTask(reqId){
  const {data:r} = await db.from('requests').select('*').eq('id',reqId).single();
  if(!r) return;
  const rt = S.requestTypes.find(x=>x.id===r.request_type_id);

  const projs = S.projects.filter(p=>p.status==='active');
  const m = modal(`<div class="modal-head"><h2>Convert to task</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Into board</label><select id="cv-proj">${projs.map(p=>{
        const w=wsById(p.workspace_id);
        return `<option value="${p.id}" ${p.workspace_id===wsId?'selected':''}>${w?esc(w.name)+' · ':''}${esc(p.name)}</option>`;}).join('')}</select>
      <label>Assignee</label><select id="cv-assignee"><option value="">Unassigned</option>${S.profiles.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===r.assigned_to?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="cv-save">Create task</button></div>`);
  m.querySelector('#cv-save').onclick = async ()=>{
    const project_id = m.querySelector('#cv-proj').value; if(!project_id) return toast('Pick a board', true);
    const desc = (rt?.fields||[]).map(f=> r.data[f.key]? `${f.label}: ${r.data[f.key]}`:'').filter(Boolean).join('\n');
    const {data:task, error} = await db.from('tasks').insert({
      project_id, title:r.title, description:`From request (${rt?.name||'request'}):\n${desc}`,
      priority:r.priority, assignee_id:m.querySelector('#cv-assignee').value||null,
      due_date: r.sla_due_at? r.sla_due_at.slice(0,10):null, request_id:r.id, created_by:S.me.id,
      tags:['request']
    }).select().single();
    if(error) return toast(error.message, true);
    await db.from('requests').update({project_id, status: r.status==='submitted'||r.status==='in_review'?'in_progress':r.status}).eq('id',r.id);
    closeModals(); toast('Task created from request'); logActivity('request', r.id, 'converted_to_task', {task:task.id});
    location.hash = '#/project/'+project_id;
  };

async function decideApproval(id, status, reqIdToRefresh){
  let note = '';
  if(status==='rejected'){ note = prompt('Reason for rejection (optional):')||''; }
  const {data:a, error} = await db.from('approvals').update({status, note, decided_at:new Date().toISOString()}).eq('id',id).select().single();
  if(error) return toast(error.message, true);
  // reflect on the request if linked and staff
  if(a?.request_id){
    try{ await db.from('requests').update({status: status==='approved'?'approved':'rejected', decided_by:S.me.id, decided_at:new Date().toISOString(), decision_note:note}).eq('id',a.request_id).in('status',['submitted','in_review']); }catch(e){}
  }
  toast(status==='approved'? 'Approved':'Rejected'); logActivity('approval', id, status, {});
  updateApprovalBadge();
  closeModals();
  if(S.route.view==='approvals') renderApprovals(); else if(S.route.view==='home') renderHome(); else if(reqIdToRefresh) openRequest(reqIdToRefresh);
}

/* ================= DASHBOARD ================= */
/* One engine, two homes: the personal Dashboard, and each workspace's Report tab.
   `wsSel` (a workspace id, or null for everything) scopes every widget. */
async function buildDashCtx(wsSel){
  const [tks, reqs, apprs] = await Promise.all([
    db.from('tasks').select('id,project_id,title,status,priority,assignee_id,due_date,completed_at,created_at'),
    db.from('requests').select('id,ticket_no,title,status,sla_due_at,completed_at,created_at,request_type_id,decided_at,submitted_by,assigned_to'),
    db.from('approvals').select('id,status,request_id'),
  ]);
  let tasks=tks.data||[], requests=reqs.data||[], approvals=apprs.data||[];
  const scopeProjects = wsSel ? S.projects.filter(p=>p.workspace_id===wsSel) : S.projects;
  if(wsSel){
    const pidSet = new Set(scopeProjects.map(p=>p.id));
    tasks = tasks.filter(t=>pidSet.has(t.project_id));
    const rtSet = new Set(S.requestTypes.filter(rt=>rt.default_workspace_id===wsSel).map(rt=>rt.id));
    requests = requests.filter(r=>rtSet.has(r.request_type_id));
    const reqSet = new Set(requests.map(r=>r.id));
    approvals = approvals.filter(a=>a.request_id && reqSet.has(a.request_id));
  }
  const open = tasks.filter(t=>t.status!=='done');
  const overdue = open.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const dueWeek = open.filter(t=>t.due_date && daysDiff(t.due_date)>=0 && daysDiff(t.due_date)<=7);
  const doneTasks = tasks.filter(t=>t.status==='done');
  const onTime = doneTasks.filter(t=>!t.due_date || (t.completed_at && new Date(t.completed_at) <= new Date(t.due_date+'T23:59:59')));
  const onTimePct = doneTasks.length? Math.round(onTime.length/doneTasks.length*100) : null;
  const openReqs = requests.filter(r=>['submitted','in_review','approved','in_progress'].includes(r.status));
  const slaBreach = openReqs.filter(r=>r.sla_due_at && new Date(r.sla_due_at)<Date.now());
  const pendingAppr = approvals.filter(a=>a.status==='pending').length;
  S._dashCtx = {tasks, requests, open, overdue, dueWeek, doneTasks, openReqs, slaBreach, scopeProjects, wsSel};
  return {open, overdue, dueWeek, onTimePct, openReqs, slaBreach, pendingAppr};
}

/* ================= DASHBOARD WIDGETS ================= */
const W_SHOWS_TASKS = [['open','Open'],['overdue','Overdue'],['due7','Due within 7 days'],['done','Done'],['blocked','Blocked'],['review','In review'],['all','All']];
const W_SHOWS_REQS  = [['open','Open'],['sla','SLA breached'],['all','All']];
const W_GROUPS_TASKS= [['status','Status'],['priority','Priority'],['workspace','Workspace'],['project','Board'],['assignee','Assignee'],['group','Group']];
const W_GROUPS_REQS = [['status','Status'],['type','Request type']];

function widgetTaskRows(cfg){
  const c=S._dashCtx;
  let rows = cfg.entity==='requests'? c.requests : c.tasks;
  if(cfg.entity==='requests'){
    if(cfg.show==='open') rows=c.openReqs;
    else if(cfg.show==='sla') rows=c.slaBreach;
  } else {
    if(cfg.show==='open') rows=c.open;
    else if(cfg.show==='overdue') rows=c.overdue;
    else if(cfg.show==='due7') rows=c.dueWeek;
    else if(cfg.show==='done') rows=c.doneTasks;
    else if(cfg.show==='blocked') rows=rows.filter(t=>t.status==='blocked');
    else if(cfg.show==='review') rows=rows.filter(t=>t.status==='review');
    if(cfg.mine) rows=rows.filter(t=>t.assignee_id===S.me.id);
  }
  return rows;
}
function widgetGroups(cfg){
  const c=S._dashCtx;
  if(cfg.entity==='requests'){
    if(cfg.groupBy==='type') return S.requestTypes.map(rt=>({label:rt.name, color:'#0F766E', n:c.requests.filter(r=>r.request_type_id===rt.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
    return REQ_STATUSES.map(s=>({label:s.label, color:s.color.startsWith('var')? '#0F766E':s.color, n:c.requests.filter(r=>r.status===s.k).length})).filter(x=>x.n>0);
  }
  if(cfg.groupBy==='priority') return PRIORITIES.map(p=>({label:p.label, color:p.color.startsWith('var')? '#8E93A8':p.color, n:c.open.filter(t=>t.priority===p.k).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='workspace') return (c.wsSel? c.scopeProjects.map(p=>({label:p.name,color:p.color,n:c.open.filter(t=>t.project_id===p.id).length}))
    : S.workspaces.map(w=>{ const pids=new Set(S.projects.filter(p=>p.workspace_id===w.id).map(p=>p.id)); return {label:w.name,color:w.color,n:c.open.filter(t=>pids.has(t.project_id)).length}; })).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  if(cfg.groupBy==='project') return c.scopeProjects.map(p=>({label:p.name, color:p.color, n:c.open.filter(t=>t.project_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,10);
  if(cfg.groupBy==='group') return (c.groups||[]).map(g=>({label:g.name, color:g.color, n:c.open.filter(t=>t.group_id===g.id).length})).filter(x=>x.n>0);
  if(cfg.groupBy==='assignee') return S.profiles.map(p=>({label:p.full_name, color:p.avatar_color||'#0F766E', n:c.open.filter(t=>t.assignee_id===p.id).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,8);
  return STATUSES.map(s=>({label:s.label, color:s.color, n:c.tasks.filter(t=>t.status===s.k).length})).filter(x=>x.n>0);
}
function donutSVG(rows){
  const total = rows.reduce((a,r)=>a+r.n,0);
  if(!total) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const C1=2*Math.PI*44; let acc=0;
  const segs = rows.map(r=>{
    const frac=r.n/total, off=acc; acc+=frac;
    return `<circle r="44" cx="60" cy="60" fill="none" stroke="${r.color}" stroke-width="16"
      stroke-dasharray="${(frac*C1).toFixed(2)} ${(C1-frac*C1).toFixed(2)}" stroke-dashoffset="${(-off*C1+C1/4).toFixed(2)}"></circle>`;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 120 120" width="140" height="140">${segs}
      <text x="60" y="58" text-anchor="middle" style="font-size:22px;font-weight:800;fill:var(--ink)">${total}</text>
      <text x="60" y="76" text-anchor="middle" style="font-size:9px;font-weight:700;fill:var(--ink3);letter-spacing:.6px">TOTAL</text></svg>
    <div class="donut-legend">${rows.map(r=>`<div class="dl-row"><span class="dl-dot" style="background:${r.color}"></span><span class="dl-l" title="${esc(r.label)}">${esc(r.label)}</span><b>${r.n}</b></div>`).join('')}</div></div>`;
}
function widgetCard(w){
  const cfg = w.config||{};
  let body='';
  if(w.wtype==='stat'){
    const rows = widgetTaskRows(cfg);
    const danger = ['overdue','sla'].includes(cfg.show);
    body = `<div class="w-stat ${danger&&rows.length?'red':''}">${rows.length}</div><div class="w-stat-l">${esc(cfg.entity==='requests'?'requests':'tasks')}</div>`;
  }
  else if(w.wtype==='bar') body = hbars(widgetGroups(cfg));
  else if(w.wtype==='donut') body = donutSVG(widgetGroups(cfg));
  else if(w.wtype==='progress'){
    const c=S._dashCtx, total=c.tasks.length, done=c.doneTasks.length;
    const pct = total? Math.round(done/total*100):0;
    body = `<div class="w-stat accent">${pct}%</div><div class="w-stat-l">${done} of ${total} tasks done</div>
      <div class="prog-bar" style="margin-top:10px"><div class="prog-fill" style="width:${pct}%"></div></div>`;
  }
  else if(w.wtype==='list'){
    let rows = widgetTaskRows(cfg);
    if(cfg.entity==='requests') rows=[...rows].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,6);
    else rows=[...rows].sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')).slice(0,6);
    body = rows.length? (cfg.entity==='requests'? requestTable(rows): taskTable(rows)) : '<div style="color:var(--ink3);font-size:13px;padding:8px 0">Nothing here</div>';
  }
  const acts = (isStaff()? `<span onclick="exportWidgetCSV('${w.id}')">Excel</span>`:'')
    + (widgetsEditable()? `<span onclick="widgetModal('${w.id}')">Edit</span><span onclick="deleteWidget('${w.id}')">Remove</span>`:'');
  return `<div class="card widget-card ${w.wtype==='list'?'w-wide':''}" draggable="${widgetsEditable()}" data-wid="${w.id}"
      ondragstart="wDragStart(event,'${w.id}')" ondragover="event.preventDefault()" ondrop="wDrop(event,'${w.id}')">
    <div class="w-head"><h3>${esc(w.title)}</h3>
      ${acts? `<span class="w-actions">${acts}</span>`:''}</div>
    ${body}</div>`;
}
function exportWidgetCSV(id){
  const w = (S._widgets||[]).find(x=>x.id===id); if(!w) return;
  downloadXLSX(xlsxFilename(w.title||'Widget'),
    [['Label','Count'], ...widgetGroups(w.config||{}).map(g=>[g.label, g.n])]);
}
/* Stat tiles, a blank line, then every widget's grouped numbers — one file. */
function exportReportCSV(){
  const out = [['Label','Value'], ...(S._reportStats||[])];
  (S._widgets||[]).forEach(w=>{
    out.push([], [w.title], ['Label','Count']);
    widgetGroups(w.config||{}).forEach(g=>out.push([g.label, g.n]));
  });
  downloadXLSX(xlsxFilename(S._reportName||'Report'), out);
}
let wDragId=null;
function wDragStart(e,id){ wDragId=id; }
async function wDrop(e,targetId){
  e.preventDefault();
  if(!widgetsEditable()) return;
  if(!wDragId || wDragId===targetId) return;
  const ws=S._widgets, from=ws.findIndex(x=>x.id===wDragId), to=ws.findIndex(x=>x.id===targetId);
  if(from<0||to<0) return;
  const [m]=ws.splice(from,1); ws.splice(to,0,m); wDragId=null;
  document.getElementById('wgrid').innerHTML = ws.map(widgetCard).join('');
  for(let i=0;i<ws.length;i++){ if(ws[i].position!==i){ ws[i].position=i; await db.from('dashboard_widgets').update({position:i}).eq('id',ws[i].id); } }
}
async function deleteWidget(id){
  const {error}=await db.from('dashboard_widgets').delete().eq('id',id);
  if(error) return toast(error.message,true);
  S._widgets = S._widgets.filter(w=>w.id!==id);
  document.getElementById('wgrid').innerHTML = S._widgets.map(widgetCard).join('') || `<div class="card empty" style="grid-column:1/-1">No widgets yet — add your first one.</div>`;
  toast('Widget removed');
}
function widgetModal(id, wsId, projId){
  const w = id? S._widgets.find(x=>x.id===id): null;
  const scope = wsId || (w? w.workspace_id : null) || widgetScope || null;
  const pScope = projId || (w? w.project_id : null) || widgetProjScope || null;
  const cfg = w? (w.config||{}) : {entity:'tasks', show:'open', groupBy:'status'};
  const types=[['stat','Number','A single big number'],['bar','Bar chart','Compare groups side by side'],['donut','Donut','Share of a total'],['list','List','The items themselves'],['progress','Progress','Done vs total']];
  const m = modal(`<div class="modal-head"><h2>${w?'Edit widget':'Add widget'}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Widget type</label>
      <div class="type-pick" id="wm-type">${types.map(([k,l,d])=>`<div class="tp ${ (w?w.wtype:'bar')===k?'sel':''}" data-k="${k}" onclick="[...this.parentNode.children].forEach(x=>x.classList.remove('sel'));this.classList.add('sel');wmRefresh()"><b>${l}</b><span>${d}</span></div>`).join('')}</div>
      <label>Title</label><input id="wm-title" value="${w? esc(w.title):''}" placeholder="e.g. Creative workload">
      <div class="field-grid">
        <div><label>Source</label><select id="wm-entity" onchange="wmRefresh()">
          <option value="tasks" ${cfg.entity!=='requests'?'selected':''}>Tasks</option>
          <option value="requests" ${cfg.entity==='requests'?'selected':''}>Requests</option></select></div>
        <div id="wm-dim"></div>
      </div>
      <div class="chk" id="wm-mine-wrap" style="margin-top:6px"><input type="checkbox" id="wm-mine" ${cfg.mine?'checked':''}> <span>Only items assigned to me</span></div>
      <p style="color:var(--ink3);font-size:12.5px;margin-top:10px">${pScope? 'This widget lives on this board\'s report — everyone who can open the board sees it.' : scope? 'This widget lives on the workspace report — everyone on the team sees it.' : 'Widgets follow the workspace selector at the top of the dashboard, and only you see them.'}</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="wm-save">${w?'Save':'Add widget'}</button></div>`);
  window.wmRefresh = ()=>{
    const t = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const ent = m.querySelector('#wm-entity').value;
    const dim = m.querySelector('#wm-dim');
    if(t==='bar'||t==='donut'){
      const gs = ent==='requests'? W_GROUPS_REQS: W_GROUPS_TASKS;
      dim.innerHTML = `<label>Group by</label><select id="wm-group">${gs.map(([k,l])=>`<option value="${k}" ${cfg.groupBy===k?'selected':''}>${l}</option>`).join('')}</select>`;
    } else if(t==='stat'||t==='list'){
      const ss = ent==='requests'? W_SHOWS_REQS: W_SHOWS_TASKS;
      dim.innerHTML = `<label>Show</label><select id="wm-show">${ss.map(([k,l])=>`<option value="${k}" ${cfg.show===k?'selected':''}>${l}</option>`).join('')}</select>`;
    } else dim.innerHTML='';
    m.querySelector('#wm-mine-wrap').style.display = (ent==='tasks' && (t==='stat'||t==='list'))? 'flex':'none';
  };
  wmRefresh();
  m.querySelector('#wm-save').onclick = async ()=>{
    const wtype = m.querySelector('#wm-type .sel')?.dataset.k || 'bar';
    const entity = m.querySelector('#wm-entity').value;
    const config = {entity};
    if(wtype==='bar'||wtype==='donut') config.groupBy = m.querySelector('#wm-group')?.value || 'status';
    if(wtype==='stat'||wtype==='list'){ config.show = m.querySelector('#wm-show')?.value || 'open'; config.mine = m.querySelector('#wm-mine')?.checked || false; }
    let title = m.querySelector('#wm-title').value.trim();
    if(!title){
      const dimL = config.groupBy? ' by '+config.groupBy : config.show? ' — '+config.show : '';
      title = (entity==='requests'?'Requests':'Tasks') + dimL;
    }
    let error;
    if(w){ ({error} = await db.from('dashboard_widgets').update({wtype, title, config}).eq('id',w.id)); }
    else { ({error} = await db.from('dashboard_widgets').insert({user_id:S.me.id, workspace_id:pScope? null : scope, project_id:pScope, wtype, title, config, position:(S._widgets||[]).length})); }
    if(error) return toast(error.message,true);
    closeModals(); toast(w?'Widget updated':'Widget added'); reRenderWidgets();
  };
}
function hbars(rows){
  if(!rows.length) return '<div style="color:var(--ink3);font-size:13px;padding:8px 0">No data yet</div>';
  const max = Math.max(...rows.map(r=>r.n));
  return rows.map(r=>`<div class="hbar-row">
    <div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(r.n/max*100)}%;background:${r.color}"></div></div>
    <div class="hbar-val">${r.n}</div></div>`).join('');
}

async function setAutoRule(key, on){

    ? await db.from('automation_rules').update({enabled:on}).eq('id',existing.id)
    : await db.from('automation_rules').insert(payload);
  if(error){ toast(error.message, true); autoRerender(); return; }
  toast(`${(AUTO_RULES.find(r=>r.key===key)||{}).label||key} ${on?'on':'off'}${scopeWs? ' for this workspace':''}`);

}
async function clearAutoRule(key){

async function slaSave(btn){
  const days = [...document.querySelectorAll('.sla-day:checked')].map(x=>parseInt(x.dataset.d,10));
  if(!days.length) return toast('Pick at least one working day', true);
  const ws = document.getElementById('sla-ws').value, we = document.getElementById('sla-we').value;
  if(!ws || !we || ws >= we) return toast('Work must start before it ends', true);
  const prio = {}; [...document.querySelectorAll('.sla-prio')].forEach(x=>{ prio[x.dataset.p] = Math.min(500, Math.max(10, parseInt(x.value,10)||100)); });
  const payload = {
    company_id: S.me.company_id,
    use_working_time: document.getElementById('sla-wt').checked,
    work_start: ws, work_end: we, work_days: days,
    warn_pct: Math.min(95, Math.max(10, parseInt(document.getElementById('sla-warn').value,10)||80)),
    pause_statuses: [...document.querySelectorAll('.sla-pause:checked')].map(x=>x.dataset.s),
    prio_pct: prio, updated_at: new Date().toISOString(),
  };
  btn.disabled = true;
  const {error} = await db.from('sla_settings').upsert(payload);
  let terr = null;
  for(const inp of document.querySelectorAll('.sla-th')){
    const rt = (S._slaTypes||[]).find(t=>t.id===inp.dataset.id);
    const hrs = Math.min(2000, Math.max(1, parseInt(inp.value,10)||24));
    if(rt && rt.sla_hours !== hrs){
      const {error:e2} = await db.from('request_types').update({sla_hours:hrs}).eq('id',rt.id);
      if(e2) terr = e2;
    }
  }
  btn.disabled = false;
  if(error||terr) return toast((error||terr).message, true);
  toast('SLA settings saved — new tickets use them right away');
  await refreshCore(); renderAdmin();
}

function caSentence(d){
  const sL = k => (STATUSES.find(s=>s.k===k)||{}).label||k;
  const pL = k => (PRIORITIES.find(p=>p.k===k)||{}).label||k;
  const uN = id => { const u=S.profiles.find(p=>p.id===id); return u? u.full_name : 'someone'; };
  const pid = d.scope.startsWith('p:')? d.scope.slice(2) : null;
  let when='';
  switch(d.trigger){
    case 'status_changed':   when = 'When status changes' + (d.cond.to? ` to ${sL(d.cond.to)}`:''); break;
    case 'priority_changed': when = 'When priority changes' + (d.cond.to? ` to ${pL(d.cond.to)}`:''); break;
    case 'task_assigned':    when = 'When a task is assigned'; break;
    case 'task_created':     when = 'When a task is created'; break;
    case 'moved_to_group':   when = 'When a task moves' + (d.cond.group_id? ` to ${caGroupName(pid,d.cond.group_id)}`:' to a new group'); break;
    case 'field_changed':    when = 'When ' + (d.cond.field_id? caFieldName(pid,d.cond.field_id):'a column') + (d.cond.to? ` becomes ${d.cond.to}`:' changes'); break;
    case 'due_date_arrives': when = 'When the due date arrives'; break;
  }
  let then='';
  switch(d.action){
    case 'notify_person':   then = `notify ${uN(d.cfg.user_id)}`; break;
    case 'notify_assignee': then = 'notify the assignee'; break;
    case 'notify_creator':  then = 'notify whoever created it'; break;
    case 'notify_team':     then = 'notify the whole workspace'; break;
    case 'set_status':      then = `set status to ${sL(d.cfg.status)}`; break;
    case 'set_priority':    then = `set priority to ${pL(d.cfg.priority)}`; break;
    case 'assign_person':   then = `assign it to ${uN(d.cfg.user_id)}`; break;
    case 'move_to_group':   then = `move it to ${caGroupName(pid,d.cfg.group_id)}`; break;
    case 'set_field':       then = `set ${d.cfg.field_id? caFieldName(pid,d.cfg.field_id):'a column'}${d.cfg.value? ` to ${d.cfg.value}`:''}`; break;
    case 'set_due_in_days': { const n=parseInt(d.cfg.days??1,10); then = `set the due date ${n} day${n===1?'':'s'} from now`; break; }
    case 'archive_task':    then = 'archive it'; break;
  }
  return `${when}, ${then}`;
}

async function caLoadGroups(pid){
  window._caGroups = window._caGroups||{}; window._caFields = window._caFields||{};
  const jobs=[];
  if(!window._caGroups[pid]) jobs.push(db.from('project_groups').select('id,name').eq('project_id',pid)
    .then(({data})=>{window._caGroups[pid]=data||[];}));
  if(!window._caFields[pid]) jobs.push(db.from('project_fields').select('id,label,ftype,options').eq('project_id',pid)
    .then(({data})=>{window._caFields[pid]=(data||[]).filter(f=>f.ftype==='select');}));
  if(jobs.length) await Promise.all(jobs);
  caDraw();
}
function caFieldName(pid, fid){

function caDraw(){
  const B = document.getElementById('ca-body'); if(!B || !_ca) return;
  const trg = CA_TRIGGERS.find(t=>t.key===_ca.trigger)||CA_TRIGGERS[0];
  const act = CA_ACTIONS.find(a=>a.key===_ca.action)||CA_ACTIONS[0];
  const pid = _ca.scope.startsWith('p:')? _ca.scope.slice(2) : null;
  const groups = pid? ((window._caGroups||{})[pid]||[]) : [];
  const people = (S.profiles||[]).filter(p=>p.active);
  const fields = pid? ((window._caFields||{})[pid]||[]) : [];
  const groupCtl = (val, id, anyLabel)=> pid
    ? `<select id="${id}" onchange="_ca.${id==='ca-cond'?'cond.group_id':'cfg.group_id'}=this.value;caDraw()">

    : `<div style="font-size:12.5px;color:var(--ink3);padding:8px 2px">Choose a board below first — groups belong to a board.</div>`;

    if(!pid) return `<div style="font-size:12.5px;color:var(--ink3);padding:8px 2px">Choose a board below first — columns belong to a board.</div>`;
    if(!fields.length) return `<div style="font-size:12.5px;color:var(--ink3);padding:8px 2px">This board has no status-type (dropdown) columns yet.</div>`;
    const st = _ca[where]; const fid = st.field_id;
    const valKey = where==='cond'? 'to' : 'value';
    const opts = fid? ((fields.find(f=>f.id===fid)||{}).options||[]) : [];
    const idBase = where==='cond'? 'ca-cond':'ca-cfg';
    return `<select id="${idBase}" onchange="_ca.${where}.field_id=this.value;_ca.${where}.${valKey}='';caDraw()">
        <option value="">Pick a column…</option>
        ${fields.map(f=>`<option value="${f.id}" ${fid===f.id?'selected':''}>${esc(f.label)}</option>`).join('')}</select>
      ${fid? `<select id="${idBase}-v" style="margin-top:8px" onchange="_ca.${where}.${valKey}=this.value;caDraw()">
        ${anyValLabel? `<option value="">${anyValLabel}</option>`:'<option value="">Pick a value…</option>'}
        ${opts.map(o=>`<option value="${esc(o)}" ${st[valKey]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:''}`;
  };
  let condCtl='';
  if(trg.cond==='status') condCtl = `<select id="ca-cond" onchange="_ca.cond.to=this.value;caDraw()">
      <option value="">to any status</option>
      ${STATUSES.map(s=>`<option value="${s.k}" ${_ca.cond.to===s.k?'selected':''}>to ${s.label}</option>`).join('')}</select>`;
  if(trg.cond==='priority') condCtl = `<select id="ca-cond" onchange="_ca.cond.to=this.value;caDraw()">
      <option value="">to any priority</option>
      ${PRIORITIES.map(p=>`<option value="${p.k}" ${_ca.cond.to===p.k?'selected':''}>to ${p.label}</option>`).join('')}</select>`;
  if(trg.cond==='group') condCtl = groupCtl(_ca.cond.group_id, 'ca-cond', 'to any group');
  if(trg.cond==='field') condCtl = fieldCtl('cond', 'to any value');
  let cfgCtl='';
  if(act.cfg==='person') cfgCtl = `<select id="ca-cfg" onchange="_ca.cfg.user_id=this.value;caDraw()">
      <option value="">Pick a person…</option>
      ${people.map(u=>`<option value="${u.id}" ${_ca.cfg.user_id===u.id?'selected':''}>${esc(u.full_name)}</option>`).join('')}</select>`;
  if(act.cfg==='status') cfgCtl = `<select id="ca-cfg" onchange="_ca.cfg.status=this.value;caDraw()">
      ${STATUSES.map(s=>`<option value="${s.k}" ${(_ca.cfg.status||'todo')===s.k?'selected':''}>${s.label}</option>`).join('')}</select>`;
  if(act.cfg==='priority') cfgCtl = `<select id="ca-cfg" onchange="_ca.cfg.priority=this.value;caDraw()">
      ${PRIORITIES.map(p=>`<option value="${p.k}" ${(_ca.cfg.priority||'urgent')===p.k?'selected':''}>${p.label}</option>`).join('')}</select>`;
  if(act.cfg==='group') cfgCtl = groupCtl(_ca.cfg.group_id, 'ca-cfg', null);
  if(act.cfg==='field') cfgCtl = fieldCtl('cfg', null);
  if(act.cfg==='days') cfgCtl = `<div style="display:flex;align-items:center;gap:8px">
      <input id="ca-cfg" type="number" min="0" max="365" style="width:90px" value="${parseInt(_ca.cfg.days??1,10)}" onchange="_ca.cfg.days=this.value">
      <span style="color:var(--ink2);font-size:13px">days from the day it fires</span></div>`;
  B.innerHTML = `
    <label>When</label>
    <select onchange="_ca.trigger=this.value;_ca.cond={};caDraw()">
      ${CA_TRIGGERS.map(t=>`<option value="${t.key}" ${_ca.trigger===t.key?'selected':''}>${t.label}</option>`).join('')}</select>
    ${condCtl? `<div style="margin-top:8px">${condCtl}</div>`:''}
    <label style="margin-top:16px">Then</label>
    <select onchange="_ca.action=this.value;_ca.cfg={};caDraw()">
      ${CA_ACTIONS.map(a=>`<option value="${a.key}" ${_ca.action===a.key?'selected':''}>${a.label}</option>`).join('')}</select>
    ${cfgCtl? `<div style="margin-top:8px">${cfgCtl}</div>`:''}
    <label style="margin-top:16px">Where it applies</label>
    <select id="ca-scope" onchange="_ca.scope=this.value;delete _ca.cond.group_id;delete _ca.cond.field_id;delete _ca.cfg.group_id;delete _ca.cfg.field_id;const p=this.value.startsWith('p:')?this.value.slice(2):null;p?caLoadGroups(p):caDraw()">
      <option value="">Everywhere</option>
      <optgroup label="Workspaces">
        ${(S.workspaces||[]).map(w=>`<option value="w:${w.id}" ${_ca.scope==='w:'+w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</optgroup>
      <optgroup label="Boards">
        ${(S.projects||[]).filter(p=>p.status!=='archived').map(p=>{const w=wsById(p.workspace_id);
          return `<option value="p:${p.id}" ${_ca.scope==='p:'+p.id?'selected':''}>${esc(p.name)}${w?` — ${esc(w.name)}`:''}</option>`;}).join('')}</optgroup>
    </select>
    <div style="margin-top:18px;padding:12px 14px;background:var(--gray-soft);border-radius:10px;font-size:13.5px;color:var(--ink2)" id="ca-preview">
      ${esc(caSentence(_ca))}<span style="color:var(--ink3)"> · ${_ca.trigger==='due_date_arrives'? 'checked every 15 minutes, fires once per task':'fires the moment it happens'}</span>
    </div>`;
}
async function caSave(){
  const act = CA_ACTIONS.find(a=>a.key===_ca.action)||{};
  const trg = CA_TRIGGERS.find(t=>t.key===_ca.trigger)||{};
  const pid = _ca.scope.startsWith('p:')? _ca.scope.slice(2) : null;
  const wid = _ca.scope.startsWith('w:')? _ca.scope.slice(2) : null;
  if(act.cfg==='person' && !_ca.cfg.user_id) return toast('Pick who to '+(_ca.action==='assign_person'?'assign':'notify'), true);
  if(act.cfg==='group' && !pid) return toast('Choose a board — groups belong to a board', true);
  if(act.cfg==='group' && !_ca.cfg.group_id) return toast('Pick the group to move to', true);
  if(trg.cond==='field' && !pid) return toast('Choose a board — columns belong to a board', true);
  if(trg.cond==='field' && !_ca.cond.field_id) return toast('Pick which column to watch', true);
  if(act.cfg==='field' && !pid) return toast('Choose a board — columns belong to a board', true);
  if(act.cfg==='field' && !_ca.cfg.field_id) return toast('Pick which column to set', true);
  if(act.cfg==='field' && !_ca.cfg.value) return toast('Pick the value to set', true);
  const condition = {};
  if(trg.cond==='status' || trg.cond==='priority'){ if(_ca.cond.to) condition.to = _ca.cond.to; }
  if(trg.cond==='group' && pid && _ca.cond.group_id) condition.group_id = _ca.cond.group_id;
  if(trg.cond==='field'){ condition.field_id = _ca.cond.field_id; if(_ca.cond.to) condition.to = _ca.cond.to; }
  const cfg = {};
  if(act.cfg==='person') cfg.user_id = _ca.cfg.user_id;
  if(act.cfg==='status') cfg.status = _ca.cfg.status||'todo';
  if(act.cfg==='priority') cfg.priority = _ca.cfg.priority||'urgent';
  if(act.cfg==='group') cfg.group_id = _ca.cfg.group_id;
  if(act.cfg==='field'){ cfg.field_id = _ca.cfg.field_id; cfg.value = _ca.cfg.value; }
  if(act.cfg==='days') cfg.days = Math.max(0, parseInt(_ca.cfg.days??1,10)||0);
  const payload = {workspace_id:wid, project_id:pid, trigger_key:_ca.trigger, condition,
                   action_key:_ca.action, action_config:cfg, name:caSentence(_ca)};
  const {error} = _ca.id
    ? await db.from('custom_automations').update(payload).eq('id',_ca.id)
    : await db.from('custom_automations').insert(payload);
  if(error) return toast(error.message, true);
  toast(_ca.id? 'Automation updated':'Automation added — it is live now');
  closeModals(); autoRerender();
}

      <label>Colour</label>
      <div id="ew-cols" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        ${WS_COLORS.map(c=>`<span data-c="${c}" style="width:26px;height:26px;border-radius:50%;background:${c};cursor:pointer;box-shadow:${c===w.color?'0 0 0 3px #fff,0 0 0 5px '+c:'none'}"></span>`).join('')}
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="ew-save">Save</button></div>`);
  let colour = w.color;
  m.querySelectorAll('#ew-cols span').forEach(s=> s.onclick=()=>{
    colour = s.dataset.c;
    m.querySelectorAll('#ew-cols span').forEach(x=> x.style.boxShadow = x.dataset.c===colour? '0 0 0 3px #fff,0 0 0 5px '+colour : 'none');
  });
  m.querySelector('#ew-save').onclick = async ()=>{
    const name = m.querySelector('#ew-name').value.trim(); if(!name) return toast('Name required', true);
    const {error} = await db.from('workspaces').update({name, description:m.querySelector('#ew-desc').value.trim(), color:colour}).eq('id',wid);
    if(error) return toast(error.message, true);
    closeModals(); toast('Workspace updated'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin(); else if(S.route.view==='ws') renderWorkspace(wid, S.route.tab);
  };
}
async function deleteWorkspaceModal(wid){
  const w = wsById(wid); if(!w) return;
  if(!isAdmin()) return toast('Only an admin can delete a workspace', true);
  const projs = S.projects.filter(p=>p.workspace_id===wid);
  let nTasks = 0;
  if(projs.length){
    const {count} = await db.from('tasks').select('id',{count:'exact',head:true}).in('project_id', projs.map(p=>p.id));
    nTasks = count||0;
  }
  const m = modal(`<div class="modal-head"><h2>Delete “${esc(w.name)}”?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="danger-note"><b>This cannot be undone.</b> Deleting this workspace also deletes everything inside it.</div>
      <div style="display:flex;gap:26px;margin:14px 0 16px">
        <div><div style="font-size:26px;font-weight:800;line-height:1">${projs.length}</div><div style="font-size:12px;color:var(--ink3)">board${projs.length===1?'':'s'}</div></div>
        <div><div style="font-size:26px;font-weight:800;line-height:1;color:${nTasks?'var(--red)':'inherit'}">${nTasks}</div><div style="font-size:12px;color:var(--ink3)">task${nTasks===1?'':'s'}</div></div>
      </div>
      ${projs.length? `<div style="font-size:13px;color:var(--ink2);margin-bottom:14px">Boards that will go: ${projs.slice(0,6).map(p=>'<b>'+esc(p.name)+'</b>').join(', ')}${projs.length>6?' and '+(projs.length-6)+' more':''}.</div>`:''}
      <label>Type the workspace name to confirm</label>
      <input id="dw-confirm" autocomplete="off" placeholder="${esc(w.name)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      <button class="btn btn-danger" id="dw-go" disabled>Delete workspace</button></div>`);
  const inp=m.querySelector('#dw-confirm'), go=m.querySelector('#dw-go');
  inp.oninput = ()=>{ go.disabled = inp.value.trim().toLowerCase() !== w.name.trim().toLowerCase(); };
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {data, error} = await db.from('workspaces').delete().eq('id',wid).select('id');
    if(error){ go.disabled=false; go.textContent='Delete workspace'; return toast(error.message, true); }
    if(!data || !data.length){ go.disabled=false; go.textContent='Delete workspace'; return toast('Nothing was deleted — only an admin can delete a workspace', true); }
    logActivity('workspace', wid, 'delete', {name:w.name, projects:projs.length, tasks:nTasks});
    closeModals(); toast('Workspace deleted'); await refreshCore();
    if(S.route.view==='ws' && S.route.id===wid) location.hash='#/home'; else { renderSidebar(); if(S.route.view==='admin') renderAdmin(); }
  };
  setTimeout(()=>inp.focus(), 30);
}
function newWorkspaceModal(){
  const m = modal(`<div class="modal-head"><h2>New workspace</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Workspace name <span class="req">*</span></label><input id="nw-name" placeholder="e.g. Livestream Squad">
      <label>Description</label><input id="nw-desc">
      <p style="margin-top:12px;font-size:12.5px;color:var(--ink2)">You'll be added as a member automatically. Add colleagues from the workspace page → Members.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="nw-save">Create workspace</button></div>`);
  m.querySelector('#nw-save').onclick = async ()=>{
    const name=m.querySelector('#nw-name').value.trim(); if(!name) return toast('Name required', true);
    const colors=['#0F766E','#3E5C95','#8C5A3B','#5A6B4F','#6E56B8','#A8770E','#7D3C55'];
    const {data, error} = await db.from('workspaces').insert({name,
      description:m.querySelector('#nw-desc').value.trim(), color:colors[Math.floor(Math.random()*colors.length)],
      position:S.workspaces.length+1}).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Workspace created'); await refreshCore(); renderSidebar();
    if(S.route.view==='admin') renderAdmin(); else if(data) location.hash='#/ws/'+data.id;
  };
}

/* ================= PLATFORM (SaaS console) ================= */
async function renderPlatform(){
  if(!S.me.platform_admin){ location.hash='#/home'; return; }
  setTopbar('Platform');
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const [{data:cos}, {data:pf}] = await Promise.all([
    db.from('companies').select('*').order('created_at'),
    db.from('profiles').select('id, company_id, active'),
  ]);
  const counts = {};
  (pf||[]).forEach(p=>{ if(p.company_id && p.active){ counts[p.company_id]=(counts[p.company_id]||0)+1; } });
  const PLANS=['internal','trial','starter','pro','enterprise'];
  const STATS=['trial','active','past_due','suspended','cancelled'];
  C.innerHTML = `
    <div class="page-head"><div><h1>Platform</h1><div class="sub">Customer companies, plans and subscription status</div></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n accent">${(cos||[]).length}</div><div class="l">Companies</div></div>
      <div class="stat"><div class="n green">${(cos||[]).filter(c=>c.status==='active').length}</div><div class="l">Active subscriptions</div></div>
      <div class="stat"><div class="n amber">${(cos||[]).filter(c=>c.status==='trial').length}</div><div class="l">On trial</div></div>
      <div class="stat"><div class="n">${(pf||[]).filter(p=>p.active).length}</div><div class="l">Total active users</div></div>
    </div>
    <div class="card"><table class="tbl"><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Seats</th><th>Users</th><th>Trial ends</th><th></th></tr></thead><tbody>
    ${(cos||[]).map(c=>`<tr id="co-${c.id}">
      <td style="font-weight:600">${esc(c.name)}<div style="font-size:11px;color:var(--ink3)">${esc(c.slug||'')} · since ${fmtDate(c.created_at)}</div></td>
      <td><select data-k="plan" style="width:auto;padding:5px 8px">${PLANS.map(p=>`<option ${p===c.plan?'selected':''}>${p}</option>`).join('')}</select></td>
      <td><select data-k="status" style="width:auto;padding:5px 8px">${STATS.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><input data-k="seats" type="number" value="${c.seats}" style="width:70px;padding:5px 8px"></td>
      <td>${counts[c.id]||0}</td>
      <td style="color:var(--ink2)">${c.trial_ends_at? fmtDate(c.trial_ends_at):'—'}</td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="savePlatformCo('${c.id}')">Save</button></td>
    </tr>`).join('')}</tbody></table></div>
    <p style="margin-top:12px;font-size:12.5px;color:var(--ink2)">Billing is manual for now — set plan/status here when a customer pays (or stops paying). Suspended and cancelled companies are locked out at sign-in. Stripe checkout can be wired in later.</p>`;
}
async function savePlatformCo(id){
  const row = document.getElementById('co-'+id); if(!row) return;
  const plan = row.querySelector('select[data-k=plan]').value;
  const status = row.querySelector('select[data-k=status]').value;
  const seats = parseInt(row.querySelector('input[data-k=seats]').value)||10;
  const {error} = await db.from('companies').update({plan, status, seats}).eq('id',id);
  if(error) return toast(error.message, true);
  toast('Company updated');
}

/* ================= INIT ================= */
(async ()=>{
  if(location.hash.startsWith('#/f/')){ renderPublicForm(location.hash.slice(4).split('?')[0]); return; }
  const {data:{session}} = await db.auth.getSession();
  S.session = session;
  if(session) await boot();
  else $('#login-screen').classList.remove('hidden');
})();
</script>
