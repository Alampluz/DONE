<script>
/* ================= HOME (My Work) ================= */
async function renderHome(){
  setTopbar('My Work');
  const C=$('#content');
  C.innerHTML = '<div class="empty">Loading…</div>';
  const [tks, reqs, apprs, cal] = await Promise.all([
    allRows(()=>db.from('tasks').select('*').eq('assignee_id',S.me.id).neq('status','done').order('due_date',{ascending:true,nullsFirst:false}).order('id')),
    db.from('requests').select('*').eq('submitted_by',S.me.id).not('status','in',"(done,cancelled)").order('created_at',{ascending:false}),
    db.from('approvals').select('*').eq('approver_id',S.me.id).eq('status','pending'),
    // My calendar: everything assigned to me that has a date, done included - a
    // finished task still happened on that day, and the grid greys it out.
    allRows(()=>db.from('tasks').select('*').eq('assignee_id',S.me.id).is('archived_at',null).not('due_date','is',null).order('id')),
  ]);
  const tasks = tks.data||[], requests = reqs.data||[], approvals = apprs.data||[];
  S._myTasks = tasks;
  S._myCalRows = (cal.data||[]).map(t=>{ const p=projById(t.project_id)||{}; return {...t, _pname:p.name||'', _pcolor:p.color||''}; });
  const overdue = tasks.filter(t=>t.due_date && daysDiff(t.due_date)<0);
  const today = tasks.filter(t=>t.due_date && daysDiff(t.due_date)===0);

  const hello = new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening';
  // Role tiers: admin & management land with the company pulse on top;
  // everyone else's Home is already their personal tier.
  let pulse = null;
  if(['admin','management'].includes(S.me.role)){
    const openSet = ['submitted','in_review','approved','in_progress','pending_info'];
    const todayISO = new Date().toISOString().slice(0,10);
    const [a,b,c,d] = await Promise.all([
      db.from('tasks').select('id',{count:'exact',head:true}).neq('status','done').is('archived_at',null),
      db.from('tasks').select('id',{count:'exact',head:true}).neq('status','done').is('archived_at',null).lt('due_date', todayISO),
      db.from('requests').select('id',{count:'exact',head:true}).in('status', openSet),
      db.from('requests').select('id',{count:'exact',head:true}).in('status', openSet).lt('sla_due_at', new Date().toISOString()).is('sla_paused_at',null),
    ]);
    pulse = {open:a.count||0, overdue:b.count||0, tickets:c.count||0, breach:d.count||0};
  }
  C.innerHTML = `
    ${pulse? `<div class="section-title" style="margin-top:0;display:flex;align-items:center">Company pulse
        <span style="flex:1"></span><button class="btn btn-ghost btn-sm" onclick="location.hash='#/dashboard'">Open dashboard</button></div>
      <div class="stat-row">
        <div class="stat"><div class="n accent">${pulse.open}</div><div class="l">Open tasks — everyone</div></div>
        <div class="stat"><div class="n ${pulse.overdue?'red':''}">${pulse.overdue}</div><div class="l">Overdue — everyone</div></div>
        <div class="stat"><div class="n">${pulse.tickets}</div><div class="l">Open tickets</div></div>
        <div class="stat"><div class="n ${pulse.breach?'red':''}">${pulse.breach}</div><div class="l">SLA breached</div></div>
      </div>`:''}
    <div class="page-head"><div><h1>${hello}, ${esc(S.me.full_name.split(' ')[0])}</h1>
      <div class="sub">${new Date().toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div></div>
      <div class="actions"><button class="btn btn-primary" onclick="newRequestFlow()">＋ New request</button></div></div>
    <div class="stat-row">
      <div class="stat"><div class="n ${overdue.length?'red':''}">${overdue.length}</div><div class="l">Overdue tasks</div></div>
      <div class="stat"><div class="n amber">${today.length}</div><div class="l">Due today</div></div>
      <div class="stat"><div class="n accent">${tasks.length}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="n">${requests.length}</div><div class="l">My open requests</div></div>
      <div class="stat"><div class="n ${approvals.length?'red':''}">${approvals.length}</div><div class="l">Waiting for my approval</div></div>
    </div>
    <div class="section-title">My tasks <span class="count">${tasks.length}</span><span style="flex:1"></span>
      <div class="tabs home-modes"><button class="tab home-mode" data-m="list" onclick="setHomeTasksMode('list')">List</button><button class="tab home-mode" data-m="calendar" onclick="setHomeTasksMode('calendar')">Calendar</button></div></div>
    <div id="home-tasks-body"></div>
    <div class="section-title">My requests <span class="count">${requests.length}</span></div>
    <div class="card">${requests.length? requestTable(requests) : `<div class="empty">No open requests yet</div>`}</div>
    ${approvals.length? `<div class="section-title">Waiting for my approval <span class="count">${approvals.length}</span></div>
      <div class="card">${approvalTable(approvals)}</div>`:''}
  `;
  renderHomeTasksBody();
}
/* My tasks on Home: the open-task list, or the same person's dated tasks across
   every workspace on one calendar. The choice sticks per browser. */
let homeTasksMode = (()=>{ try{ return localStorage.getItem('workos.homeTasks')==='calendar'? 'calendar':'list'; }catch(e){ return 'list'; } })();
function setHomeTasksMode(m){
  homeTasksMode = m==='calendar'? 'calendar':'list';
  try{ localStorage.setItem('workos.homeTasks', homeTasksMode); }catch(e){}
  renderHomeTasksBody();
}
function renderHomeTasksBody(){
  const host = $('#home-tasks-body'); if(!host) return;
  document.querySelectorAll('.home-mode').forEach(b=> b.classList.toggle('active', b.dataset.m===homeTasksMode));
  if(homeTasksMode==='calendar'){
    calRerender = () => renderHomeTasksBody();
    host.innerHTML = calendarHTML('home', S._myCalRows||[], {everywhere:'the List shows every open task'});
    return;
  }
  const tasks = S._myTasks||[];
  host.innerHTML = `<div class="card">${tasks.length? taskTable(tasks) : `<div class="empty">No open tasks assigned to you</div>`}</div>`;
}
function taskTable(tasks){
  return `<table class="tbl"><thead><tr><th>Task</th><th>Board</th><th>Status</th><th>Priority</th><th>Due</th><th>Assignee</th></tr></thead><tbody>
    ${tasks.map(t=>{
      const p=projById(t.project_id);
      return `<tr class="rowlink" onclick="openTask('${t.id}')">
        <td style="font-weight:600">${esc(t.title)}</td>
        <td style="color:var(--ink2)">${esc(p?p.name:'—')}</td>
        <td>${statusChip(t.status)}</td><td>${prioChip(t.priority)}</td>
        <td>${dueBadge(t.due_date, t.status==='done')||'<span style="color:var(--ink3)">—</span>'}</td>
        <td>${avatar(prof(t.assignee_id), true)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function requestTable(reqs){
  return `<table class="tbl"><thead><tr><th>Request</th><th>Type</th><th>Status</th><th>SLA</th><th>Submitted by</th><th>Assigned</th></tr></thead><tbody>
    ${reqs.map(r=>{
      const rt=S.requestTypes.find(x=>x.id===r.request_type_id);
      return `<tr class="rowlink" onclick="openRequest('${r.id}')">
        <td style="font-weight:600">${r.ticket_no? `<span style="color:var(--ink3);font-weight:700;font-size:11.5px;margin-right:6px">WO-${r.ticket_no}</span>`:''}${esc(r.title)}</td>
        <td style="color:var(--ink2)">${rt? esc(rt.name):'—'}</td>
        <td>${reqStatusChip(r.status)}</td>
        <td>${slaBadge(r.sla_due_at, r.status)}</td>
        <td>${avatar(prof(r.submitted_by), true)}</td>
        <td>${avatar(prof(r.assigned_to), true)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function approvalTable(apprs){
  return `<table class="tbl"><thead><tr><th>Approval</th><th>Requested by</th><th>Created</th><th></th></tr></thead><tbody>
    ${apprs.map(a=>`<tr>
      <td style="font-weight:600">${esc(a.title||'Approval')}</td>
      <td>${avatar(prof(a.requested_by), true)} <span style="color:var(--ink2)">${esc(prof(a.requested_by)?.full_name||'')}</span></td>
      <td style="color:var(--ink2)">${fmtDateTime(a.created_at)}</td>
      <td style="text-align:right;white-space:nowrap">
        ${a.request_id? `<button class="btn btn-ghost btn-sm" onclick="openRequest('${a.request_id}')">View</button>`:''}
        ${a.task_id? `<button class="btn btn-ghost btn-sm" onclick="location.hash='#/task/${a.task_id}'">View</button>`:''}
        <button class="btn btn-green btn-sm" onclick="decideApproval('${a.id}','approved')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="decideApproval('${a.id}','rejected')">Reject</button></td>
    </tr>`).join('')}</tbody></table>`;
}

/* ================= WORKSPACE ================= */
/* Boards | Report — the two faces of a workspace. */
function wsTabsHTML(wsId, active){
  return `<div class="tabs" style="margin-bottom:18px;width:fit-content">
    <button class="tab ${active==='boards'?'active':''}" onclick="location.hash='#/ws/${wsId}'">Boards</button>
    <button class="tab ${active==='calendar'?'active':''}" onclick="location.hash='#/ws/${wsId}/calendar'">Calendar</button>
    <button class="tab ${active==='report'?'active':''}" onclick="location.hash='#/ws/${wsId}/report'">Report</button>
    ${isStaff()? `<button class="tab ${active==='automations'?'active':''}" onclick="location.hash='#/ws/${wsId}/automations'">Automations</button>`:''}
  </div>`;
}
async function renderWorkspace(id, tab){
  const w = wsById(id); if(!w){ location.hash='#/home'; return; }
  if(tab==='report') return renderWorkspaceReport(id);
  if(tab==='calendar') return renderWorkspaceCalendar(id);
  if(tab==='automations') return renderWorkspaceAutomations(id);
  widgetScope = null; widgetProjScope = null;
  setTopbar(esc(w.name), (canManageWs(w.id)? `<button class="btn btn-ghost btn-sm" onclick="editWorkspaceModal('${w.id}')">Edit workspace</button>`:'')
    + (isStaff()? `<button class="btn btn-ghost btn-sm" onclick="teamMembersModal('${w.id}')">Members</button>
    <button class="btn btn-primary btn-sm" onclick="wsAddMenu(this,'${w.id}')">＋ Add</button>`:''));
  const C=$('#content'); C.innerHTML='<div class="empty">Loading…</div>';
  const projects = S.projects.filter(p=>p.workspace_id===id && p.status!=='archived');
  const ids = projects.map(p=>p.id);
  let counts = {};
  if(ids.length){
    const {data} = await allRows(()=>db.from('tasks').select('project_id,status').in('project_id', ids).order('id'));
    (data||[]).forEach(t=>{ counts[t.project_id]=counts[t.project_id]||{open:0,done:0}; t.status==='done'?counts[t.project_id].done++:counts[t.project_id].open++; });
  }
  C.innerHTML = `
    ${wsTabsHTML(id,'boards')}
    <div class="page-head"><div><h1>${esc(w.name)}</h1><div class="sub">${esc(w.description)}</div></div></div>
    ${projects.length? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
      ${projects.map(p=>{
        const c = counts[p.id]||{open:0,done:0}; const total=c.open+c.done;
        const pct = total? Math.round(c.done/total*100):0;
        return `<div class="card" style="padding:16px;cursor:pointer" onclick="location.hash='#/project/${p.id}'">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
            <span class="ws-dot" style="background:${p.color};width:11px;height:11px"></span>
            <b style="font-size:14.5px;flex:1">${esc(p.name)}</b>
            ${visChip(p.visibility)}
            ${p.status!=='active'? `<span class="chip" style="background:var(--gray-soft);color:var(--ink2)">${p.status.replace('_',' ')}</span>`:''}
            ${canEdit()? `<span class="pj-menu" title="Board options" onclick="event.stopPropagation();projMenu(this,'${p.id}')">⋯</span>`:''}
          </div>
          <div style="color:var(--ink2);font-size:12.5px;min-height:18px;margin-bottom:12px">${esc(p.description||'')}</div>
          <div style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)">
            <div style="flex:1;height:6px;background:var(--gray-soft);border-radius:4px"><div style="width:${pct}%;height:100%;border-radius:4px;background:${p.color}"></div></div>
            <span style="font-weight:700">${pct}%</span><span>${c.open} open</span>
          </div></div>`;
      }).join('')}</div>`
    : `<div class="card empty">No boards yet in this workspace${isStaff()? ' — create the first one.':''}</div>`}`;
}
/* ---- Board visibility: private | collaborate | shareable ---- */
const ico = p => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

  private: {label:'Private',

const visChip = v=>{
  const d = VIS[v] || VIS.collaborate;
  if(v==='collaborate') return '';
  return `<span class="chip vis-chip" title="${esc(d.blurb)}">${d.icon}${d.label}</span>`;
};
function visPickerHTML(id, cur){
  return `<div class="vis-pick" id="${id}" data-sel="${cur||'collaborate'}">
    ${Object.entries(VIS).map(([k,d])=>`<div class="vis-opt ${k===(cur||'collaborate')?'on':''}" data-v="${k}">
      <div class="vis-t">${d.icon}${d.label}</div><div class="vis-b">${d.blurb}</div></div>`).join('')}

}
function wireVisPicker(root, id){
  const box = root.querySelector('#'+id); if(!box) return;
  box.querySelectorAll('.vis-opt').forEach(o=> o.onclick = ()=>{
    box.dataset.sel = o.dataset.v;
    box.querySelectorAll('.vis-opt').forEach(x=> x.classList.toggle('on', x===o));
  });
}

/* ---- Board templates: snapshot groups/columns/tasks, replay onto a new board ---- */
async function saveTemplateModal(pid){
  const p = projById(pid); if(!p) return;
  // Use the loaded board when we're on it; otherwise fetch a fresh snapshot.
  let groups=S._groups||[], fields=S._fields||[], tasks=S._tasksAll||[];
  if(!(S.route.view==='project' && S.route.id===pid)){
    const [{data:g},{data:f},{data:t}] = await Promise.all([
      db.from('project_groups').select('*').eq('project_id',pid).order('position').order('created_at'),
      db.from('project_fields').select('*').eq('project_id',pid).order('position').order('created_at'),
      allRows(()=>db.from('tasks').select('*').eq('project_id',pid).order('position').order('id')),
    ]);
    groups=g||[]; fields=f||[]; tasks=t||[];
  }
  const m = modal(`<div class="modal-head"><h2>Save as template</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Template name <span class="req">*</span>${helpIcon('Saves this board\'s groups, columns and tasks (statuses and priorities included, archived tasks left out). Pick it under “Start from” when creating a board.')}</label><input id="tp-name" value="${esc(p.name)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tp-save">Save template</button></div>`);
  m.querySelector('#tp-save').onclick = async ()=>{
    const name = m.querySelector('#tp-name').value.trim(); if(!name) return toast('Name is required', true);
    const gidx = {}; groups.forEach((g,i)=> gidx[g.id]=i);
    const spec = {
      groups: groups.map(g=>({name:g.name, color:g.color, position:g.position})),
      fields: fields.map(f=>({label:f.label, ftype:f.ftype, options:f.options, position:f.position})),
      tasks: tasks.filter(t=>!t.archived_at).map(t=>({title:t.title, status:t.status, priority:t.priority,
        group_index: gidx[t.group_id] ?? null})),
    };
    const {error} = await db.from('board_templates').insert({name, spec});
    if(error) return toast(error.message, true);
    closeModals(); toast('Template saved');
  };
}
/* Replays a template spec onto a freshly created board. Errors toast but the
   board stays — a partial start beats losing the board. */
async function applyTemplate(pid, spec){
  let gids = [];
  if((spec.groups||[]).length){
    const {data:gs, error} = await db.from('project_groups').insert(spec.groups.map((g,i)=>(
      {project_id:pid, name:g.name, color:g.color, position:g.position ?? i}))).select();
    if(error) return toast(error.message, true);
    gids = (gs||[]).map(g=>g.id);
  }
  if((spec.fields||[]).length){
    const {error} = await db.from('project_fields').insert(spec.fields.map((f,i)=>(
      {project_id:pid, label:f.label, ftype:f.ftype, options:f.options||[], position:f.position ?? i, created_by:S.me.id})));
    if(error) return toast(error.message, true);
  }
  if((spec.tasks||[]).length){
    const {error} = await db.from('tasks').insert(spec.tasks.map((t,i)=>(
      {project_id:pid, title:t.title, status:t.status||'todo', priority:t.priority||'normal',
       group_id: t.group_index==null? null : (gids[t.group_index]||null),
       created_by:S.me.id, position:i+1})));
    if(error) return toast(error.message, true);
  }
}
/* ---- Recurring tasks: rules only — a 15-min DB sweep creates the tasks ---- */
const RC_EVERY = {daily:'Every day', weekly:'Every week', monthly:'Every month'};
function rcRow(r, groups){
  const g = (groups||[]).find(x=>x.id===r.group_id);
  return `<div class="rc-row" style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)">
    <label class="sw"><input type="checkbox" ${r.enabled?'checked':''} onchange="rcToggle('${r.id}',this.checked,'${r.project_id}')"><span></span></label>
    <b>${esc(r.title)}</b> ${prioChip(r.priority)}
    <span style="color:var(--ink3);font-size:12px">${RC_EVERY[r.every]||esc(r.every)} · next ${esc(r.next_run||'—')}${g? ' · '+esc(g.name):''}${r.due_in_days? ` · due +${r.due_in_days}d`:''}</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:8px">${avatar(prof(r.assignee_id), true)}
      <span style="cursor:pointer;color:var(--ink3)" title="Delete rule" onclick="rcDelete('${r.id}','${r.project_id}')">✕</span></span>
  </div>`;
}
async function recurringModal(pid){
  const p = projById(pid); if(!p) return;
  const [{data:rules},{data:groups}] = await Promise.all([
    db.from('recurring_tasks').select('*').eq('project_id',pid).order('created_at'),
    db.from('project_groups').select('*').eq('project_id',pid).order('position').order('created_at'),
  ]);
  S._rcGroups = groups||[];
  const people = S.profiles.filter(u=>u.active && !(u.email||'').startsWith('forms+'));
  const today = new Date().toISOString().slice(0,10);
  const m = modal(`<div class="modal-head"><h2>Recurring tasks — ${esc(p.name)} ${helpIcon('Each rule creates a fresh task on schedule, within 15 minutes of its next-run date.')}</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div id="rc-list">${(rules||[]).map(r=>rcRow(r, groups||[])).join('') || '<div style="color:var(--ink3);font-size:13px;padding:6px 0">No recurring tasks on this board yet</div>'}</div>
      <label style="margin-top:14px">New rule</label>
      <input id="rc-title" placeholder="Task title, e.g. Weekly stock check">
      <div class="field-grid">
        <div><label>Group</label><select id="rc-group"><option value="">No group</option>${(groups||[]).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div>
        <div><label>Priority</label><select id="rc-prio">${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k==='normal'?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div><label>Assignee</label><select id="rc-assignee"><option value="">Unassigned</option>${people.map(u=>`<option value="${u.id}">${esc(u.full_name)}</option>`).join('')}</select></div>
        <div><label>Repeats</label><select id="rc-every">${Object.entries(RC_EVERY).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div>
        <div><label>First run</label><input id="rc-next" type="date" value="${today}"></div>
        <div><label>Due (days after created — 0 = none)</label><input id="rc-due" type="number" min="0" max="365" value="0"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="rc-add">Add rule</button></div>`, true);
  m.querySelector('#rc-add').onclick = async ()=>{
    const title = m.querySelector('#rc-title').value.trim(); if(!title) return toast('Title is required', true);
    const next_run = m.querySelector('#rc-next').value; if(!next_run) return toast('Pick a first run date', true);
    const due_in_days = Math.min(365, Math.max(0, parseInt(m.querySelector('#rc-due').value,10)||0));
    const {error} = await db.from('recurring_tasks').insert({
      project_id:pid, group_id:m.querySelector('#rc-group').value||null, title, description:'',
      priority:m.querySelector('#rc-prio').value, assignee_id:m.querySelector('#rc-assignee').value||null,
      every:m.querySelector('#rc-every').value, next_run, due_in_days, enabled:true});
    if(error) return toast(error.message, true);
    toast('Recurring task added'); closeModals(); recurringModal(pid);
  };
}
async function rcToggle(id, enabled, pid){
  const {error} = await db.from('recurring_tasks').update({enabled}).eq('id',id);
  if(error){ toast(error.message, true); closeModals(); recurringModal(pid); return; }
  toast(enabled? 'Rule switched on':'Rule paused');
}
async function rcDelete(id, pid){
  const {error} = await db.from('recurring_tasks').delete().eq('id',id);
  if(error) return toast(error.message, true);
  toast('Rule deleted'); closeModals(); recurringModal(pid);
}

async function deleteProjectModal(pid){
  const p = (S.projects||[]).find(x=>x.id===pid); if(!p) return;
  if(!canDeleteBoard(pid)) return toast(`Only an owner of this board (${ownerNames(boardOwnerIds(pid))}) or an admin can delete it`, true);
  const {count} = await db.from('tasks').select('id',{count:'exact',head:true}).eq('project_id',pid);
  const n = count||0;
  const m = modal(`<div class="modal-head"><h2>Delete board “${esc(p.name)}”?</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="danger-note"><b>This cannot be undone.</b> Every task on this board goes with it, along with its subtasks, comments and attachments.</div>
      <div style="margin:14px 0 16px"><div style="font-size:30px;font-weight:800;line-height:1;color:${n?'var(--red)':'inherit'}">${n}</div>
        <div style="font-size:12px;color:var(--ink3)">task${n===1?'':'s'} on this board</div></div>
      ${n? `<p style="font-size:13px;color:var(--ink2);margin-bottom:14px">If you only want it out of the way, set the board's status to <b>archived</b> in Edit instead — nothing is lost and you can switch it back.</p>`:''}
      <label>Type the board name to confirm</label>
      <input id="dp-confirm" autocomplete="off" placeholder="${esc(p.name)}">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button>
      ${n? `<button class="btn btn-ghost" id="dp-arch">Archive instead</button>`:''}
      <button class="btn btn-danger" id="dp-go" disabled>Delete board</button></div>`);
  const inp=m.querySelector('#dp-confirm'), go=m.querySelector('#dp-go');
  inp.oninput = ()=>{ go.disabled = inp.value.trim().toLowerCase() !== p.name.trim().toLowerCase(); };
  m.querySelector('#dp-arch')?.addEventListener('click', async ()=>{
    const {error} = await db.from('projects').update({status:'archived'}).eq('id',pid);
    if(error) return toast(error.message, true);
    closeModals(); toast('Board archived'); await refreshCore();
    if(S.route.view==='project') location.hash='#/ws/'+p.workspace_id; else renderWorkspace(p.workspace_id);
  });
  go.onclick = async ()=>{
    go.disabled=true; go.textContent='Deleting…';
    const {data, error} = await db.from('projects').delete().eq('id',pid).select('id');
    if(error){ go.disabled=false; go.textContent='Delete board'; return toast(error.message, true); }
    if(!data || !data.length){ go.disabled=false; go.textContent='Delete board'; return toast('Nothing was deleted — your role may not have permission', true); }
    logActivity('project', pid, 'delete', {name:p.name, tasks:n});
    closeModals(); toast('Board deleted'); await refreshCore();
    if(S.route.view==='project') location.hash='#/ws/'+p.workspace_id;
    else { renderSidebar(); if(S.route.view==='ws') renderWorkspace(S.route.id, S.route.tab); }
  };
  setTimeout(()=>inp.focus(), 30);
}
/* Roles that need to be granted a workspace explicitly. admin + management
   already see every workspace, so they are shown as "all workspaces" and
   are not checkboxes. Anyone here can belong to as many workspaces as you like. */
const ASSIGNABLE_ROLES = ['internal','requester','partner','freelancer'];
const ROLE_LABEL = {internal:'Internal staff', requester:'Requester (view + raise + comment)', partner:'Partner (external)', freelancer:'Freelancer (external)'};
async function setWsOwner(wid, uid){
  const w = wsById(wid); if(!w) return;
  if(!(isAdmin() || ownsWs(wid))) return toast('Only an owner of this workspace or an admin can change its owners', true);
  const owners = wsOwnerIds(wid), has = owners.includes(uid);
  if(has && owners.length<=1){
    if(!isAdmin()) return toast('A workspace needs at least one owner — add someone else first', true);
    if(!confirm(`Remove the last owner of ${w.name}? Only admins will be able to manage its settings until someone is made owner again.`)) return;
  }
  if(has && uid===(S.me||{}).id && !isAdmin()
     && !confirm(`Step down as an owner of ${w.name}? You will lose control of its settings.`)) return;
  const {error} = has

/* ================= PROJECT (Board / List) ================= */
let boardMode = 'table';
/* Per-board filters. Keyed by board id so each board remembers its own. */
const boardFilters = {};
/* Quick filters: one-click views a CS or ops person reaches for all day. The chosen chip is
   remembered per board in localStorage so "My open" is still on tomorrow morning. */
const OPEN_STATES = new Set(['todo','in_progress','review','blocked']);
const daysAgoISO = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };
const BF_QUICK = [
  {k:'mine',       label:'My open',        test:t=> OPEN_STATES.has(t.status) && t.assignee_id===(S.me||{}).id},
  {k:'unassigned', label:'Unassigned',     test:t=> OPEN_STATES.has(t.status) && !t.assignee_id},
  {k:'urgent',     label:'Urgent open',    test:t=> OPEN_STATES.has(t.status) && t.priority==='urgent'},
  {k:'overdue',    label:'Overdue',        test:t=> OPEN_STATES.has(t.status) && t.due_date && daysDiff(t.due_date)<0},
  {k:'new7',       label:'New this week',  test:t=> (t.created_at||'') >= daysAgoISO(7)},
  {k:'done7',      label:'Done this week', test:t=> t.status==='done' && (t.completed_at||'') >= daysAgoISO(7)},
];
function bfQuickLoad(pid){ try{ return localStorage.getItem('workos.quick.'+pid)||''; }catch(e){ return ''; } }
function bfQuickSave(pid, k){ try{ k? localStorage.setItem('workos.quick.'+pid, k) : localStorage.removeItem('workos.quick.'+pid); }catch(e){} }
const bfGet = pid => (boardFilters[pid] || (boardFilters[pid] = {q:'', status:'', priority:'', assignee:'', group:'', quick:bfQuickLoad(pid)}));
function bfActiveCount(pid){ const f=bfGet(pid); return ['q','status','priority','assignee','group','quick'].filter(k=>f[k]).length; }
function bfSet(pid, key, val){ bfGet(pid)[key] = val; renderBoardBody(pid); }
function bfQuick(pid, k){ const f=bfGet(pid); f.quick = (f.quick===k)? '' : k; bfQuickSave(pid, f.quick); renderProject(pid); }
function bfClear(pid){ boardFilters[pid] = {q:'', status:'', priority:'', assignee:'', group:'', quick:''}; bfQuickSave(pid,''); renderProject(pid); }
function bfApply(pid, rows){
  const f = bfGet(pid);
  const q = f.q.trim().toLowerCase();
  const quick = BF_QUICK.find(x=>x.k===f.quick);
  return rows.filter(t=>
    (!quick || quick.test(t))
    && (!q || (t.title||'').toLowerCase().includes(q) || (t.description||'').toLowerCase().includes(q))
    && (!f.status   || t.status===f.status)
    && (!f.priority || t.priority===f.priority)
    && (!f.assignee || (f.assignee==='__none__' ? !t.assignee_id : t.assignee_id===f.assignee))
    && (!f.group    || (f.group==='__none__' ? !t.group_id : t.group_id===f.group))
  );
}

  table:    '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>',

    <span class="vp-ico">${VIEW_ICON[cur[0]]}</span><span class="vp-cur">${cur[1]}</span><span class="vp-chev">▾</span></button>`;

function viewMenu(anchor, pid){
  if(document.getElementById('tvmenu')){ document.getElementById('tvmenu').remove(); anchor.classList.remove('on'); return; }
  const m = document.createElement('div'); m.id='tvmenu'; m.className='view-menu'; m.setAttribute('role','menu');
  m.innerHTML = `<div class="vm-head">View</div>` + BOARD_VIEWS.map(([k,l,d])=>`<div role="menuitemradio" tabindex="-1" aria-checked="${boardMode===k}" class="vm-opt ${boardMode===k?'on':''}" data-k="${k}">
      <span class="vp-ico">${VIEW_ICON[k]}</span><span class="vm-txt"><b>${l}</b>${helpIcon(d)}</span><span class="vm-check">${boardMode===k?'✓':''}</span></div>`).join('');
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mb = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - mb.width - 10)) + 'px';
  m.style.top  = (r.bottom + mb.height > innerHeight ? Math.max(8, r.top - mb.height - 6) : r.bottom + 6) + 'px';
  anchor.classList.add('on');
  const close = ()=>{ m.remove(); anchor.classList.remove('on'); document.removeEventListener('mousedown', off); document.removeEventListener('keydown', key); };
  m.querySelectorAll('.vm-opt').forEach(o=> o.onclick = e=>{
    e.stopPropagation();
    if(e.target.closest && e.target.closest('.ihelp')) return;   // the ⓘ is not the row
    close(); setBoardView(pid, o.dataset.k); });
  const off = e=>{ if(!m.contains(e.target) && e.target!==anchor && !anchor.contains(e.target)) close(); };
  const key = e=>{
    if(e.key==='Escape') return close();
    const opts=[...m.querySelectorAll('.vm-opt')], i=opts.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); (opts[i+1]||opts[0]).focus(); }
    if(e.key==='ArrowUp'){ e.preventDefault(); (opts[i-1]||opts[opts.length-1]).focus(); }
  };
  setTimeout(()=>{ document.addEventListener('mousedown', off); document.addEventListener('keydown', key); (m.querySelector('.vm-opt.on')||m.querySelector('.vm-opt')).focus(); }, 0);
}

/* ---- Workload view (M-13): assignments + capacity by employee ---- */
let WORKLOAD_CAP = 8;   // "open tasks" a person can comfortably hold before flagged Heavy
function renderWorkload(id, rows, host){
  const OPEN = new Set(['todo','in_progress','review','blocked']);
  // bucket the filtered rows by assignee (plus an Unassigned bucket)
  const buckets = new Map();
  const bucket = key => { let b=buckets.get(key); if(!b){ b={key, counts:{}, open:0, total:0}; buckets.set(key,b); } return b; };
  (rows||[]).forEach(t=>{
    const b = bucket(t.assignee_id||'__none__');
    b.counts[t.status] = (b.counts[t.status]||0)+1;
    b.total++; if(OPEN.has(t.status)) b.open++;
  });
  let list = [...buckets.values()];
  // real people first (by open desc), Unassigned always last
  list.sort((a,b)=> (a.key==='__none__') - (b.key==='__none__') || b.open-a.open || b.total-a.total);
  const maxOpen = Math.max(WORKLOAD_CAP, ...list.map(b=>b.open), 1);
  const totalOpen = list.reduce((s,b)=>s+b.open,0), people = list.filter(b=>b.key!=='__none__').length;
  const seg = b => STATUSES.map(s=> b.counts[s.k]? `<span class="wl-chip" style="background:${s.color}1C;color:${s.color}"><span class="cdot" style="background:${s.color}"></span>${s.label} ${b.counts[s.k]}</span>`:'').join('');
  const rowHTML = b=>{
    const none = b.key==='__none__';
    const p = none? null : prof(b.key);
    const heavy = b.open > WORKLOAD_CAP;
    const pct = Math.round(b.open/maxOpen*100);
    const barColor = heavy? 'var(--red)' : b.open>=WORKLOAD_CAP*0.75? 'var(--amber)' : 'var(--accent)';
    return `<div class="wl-row">
      <div class="wl-who">${none? `<span class="wl-av wl-none">?</span><span class="wl-name" style="color:var(--ink3)">Unassigned</span>` : `${avatar(p,true)}<span class="wl-name">${esc(p?p.full_name:'—')}</span>`}</div>
      <div class="wl-mid">
        <div class="wl-bar"><div class="wl-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="wl-segs">${seg(b)||'<span class="tv-empty">No tasks</span>'}</div>
      </div>
      <div class="wl-load"><b style="color:${heavy?'var(--red)':'var(--ink)'}">${b.open}</b> open${heavy?' <span class="wl-flag">Heavy</span>':''}<div class="wl-sub">${b.total} total</div></div>
    </div>`;
  };
  host.innerHTML = `<div class="card wl-wrap">
    <div class="wl-head">
      <div>${people} ${people===1?'person':'people'} · ${totalOpen} open task${totalOpen===1?'':'s'} on this board</div>
      <label class="wl-cap">Comfortable load
        <input type="number" min="1" max="99" value="${WORKLOAD_CAP}" onchange="WORKLOAD_CAP=Math.max(1,+this.value||8);renderBoardBody('${id}')"> open/person</label>
    </div>
    ${list.length? list.map(rowHTML).join('') : '<div class="empty">No tasks match the current filters</div>'}
  </div>`;
}
/* ---- Calendar view: the month a board's due dates actually land in ----
   Dates here are handled as local calendar days, never as instants: keys are
   built from local y/m/d and a bare yyyy-mm-dd is parsed at T00:00:00, so a
   task due the 1st never shows on the 31st on a UTC+7 clock (same trap the
   date formatting fixed on 30 Aug).
   calMonth is the first of the displayed month; null means "this month". */
let calMonth = null;
let calOpenDays = new Set();     // days the user expanded past the 3-task fold
const CAL_FOLD = 3;
/* Whoever draws the calendar says how to redraw it. The board view redraws
   through renderBoardBody (filters intact); the workspace view through its own
   renderer. Falls back to the board path so old callers keep working. */
let calRerender = null;
function calKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function calParse(v){
  if(!v) return null;
  const d = new Date(String(v).slice(0,10)+'T00:00:00');
  return isNaN(d)? null : d;
}
function calFirst(){
  if(calMonth) return new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1);
}
/* Six Monday-first weeks, always 42 cells so the grid never changes height. */
function calGrid(first){
  const start = new Date(first);
  const back = (start.getDay() + 6) % 7;        // Sunday(0) sits at the end of the week
  start.setDate(start.getDate() - back);
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i);
    cells.push({date:d, key:calKey(d), inMonth: d.getMonth()===first.getMonth()});
  }
  return cells;
}
/* date key -> tasks, plus the ones with no due date (never silently dropped). */
function calBuckets(rows){
  const by = new Map(), undated = [];
  (rows||[]).forEach(t=>{
    const d = calParse(t.due_date);
    if(!d){ undated.push(t); return; }
    const k = calKey(d);
    (by.get(k) || by.set(k, []).get(k)).push(t);
  });
  by.forEach(list=> list.sort((a,b)=>
    (a.status==='done') - (b.status==='done')
    || PRIORITIES.findIndex(p=>p.k===a.priority) - PRIORITIES.findIndex(p=>p.k===b.priority)
    || (a.title||'').localeCompare(b.title||'')));
  return {by, undated};
}
function calRedraw(id){ if(calRerender) calRerender(); else renderBoardBody(id); }
function calMove(id, delta){
  const f = calFirst();
  calMonth = delta===0 ? null : new Date(f.getFullYear(), f.getMonth()+delta, 1);
  calOpenDays = new Set();
  calRedraw(id);
}
function calToggleDay(id, key){
  if(calOpenDays.has(key)) calOpenDays.delete(key); else calOpenDays.add(key);
  calRedraw(id);
}
function calPill(t){
  const st = STATUSES.find(s=>s.k===t.status) || STATUSES[0];
  const overdue = t.status!=='done' && daysDiff(t.due_date) < 0;
  const board = t._pname? ` · ${esc(t._pname)}` : '';
  const bdot = t._pname? `<span class="cal-bdot" style="background:${t._pcolor||'var(--ink3)'}" title="${esc(t._pname)}"></span>` : '';
  return `<button class="cal-pill${overdue?' over':''}" style="--pc:${st.color}" title="${esc(t.title)} · ${esc(st.label)}${overdue?' · overdue':''}${board}"
    onclick="openTask('${t.id}')"><span class="cdot" style="background:${st.color}"></span>${bdot}<span class="cal-pt">${esc(t.title)}</span></button>`;
}
function calendarHTML(id, rows, opts){
  const everywhere = (opts&&opts.everywhere) || 'the Table view shows everything';
  const first = calFirst(), todayKey = calKey(new Date());
  const {by, undated} = calBuckets(rows);
  const cells = calGrid(first);
  // A task due last month is not on this grid at all. Say so, or the header
  // count and what you can actually see disagree with no explanation.
  const span = new Set(cells.map(c=>c.key));
  let shownCount = 0; by.forEach((list,k)=>{ if(span.has(k)) shownCount += list.length; });
  const elsewhere = (rows||[]).length - undated.length - shownCount;
  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cellHTML = c => {
    const list = by.get(c.key) || [];
    const open = calOpenDays.has(c.key);
    const shown = open? list : list.slice(0, CAL_FOLD);
    const hidden = list.length - shown.length;
    const wknd = c.date.getDay()===0 || c.date.getDay()===6;
    return `<div class="cal-cell${c.inMonth?'':' out'}${wknd?' wknd':''}${c.key===todayKey?' today':''}" data-day="${c.key}">
      <div class="cal-dnum">${c.date.getDate()}${c.key===todayKey? '<span class="cal-tod">Today</span>':''}</div>
      <div class="cal-list">${shown.map(calPill).join('')}
        ${hidden>0? `<button class="cal-more" onclick="calToggleDay('${id}','${c.key}')">+${hidden} more</button>`:''}
        ${open && list.length>CAL_FOLD? `<button class="cal-more" onclick="calToggleDay('${id}','${c.key}')">Show less</button>`:''}</div>
    </div>`;
  };
  return `<div class="card cal-wrap">
    <div class="cal-head">
      <div class="cal-nav">
        <button class="btn btn-ghost btn-sm" onclick="calMove('${id}',-1)" title="Previous month">‹</button>
        <b class="cal-title">${first.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</b>
        <button class="btn btn-ghost btn-sm" onclick="calMove('${id}',1)" title="Next month">›</button>
        <button class="btn btn-ghost btn-sm" onclick="calMove('${id}',0)">Today</button>
      </div>
      <div class="cal-note">${shownCount} task${shownCount===1?'':'s'} shown${elsewhere>0? ` · <span class="cal-und">${elsewhere} outside this view</span>`:''}${undated.length? ` · <span class="cal-und">${undated.length} with no due date</span>`:''}</div>
    </div>
    <div class="cal-dows">${dows.map(d=>`<div>${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.map(cellHTML).join('')}</div>
    ${(undated.length||elsewhere>0)? `<div class="cal-foot">${[
        undated.length? `${undated.length} task${undated.length===1?' has':'s have'} no due date` : '',
        elsewhere>0? `${elsewhere} ${elsewhere===1?'is':'are'} due outside the weeks shown` : ''
      ].filter(Boolean).join(' · ')} — ${everywhere}.</div>`:''}
  </div>`;
}
function renderCalendar(id, rows, host){

  host.innerHTML = calendarHTML(id, rows);

function taskCard(t){

function wireDnD(projectId){
  let dragId=null;
  document.querySelectorAll('.tcard').forEach(c=>{
    c.addEventListener('dragstart', e=>{ dragId=c.dataset.id; c.classList.add('dragging'); });
    c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col-body').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const status = col.dataset.status; if(!dragId) return;
      const t = S._tasks.find(x=>x.id===dragId); if(!t || t.status===status) return;
      const old = t.status; t.status=status;
      renderProjectFromCache(projectId);
      const {error} = await db.from('tasks').update({status}).eq('id',dragId);
      if(error){ t.status=old; renderProjectFromCache(projectId); return toast(error.message, true); }
      const changed = await echoAutomation(dragId, {status});
      if(changed.length){ automationToast(changed); renderProjectFromCache(projectId); }

    });
  });
}

/* ---- formula columns ----------------------------------------------------

function fxEval(expr, t, depth=0){

      'name': t.title??'', 'title': t.title??'',
      'status': (STATUSES.find(x=>x.k===t.status)||{}).label||t.status||'',
      'priority': (PRIORITIES.find(x=>x.k===t.priority)||{}).label||t.priority||'',
      'assignee': (prof(t.assignee_id)||{}).full_name||'',
      'due date': t.due_date||'', 'due': t.due_date||'',
      'group': ((S._groups||[]).find(g=>g.id===t.group_id)||{}).name||'',
      'created': (t.created_at||'').slice(0,10),
    };
    if(n in core) return core[n];
    const fld = flds.find(x=>x.label.toLowerCase()===n);
    if(!fld) throw new Error('Unknown field {'+name+'}');
    if(fld.ftype==='formula'){
      if(depth>=3) throw new Error('Formulas reference each other in a loop');
      return fxEval((fld.options&&fld.options.expr)||'', t, depth+1);
    }

    if(c==='{'){ const j=src.indexOf('}',i); if(j<0) throw new Error('A { is missing its }'); toks.push({t:'field',v:src.slice(i+1,j)}); i=j+1; continue; }

    else if(op==='+'){ const x=parseFloat(a), y=parseFloat(b); a=(!isNaN(x)&&!isNaN(y))? x+y : String(a??'')+String(b??''); }

function fxCall(name,a,num,truthy){
  const D=s=>{ const d=new Date(s); if(isNaN(d)) throw new Error('"'+s+'" is not a date'); return d; };
  switch(name){
    case 'CONCATENATE': return a.map(x=>String(x??'')).join('');
    case 'UPPER': return String(a[0]??'').toUpperCase();
    case 'LOWER': return String(a[0]??'').toLowerCase();
    case 'TRIM':  return String(a[0]??'').trim();
    case 'LEN':   return String(a[0]??'').length;
    case 'LEFT':  return String(a[0]??'').slice(0, num(a[1]));
    case 'RIGHT': return String(a[0]??'').slice(-num(a[1]));
    case 'REPLACE': return String(a[0]??'').split(String(a[1]??'')).join(String(a[2]??''));
    case 'IF':  return truthy(a[0])? a[1] : (a.length>2? a[2] : '');
    case 'AND': return a.every(truthy);
    case 'OR':  return a.some(truthy);
    case 'NOT': return !truthy(a[0]);
    case 'ROUND': { const d=a.length>1? num(a[1]):0; return Math.round(num(a[0])*Math.pow(10,d))/Math.pow(10,d); }

    case 'MAX': return Math.max(...a.map(num));
    case 'SUM': return a.reduce((x,y)=>x+num(y),0);
    case 'AVERAGE': return a.length? a.reduce((x,y)=>x+num(y),0)/a.length : 0;
    case 'DAYS': return Math.round((D(a[0])-D(a[1]))/86400000);

    else if(show==='due_date') inner = lt.due_date? esc(fmtDate(lt.due_date)) : inner;
    else { const s = mirrorText(t, f); inner = s? esc(s) : inner; }
  }
  if(canEditTask(t) && mirrorEditable(f, lt))
    return `<div class="tv-pickv tv-mirror" title="Mirrored — editing here updates the linked task" onclick="tvMirrorEdit(this,'${t.id}','${f.id}')">${inner}</div>`;
  return `<div class="tv-pickv ro tv-mirror" title="Mirrored from the linked task">${inner}</div>`;
}
async function tvMirrorEdit(el, tid, fid){
  const f = (S._fields||[]).find(x=>x.id===fid); if(!f) return;
  const t = (S._tasks||[]).find(x=>x.id===tid); if(!t) return;
  const lt = mirrorResolve(t, f); if(!lt) return toast('Link this row to a task first', true);
  const show = (f.options||{}).show;
  const save = async patch=>{
    const {error} = await db.from('tasks').update(patch).eq('id', lt.id);
    if(error) return toast(error.message, true);
    Object.assign(lt, patch);
    const y=scrollY; renderBoardBody(tvPid); scrollTo(0,y);
    toast('Updated on the linked board');
  };
  if(show==='status')
    return tvShowMenu(el, STATUSES.map(s=>({v:s.k,l:s.label})), o=>tvDotOpt(o, STATUSES, lt.status), v=>v&&save({status:v}));
  if(show==='priority')
    return tvShowMenu(el, PRIORITIES.map(p=>({v:p.k,l:p.label})), o=>tvDotOpt(o, PRIORITIES, lt.priority), v=>v&&save({priority:v}));
  if(show==='assignee')
    return tvShowMenu(el, S.profiles.filter(p=>p.active).map(p=>({v:p.id,l:p.full_name})),
      o=>`${avatar(prof(o.v),true)}<span>${esc(o.l)}</span>${o.v===lt.assignee_id?'<span class="opt-cur">✓</span>':''}`,
      v=>save({assignee_id:v||null}), true, true);
  if(show==='due_date')
    return miniInputModal(f.label, 'date', lt.due_date||'', v=>save({due_date:v||null}), 'Editing here updates the linked task on the other board.');
  const rf = (S._linkedFields||{})[show]; if(!rf) return;
  const saveRemoteCustom = v=>{
    const custom = Object.assign({}, lt.custom||{});
    if(v===''||v==null){ delete custom[show]; } else { custom[show]=v; }
    return save({custom});
  };
  if(rf.ftype==='select')
    return tvShowMenu(el, (rf.options||[]).map(o=>({v:o,l:o})),
      o=>`<span>${esc(o.l)}</span>${o.v===(lt.custom||{})[show]?'<span class="opt-cur">✓</span>':''}`,
      v=>saveRemoteCustom(v), (rf.options||[]).length>5, true);
  if(rf.ftype==='platform')
    return tvShowMenu(el, PLATFORMS.map(p=>({v:p.k,l:p.label})),
      o=>tvDotOpt(o, PLATFORMS, (lt.custom||{})[show]),
      v=>saveRemoteCustom(v), true, true);
  if(rf.ftype==='checkbox')
    return saveRemoteCustom(!( /^(true|yes|1)$/i.test(String((lt.custom||{})[show]||'')) ));
  miniInputModal(rf.label, rf.ftype==='number'?'number':rf.ftype==='date'?'date':'text',
    (lt.custom||{})[show]||'', v=>saveRemoteCustom(v), 'Editing here updates the linked task on the other board.');
}

/* Export the rows the table is showing right now (filters applied), in display order. */
function exportBoardCSV(pid){
  const p = projById(pid);
  const flds = S._fields||[], groups = S._groups||[];
  let rows = S._lastRowSet || bfApply(pid, S._tasks||[]);
  const byPos = (a,b)=> (a.position||0)-(b.position||0);
  if(groups.length){
    const gids = new Set(groups.map(g=>g.id));
    rows = groups.flatMap(g=> rows.filter(t=>t.group_id===g.id).sort(byPos))
      .concat(rows.filter(t=>!t.group_id || !gids.has(t.group_id)).sort(byPos));
  } else rows = [...rows].sort(byPos);
  const cell = (t,f)=>{
    if(f.ftype==='formula'){ try{ return fxFormat(fxEval((f.options&&f.options.expr)||'', t)); }catch(e){ return ''; } }
    if(f.ftype==='link'){ const lv=(t.custom||{})[f.id]; const lt=lv? (S._linkedTasks||{})[lv]:null; return lt? (lt.title||'') : ''; }
    if(f.ftype==='mirror') return mirrorText(t, f);
    const v = (t.custom||{})[f.id];
    if(f.ftype==='checkbox') return v? 'Yes':'No';
    if(f.ftype==='file') return (v&&v.name)? v.name : '';
    return v==null? '' : v;
  };
  const out = [['Task','Group',coreLabel(pid,'status'),coreLabel(pid,'priority'),coreLabel(pid,'assignee'),coreLabel(pid,'due_date'), ...flds.map(f=>f.label), 'Created']];
  rows.forEach(t=> out.push([
    t.title||'',
    (groups.find(g=>g.id===t.group_id)||{}).name||'',
    (STATUSES.find(s=>s.k===t.status)||{}).label||t.status||'',
    (PRIORITIES.find(x=>x.k===t.priority)||{}).label||t.priority||'',
    (prof(t.assignee_id)||{}).full_name||'',
    t.due_date||'',
    ...flds.map(f=>cell(t,f)),
    (t.created_at||'').slice(0,10),
  ]));
  downloadXLSX(xlsxFilename(p? p.name : 'Board'), out);
}
/* ---- Import Excel: first sheet, header row with a "Task" column, columns matched by name ---- */
function importExcel(pid){
  if(typeof XLSX === 'undefined') return toast('The Excel engine is still loading — try again in a second', true);
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      const wb = XLSX.read(await f.arrayBuffer(), {cellDates:true});
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:''});
      const res = mapImportRows(aoa, pid);
      if(!res.tasks.length) return toast('Nothing to import — the first sheet needs a header row with a "Task" column and at least one row under it', true);
      importPreviewModal(pid, res);
    }catch(e){ toast('Could not read that file: '+e.message, true); }
  };
  inp.click();
}
/* Pure mapping: array-of-arrays -> task rows + warnings. Kept separate so it is testable. */
function mapImportRows(aoa, pid){
  const warnings = []; const tasks = []; let skipped = 0;
  const hi = (aoa||[]).findIndex(r=> (r||[]).some(c=> String(c).trim().toLowerCase()==='task'));
  if(hi < 0) return {tasks, warnings:['No "Task" column found in the header row'], skipped};
  const head = aoa[hi].map(c=> String(c).trim());
  const low  = head.map(h=> h.toLowerCase());
  const col  = name => low.indexOf(name);
  const flds = S._fields||[], groups = S._groups||[];
  const fieldByLabel = {}; flds.forEach(f=>{ fieldByLabel[f.label.trim().toLowerCase()] = f; });
  const known = new Set(['task','group','status','priority','assignee','due date','created']);
  const unknown = [];
  head.forEach((h,i)=>{ if(h && !known.has(low[i]) && !fieldByLabel[low[i]]) unknown.push(h); });
  if(unknown.length) warnings.push(`Ignored column${unknown.length>1?'s':''}: ${unknown.join(', ')}`);
  if(head.some((h,i)=> fieldByLabel[low[i]] && fieldByLabel[low[i]].ftype==='formula'))
    warnings.push('Formula columns are computed automatically and were skipped');
  if(head.some((h,i)=> fieldByLabel[low[i]] && ['link','mirror','file'].includes(fieldByLabel[low[i]].ftype)))
    warnings.push('Link, Mirror and File columns can\'t be imported and were skipped');
  const statusOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return 'todo';
    const m = STATUSES.find(x=> x.k===s || x.label.toLowerCase()===s); return m? m.k : 'todo'; };
  const prioOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return 'normal';
    const m = PRIORITIES.find(x=> x.k===s || x.label.toLowerCase()===s); return m? m.k : 'normal'; };
  const personOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return null;
    const m = (S.profiles||[]).find(p=> p.active && (p.full_name||'').trim().toLowerCase()===s); return m? m.id : null; };
  const groupOf = v=>{ const s=String(v).trim().toLowerCase(); if(!s) return null;
    const m = groups.find(g=> (g.name||'').trim().toLowerCase()===s); return m? m.id : null; };
  const dateOf = v=>{
    if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    if(typeof v === 'number' && v > 20000) return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
    const s = String(v).trim(); if(!s) return null;
    const d = new Date(s); return isNaN(d)? null : d.toISOString().slice(0,10);
  };
  let misses = 0;
  for(let i=hi+1; i<aoa.length; i++){
    const r = aoa[i]||[];
    const title = String(r[col('task')]??'').trim();
    if(!title){ skipped++; continue; }
    const t = {project_id:pid, title, status:'todo', priority:'normal', assignee_id:null, group_id:null, due_date:null, custom:{}, created_by:S.me.id};
    if(col('status')>=0)   t.status = statusOf(r[col('status')]);
    if(col('priority')>=0) t.priority = prioOf(r[col('priority')]);
    if(col('assignee')>=0){ t.assignee_id = personOf(r[col('assignee')]);
      if(!t.assignee_id && String(r[col('assignee')]).trim()) misses++; }
    if(col('group')>=0)    t.group_id = groupOf(r[col('group')]);
    if(col('due date')>=0) t.due_date = dateOf(r[col('due date')]);
    head.forEach((h,ci)=>{
      const f = fieldByLabel[low[ci]]; if(!f || ['formula','link','mirror','file'].includes(f.ftype)) return;
      const v = r[ci]; if(v===''||v==null) return;
      t.custom[f.id] = f.ftype==='checkbox'? /^(yes|true|1|y|✓)$/i.test(String(v).trim())
        : f.ftype==='date'? (dateOf(v)||'') : String(v instanceof Date? v.toISOString().slice(0,10) : v);
    });
    tasks.push(t);
  }
  if(misses) warnings.push(`${misses} assignee name${misses>1?'s':''} didn't match anyone — those rows import unassigned`);
  return {tasks, warnings, skipped};
}

function tvBulkDelete(){

  if(!isAdmin()) return toast('Only an admin can permanently delete tasks', true);
  const rows = (S._tasks||[]).filter(t=>tvSel.has(t.id));
  const preview = rows.slice(0,8).map(t=>`<li>${esc(t.title||'(untitled)')}</li>`).join('')
    + (rows.length>8? `<li style="color:var(--ink3)">…and ${rows.length-8} more</li>`:'');

  m.querySelector('#bd-archive').onclick = ()=>{ closeModals(); tvBulkArchive(); };
  go.onclick = async ()=>{

  m.querySelector('#cf-type').onchange = e=> syncType(e.target.value);
  // mirror wiring: when the link column changes, offer the target board's own fields too
  const viaSel = m.querySelector('#cf-mirror-via'), showSel = m.querySelector('#cf-mirror-show');
  let mirrorInit = true;   // on open, keep the saved "show" (it may be a target-board field id)
  async function loadMirrorShow(){
    if(!viaSel || !showSel || !viaSel.value) return;
    const lf = (S._fields||[]).find(x=>x.id===viaSel.value);
    const tb = lf && lf.options && lf.options.project_id;
    const keep = (mirrorInit && f && f.options && f.options.show) || showSel.value || 'status';
    mirrorInit = false;
    const core = [['status','Status'],['priority','Priority'],['assignee','Assignee'],['due_date','Due date']];
    let extra = [];
    if(tb){
      const {data:tf} = await db.from('project_fields').select('id,label,ftype').eq('project_id',tb);
      extra = (tf||[]).filter(x=>!['formula','link','mirror'].includes(x.ftype)).map(x=>[x.id, x.label]);
    }
    showSel.innerHTML = core.concat(extra).map(([v,l])=>`<option value="${esc(v)}" ${v===keep?'selected':''}>${esc(l)}</option>`).join('');
  }
  if(viaSel){ viaSel.onchange = loadMirrorShow; loadMirrorShow(); }
  // formula builder wiring: field chips + live preview against a real row
  const fxIn = m.querySelector('#cf-fx'), fxPrev = m.querySelector('#cf-fx-prev');
  const chipNames = ['Name','Status','Assignee','Due date','Priority','Group']
    .concat((S._fields||[]).filter(x=>(!f || x.id!==f.id) && !['link','mirror'].includes(x.ftype)).map(x=>x.label));
  m.querySelector('#cf-fx-fields').innerHTML = chipNames.map(n=>`<button type="button" class="fx-chip">{${esc(n)}}</button>`).join('');
  m.querySelectorAll('.fx-chip').forEach(ch=> ch.onclick = ()=>{
    const pos = fxIn.selectionStart ?? fxIn.value.length;
    fxIn.value = fxIn.value.slice(0,pos) + ch.textContent + fxIn.value.slice(fxIn.selectionEnd ?? pos);
    fxIn.focus(); fxIn.selectionStart = fxIn.selectionEnd = pos + ch.textContent.length;
    fxPreview();
  });
  const sampleTask = ()=> (S._tasks||[]).find(t=>!t.archived_at) || (S._tasks||[])[0] || {title:'Sample task', status:'todo', priority:'normal', custom:{}, created_at:new Date().toISOString()};
  function fxPreview(){
    const src = fxIn.value.trim();
    if(!src){ fxPrev.innerHTML = 'Preview appears as you type'; return; }
    try{ fxPrev.innerHTML = 'Preview: <b>'+esc(fxFormat(fxEval(src, sampleTask())))+'</b>'; fxPrev.style.color='var(--ink)'; }
    catch(e){ fxPrev.innerHTML = '⚠ '+esc(e.message); fxPrev.style.color='var(--amber)'; }
  }
  fxIn.oninput = fxPreview;
  if(f && f.ftype==='formula') fxPreview();
  if(f){
    m.querySelector('#cf-del').onclick = async ()=>{
      const {error}=await db.from('project_fields').delete().eq('id',f.id);
      if(error) return toast(error.message, true);
      closeModals(); toast('Column deleted'); renderProject(pid);
    };
  }
  m.querySelector('#cf-save').onclick = async ()=>{
    const label=m.querySelector('#cf-label').value.trim(); if(!label) return toast('Column name is required', true);
    const ftype=m.querySelector('#cf-type').value;
    let options = ftype==='select'? m.querySelector('#cf-opts').value.split('\n').map(s=>s.trim()).filter(Boolean) : [];
    if(ftype==='select' && !options.length) return toast('Add at least one dropdown option', true);
    if(ftype==='formula'){
      const expr = m.querySelector('#cf-fx').value.trim();
      if(!expr) return toast('Write a formula first', true);
      try{ fxEval(expr, {title:'x', status:'todo', priority:'normal', custom:{}, created_at:new Date().toISOString()}); }
      catch(e){ if(/Unknown field|not a known function|missing|not closed|Unexpected|too early|loop/i.test(e.message)) return toast('Formula problem: '+e.message, true); }
      options = {expr};
    }
    if(ftype==='link'){
      const target = m.querySelector('#cf-link-board').value;
      if(!target) return toast('Pick the board this column links to', true);
      options = {project_id: target};
    }
    if(ftype==='mirror'){
      const via = m.querySelector('#cf-mirror-via')?.value;
      const show = m.querySelector('#cf-mirror-show')?.value;
      if(!via) return toast('A mirror needs a "Link to board" column on this board first', true);
      if(!show) return toast('Pick what the mirror should show', true);
      options = {via, show};
    }
    let error;
    if(f){ ({error} = await db.from('project_fields').update({label, options}).eq('id',f.id)); }
    else { ({error} = await db.from('project_fields').insert({project_id:pid, label, ftype, options, position:(S._fields||[]).length, created_by:S.me.id})); }
    if(error) return toast(error.message, true);
    closeModals(); toast(f?'Column updated':'Column added'); renderProject(pid);
  };
}
/* A board can have several owners. The crown toggles one person in or out. */
async function setBoardOwner(pid, uid){
  const p = projById(pid); if(!p) return;
  if(!(isAdmin() || ownsBoard(pid))) return toast('Only an owner of this board or an admin can change its owners', true);
  const owners = boardOwnerIds(pid), has = owners.includes(uid);
  if(has && owners.length<=1){
    if(!isAdmin()) return toast('A board needs at least one owner — add someone else first', true);
    if(!confirm(`Remove the last owner of ${p.name}? Only admins will be able to manage its settings until someone is made owner again.`)) return;
  }
  if(has && uid===(S.me||{}).id && !isAdmin()
     && !confirm(`Step down as an owner of ${p.name}? You will lose control of its settings.`)) return;
  const {error} = has
    ? await db.from('project_owners').delete().eq('project_id',pid).eq('user_id',uid)
    : await db.from('project_owners').insert({project_id:pid, user_id:uid});
  if(error) return toast(error.message, true);
  await refreshCore(); closeModals();
  toast(has? `${ownerName(uid)} is no longer an owner` : `${ownerName(uid)} is now an owner`);
  projectMembersModal(pid);
}
async function projectMembersModal(pid){
  const {data:members} = await db.from('project_members').select('*').eq('project_id',pid);
  const memberIds = new Set((members||[]).map(m=>m.user_id));
  const externals = S.profiles.filter(p=>['partner','freelancer'].includes(p.role));
  const board = (S.projects||[]).find(x=>x.id===pid) || {};
  // Everyone who can already open this board: owner, admin/management, the
  // workspace's members, plus any partner explicitly added to it.
  const {data:wsm} = await db.from('workspace_members').select('user_id').eq('workspace_id', board.workspace_id);
  const canSetOwner = isAdmin() || ownsBoard(pid);
  const ownerIds = boardOwnerIds(pid);
  const ids = [...new Set([...ownerIds, ...(wsm||[]).map(r=>r.user_id), ...memberIds,
    ...S.profiles.filter(p=>p.active && ['admin','management'].includes(p.role)).map(p=>p.id)].filter(Boolean))];
  const people = ids.map(id=>prof(id)).filter(p=>p && p.active && !(p.email||'').startsWith('forms+'))
    .sort((a,b)=> (ownerIds.includes(b.id)) - (ownerIds.includes(a.id))
                  || (a.full_name||'').localeCompare(b.full_name||''));
  const peopleHTML = `
      ${searchBoxHTML('pm-q','Search by name, team, role, or email address')}
      ${canGuest? teamAddHTML('pm-team') : ''}
      <label style="margin-top:4px">People on this board ${helpIcon('A filled heart marks an owner' + (canSetOwner? '; click an outline heart to make someone an owner, or a filled one to remove them':'') + '. Owners and admins manage this board\'s settings; everyone here works on its tasks.')}</label>
      <div style="display:flex;gap:26px;align-items:center;margin:6px 0 10px;font-size:12.5px;color:var(--ink2)">
        <span style="display:flex;align-items:center;gap:8px">Members ${avatarStack(people.filter(p=>!ownerIds.includes(p.id)).map(p=>p.id))}</span>
        <span style="display:flex;align-items:center;gap:8px">Owners ${avatarStack(ownerIds)}</span>
      </div>
      <div style="margin-top:4px">${people.map(p=>`
        <div class="person-row" data-search="${esc(searchKey(p))}">
          ${avatar(p,true)}
          <span class="pr-name">${esc(p.full_name||p.email)}
            ${p.job_title? `<span class="pr-sub">${esc(p.job_title)}</span>`:''}</span>
          ${ownerHeartHTML(ownerIds.includes(p.id), canSetOwner, `setBoardOwner('${pid}','${p.id}')`, 'board')}
        </div>`).join('')}</div>
      `;
  const vis = board.visibility || 'collaborate';
  const canGuest = vis === 'shareable';
  const m = modal(`<div class="modal-head"><h2>Board members (partner access)</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      ${peopleHTML}
      <p style="color:var(--ink2);font-size:13px;margin-top:8px">Internal staff already see every board in their workspaces. Add partners or freelancers here to give them access to <b>this board only</b>.</p>
      ${canGuest? '' : `<div style="margin-top:12px;padding:10px 12px;background:var(--gray-soft);border-radius:8px;font-size:12.5px;color:var(--ink2)">
        This board is <b>${VIS[vis].label}</b>, so outside guests can't be added. Switch it to <b>Shareable</b> first.
        ${canEdit()? `<button class="btn btn-ghost btn-sm" style="margin-left:8px" id="pm-tovis">Make Shareable</button>`:''}</div>`}
      ${externals.length? externals
        .sort((a,b)=> (memberIds.has(b.id)) - (memberIds.has(a.id)) || (a.full_name||'').localeCompare(b.full_name||''))
        .map(p=>`
        <div class="chk" data-search="${esc(searchKey(p))}" ${canGuest?'':'style="opacity:.45"'}><input type="checkbox" data-uid="${p.id}" ${memberIds.has(p.id)?'checked':''} ${canGuest?'':'disabled'}>
        ${avatar(p,true)} <span>${esc(p.full_name)} <span style="color:var(--ink3)">· ${esc(p.email)}</span></span></div>`).join('')
      : '<div class="empty">No partner or freelancer accounts yet. Create them in Admin → Users.</div>'}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button><button class="btn btn-primary" id="pm-save" ${canGuest?'':'disabled'}>Save</button></div>`);
  wireMemberSearch(m, 'pm-q');
  wireTeamAdd(m, 'pm-team');
  m.querySelector('#pm-tovis')?.addEventListener('click', async ()=>{
    const {error} = await db.from('projects').update({visibility:'shareable'}).eq('id',pid);
    if(error) return toast(error.message, true);
    board.visibility='shareable'; await refreshCore();
    closeModals(); toast('Board is now Shareable'); projectMembersModal(pid);
  });
  m.querySelector('#pm-save').onclick = async ()=>{
    const want = new Set([...m.querySelectorAll('input[data-uid]:checked')].map(i=>i.dataset.uid));
    const add=[...want].filter(u=>!memberIds.has(u)).map(user_id=>({project_id:pid,user_id}));
    const rm=[...memberIds].filter(u=>!want.has(u));
    if(add.length){ const {error} = await db.from('project_members').insert(add); if(error) return toast(error.message, true); }
    if(rm.length){ const {error} = await db.from('project_members').delete().eq('project_id',pid).in('user_id',rm); if(error) return toast(error.message, true); }
    closeModals(); toast('Members updated');
  };
}
</script>
<script>
/* ================= TASK MODAL ================= */
function newTaskModal(projectId, status='todo', groupId=null){
  const p = projById(projectId);
  const m = modal(`<div class="modal-head"><h2>New task</h2><button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <label>Title <span class="req">*</span></label><input id="tk-title" placeholder="What needs to be done?">
      <label>Description</label><textarea id="tk-desc" rows="3"></textarea>
      <div class="field-grid">
        <div><label>${esc(coreLabel(projectId,'status'))}</label><select id="tk-status">${STATUSES.map(s=>`<option value="${s.k}" ${s.k===status?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div ${coreHidden(projectId,'priority')?'hidden':''}><label>${esc(coreLabel(projectId,'priority'))}</label><select id="tk-prio">${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k==='normal'?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div ${coreHidden(projectId,'assignee')?'hidden':''}><label>${esc(coreLabel(projectId,'assignee'))}</label><select id="tk-assignee"><option value="">Unassigned</option>${assigneeOptions(projectId)}</select></div>
        <div ${coreHidden(projectId,'due_date')?'hidden':''}><label>${esc(coreLabel(projectId,'due_date'))}</label><input id="tk-due" type="date"></div>
      </div>
      <label>Tags (comma separated)</label><input id="tk-tags" placeholder="e.g. 9.9, shopee">
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Cancel</button><button class="btn btn-primary" id="tk-save">Create task</button></div>`);
  m.querySelector('#tk-title').focus();
  m.querySelector('#tk-save').onclick = async ()=>{
    const title=m.querySelector('#tk-title').value.trim(); if(!title) return toast('Title is required', true);
    const maxPos = Math.max(0, ...(S._tasks||[]).map(t=>t.position||0));
    const {data, error} = await db.from('tasks').insert({
      project_id:projectId, title, description:m.querySelector('#tk-desc').value.trim(),
      status:m.querySelector('#tk-status').value, priority:m.querySelector('#tk-prio').value,
      assignee_id:m.querySelector('#tk-assignee').value||null, due_date:m.querySelector('#tk-due').value||null,
      tags:m.querySelector('#tk-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      created_by:S.me.id, position:maxPos+1, group_id:groupId
    }).select().single();
    if(error) return toast(error.message, true);
    closeModals(); toast('Task created');
    if(S.route.view==='project') renderProject(projectId); else renderHome();
  };
}
function assigneeOptions(projectId, selected){
  // staff can assign anyone; also include project members (partners)
  return S.profiles.filter(p=>p.active).map(p=>
    `<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.full_name)}</option>`).join('');
}
/* #/task/<id> — a shareable link straight to one task */
async function openTaskRoute(id){
  const {data:t} = await db.from('tasks').select('id,project_id').eq('id',id).single();
  if(!t){ toast('Task not found — it may have been deleted or you may not have access', true); location.hash='#/home'; return; }
  location.hash = '#/project/' + t.project_id;
  setTimeout(()=>openTask(id), 450);
}
async function openTask(id){
  const [{data:t}, {data:chk}, {data:comments}, {data:atts}, {data:subs}, {data:hist}, {data:apprs}, {data:depsOn}, {data:depsBy}] = await Promise.all([
    db.from('tasks').select('*').eq('id',id).single(),
    db.from('task_checklist').select('*').eq('task_id',id).order('position'),
    db.from('comments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('attachments').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at'),
    db.from('subtasks').select('*').eq('task_id',id).order('position').order('created_at'),
    db.from('activity_log').select('*').eq('entity_type','task').eq('entity_id',id).order('created_at',{ascending:false}).limit(200),
    db.from('approvals').select('*').eq('task_id',id).order('created_at'),
    db.from('task_deps').select('*').eq('task_id',id),
    db.from('task_deps').select('*').eq('depends_on',id),
  ]);
  S._taskHist = hist||[]; S._histEntity = id; S._histType = 'task';
  if(!t) return toast('Task not found', true);
  S._taskDeps = depsOn||[];
  // Titles/statuses for what this task waits on — the board cache usually has them.
  let depTasks = [];
  const depIds = (depsOn||[]).map(d=>d.depends_on);
  if(depIds.length){
    depTasks = (S._tasksAll||S._tasks||[]).filter(x=>depIds.includes(x.id));
    const missing = depIds.filter(i=>!depTasks.some(x=>x.id===i));
    if(missing.length){ const {data:mt} = await db.from('tasks').select('id,title,status').in('id',missing); depTasks = depTasks.concat(mt||[]); }
  }
  await hydrateCommentAtts(comments||[]);
  S._commentCache = {}; (comments||[]).forEach(c=> S._commentCache[c.id]=c);
  const p = projById(t.project_id);
  const m = modal(`<div class="modal-head">
      <h2><span id="tv-title-view">${esc(t.title)}</span></h2>
      ${isStaff()? `<button class="x" title="Delete task" onclick="deleteTask('${t.id}','${t.project_id}')" style="font-size:12px;font-weight:600">Delete</button>`:''}
      <button class="x" onclick="closeModals()">✕</button></div>
    <div class="modal-body">
      <div class="field-grid">
        <div><label>${esc(coreLabel(t.project_id,'status'))}</label><select id="tv-status" ${canEdit()?'':'disabled'}>${STATUSES.map(s=>`<option value="${s.k}" ${s.k===t.status?'selected':''}>${s.label}</option>`).join('')}</select></div>
        <div ${coreHidden(t.project_id,'priority')?'hidden':''}><label>${esc(coreLabel(t.project_id,'priority'))}</label><select id="tv-prio" ${canEdit()?'':'disabled'}>${PRIORITIES.map(x=>`<option value="${x.k}" ${x.k===t.priority?'selected':''}>${x.label}</option>`).join('')}</select></div>
        <div ${coreHidden(t.project_id,'assignee')?'hidden':''}><label>${esc(coreLabel(t.project_id,'assignee'))}</label><select id="tv-assignee" ${canEdit()?'':'disabled'}><option value="">Unassigned</option>${assigneeOptions(t.project_id, t.assignee_id)}</select></div>
        <div ${coreHidden(t.project_id,'due_date')?'hidden':''}><label>${esc(coreLabel(t.project_id,'due_date'))}</label><input id="tv-due" type="date" value="${t.due_date||''}" ${canEdit()?'':'disabled'}></div>
      </div>
      <label>Title</label><input id="tv-title" value="${esc(t.title)}" ${canEdit()?'':'disabled'}>
      <label>Description</label><textarea id="tv-desc" rows="3" ${canEdit()?'':'disabled'}>${esc(t.description)}</textarea>
      <label>Subtasks</label>
      <div id="tv-subprog">${subProgressBar(subs||[])}</div>
      <div id="tv-subs">${(subs||[]).map(stRow).join('')}</div>
      ${canCreate()? `<div style="display:flex;gap:8px;margin-top:6px"><input id="tv-sub-new" placeholder="Add a subtask…" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-sub-add">Add</button></div>`:''}
      <label>Checklist</label>
      <div id="tv-chk">${(chk||[]).map(c=>chkRow(c)).join('')}</div>
      ${canEdit()? `<div style="display:flex;gap:8px;margin-top:6px"><input id="tv-chk-new" placeholder="Add checklist item…" style="flex:1">
        <button class="btn btn-ghost btn-sm" id="tv-chk-add">Add</button></div>`:''}
      <label>Attachments</label>
      <div id="tv-atts">${attListHTML(atts, canEdit())}</div>
      ${canCreate()? attachZoneHTML('tv-drop') : ''}
      ${(p?.approval_gate?.on || (apprs||[]).length)? signoffSectionHTML(t, apprs||[], p?.approval_gate||{}) : ''}
      ${(isStaff() || (depsOn||[]).length || (depsBy||[]).length)? depsSectionHTML(t, depsOn||[], depsBy||[], depTasks) : ''}
      <label>Comments</label>
      <div id="tv-comments">${(comments||[]).map(commentRow).join('')||'<div style="color:var(--ink3);font-size:13px">No comments yet</div>'}</div>
      ${canCreate()? commentComposerHTML('tv') : ''}
      ${historySectionHTML()}
      <div style="margin-top:14px;font-size:11.5px;color:var(--ink3)">Created ${fmtDateTime(t.created_at)} by ${esc(prof(t.created_by)?.full_name||'—')} · in ${esc(p?.name||'')}</div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModals()">Close</button>${canEdit()? `<button class="btn btn-primary" id="tv-save">Save changes</button>`:''}</div>`, true);

  if(m.querySelector('#tv-save')) m.querySelector('#tv-save').onclick = async ()=>{
    const upd = {
      title:m.querySelector('#tv-title').value.trim()||t.title,
      description:m.querySelector('#tv-desc').value,
      status:m.querySelector('#tv-status').value, priority:m.querySelector('#tv-prio').value,
      assignee_id:m.querySelector('#tv-assignee').value||null, due_date:m.querySelector('#tv-due').value||null,
    };
    const {error} = await db.from('tasks').update(upd).eq('id',t.id);
    if(error) return toast(error.message, true);
    closeModals(); toast('Task saved');
    if(S.route.view==='project') renderProject(t.project_id); else if(S.route.view==='home') renderHome();
  };
  if(m.querySelector('#tv-sub-add')) m.querySelector('#tv-sub-add').onclick = async ()=>{
    const title = m.querySelector('#tv-sub-new').value.trim(); if(!title) return;
    const {data, error} = await db.from('subtasks').insert({task_id:t.id, title, created_by:S.me.id, position:(m.querySelectorAll('.strow').length)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-subs').insertAdjacentHTML('beforeend', stRow(data));
    m.querySelector('#tv-sub-new').value=''; refreshSubProg(t.id);
  };
  if(m.querySelector('#tv-chk-add')) m.querySelector('#tv-chk-add').onclick = async ()=>{
    const label = m.querySelector('#tv-chk-new').value.trim(); if(!label) return;
    const {data, error} = await db.from('task_checklist').insert({task_id:t.id, label, position:(chk?.length||0)+1}).select().single();
    if(error) return toast(error.message, true);
    m.querySelector('#tv-chk').insertAdjacentHTML('beforeend', chkRow(data));
    m.querySelector('#tv-chk-new').value='';
  };
  // Paste a whole list -> one subtask / checklist item per line
  wireListPaste(m.querySelector('#tv-sub-new'), lines=> addSubtasksBulk(t.id, lines, m));
  wireListPaste(m.querySelector('#tv-chk-new'), lines=> addChecklistBulk(t.id, lines, m));
  wireAttachZone(m, 'tv-drop', 'task', t.id, m.querySelector('#tv-atts'));
  const cIn = m.querySelector('#tv-comment');
  if(cIn){
    wireComposer(m, 'tv');
    wireMentions(cIn);
    cIn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !document.querySelector('.mention-menu')){ e.preventDefault(); m.querySelector('#tv-comment-add').click(); } });
    m.querySelector('#tv-comment-add').onclick = ()=> postComment('task', t.id, t.title, cIn, m.querySelector('#tv-comments'));
  }
}
/* ---- sign-off (maker-checker) ----
   The DB enforces the gate: moving into the gated status without an approved
   row raises, and maker-cannot-be-checker is rejected on insert. The UI just
   shows the rows and passes error messages through. */
function signoffRow(a){
  const ap = prof(a.approver_id), rq = prof(a.requested_by);
  const chip = a.status==='approved'? `<span class="chip" style="background:var(--green-soft);color:var(--green)">approved</span>`
    : a.status==='rejected'? `<span class="chip" style="background:var(--red-soft);color:var(--red)">rejected</span>`
    : `<span class="chip" style="background:var(--amber-soft);color:var(--amber)">pending</span>`;
  const mine = a.status==='pending' && S.me && a.approver_id===S.me.id;
  return `<div class="so-row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;font-size:13px">

/* ---- paste a list, get items: one per line, bullets/numbering stripped ---- */
function splitPasteLines(text){
  return String(text||'').split(/\r?\n/)
    .map(s=> s.replace(/^\s*(?:[-–—•*▪◦✓☐]|\d+[.)])\s*/,'').trim())
    .filter(Boolean);
}
function wireListPaste(input, addMany){
  if(!input) return;
  input.addEventListener('paste', e=>{
    const txt = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    const lines = splitPasteLines(txt);
    if(lines.length < 2) return;              // single line pastes normally
    e.preventDefault();
    addMany(lines);
  });
}
